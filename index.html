<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>話す英文法（ハナブン）</title>
<style>
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f7f9fc; --ink: #1d2433; --muted: #5f687c; --line: #e2e6ee;
  --accent: #1f6f8b; --accent-ink: #ffffff; --accent-soft: #e3f1f6; --orange: #f08a24; --orange-soft: #fff1e3; --gold: #d4a017;
  --ok: #1a8a60; --ok-bg: #e2f6ee; --ng: #d03a3a; --ng-bg: #fde8e8; --warn: #a86400; --warn-bg: #fff3dc;
  --s1: #7a55e0; --s2: #2775d6; --s3: #0e9583; --s4: #e07a26;
  --s1-bg: #efebfd; --s2-bg: #e7f0fb; --s3-bg: #e2f5f2; --s4-bg: #fcefe3;
  --chip: #edf1f7; --bar: #1f6f8b; --bar-ink: #ffffff; --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 14px rgba(20, 30, 60, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121821; --surface: #1b232e; --surface-2: #222c38; --ink: #e8edf3; --muted: #a3aebd; --line: #2f3a48;
    --accent: #5fb7d4; --accent-ink: #0b1a21; --accent-soft: #17323d; --orange: #ffa552; --orange-soft: #3a2a1a; --gold: #f0c64a;
    --ok: #4cc98f; --ok-bg: #163527; --ng: #ff7b7b; --ng-bg: #3a1f22; --warn: #f0b64a; --warn-bg: #3a2e14;
    --s1: #a68cff; --s2: #67a8ff; --s3: #3fd1bc; --s4: #ffa361;
    --s1-bg: #2a2547; --s2-bg: #1d2c42; --s3-bg: #17332f; --s4-bg: #3a2a1c;
    --chip: #263140; --bar: #163f4f; --bar-ink: #ffffff; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #121821; --surface: #1b232e; --surface-2: #222c38; --ink: #e8edf3; --muted: #a3aebd; --line: #2f3a48;
    --accent: #5fb7d4; --accent-ink: #0b1a21; --accent-soft: #17323d; --orange: #ffa552; --orange-soft: #3a2a1a; --gold: #f0c64a;
    --ok: #4cc98f; --ok-bg: #163527; --ng: #ff7b7b; --ng-bg: #3a1f22; --warn: #f0b64a; --warn-bg: #3a2e14;
    --s1: #a68cff; --s2: #67a8ff; --s3: #3fd1bc; --s4: #ffa361;
    --s1-bg: #2a2547; --s2-bg: #1d2c42; --s3-bg: #17332f; --s4-bg: #3a2a1c;
    --chip: #263140; --bar: #163f4f; --bar-ink: #ffffff; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 16px; line-height: 1.6;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
.hidden { display: none !important; }

/* ヘッダー */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: var(--bar); color: var(--bar-ink); }
.bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 26px; line-height: 1; padding-bottom: 3px; }
.who { font-size: 13px; color: rgba(255,255,255,.85); }
.badge { background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 99px; font-weight: 700; font-size: 12px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lead { color: var(--muted); margin: 4px 0 14px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.boot { padding: 60px 16px; text-align: center; color: var(--muted); }

/* ホームの項目カード */
.items { display: grid; gap: 10px; }
.item-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.item-card:active { transform: scale(.99); }
.num { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.item-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-title { font-weight: 700; font-size: 16px; }
.item-count { font-weight: 800; color: var(--muted); font-size: 15px; }
.dots { display: flex; gap: 6px; }
.dot { position: relative; overflow: hidden; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--chip); color: var(--muted); }
.dot b { position: relative; }
.dot i { position: absolute; left: 0; bottom: 0; top: 0; opacity: .35; }
.dot.s1 i { background: var(--s1); } .dot.s2 i { background: var(--s2); } .dot.s3 i { background: var(--s3); } .dot.s4 i { background: var(--s4); }
.item-card.mastered { border-color: var(--s4); }
.item-card.mastered .item-count { color: var(--s4); }
.sec { font-size: 15px; color: var(--muted); margin: 18px 4px 8px; }
.mic-side { flex: 1; min-width: 0; }
.level { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
.level i { display: block; height: 100%; width: 0; background: var(--ng); transition: width .1s; }
.clear-info { font-weight: 700; color: var(--accent); margin-top: 8px; }
.clear-info:empty { display: none; }
.dot.on.s1 { background: var(--s1); color: #fff; } .dot.on.s2 { background: var(--s2); color: #fff; }
.dot.on.s3 { background: var(--s3); color: #fff; } .dot.on.s4 { background: var(--s4); color: #fff; }
.home-links { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.link-btn { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 8px 16px; color: var(--muted); font-size: 14px; }

/* 段階カード */
.stages { display: grid; gap: 12px; }
.stage-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); flex-wrap: wrap; }
.stage-no { flex: none; font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 10px; color: #fff; }
.stage-card.s1 .stage-no { background: var(--s1); } .stage-card.s2 .stage-no { background: var(--s2); }
.stage-card.s3 .stage-no { background: var(--s3); } .stage-card.s4 .stage-no { background: var(--s4); }
.stage-body { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
.stage-name { font-weight: 700; font-size: 17px; }
.stage-desc { color: var(--muted); font-size: 13px; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.lock { background: transparent; }

/* 問題カード */
.progress { height: 6px; background: var(--chip); }
.progress-bar { height: 100%; transition: width .3s; }
.progress-bar.s2 { background: var(--s2); } .progress-bar.s3 { background: var(--s3); } .progress-bar.s4 { background: var(--s4); }
.progress-text { text-align: right; font-size: 13px; color: var(--muted); padding: 6px 16px 0; max-width: 640px; margin: 0 auto; }
.q-card { border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.q-card.s1 { border-top: 5px solid var(--s1); } .q-card.s2 { border-top: 5px solid var(--s2); }
.q-card.s3 { border-top: 5px solid var(--s3); } .q-card.s4 { border-top: 5px solid var(--s4); }
.q-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.q-main { font-size: 22px; font-weight: 700; line-height: 1.5; }
.q-main.en { font-size: 24px; letter-spacing: .01em; }
.q-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.q-context { color: var(--muted); font-size: 18px; margin-bottom: 4px; }
.blank { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--s2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 6px 14px; border-radius: 10px; background: var(--chip); font-weight: 700; font-size: 18px; }
.chips.big .chip { font-size: 21px; padding: 8px 16px; }
.intro .rules { margin: 12px 0 0; padding-left: 20px; color: var(--ink); }
.countdown { height: 8px; border-radius: 99px; background: var(--chip); margin-top: 14px; overflow: hidden; }
.countdown-bar { height: 100%; width: 100%; background: var(--s4); transition: width .1s linear; }
.countdown-bar.ok { background: var(--ok); } .countdown-bar.late { background: var(--ng); }

/* 回答欄 */
.answer { margin-bottom: 14px; }
.transcript { min-height: 64px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 1px dashed var(--line); font-size: 19px; margin-bottom: 12px; word-break: break-word; }
.transcript .ph { color: var(--muted); font-size: 15px; }
.transcript .interim { color: var(--muted); }
.mic-row { display: flex; align-items: center; gap: 14px; }
.mic { width: 76px; height: 76px; flex: none; border-radius: 50%; border: none; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(45, 85, 224, .35); }
.mic-ico { width: 22px; height: 34px; border: 4px solid #fff; border-radius: 12px; position: relative; }
.mic-ico::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 4px; height: 8px; background: #fff; transform: translateX(-50%); }
.mic.on { background: var(--ng); animation: pulse 1.2s infinite; box-shadow: 0 6px 18px rgba(201, 60, 60, .35); }
.mic.on .mic-ico { border-radius: 4px; width: 26px; height: 26px; background: #fff; }
.mic.on .mic-ico::after { display: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201, 60, 60, .45); } 70% { box-shadow: 0 0 0 18px rgba(201, 60, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(201, 60, 60, 0); } }
.mic-hint { color: var(--muted); font-size: 14px; }
.msg { font-size: 14px; margin-top: 8px; min-height: 0; }
.msg:empty { display: none; }
.msg.ok { color: var(--ok); } .msg.ng { color: var(--ng); } .msg.warn { color: var(--warn); font-weight: 700; }
.confirm { display: flex; gap: 10px; margin-top: 12px; }
.text-in { margin-top: 14px; }
.text-in summary { color: var(--muted); font-size: 14px; cursor: pointer; }
.text-row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
.text-row input, .text-row textarea { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* ボタン */
.btn { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn.big { width: 100%; padding: 15px; font-size: 18px; margin-top: 6px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

/* 判定結果 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.panel h2 { font-size: 16px; margin: 4px 0 10px; }
.judging { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 14px 4px; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--chip); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict { font-size: 22px; font-weight: 800; }
.verdict small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.points { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.points li { padding: 8px 12px; border-radius: 10px; font-size: 15px; }
.points li.met { background: var(--ok-bg); color: var(--ok); }
.points li.miss { background: var(--ng-bg); color: var(--ng); }
.feedback { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 15px; }
.model-line { margin-top: 10px; font-size: 19px; font-weight: 700; }
.model-line span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.model { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-top: 8px; }
.model-wrap { margin-top: 12px; } .model-wrap summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.checks { display: grid; gap: 8px; margin: 12px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; margin: 6px 0; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.save { font-size: 13px; color: var(--muted); margin-top: 10px; }
.save.ok { color: var(--ok); } .save.ng { color: var(--ng); }

.result-card { text-align: center; padding: 24px 16px; border-radius: 20px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); }
.result-card.ok { background: var(--ok-bg); } .result-card.ng { background: var(--ng-bg); }
.big-score { font-size: 56px; font-weight: 800; line-height: 1; }
.big-score span { font-size: 24px; color: var(--muted); }
.result-card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.log li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.log .mark { font-weight: 800; flex: none; }
.log li.ok .mark { color: var(--ok); } .log li.ng .mark { color: var(--ng); }
.log .lq { display: block; font-size: 14px; color: var(--muted); }
.log .la { display: block; font-size: 16px; word-break: break-word; }

/* 設定 */
.form .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.form .row > span:first-child { flex: 1; min-width: 180px; font-size: 15px; }
.num-in { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.form input[type=number] { width: 80px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: right; }
.form input.wide { flex: 1; min-width: 200px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); }

/* 学習記録 */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th small { font-weight: 400; color: var(--muted); font-size: 11px; }
th.name { text-align: left; }
.lv { font-weight: 700; border-radius: 6px; }
.lv1 { color: var(--s1); } .lv2 { color: var(--s2); } .lv3 { color: var(--s3); } .lv4 { color: #fff; background: var(--s4); }

.ai-note { font-size: 12px; color: var(--muted); margin-top: 28px; text-align: center; }

.preview-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; }
.preview-bar button { border: 1px solid var(--warn); background: var(--surface); color: var(--warn); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.login a.btn { display: block; text-align: center; text-decoration: none; }

/* 先生用：画面の切りかえ・管理者画面 */
.view-switch { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 99px; overflow: hidden; flex: none; }
.view-switch button { border: 0; background: transparent; color: rgba(255,255,255,.85); font-size: 12px; font-weight: 700; padding: 6px 11px; }
.view-switch button.on { background: #fff; color: var(--bar); }
.admin-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 14px; }
.admin-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.ac-ico { font-size: 24px; }
.ac-title { font-weight: 800; font-size: 17px; }
.ac-desc { color: var(--muted); font-size: 13px; }
.summary { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.summary dt { color: var(--muted); font-weight: 700; }
.summary dd { margin: 0; }
@media (max-width: 520px) { .summary { grid-template-columns: 1fr; } .summary dd { margin-bottom: 6px; } .bar .who { display: none; } }
.url-row { display: flex; gap: 8px; }
.url-row input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* ===== 生徒ホーム：自分のカード・スタンプカード ===== */
.me-card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; margin-bottom: 14px; }
.me-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.me-hello { font-size: 20px; font-weight: 800; }
.me-sub { color: var(--muted); font-size: 14px; }
.me-stats { display: flex; gap: 8px; }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 62px; padding: 6px 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.stat b { font-size: 17px; }
.stat small { color: var(--muted); font-size: 11px; font-weight: 700; }
.stamp-card { display: block; width: 100%; text-align: left; margin-top: 14px; padding: 12px; border-radius: 14px; border: 2px dashed color-mix(in srgb, var(--orange) 55%, transparent); background: var(--orange-soft); }
.sc-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.sc-more { color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.slot { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: color-mix(in srgb, var(--orange) 55%, transparent); border: 2px solid color-mix(in srgb, var(--orange) 35%, transparent); background: var(--surface); }
.slot.on { background: var(--orange); border-color: var(--orange); color: #fff; font-size: 15px; }
.slot.today { animation: stampIn .6s ease-out; box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 35%, transparent); }
.slots.wide { grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 420px; margin: 10px auto; }
.slot.big { font-size: 15px; }
.slot.big.on { font-size: 26px; }
@keyframes stampIn { 0% { transform: scale(1.8) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(4deg); opacity: 1; } 100% { transform: none; } }

/* 今日のおすすめ */
.next-card { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.next-label { font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.next-body { display: flex; align-items: center; gap: 10px; }
.next-body .stage-no { color: #fff; padding: 6px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; }
.stage-no.s1 { background: var(--s1); } .stage-no.s2 { background: var(--s2); } .stage-no.s3 { background: var(--s3); } .stage-no.s4 { background: var(--s4); }
.next-title { font-size: 18px; font-weight: 800; display: flex; flex-direction: column; }
.next-title small { font-size: 13px; color: var(--muted); font-weight: 700; }
.next-card.done .next-title { display: block; }

/* スタンプとバッジのページ */
.rw-stats { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; color: var(--muted); font-size: 14px; }
.rw-stats b { color: var(--ink); font-size: 18px; }
.panel h2 small { color: var(--muted); font-weight: 700; font-size: 13px; margin-left: 6px; }

/* ごほうびのお知らせ */

.gift { position: relative; overflow: hidden; width: min(360px, 100%); background: var(--surface); border-radius: 22px; padding: 26px 20px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
.gift-big { font-size: 72px; line-height: 1.1; animation: stampIn .7s ease-out; }

.confetti { position: absolute; inset: 0; pointer-events: none; }

@keyframes fall { to { transform: translateY(420px) rotate(540deg); opacity: 0; } }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gift, .gift-big, .confetti i, .slot.today, .gift-overlay { animation: none !important; } .confetti { display: none; } }

/* お手本音声 */

.listen { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 800; }

/* 全体の見やすさ */
.item-card, .stage-card { min-height: 64px; }
.btn.primary { box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 30%, transparent); }

.lead { font-size: 14px; }

/* ===== 着せ替え（テーマ色）：--skin の色でヘッダーとボタンの色を変える ===== */

@media (prefers-color-scheme: dark) {
  :root[data-skin]:not([data-theme="light"]) { --bar: color-mix(in srgb, var(--skin) 72%, #000000); --accent: color-mix(in srgb, var(--skin) 55%, #ffffff); --accent-soft: color-mix(in srgb, var(--skin) 28%, #1b232e); }
}

/* ホームのメニュー */

.btn-row.center { justify-content: center; }

.nick-box { margin-top: 14px; text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); }
.nick-box .url-row { margin-top: 4px; }
.nick-box input { font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: var(--muted); }

.mk-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.mk-opt { display: flex; flex-direction: column; align-items: center; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 3px 4px; }

/* 画像・お絵かきのアバター */

.pm-size i { display: inline-block; border-radius: 50%; background: currentColor; }

.pm-zoom { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 4px 0 8px; }

.me-av { position: relative; }

.pq-who { display: flex; flex-direction: column; gap: 1px; font-size: 13px; } .pq-who small { color: var(--muted); }

/* おみくじ英文 */
.om-sentence { background: linear-gradient(180deg, #fffdf6, #fff6e0); border: 2px solid #f1d58a; border-radius: 18px; padding: 18px 16px; margin-bottom: 12px; text-align: center; color: #2b2118; }

.fortune.f0 { color: #d93a3a; text-shadow: 0 0 14px rgba(255,200,0,.8); } .fortune.f1 { color: #e0703a; } .fortune.f2 { color: #2a9d8f; } .fortune.f3 { color: #1769aa; }

.maker-form { display: grid; gap: 10px; }

/* ===== 段階C：復習・締め切り・先生用の画面 ===== */
.chip.small { font-size: 13px; padding: 4px 10px; border: 0; }
button.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); }
.review-tag { display: inline-block; font-size: 12px; font-weight: 800; color: var(--s3); background: var(--s3-bg); border-radius: 99px; padding: 3px 10px; margin-bottom: 8px; }
.review-list { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; max-height: 360px; overflow-y: auto; }
.review-list li { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); }
.review-list .lq { font-weight: 700; } .review-list .la { font-size: 13px; color: var(--ng); }
.review-list small { color: var(--muted); margin-left: 4px; }
.due { display: inline-block; align-self: flex-start; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.due.ok { background: var(--ok-bg); color: var(--ok); } .due.warn { background: var(--warn-bg); color: var(--warn); } .due.ng { background: var(--ng-bg); color: var(--ng); }
.due-notice { font-weight: 700; }
.task-table { display: grid; gap: 4px; margin: 8px 0; }
.task-table.off { opacity: .55; }
.task-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 4px 0; border-bottom: 1px solid var(--line); }
.task-row .check { margin: 0; flex: 1; min-width: 200px; }
.due-in { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.due-in input, .cls-sel, .toolbar select, .form-grid input, .edit-row input { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.form select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.toolbar.center { justify-content: center; }
.seg.small button { padding: 4px 12px; font-size: 12px; }
.sum-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
.sum-cards > div { display: flex; flex-direction: column; align-items: center; padding: 10px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; }
.sum-cards b { font-size: 22px; } .sum-cards b.ng { color: var(--ng); } .sum-cards small { font-size: 11px; color: var(--muted); font-weight: 700; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 800; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.cls-tag { display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 6px; }
.dash td.asg { font-weight: 900; }
.due-mark { display: block; font-size: 10px; font-weight: 800; }
.due-mark.done { color: var(--ok); } .due-mark.over { color: var(--ng); } .due-mark.late { color: var(--warn); }
.lv4 .due-mark { color: #fff; }
.edit-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; text-align: left; }
.edit-row label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); font-weight: 700; }
.edit-row input { width: 120px; }
.detail-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.detail-head > div { flex: 1; min-width: 180px; }
.cal { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.cal-dow, .cal-col { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.cal-dow span, .cal-dow small, .cal-col small { font-size: 10px; color: var(--muted); height: 14px; line-height: 14px; white-space: nowrap; }
.cal-col small { min-width: 26px; text-align: center; }
.cal-d { display: block; width: 16px; height: 14px; border-radius: 3px; background: var(--chip); }
.cal-d.l1 { background: color-mix(in srgb, var(--ok) 35%, var(--chip)); } .cal-d.l2 { background: color-mix(in srgb, var(--ok) 65%, var(--chip)); } .cal-d.l3 { background: var(--ok); }
.cal-d.fut { opacity: .3; }
table.prog th.name, table.miss td { text-align: left; white-space: normal; }
table.prog td.clr { color: var(--ok); font-weight: 900; }

.rate { width: 80px; height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin: 4px 0 2px; }
.rate i { display: block; height: 100%; background: var(--ng); }
.ans { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; border-radius: 8px; background: var(--ng-bg); color: var(--ng); font-size: 12px; }
.ans small { margin-left: 4px; color: var(--muted); }
details.rec { border-top: 1px solid var(--line); padding: 6px 0; }
details.rec summary { display: grid; grid-template-columns: 90px 1fr 60px 60px 50px; gap: 6px; cursor: pointer; font-size: 14px; align-items: center; }
details.rec summary .ok { color: var(--ok); font-weight: 800; }
.log.small li { padding: 6px 10px; } .log.small .la { font-size: 14px; }
.badge-row { display: flex; flex-wrap: wrap; gap: 6px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-bottom: 10px; }
.form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.chip-check { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
textarea.full { width: 100%; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* 個人レポート（印刷用） */
.report-wrap { max-width: 860px; }

.rp-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #1f6f8b; padding-bottom: 8px; }
.rp-title { font-size: 18px; font-weight: 900; } .rp-sub { font-size: 12px; color: #5f687c; }
.rp-who { display: flex; gap: 10px; align-items: baseline; font-size: 14px; } .rp-who b { font-size: 20px; }
.rp-sum { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.rp-sum > div { border: 1px solid #e2e6ee; border-radius: 8px; padding: 6px; text-align: center; display: flex; flex-direction: column; }
.rp-sum small { font-size: 10px; color: #5f687c; } .rp-sum b { font-size: 16px; }
.report-page table { font-size: 12px; } .report-page th, .report-page td { padding: 4px; border-bottom: 1px solid #e2e6ee; }
.report-page .hint { color: #5f687c; }
.report-page .cal-d { background: #edf1f7; } .report-page .cal-d.l1 { background: #a9dcc5; } .report-page .cal-d.l2 { background: #5fbf95; } .report-page .cal-d.l3 { background: #1a8a60; }
.rp-comment { height: 90px; border: 1px solid #c9ced8; border-radius: 8px; }
@media print {
  @page { size: A4 portrait; margin: 12mm; }
  html, body { background: #fff !important; }
  .bar, .preview-bar, .no-print, .ai-note, .gift-overlay { display: none !important; }
  .wrap, .report-wrap { max-width: none; padding: 0; margin: 0; }
  .report-page { border: 0; border-radius: 0; box-shadow: none; padding: 0; margin: 0; page-break-after: always; break-after: page; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .report-page:last-child { page-break-after: auto; break-after: auto; }
}

/* ===== 段階D：学年ごとのまとまり・教材・PDFの問題 ===== */
.grade-box { border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px; margin: 8px 0; background: var(--surface); }
.grade-box > summary { cursor: pointer; font-weight: 700; padding: 8px 2px; list-style-position: inside; }
.grade-box.free { border: none; background: none; padding: 0; }
.grade-box.free > summary { color: var(--muted); font-size: 15px; }
.grade-box .btn-row.small { margin: 4px 0 8px; gap: 6px; }
.task-opts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.src-sel { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 220px; }
.item-use { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); margin: 0; }
.item-use small { margin-left: auto; }
.fmt-row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
.fmt-row .check { margin: 0; }
.form-grid label select, .form-grid label input[type=file] { display: block; width: 100%; margin-top: 4px; font: inherit; font-size: 14px; }
.sent-list { display: grid; gap: 12px; }
.sent-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
.sent-card.off { opacity: .5; }
.sent-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.sent-head b { display: inline-grid; place-items: center; min-width: 28px; height: 28px; border-radius: 50%; background: var(--line); }
.sent-head .check { margin: 0; }
.sent-card .warn { color: #b06000; margin: 2px 0 6px; }
.sent-card .fld { display: block; font-size: 13px; color: var(--muted); margin: 6px 0; }
.sent-card input[type=text] { display: block; width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); margin-top: 3px; }
.sent-card input.en { font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif; }
.sent-card .fmt { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 6px; }
.sent-card .fmt .check { margin: 0 0 2px; }
.sent-card .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; margin-top: 4px; }
.sent-card .opt { display: flex; align-items: center; gap: 4px; }
.sent-card .opt input[type=text] { margin-top: 0; }
.sticky-save { position: sticky; bottom: 8px; z-index: 5; }
table.sets td, table.sets th { vertical-align: top; }
.form-grid select { padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* ===== マスターモード ===== */
.mc-items { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0; }

/* 課題（範囲の総復習）：ダンジョン */
.kind-chip.rg { background: #2b2f4a; color: #ffe8a3; }
.range-panel { border: 2px solid #2b2f4a; background: linear-gradient(160deg, var(--surface), color-mix(in srgb, #2b2f4a 8%, var(--surface))); }
.range-panel.done { border-color: var(--gold); background: linear-gradient(135deg, var(--surface), #fff4cc); }
.range-panel h2 { margin-top: 0; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.range-panel h2 small { font-size: 13px; color: var(--muted); font-weight: 700; }
.dungeon { display: grid; gap: 10px; margin: 10px 0 14px; }
.dg-room { border-radius: 14px; padding: 8px 10px 10px; background: #1f2238; color: #f1f3f5; box-shadow: inset 0 0 0 2px #3b3f63; }

.dg-mons { display: flex; gap: 8px; flex-wrap: wrap; }

.rg-tag { display: inline-flex; align-items: center; gap: 6px; }

@media (max-width: 480px) { .dg-mon { width: 92px; } }
/* 締め切りの時刻 */
.due-in { display: inline-flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

.due-hint { margin-top: -4px; text-align: right; font-size: 12px; }
.tc-due .due-time { display: block; font-weight: 800; }
/* ラスボス */

.boss-room.down { background: linear-gradient(135deg, #2b3a2e, #5c4a12); box-shadow: inset 0 0 0 2px #fab005; }
.boss-room .boss-svg { flex: none; }
.boss-txt { display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }

.boss-wait { margin: 0; font-weight: 800; color: #ffd43b; }
.btn.boss-btn { background: linear-gradient(135deg, #c92a2a, #7048e8); color: #fff; border: none; font-weight: 900; box-shadow: 0 3px 0 #5f1a1a; }

.boss-ans { color: #2b8a3e; font-weight: 700; }
.boss-ok { color: #e67700; font-weight: 800; }
@media (max-width: 480px) { .boss-room { flex-direction: column; text-align: center; } .boss-txt { text-align: center; align-items: center; } }
.master-panel { border: 2px dashed var(--gold); }
.master-panel.done { border: 2px solid var(--gold); background: linear-gradient(135deg, var(--surface), #fff4cc); }
.master-panel h2 { margin-top: 0; }
.cls-checks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.cls-checks .check { margin: 0; }
/* 課題の種類 */
.kind-chip { display: inline-block; align-self: flex-start; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-top: 3px; }
.kind-chip.mm { background: #fff1c2; color: #8a5a00; border: 1px solid var(--gold); }

.mm-mark { display: block; font-size: 10px; font-weight: 800; color: #8a5a00; }

th.name .mm-mark { display: inline-block; margin-left: 6px; }
.kind-sel, .from-sel { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 240px; }
.kind-sel { border-color: var(--gold); }
.from-sel[hidden] { display: none; }

/* ===== 現在地（ホーム） ===== */
.me-av.ringed { position: relative; }

.next-goal { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--orange); background: var(--orange-soft); color: var(--ink); font: inherit; text-align: left; flex-wrap: wrap; }

.ng-label { font-size: 12px; font-weight: 800; color: #fff; background: var(--orange); border-radius: 999px; padding: 2px 8px; }

.ng-gain { font-size: 13px; color: var(--orange); font-weight: 800; }

/* ===== ストーリーモード ===== */
.story-card { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; margin: 12px 0; padding: 12px 14px; border-radius: 18px; border: 2px solid #5f3dc4; background: linear-gradient(135deg, #2b1f5c, #4c2f9e); color: #fff; box-shadow: var(--shadow); font: inherit; }

.sc-bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.2); overflow: hidden; }

.sc-goal.ng { background: #ffe3e3; color: #a51111; }

.sh-sub { font-size: 14px; opacity: .9; margin: 4px 0 8px; }

/* ===== 生徒ホーム（入り口が一目で見える・課題がいちばん目立つ） ===== */

/* 課題パネル */
.task-panel { background: var(--surface); border: 3px solid var(--accent); border-radius: 20px; box-shadow: 0 4px 18px color-mix(in srgb, var(--accent) 22%, transparent); overflow: hidden; }

.tp-head h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: .04em; }
.tp-count { font-size: 14px; font-weight: 700; }
.tp-count b { font-size: 22px; margin: 0 2px; }
.tp-alert { background: var(--ng); color: #fff; font-weight: 800; font-size: 14px; padding: 5px 14px; }
.tp-list { display: grid; gap: 8px; padding: 10px; }

.task-card { display: flex; align-items: stretch; gap: 10px; width: 100%; text-align: left; padding: 0; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; min-height: 72px; }

.tc-due b { font-size: 24px; font-weight: 900; letter-spacing: -.02em; }
.tc-due b.nd { font-size: 16px; }
.tc-due small { font-size: 12px; font-weight: 700; }
.tc-due em { font-style: normal; font-size: 12px; font-weight: 900; margin-top: 2px; }
.task-card.due-soon .tc-due { background: var(--orange); color: #fff; }
.task-card.due-over .tc-due { background: var(--ng); color: #fff; }
.task-card.due-over { border-color: var(--ng); }
.task-card.due-soon { border-color: var(--orange); }
.task-card.due-none .tc-due { background: var(--chip); color: var(--muted); }
.tc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 0; }
.tc-main .kind-chip { margin: 0; }
.tc-title { font-weight: 800; font-size: 16px; line-height: 1.3; }
.tc-sub { font-size: 12px; color: var(--muted); font-weight: 700; }

.tc-main .dot { width: 20px; height: 20px; font-size: 11px; border-radius: 6px; }
.tc-go { flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0 12px 0 4px; color: var(--accent); font-weight: 900; font-size: 20px; }

.kind-chip.story { background: #ece6ff; color: #5f3dc4; border: 1px solid #b9a5f5; }
/* 入り口 */
.entry-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; }
.entry { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 76px; padding: 8px 4px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); text-align: center; }

.en-text { display: flex; flex-direction: column; min-width: 0; }

.entry.free { background: linear-gradient(135deg, var(--s2-bg), var(--surface)); border-color: color-mix(in srgb, var(--s2) 40%, transparent); }

  .tc-due b { font-size: 20px; }

/* ===== 課題のフォルダ（生徒） ===== */
.folder-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.folder-card { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 72px; text-align: left; padding: 10px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface-2); }

.folder-card.has-task { border-color: var(--orange); background: linear-gradient(135deg, var(--orange-soft), var(--surface)); box-shadow: 0 3px 12px color-mix(in srgb, var(--orange) 22%, transparent); }

.fc-ico { font-size: 30px; line-height: 1; flex: none; }
.fc-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.fc-name { font-weight: 900; font-size: 16px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fc-sub { font-size: 12px; font-weight: 700; color: var(--muted); }
.fc-due { color: var(--accent); }
.fc-due.soon { color: var(--orange); }
.fc-due.over { color: var(--ng); }
.fc-badge { flex: none; display: flex; flex-direction: column; align-items: center; background: var(--orange); color: #fff; font-size: 11px; font-weight: 900; border-radius: 12px; padding: 4px 8px; line-height: 1.2; animation: badgePulse 2.4s ease-in-out infinite; }
.has-over .fc-badge { background: var(--ng); }
.fc-badge b { font-size: 20px; }
@keyframes badgePulse { 0%, 100% { transform: none; } 50% { transform: scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .fc-badge { animation: none; } }
.task-list { display: grid; gap: 8px; }
.task-card.due-done .tc-due { background: var(--ok-bg); color: var(--ok); }
.task-card.due-done { opacity: .85; }
.tc-sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-head { display: flex; align-items: stretch; gap: 12px; background: var(--surface); border: 2px solid var(--accent); border-radius: 16px; overflow: hidden; margin-bottom: 12px; box-shadow: var(--shadow); }
.task-head .tc-due { width: 112px; }
.task-head.due-soon { border-color: var(--orange); } .task-head.due-soon .tc-due { background: var(--orange); color: #fff; }
.task-head.due-over { border-color: var(--ng); } .task-head.due-over .tc-due { background: var(--ng); color: #fff; }

.th-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 10px 0; }

.kind-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 800; color: var(--muted); }
@media (min-width: 1000px) { .home-grid .folder-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) {

  .fc-name { font-size: 14px; }

/* ===== 課題（先生） ===== */
.admin-card.main { border: 2px solid var(--accent); background: linear-gradient(135deg, var(--accent-soft), var(--surface)); }
.tk-newf { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.tk-newf input { font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 220px; }
.tk-folder { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 8px 14px 12px; margin: 10px 0; box-shadow: var(--shadow); }
.tk-folder > summary { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; cursor: pointer; padding: 4px 0; list-style: none; }

.tkf-n { color: var(--muted); font-size: 13px; font-weight: 700; }
.tkf-btns { margin-left: auto; display: flex; gap: 4px; flex-wrap: wrap; }
.tk-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.tk-main { flex: 1; min-width: 240px; display: flex; flex-direction: column; gap: 3px; }
.tk-name { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tk-name .kind-chip { margin: 0; }
.tk-meta { font-size: 13px; color: var(--muted); }
.tk-prog { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; }
.tk-prog.wait { color: var(--muted); }
.tk-bar { width: 120px; height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; }
.tk-bar i { display: block; height: 100%; background: var(--ok); }
.tk-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn.danger { color: var(--ng); border-color: color-mix(in srgb, var(--ng) 40%, transparent); }
.link-btn.danger { color: var(--ng); }
.req { font-size: 11px; background: var(--ng); color: #fff; border-radius: 6px; padding: 0 5px; margin-left: 4px; }

@media (max-width: 600px) {

#sgUpto, #sgCls { max-width: min(100%, 60vw); text-overflow: ellipsis; }
/* 課題の配信先 */
.tk-cls { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 10px; }
.cls-pick { position: relative; cursor: pointer; }
.cls-pick input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.cls-pick span { display: inline-block; min-width: 64px; text-align: center; padding: 8px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface); font-weight: 800; }
.cls-pick input:checked + span { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.cls-pick input:focus-visible + span { outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.tk-stu { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-bottom: 10px; }

.tk-stu-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 2px 10px; }
.stu-pick { margin: 0; font-size: 14px; }

/* タップの反応（iPad で押したことがすぐわかるように） */
button, summary, a, label, input, select, textarea, .stage-card, .item-card { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:not(:disabled):active, summary:active { transform: scale(.96); filter: brightness(.93); transition: transform .05s, filter .05s; }
.icon-btn { min-width: 44px; min-height: 44px; }
.stage-card.locked { opacity: .55; }
.btn[aria-disabled="true"] { opacity: .5; }
.text-in summary { padding: 10px 2px; }
.fog-cover { cursor: pointer; }

.net-busy.on { opacity: 1; }
.net-busy .spinner { width: 14px; height: 14px; border-width: 2px; margin: 0; }

.mic.wait { opacity: .7; }
.sync-badge { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 55; padding: 8px 14px; border-radius: 99px; border: none; background: var(--warn-bg); color: var(--warn); font-weight: 800; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.15); }
.save.warn { color: var(--warn); }
/* ホーム：最初に押すボタン */
.main-go { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 16px; margin-bottom: 10px; border-radius: 16px; border: none; background: var(--accent); color: var(--accent-ink); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 35%, transparent); }
.main-go.task { background: linear-gradient(135deg, var(--orange), #e8590c); color: #fff; }
.main-go .mg-ico { font-size: 28px; line-height: 1; flex: none; }
.main-go .mg-text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main-go .mg-label { font-size: 19px; font-weight: 900; line-height: 1.3; }
.main-go .mg-sub { font-size: 13px; font-weight: 700; opacity: .92; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.main-go .mg-go { font-size: 22px; font-weight: 900; flex: none; }
.main-go.done { justify-content: center; background: var(--ok-bg); color: var(--ok); box-shadow: none; font-weight: 800; }
/* 自由練習：検索と絞りこみ */
.free-tools { position: sticky; top: calc(58px + env(safe-area-inset-top)); z-index: 4; background: var(--bg); padding: 6px 0 10px; }
.free-search { width: 100%; font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.free-chips { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.free-chips button { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.free-chips button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.free-count { font-size: 13px; color: var(--muted); margin: 0 4px 8px; }
.item-card .task-tag { font-size: 11px; font-weight: 800; color: var(--orange); margin-left: 6px; }
.item-card .why { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
</style>

<body>
<div id="app"></div>
<script>

/*
 * スタンプの絵（このアプリ用のオリジナルのイラスト。すべて SVG で描いています）
 *  ・ゆるかわステッカー：キャラクター × ポーズ × 表情 の組み合わせ
 *  ・先生のハンコ：はなまる・丸・二重丸・角印・さくら（インクのかすれつき）
 *  ・キラキラ・ポップ：バースト・リボン・星・ふきだし・メダル
 *  ・ライブ表彰：1位はトロフィー・王冠・後光・月桂樹・紙ふぶき（動きつき）
 */
(function (root) {
  'use strict';
  var FONT = "'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Maru Gothic Pro','Arial Rounded MT Bold','Yu Gothic UI','Meiryo',sans-serif";
  var uid = 0;
  function nid(p) { return (p || 'a') + (++uid).toString(36); }
  function esc(t) { return String(t === undefined || t === null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function tint(hex, amt) {
    var m = /^#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex || ''); if (!m) return '#fff';
    return '#' + [1, 2, 3].map(function (i) { var v = parseInt(m[i], 16); v = Math.round(amt >= 0 ? v + (255 - v) * amt : v * (1 + amt)); return ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2); }).join('');
  }
  // 文字の幅のめやす（em）
  function emWidth(t) {
    var w = 0;
    for (var i = 0; i < t.length; i++) {
      var ch = t.charAt(i);
      if (/[　-鿿＀-￯]/.test(ch)) w += 1;

      else if (/[a-z]/.test(ch)) w += 0.58;
      else if (ch === ' ') w += 0.28;

    return w || 1;
  }
  function fit(t, maxW, maxSize, minSize) { return Math.max(minSize || 9, Math.min(maxSize, maxW / emWidth(t))); }
  // ふちどりつきの太い文字
  function bigText(t, x, y, size, fill, stroke, sw, extra) {

  }
  function starPath(cx, cy, ro, ri, n, rot) {

      var r = i % 2 ? ri : ro, a = (rot + i * 180 / n) * Math.PI / 180;

    }
    return d + 'Z';
  }
  function heartPath(cx, cy, s) {
    return 'M' + cx + ' ' + (cy + 9 * s) + ' C' + (cx - 14 * s) + ' ' + (cy) + ' ' + (cx - 12 * s) + ' ' + (cy - 10 * s) + ' ' + (cx - 5 * s) + ' ' + (cy - 9 * s) +
      ' C' + (cx - 2 * s) + ' ' + (cy - 9 * s) + ' ' + cx + ' ' + (cy - 6 * s) + ' ' + cx + ' ' + (cy - 4 * s) +
      ' C' + cx + ' ' + (cy - 6 * s) + ' ' + (cx + 2 * s) + ' ' + (cy - 9 * s) + ' ' + (cx + 5 * s) + ' ' + (cy - 9 * s) +
      ' C' + (cx + 12 * s) + ' ' + (cy - 10 * s) + ' ' + (cx + 14 * s) + ' ' + cy + ' ' + cx + ' ' + (cy + 9 * s) + 'Z';
  }

  // =================== ゆるかわキャラクター ===================
  var SP = {
    cat: { f: '#ffc078', l: '#c96f1e', in: '#ffc9d6', mz: '#fff4e6', name: 'ねこ' },
    rabbit: { f: '#ffffff', l: '#d66f98', in: '#ffc9de', mz: '#ffffff', name: 'うさぎ' },
    bear: { f: '#c08457', l: '#7a4a28', in: '#f5d7b8', mz: '#f5d7b8', name: 'くま' },
    dog: { f: '#fffaf0', l: '#a8743f', in: '#c8925e', mz: '#ffffff', name: 'いぬ' },
    panda: { f: '#ffffff', l: '#343a40', in: '#343a40', mz: '#ffffff', name: 'パンダ' },
    chick: { f: '#ffe066', l: '#d99a00', in: '#ffd43b', mz: '#ffe066', name: 'ひよこ' },
    penguin: { f: '#4263eb', l: '#1c2f8a', in: '#ffffff', mz: '#ffffff', name: 'ペンギン' },
    frog: { f: '#8ce99a', l: '#2b8a3e', in: '#ebfbee', mz: '#ebfbee', name: 'かえる' },
    hamster: { f: '#ffd8a8', l: '#c4782d', in: '#ffc9d6', mz: '#ffffff', name: 'ハムスター' },
    shiba: { f: '#ffa94d', l: '#c2410c', in: '#ffffff', mz: '#ffffff', name: 'しばいぬ' },
    star: { f: '#ffd43b', l: '#e67700', in: '#fff3bf', mz: '#ffd43b', name: 'ほし' },
    heart: { f: '#ff8fab', l: '#d6336c', in: '#ffdeeb', mz: '#ff8fab', name: 'ハート' },
    boy: { f: '#ffe3cc', l: '#c98b5e', shirt: '#4dabf7', shirtL: '#1971c2', hair: '#4a2f1d', human: 1, name: '男の子' },
    girl: { f: '#ffe3cc', l: '#c98b5e', shirt: '#f783ac', shirtL: '#c2255c', hair: '#6b3a1f', human: 1, name: '女の子' },
    kid2: { f: '#ffe3cc', l: '#c98b5e', shirt: '#69db7c', shirtL: '#2b8a3e', hair: '#2b2118', human: 1, name: 'くるくる髪の子' },
    kid3: { f: '#ffe3cc', l: '#c98b5e', shirt: '#ffd43b', shirtL: '#e67700', hair: '#8a4b14', human: 1, name: 'おだんご髪の子' },
    robot: { f: '#d0dbe8', l: '#566573', in: '#74c0fc', mz: '#e7f5ff', name: 'ロボット' },
    ghost: { f: '#ffffff', l: '#8f9bb3', in: '#f1f3f5', mz: '#ffffff', name: 'おばけ' },
    dragon: { f: '#69db7c', l: '#2b8a3e', in: '#ffe066', mz: '#d3f9d8', name: 'ドラゴン' },
    alien: { f: '#b2f2bb', l: '#2f9e44', in: '#e6fcf5', mz: '#b2f2bb', name: 'うちゅうじん' },
    unicorn: { f: '#ffffff', l: '#b07cc6', in: '#ffc9de', mz: '#ffffff', name: 'ユニコーン' }
  };
  var POSES = { banzai: 'ばんざい', wave: '手をふる', heart: 'ハートを持つ', star: 'ほしを持つ' };
  var ALLPOSES = { banzai: 1, wave: 1, heart: 1, star: 1, stand: 1 };
  var EXPRS = { happy: 'にっこり', sparkle: 'キラキラ', wink: 'ウインク' };
  var DARK = '#3a2e2a';
  function arm(x1, y1, x2, y2, s) {
    var d = 'M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2;
    return '<path d="' + d + '" stroke="' + s.l + '" stroke-width="12" stroke-linecap="round" fill="none"/><path d="' + d + '" stroke="' + s.f + '" stroke-width="8" stroke-linecap="round" fill="none"/>';
  }
  function eyes(ex, y, white) {
    var c = white ? '#fff' : DARK, out = '';
    function happy(x) { return '<path d="M' + (x - 5) + ' ' + (y + 1.5) + ' Q' + x + ' ' + (y - 5.5) + ' ' + (x + 5) + ' ' + (y + 1.5) + '" stroke="' + c + '" stroke-width="3" fill="none" stroke-linecap="round"/>'; }
    function spark(x) {
      return '<ellipse cx="' + x + '" cy="' + y + '" rx="4.6" ry="5.6" fill="' + (white ? '#fff' : DARK) + '"/>' + (white ? '<ellipse cx="' + x + '" cy="' + (y + 0.5) + '" rx="2.8" ry="3.6" fill="' + DARK + '"/>' : '') +
        '<circle cx="' + (x + 1.5) + '" cy="' + (y - 2) + '" r="1.9" fill="#fff"/><circle cx="' + (x - 1.6) + '" cy="' + (y + 2) + '" r=".9" fill="#fff"/>';
    }
    if (ex === 'happy') out = happy(48) + happy(72);
    else if (ex === 'wink') out = spark(48) + '<path d="M67 ' + (y - 3) + ' L75 ' + y + ' L67 ' + (y + 3) + '" stroke="' + c + '" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
    else out = spark(48) + spark(72);
    return out;
  }
  function mouth(ex, sp, y) {
    if (sp === 'chick' || sp === 'penguin') return '<path d="M55 ' + (y - 2) + ' L65 ' + (y - 2) + ' L60 ' + (y + 5) + 'Z" fill="#ff922b" stroke="#e8590c" stroke-width="1.2" stroke-linejoin="round"/>';
    if (sp === 'frog') return '<path d="M47 ' + (y - 2) + ' Q60 ' + (y + 10) + ' 73 ' + (y - 2) + '" stroke="' + DARK + '" stroke-width="2.8" fill="#ff8787" stroke-linecap="round"/>';
    if (ex === 'sparkle' && (sp === 'cat' || sp === 'shiba' || sp === 'rabbit' || sp === 'hamster')) {
      return '<path d="M54 ' + y + ' q3 4 6 0 q3 4 6 0" stroke="' + DARK + '" stroke-width="2.4" fill="none" stroke-linecap="round"/>';
    }
    return '<path d="M54.5 ' + (y - 1) + ' Q60 ' + (y + 8) + ' 65.5 ' + (y - 1) + ' Z" fill="#c92a2a" stroke="' + DARK + '" stroke-width="2" stroke-linejoin="round"/><ellipse cx="60" cy="' + (y + 3.6) + '" rx="3" ry="1.8" fill="#ff8fab"/>';
  }
  function cheeks(y, gap) { return '<ellipse cx="' + (60 - gap) + '" cy="' + y + '" rx="6" ry="3.8" fill="#ff8fab" opacity=".6"/><ellipse cx="' + (60 + gap) + '" cy="' + y + '" rx="6" ry="3.8" fill="#ff8fab" opacity=".6"/>'; }
  function prop(po, s) {
    if (po === 'heart') return '<path d="' + heartPath(60, 95, 1.25) + '" fill="#ff6b8a" stroke="#c2255c" stroke-width="2.2"/><ellipse cx="54" cy="89" rx="3" ry="2" fill="#fff" opacity=".7"/>' +
      '<circle cx="45" cy="96" r="5.5" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.4"/><circle cx="75" cy="96" r="5.5" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.4"/>';
    if (po === 'star') return '<path d="M100 60 L104 34" stroke="#c79100" stroke-width="2.6"/><path d="' + starPath(104, 30, 11, 5) + '" fill="#ffd43b" stroke="#e67700" stroke-width="2" stroke-linejoin="round"/>' +
      sparkle(114, 16, 4, '#fab005') + sparkle(92, 18, 3, '#fab005');
    return '';
  }
  // キャラクター本体（120×120 の中に描く）
  // キャラクターの目の高さ・頭のてっぺん（着せ替えアイテムの位置あわせ）
  function anchors(sp) {
    if (sp === 'frog') return { ey: 30, top: 18 };
    if (sp === 'ghost') return { ey: 58, top: 30 };
    if (sp === 'robot') return { ey: 56, top: 30 };
    if (sp === 'star') return { ey: 60, top: 14 };
    if (sp === 'heart') return { ey: 52, top: 20 };
    return { ey: 56, top: 28 };
  }
  function character(sp, po, ex, opt) {
    opt = opt || {};
    var s = SP[sp] || SP.cat; po = ALLPOSES[po] ? po : 'banzai'; ex = EXPRS[ex] ? ex : 'sparkle';
    if (s.human) { var sk = /^#[0-9a-f]{6}$/i.test(opt.skin || '') ? opt.skin : s.f; s = { f: sk, l: tint(sk, -0.38), shirt: s.shirt, shirtL: s.shirtL, hair: s.hair, human: 1, in: '#ffc9d6', mz: sk }; }
    var back = '', front = '', head = '', face = '', body = '', armsBack = '', armsFront = '';
    var ey = 56, my = 66;
    // 腕
    if (po === 'banzai') armsBack = arm(46, 90, 20, 50, s) + arm(74, 90, 100, 50, s) +
      '<path d="M10 44 l-5 -4 M12 36 l-6 -1 M110 44 l5 -4 M108 36 l6 -1" stroke="' + s.l + '" stroke-width="2.2" stroke-linecap="round"/>';
    else if (po === 'wave') { armsBack = arm(74, 90, 101, 52, s) + '<path d="M108 40 q5 5 3 12 M113 34 q7 7 4 17" stroke="' + s.l + '" stroke-width="2.2" fill="none" stroke-linecap="round"/>'; armsFront = arm(46, 92, 37, 104, s); }
    else if (po === 'star') { armsBack = arm(74, 90, 100, 60, s); armsFront = arm(46, 92, 37, 104, s); }
    else if (po === 'stand') armsFront = arm(46, 90, 39, 104, s) + arm(74, 90, 81, 104, s);
    else armsFront = arm(45, 90, 46, 96, s) + arm(75, 90, 74, 96, s);
    // 耳など（頭の後ろ）
    if (sp === 'cat' || sp === 'shiba') back += '<path d="M33 46 L36 16 L58 32 Z" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.6" stroke-linejoin="round"/><path d="M87 46 L84 16 L62 32 Z" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.6" stroke-linejoin="round"/>' +
      '<path d="M39 36 L40 24 L50 32 Z" fill="' + (sp === 'shiba' ? '#fff' : s.in) + '"/><path d="M81 36 L80 24 L70 32 Z" fill="' + (sp === 'shiba' ? '#fff' : s.in) + '"/>';
    if (sp === 'rabbit') back += '<ellipse cx="47" cy="20" rx="9" ry="21" fill="#fff" stroke="' + s.l + '" stroke-width="2.6" transform="rotate(-10 47 20)"/><ellipse cx="74" cy="20" rx="9" ry="21" fill="#fff" stroke="' + s.l + '" stroke-width="2.6" transform="rotate(14 74 20)"/>' +
      '<ellipse cx="47" cy="22" rx="4" ry="14" fill="' + s.in + '" transform="rotate(-10 47 20)"/><ellipse cx="74" cy="22" rx="4" ry="14" fill="' + s.in + '" transform="rotate(14 74 20)"/>';
    if (sp === 'bear' || sp === 'panda' || sp === 'hamster') {
      var er = sp === 'hamster' ? 8 : 11, ec = sp === 'panda' ? s.in : s.f;
      back += '<circle cx="35" cy="32" r="' + er + '" fill="' + ec + '" stroke="' + s.l + '" stroke-width="2.6"/><circle cx="85" cy="32" r="' + er + '" fill="' + ec + '" stroke="' + s.l + '" stroke-width="2.6"/>' +
        (sp !== 'panda' ? '<circle cx="35" cy="32" r="' + (er * 0.5) + '" fill="' + (sp === 'hamster' ? s.in : s.in) + '"/><circle cx="85" cy="32" r="' + (er * 0.5) + '" fill="' + s.in + '"/>' : '');
    }
    if (sp === 'frog') back += '<circle cx="44" cy="30" r="12" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.6"/><circle cx="76" cy="30" r="12" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.6"/>';
    if (sp === 'chick') back += '<path d="M54 30 q-2 -12 6 -6 q2 -10 8 -2" fill="none" stroke="' + s.l + '" stroke-width="3" stroke-linecap="round"/>';
    // 体
    if (sp !== 'star' && sp !== 'heart') {
      body = '<ellipse cx="51" cy="110" rx="8" ry="5" fill="' + (sp === 'chick' || sp === 'penguin' ? '#ff922b' : s.f) + '" stroke="' + s.l + '" stroke-width="2.4"/>' +
        '<ellipse cx="69" cy="110" rx="8" ry="5" fill="' + (sp === 'chick' || sp === 'penguin' ? '#ff922b' : s.f) + '" stroke="' + s.l + '" stroke-width="2.4"/>' +
        '<ellipse cx="60" cy="94" rx="22" ry="17" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.6"/>' +
        '<ellipse cx="60" cy="97" rx="12" ry="10" fill="' + (sp === 'penguin' ? '#fff' : tint(s.f, 0.5)) + '"/>';
      head = '<ellipse cx="60" cy="56" rx="' + (sp === 'frog' ? 34 : 32) + '" ry="' + (sp === 'chick' ? 30 : 28) + '" fill="' + s.f + '" stroke="' + s.l + '" stroke-width="2.8"/>';
    }
    // 顔のもよう
    if (sp === 'penguin') face += '<path d="M60 44 C46 36 32 46 34 60 C36 74 50 80 60 80 C70 80 84 74 86 60 C88 46 74 36 60 44Z" fill="#fff"/>';
    if (sp === 'shiba') face += '<ellipse cx="47" cy="68" rx="13" ry="10" fill="#fff"/><ellipse cx="73" cy="68" rx="13" ry="10" fill="#fff"/><ellipse cx="60" cy="72" rx="12" ry="9" fill="#fff"/>' +
      '<ellipse cx="46" cy="46" rx="3" ry="2" fill="#fff4e6"/><ellipse cx="74" cy="46" rx="3" ry="2" fill="#fff4e6"/>';
    if (sp === 'cat') face += '<path d="M54 30 v7 M60 29 v8 M66 30 v7" stroke="' + s.l + '" stroke-width="2.6" stroke-linecap="round"/>' +
      '<path d="M22 62 h10 M23 69 l9 -3 M98 62 h-10 M97 69 l-9 -3" stroke="' + s.l + '" stroke-width="1.8" stroke-linecap="round"/>';
    if (sp === 'dog') face += '<ellipse cx="72" cy="52" rx="10" ry="9" fill="#f1c69d" opacity=".8"/>';
    if (sp === 'bear' || sp === 'dog' || sp === 'hamster') face += '<ellipse cx="60" cy="67" rx="12" ry="8.5" fill="' + s.mz + '"/>';
    if (sp === 'panda') face += '<ellipse cx="47" cy="56" rx="8" ry="10" fill="' + s.in + '" transform="rotate(25 47 56)"/><ellipse cx="73" cy="56" rx="8" ry="10" fill="' + s.in + '" transform="rotate(-25 73 56)"/>';
    // ---- 人・ロボット・おばけ・ドラゴン・うちゅうじん・ユニコーン ----

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文法トレーニング</title>
<style>
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f7f9fc; --ink: #1d2433; --muted: #5f687c; --line: #e2e6ee;
  --accent: #1f6f8b; --accent-ink: #ffffff; --accent-soft: #e3f1f6; --orange: #f08a24; --orange-soft: #fff1e3; --gold: #d4a017;
  --ok: #1a8a60; --ok-bg: #e2f6ee; --ng: #d03a3a; --ng-bg: #fde8e8; --warn: #a86400; --warn-bg: #fff3dc;
  --s1: #7a55e0; --s2: #2775d6; --s3: #0e9583; --s4: #e07a26;
  --s1-bg: #efebfd; --s2-bg: #e7f0fb; --s3-bg: #e2f5f2; --s4-bg: #fcefe3;
  --chip: #edf1f7; --bar: #1f6f8b; --bar-ink: #ffffff; --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 14px rgba(20, 30, 60, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121821; --surface: #1b232e; --surface-2: #222c38; --ink: #e8edf3; --muted: #a3aebd; --line: #2f3a48;
    --accent: #5fb7d4; --accent-ink: #0b1a21; --accent-soft: #17323d; --orange: #ffa552; --orange-soft: #3a2a1a; --gold: #f0c64a;
    --ok: #4cc98f; --ok-bg: #163527; --ng: #ff7b7b; --ng-bg: #3a1f22; --warn: #f0b64a; --warn-bg: #3a2e14;
    --s1: #a68cff; --s2: #67a8ff; --s3: #3fd1bc; --s4: #ffa361;
    --s1-bg: #2a2547; --s2-bg: #1d2c42; --s3-bg: #17332f; --s4-bg: #3a2a1c;
    --chip: #263140; --bar: #163f4f; --bar-ink: #ffffff; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #121821; --surface: #1b232e; --surface-2: #222c38; --ink: #e8edf3; --muted: #a3aebd; --line: #2f3a48;
    --accent: #5fb7d4; --accent-ink: #0b1a21; --accent-soft: #17323d; --orange: #ffa552; --orange-soft: #3a2a1a; --gold: #f0c64a;
    --ok: #4cc98f; --ok-bg: #163527; --ng: #ff7b7b; --ng-bg: #3a1f22; --warn: #f0b64a; --warn-bg: #3a2e14;
    --s1: #a68cff; --s2: #67a8ff; --s3: #3fd1bc; --s4: #ffa361;
    --s1-bg: #2a2547; --s2-bg: #1d2c42; --s3-bg: #17332f; --s4-bg: #3a2a1c;
    --chip: #263140; --bar: #163f4f; --bar-ink: #ffffff; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 16px; line-height: 1.6;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
.hidden { display: none !important; }

/* ヘッダー */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: var(--bar); color: var(--bar-ink); }
.bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 26px; line-height: 1; padding-bottom: 3px; }
.who { font-size: 13px; color: rgba(255,255,255,.85); }
.badge { background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 99px; font-weight: 700; font-size: 12px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lead { color: var(--muted); margin: 4px 0 14px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.boot { padding: 60px 16px; text-align: center; color: var(--muted); }

/* ホームの項目カード */
.items { display: grid; gap: 10px; }
.item-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.item-card:active { transform: scale(.99); }
.num { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.item-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-title { font-weight: 700; font-size: 16px; }
.item-count { font-weight: 800; color: var(--muted); font-size: 15px; }
.dots { display: flex; gap: 6px; }
.dot { position: relative; overflow: hidden; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--chip); color: var(--muted); }
.dot b { position: relative; }
.dot i { position: absolute; left: 0; bottom: 0; top: 0; opacity: .35; }
.dot.s1 i { background: var(--s1); } .dot.s2 i { background: var(--s2); } .dot.s3 i { background: var(--s3); } .dot.s4 i { background: var(--s4); }
.item-card.mastered { border-color: var(--s4); }
.item-card.mastered .item-count { color: var(--s4); }
.sec { font-size: 15px; color: var(--muted); margin: 18px 4px 8px; }
.mic-side { flex: 1; min-width: 0; }
.level { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
.level i { display: block; height: 100%; width: 0; background: var(--ng); transition: width .1s; }
.clear-info { font-weight: 700; color: var(--accent); margin-top: 8px; }
.clear-info:empty { display: none; }
.dot.on.s1 { background: var(--s1); color: #fff; } .dot.on.s2 { background: var(--s2); color: #fff; }
.dot.on.s3 { background: var(--s3); color: #fff; } .dot.on.s4 { background: var(--s4); color: #fff; }
.home-links { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.link-btn { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 8px 16px; color: var(--muted); font-size: 14px; }

/* 段階カード */
.stages { display: grid; gap: 12px; }
.stage-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); flex-wrap: wrap; }
.stage-no { flex: none; font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 10px; color: #fff; }
.stage-card.s1 .stage-no { background: var(--s1); } .stage-card.s2 .stage-no { background: var(--s2); }
.stage-card.s3 .stage-no { background: var(--s3); } .stage-card.s4 .stage-no { background: var(--s4); }
.stage-body { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
.stage-name { font-weight: 700; font-size: 17px; }
.stage-desc { color: var(--muted); font-size: 13px; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.lock { background: transparent; }

/* 問題カード */
.progress { height: 6px; background: var(--chip); }
.progress-bar { height: 100%; transition: width .3s; }
.progress-bar.s2 { background: var(--s2); } .progress-bar.s3 { background: var(--s3); } .progress-bar.s4 { background: var(--s4); }
.progress-text { text-align: right; font-size: 13px; color: var(--muted); padding: 6px 16px 0; max-width: 640px; margin: 0 auto; }
.q-card { border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.q-card.s1 { border-top: 5px solid var(--s1); } .q-card.s2 { border-top: 5px solid var(--s2); }
.q-card.s3 { border-top: 5px solid var(--s3); } .q-card.s4 { border-top: 5px solid var(--s4); }
.q-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.q-main { font-size: 22px; font-weight: 700; line-height: 1.5; }
.q-main.en { font-size: 24px; letter-spacing: .01em; }
.q-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.q-context { color: var(--muted); font-size: 18px; margin-bottom: 4px; }
.blank { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--s2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 6px 14px; border-radius: 10px; background: var(--chip); font-weight: 700; font-size: 18px; }
.chips.big .chip { font-size: 21px; padding: 8px 16px; }
.intro .rules { margin: 12px 0 0; padding-left: 20px; color: var(--ink); }
.countdown { height: 8px; border-radius: 99px; background: var(--chip); margin-top: 14px; overflow: hidden; }
.countdown-bar { height: 100%; width: 100%; background: var(--s4); transition: width .1s linear; }
.countdown-bar.ok { background: var(--ok); } .countdown-bar.late { background: var(--ng); }

/* 回答欄 */
.answer { margin-bottom: 14px; }
.transcript { min-height: 64px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 1px dashed var(--line); font-size: 19px; margin-bottom: 12px; word-break: break-word; }
.transcript .ph { color: var(--muted); font-size: 15px; }
.transcript .interim { color: var(--muted); }
.mic-row { display: flex; align-items: center; gap: 14px; }
.mic { width: 76px; height: 76px; flex: none; border-radius: 50%; border: none; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(45, 85, 224, .35); }
.mic-ico { width: 22px; height: 34px; border: 4px solid #fff; border-radius: 12px; position: relative; }
.mic-ico::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 4px; height: 8px; background: #fff; transform: translateX(-50%); }
.mic.on { background: var(--ng); animation: pulse 1.2s infinite; box-shadow: 0 6px 18px rgba(201, 60, 60, .35); }
.mic.on .mic-ico { border-radius: 4px; width: 26px; height: 26px; background: #fff; }
.mic.on .mic-ico::after { display: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201, 60, 60, .45); } 70% { box-shadow: 0 0 0 18px rgba(201, 60, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(201, 60, 60, 0); } }
.mic-hint { color: var(--muted); font-size: 14px; }
.msg { font-size: 14px; margin-top: 8px; min-height: 0; }
.msg:empty { display: none; }
.msg.ok { color: var(--ok); } .msg.ng { color: var(--ng); } .msg.warn { color: var(--warn); font-weight: 700; }
.confirm { display: flex; gap: 10px; margin-top: 12px; }
.text-in { margin-top: 14px; }
.text-in summary { color: var(--muted); font-size: 14px; cursor: pointer; }
.text-row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
.text-row input, .text-row textarea { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* ボタン */
.btn { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn.big { width: 100%; padding: 15px; font-size: 18px; margin-top: 6px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

/* 判定結果 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.panel h2 { font-size: 16px; margin: 4px 0 10px; }
.judging { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 14px 4px; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--chip); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict { font-size: 22px; font-weight: 800; }
.verdict small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.points { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.points li { padding: 8px 12px; border-radius: 10px; font-size: 15px; }
.points li.met { background: var(--ok-bg); color: var(--ok); }
.points li.miss { background: var(--ng-bg); color: var(--ng); }
.feedback { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 15px; }
.model-line { margin-top: 10px; font-size: 19px; font-weight: 700; }
.model-line span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.model { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-top: 8px; }
.model-wrap { margin-top: 12px; } .model-wrap summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.checks { display: grid; gap: 8px; margin: 12px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; margin: 6px 0; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.save { font-size: 13px; color: var(--muted); margin-top: 10px; }
.save.ok { color: var(--ok); } .save.ng { color: var(--ng); }

.result-card { text-align: center; padding: 24px 16px; border-radius: 20px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); }
.result-card.ok { background: var(--ok-bg); } .result-card.ng { background: var(--ng-bg); }
.big-score { font-size: 56px; font-weight: 800; line-height: 1; }
.big-score span { font-size: 24px; color: var(--muted); }
.result-card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.log li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.log .mark { font-weight: 800; flex: none; }
.log li.ok .mark { color: var(--ok); } .log li.ng .mark { color: var(--ng); }
.log .lq { display: block; font-size: 14px; color: var(--muted); }
.log .la { display: block; font-size: 16px; word-break: break-word; }

/* 設定 */
.form .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.form .row > span:first-child { flex: 1; min-width: 180px; font-size: 15px; }
.num-in { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.form input[type=number] { width: 80px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: right; }
.form input.wide { flex: 1; min-width: 200px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); }

/* 学習記録 */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th small { font-weight: 400; color: var(--muted); font-size: 11px; }
th.name { text-align: left; }
.lv { font-weight: 700; border-radius: 6px; }
.lv1 { color: var(--s1); } .lv2 { color: var(--s2); } .lv3 { color: var(--s3); } .lv4 { color: #fff; background: var(--s4); }

.ai-note { font-size: 12px; color: var(--muted); margin-top: 28px; text-align: center; }

.preview-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; }
.preview-bar button { border: 1px solid var(--warn); background: var(--surface); color: var(--warn); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.login a.btn { display: block; text-align: center; text-decoration: none; }

/* 先生用：画面の切りかえ・管理者画面 */
.view-switch { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 99px; overflow: hidden; flex: none; }
.view-switch button { border: 0; background: transparent; color: rgba(255,255,255,.85); font-size: 12px; font-weight: 700; padding: 6px 11px; }
.view-switch button.on { background: #fff; color: var(--bar); }
.admin-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 14px; }
.admin-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.ac-ico { font-size: 24px; }
.ac-title { font-weight: 800; font-size: 17px; }
.ac-desc { color: var(--muted); font-size: 13px; }
.summary { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.summary dt { color: var(--muted); font-weight: 700; }
.summary dd { margin: 0; }
@media (max-width: 520px) { .summary { grid-template-columns: 1fr; } .summary dd { margin-bottom: 6px; } .bar .who { display: none; } }
.url-row { display: flex; gap: 8px; }
.url-row input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* ===== 生徒ホーム：自分のカード・スタンプカード ===== */
.me-card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; margin-bottom: 14px; }
.me-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.me-hello { font-size: 20px; font-weight: 800; }
.me-sub { color: var(--muted); font-size: 14px; }
.me-stats { display: flex; gap: 8px; }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 62px; padding: 6px 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.stat b { font-size: 17px; }
.stat small { color: var(--muted); font-size: 11px; font-weight: 700; }
.stamp-card { display: block; width: 100%; text-align: left; margin-top: 14px; padding: 12px; border-radius: 14px; border: 2px dashed color-mix(in srgb, var(--orange) 55%, transparent); background: var(--orange-soft); }
.sc-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.sc-more { color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.slot { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: color-mix(in srgb, var(--orange) 55%, transparent); border: 2px solid color-mix(in srgb, var(--orange) 35%, transparent); background: var(--surface); }
.slot.on { background: var(--orange); border-color: var(--orange); color: #fff; font-size: 15px; }
.slot.today { animation: stampIn .6s ease-out; box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 35%, transparent); }
.slots.wide { grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 420px; margin: 10px auto; }
.slot.big { font-size: 15px; }
.slot.big.on { font-size: 26px; }
@keyframes stampIn { 0% { transform: scale(1.8) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(4deg); opacity: 1; } 100% { transform: none; } }

/* 今日のおすすめ */
.next-card { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.next-label { font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.next-body { display: flex; align-items: center; gap: 10px; }
.next-body .stage-no { color: #fff; padding: 6px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; }
.stage-no.s1 { background: var(--s1); } .stage-no.s2 { background: var(--s2); } .stage-no.s3 { background: var(--s3); } .stage-no.s4 { background: var(--s4); }
.next-title { font-size: 18px; font-weight: 800; display: flex; flex-direction: column; }
.next-title small { font-size: 13px; color: var(--muted); font-weight: 700; }
.next-card.done .next-title { display: block; }

/* スタンプとバッジのページ */
.rw-stats { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; color: var(--muted); font-size: 14px; }
.rw-stats b { color: var(--ink); font-size: 18px; }
.panel h2 small { color: var(--muted); font-weight: 700; font-size: 13px; margin-left: 6px; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.bdg { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 12px 8px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); opacity: .55; }
.bdg.got { opacity: 1; background: color-mix(in srgb, var(--gold) 12%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.bdg-ico { font-size: 30px; }
.bdg-name { font-weight: 800; font-size: 14px; }
.bdg-desc { color: var(--muted); font-size: 12px; line-height: 1.4; }

/* ごほうびのお知らせ */
.gift-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 30, .55); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s ease-out; }
.gift { position: relative; overflow: hidden; width: min(360px, 100%); background: var(--surface); border-radius: 22px; padding: 26px 20px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
.gift-big { font-size: 72px; line-height: 1.1; animation: stampIn .7s ease-out; }
.gift-title { font-size: 20px; font-weight: 800; margin-top: 6px; }
.gift-text { color: var(--muted); margin: 4px 0 14px; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -12px; left: calc(var(--k) * 5.5%); width: 8px; height: 14px; border-radius: 2px; background: hsl(calc(var(--k) * 40), 85%, 60%); animation: fall 1.6s calc(var(--k) * 45ms) ease-in forwards; }
@keyframes fall { to { transform: translateY(420px) rotate(540deg); opacity: 0; } }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gift, .gift-big, .confetti i, .slot.today, .gift-overlay { animation: none !important; } .confetti { display: none; } }

/* お手本音声 */
.model-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.listen { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 800; }

/* 全体の見やすさ */
.item-card, .stage-card { min-height: 64px; }
.btn.primary { box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 30%, transparent); }
.mic { background: var(--orange); box-shadow: 0 6px 18px color-mix(in srgb, var(--orange) 40%, transparent); }
.lead { font-size: 14px; }
.dash td, .dash th { font-size: 13px; }

</style>

  const sep = lang.startsWith("ja") ? "" : " ";

    clearTimeout(silenceTimer);

  };

    clearTimeout(silenceTimer);

    const all = [text].concat(continuous ? [] : alts).filter(Boolean);
    onEnd && onEnd({ text, alts: Array.from(new Set(all)), segAlts: segAlts.filter(Boolean), errored });
  };
  try { r.start(); } catch (e) { setTimeout(() => onError && onError("start-failed"), 0); }

}

let micStream = null; // マイクは段階1の画面にいる間つないだままにする（許可を何度も聞かれないように）
async function getMic() {
  if (micStream && micStream.getTracks().some((t) => t.readyState === "live")) return micStream;

/* 録音して、話し終わって silenceSec 秒たったら自動で止める */

    const stream = await getMic();

      if (analyser) {
        analyser.getByteTimeDomainData(buf);
        let sum = 0; for (let k = 0; k < buf.length; k++) { const x = (buf[k] - 128) / 128; sum += x * x; }

      } else spoke = true;
      if (spoke && silenceSec && now - lastLoud > silenceSec * 1000) stopFn();
      else if (!spoke && now - t0 > noSpeechSec * 1000) stopFn();

function speak(text, lang, onDone) {

    if (!("speechSynthesis" in window)) { onDone && onDone(); return; }
    speechSynthesis.cancel();

    u.lang = lang; u.rate = 1.0;

    u.onend = fin; u.onerror = fin;

/* マイク操作をまとめたコントローラ */
function mountAnswer({ lang, continuous, silenceSec, confirm, onSubmit, onSpeechStart }) {
  let current = { text: "", alts: [] };
  const tEl = $("#transcript"), mic = $("#micBtn"), msg = $("#msg"), conf = $("#confirmRow");
  const setText = (t, interim) => { tEl.innerHTML = t ? `<span class="${interim ? "interim" : ""}">${esc(t)}</span>` : `<span class="ph">…</span>`; };
  const setMsg = (m, cls) => { msg.textContent = m || ""; msg.className = "msg " + (cls || ""); };
  let listening = false;
  const stopUI = () => { listening = false; mic && mic.classList.remove("on"); };
  function start() {
    if (!speechAvailable || listening) return;
    setMsg(""); conf.classList.add("hidden");
    listening = true; mic && mic.classList.add("on");
    setText("", true);
    activeRec = listen({
      lang, continuous, silenceSec,
      onSpeechStart: () => onSpeechStart && onSpeechStart(),
      onInterim: (t) => setText(t, true),
      onError: (err) => { if (err !== "aborted") setMsg(SR_ERRORS[err] || ("音声認識エラー: " + err), "ng"); },
      onEnd: (res) => {
        stopUI(); activeRec = null;
        if (!res.text) { if (!msg.textContent) setMsg(SR_ERRORS["no-speech"], "ng"); setText(""); return; }
        current = res; setText(res.text, false);
        if (confirm) conf.classList.remove("hidden"); else onSubmit(current, "voice");
      }
    });
  }
  function stop() { if (activeRec) { try { activeRec.stop(); } catch (e) {} } }
  if (mic) mic.onclick = () => (listening ? stop() : start());
  $("#submitBtn").onclick = () => { conf.classList.add("hidden"); onSubmit(current, "voice"); };
  $("#retryBtn").onclick = () => { conf.classList.add("hidden"); setText(""); start(); };
  const ti = $("#textIn"), ts = $("#textSubmit");
  if (ti && ts) {
    let firstKey = true;
    ti.addEventListener("input", () => { if (firstKey) { firstKey = false; onSpeechStart && onSpeechStart(); } });
    const go = () => { const v = ti.value.trim(); if (!v) return; setText(v, false); onSubmit({ text: v, alts: [v] }, "text"); };
    ts.onclick = go;
    if (ti.tagName === "INPUT") ti.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) go(); });
  }
  return {
    start, setMsg,
    disable() { if (mic) mic.disabled = true; if (ti) ti.disabled = true; if (ts) ts.disabled = true; conf.classList.add("hidden"); },
  };
}

async function judgeStage1(i, text, segAlts) {
  const it = CONTENT[i];

/* ElevenLabs で文字起こしする版（日本語と英語がまざっても聞き取れる） */
function renderStage1Rec(i) {

  render(`${header("段階1　" + it.short, true)}

          <button class="mic" id="micBtn" aria-label="話す"><span class="mic-ico"></span></button>

          <button class="btn primary" id="textSubmit">答える</button></div></details>` : ""}
      </div>
      <div id="result"></div>

  bindBack(() => renderItem(i));

  const setMsg = (m, cls) => { msg.textContent = m || ""; msg.className = "msg " + (cls || ""); };
  let recording = null, busy = false;
  const lock = () => { mic.disabled = true; const ti = $("#textIn"), ts = $("#textSubmit"); if (ti) ti.disabled = true; if (ts) ts.disabled = true; };
  mic.onclick = async () => {
    if (busy) return;
    if (recording) { recording.stop(); return; }
    setMsg("");
    try {
      recording = startRecording({ silenceSec: sec, onLevel: (v) => { bar.style.width = Math.round(v * 100) + "%"; } });
      mic.classList.add("on"); level.classList.remove("hidden");

      tEl.innerHTML = `<span class="ph">録音しています…</span>`;
      const { blob, spoke } = await recording.done;
      recording = null; mic.classList.remove("on"); level.classList.add("hidden");
      if (!spoke || blob.size < 1000) { hint.textContent = "もう一度タップして説明しよう"; tEl.innerHTML = `<span class="ph">…</span>`; return setMsg(SR_ERRORS["no-speech"], "ng"); }
      busy = true; lock();
      hint.textContent = "";
      tEl.innerHTML = `<span class="judging"><span class="spinner"></span>文字に起こしています…</span>`;
      const { text } = await api.transcribe(blob);
      if (!text) { busy = false; mic.disabled = false; hint.textContent = "もう一度タップして説明しよう"; tEl.innerHTML = `<span class="ph">…</span>`; return setMsg(SR_ERRORS["no-speech"], "ng"); }
      tEl.innerHTML = `<span>${esc(text)}</span>`;

      recording = null; busy = false; mic.disabled = false; mic.classList.remove("on"); level.classList.add("hidden");
      const m = String(e && (e.name || "")).includes("NotAllowed") ? SR_ERRORS["not-allowed"] : ("聞き取りに失敗しました：" + (e.message || e));
      setMsg(m + "（文字で入力して答えることもできます）", "ng");
      hint.textContent = "もう一度タップして説明しよう";
    }
  };
  const ti = $("#textIn"), ts = $("#textSubmit");
  if (ti && ts) ts.onclick = () => { const v = ti.value.trim(); if (!v || busy) return; busy = true; lock(); tEl.innerHTML = `<span>${esc(v)}</span>`; judgeStage1(i, v, null); };
}

async function saveResult(r) {
  const el = $("#saveState");
  try {
    const before = rewardState(state.history);
    const prog = await api.saveResult(r);
    if (prog) state.progress = prog;
    state.history = state.history.concat([{ timestamp: new Date().toISOString(), itemId: r.itemId, stage: r.stage, score: r.score, total: r.total, passed: r.passed, tags: r.tags || [] }]);
    if (el) { el.textContent = "記録しました"; el.classList.add("ok"); }
    const after = rewardState(state.history);
    const gifts = [];
    if (after.days > before.days) gifts.push({ big: "🐾", title: "今日のスタンプ！", text: after.onCard === 0 ? `スタンプカードが1枚うまりました（${after.cards}枚目）` : `スタンプカード ${after.onCard} / ${STAMPS_PER_CARD}` + (after.streak >= 2 ? `　🔥${after.streak}日連続` : "") });
    BADGES.filter((b) => after.badges.has(b.id) && !before.badges.has(b.id)).forEach((b) => gifts.push({ big: b.ico, title: "バッジ「" + b.name + "」", text: b.desc }));
    showGifts(gifts);
    const ci = $("#clearInfo");
    if (ci && r.passed) {
      const need = requiredPasses(r.stage), n = itemProg(r.itemId).passCount[r.stage - 1];
      ci.textContent = n >= need ? (r.stage === 4 ? "🎉 この文法をマスターしました！" : `段階${r.stage}クリア！ 段階${r.stage + 1}に進めます。`)
        : `段階${r.stage}クリアまで、あと${need - n}回合格しよう（${n}/${need}回）`;
    }
  } catch (e) {
    if (el) { el.textContent = "記録できませんでした：" + e.message; el.classList.add("ng"); }
  }
}

/* ===== 段階2〜4：問題を順に出す ===== */
function startQuiz(i, stage) {
  const it = CONTENT[i];
  const conf = state.settings["stage" + stage];
  let qs;
  if (stage === 2) qs = shuffle(it.stage2.questions);
  else if (stage === 3) qs = shuffle(it.stage3.questions).map((q) => Object.assign({ grammar: it.title }, q));
  else {
    // 段階4：この項目を中心に、それまでの項目もまぜる
    const tag = (src) => src.stage4.questions.concat(src.stage3.questions).map((q) => Object.assign({ grammar: src.title }, q));
    const cur = shuffle(tag(it));
    const prev = shuffle(CONTENT.slice(0, i).flatMap(tag));
    const n = conf.numQuestions;
    const fromCur = prev.length ? Math.ceil(n / 2) : n;
    qs = shuffle(cur.slice(0, fromCur).concat(prev.slice(0, n - Math.min(fromCur, cur.length))));
  }
  qs = qs.slice(0, Math.max(1, conf.numQuestions));
  session = { i, stage, qs, index: 0, log: [], startedAt: Date.now() };
  if (stage === 4) renderStage4Intro(); else renderQuestion();
}

function quizHeader() {
  const { stage, qs, index, i } = session;

function questionCard(q, stage) {
  if (stage === 2) {
    if (q.type === "choice") {
      return `<section class="q-card s2"><div class="q-label">( ) に入るものをえらんで、文全体を言おう</div>
        ${q.context ? `<div class="q-context">${esc(q.context)}</div>` : ""}
        <div class="q-main en">${esc(q.text).replace("( )", '<span class="blank">　　</span>')}</div>
        <div class="chips">${q.options.map((o) => `<span class="chip">${esc(o)}</span>`).join("")}</div></section>`;
    }
    if (q.type === "order") {
      return `<section class="q-card s2"><div class="q-label">ならべかえて、文を言おう${q.hint ? `（${esc(q.hint)}）` : ""}</div>
        <div class="chips big">${shuffle(q.words).map((w) => `<span class="chip">${esc(w)}</span>`).join("")}</div></section>`;
    }
    return `<section class="q-card s2"><div class="q-label">${esc(q.instruction)}</div>
      <div class="q-main en">${esc(q.text)}</div></section>`;
  }
  return `<section class="q-card s${stage}"><div class="q-label">${stage === 3 ? "英語で言おう" : "すぐに英語で！"}</div>
    <div class="q-main ja">${esc(q.ja)}</div>
    ${stage === 4 ? `<div class="countdown"><div class="countdown-bar" id="cd"></div></div>` : ""}</section>`;
}

function renderQuestion() {
  const { stage, qs, index } = session;
  const q = qs[index];
  render(`${quizHeader()}
    <main class="wrap">
      ${questionCard(q, stage)}
      ${answerBlock({ lang: "en-US", placeholder: stage === 4 ? "聞き取り中に英語で言おう" : "マイクをタップして英語で言おう", multiline: false })}
      <div id="result"></div>
    </main>`);
  bindBack(() => renderItem(session.i));

  let shownAt = 0, latency = null;
  const limit = state.settings.stage4.timeLimitSec;
  const confirm = stage === 4 ? !state.settings.autoSubmitStage4 : state.settings.confirmBeforeSubmit;
  const ctl = mountAnswer({
    lang: "en-US", continuous: false, confirm,
    onSpeechStart: () => { if (latency == null && shownAt) latency = (performance.now() - shownAt) / 1000; },
    onSubmit: (ans, via) => judgeQuestion(q, ans, via, latency, ctl)
  });

  if (stage === 4) {
    const begin = () => {
      shownAt = performance.now();
      const bar = $("#cd");
      const tick = setInterval(() => {
        const el = (performance.now() - shownAt) / 1000;
        if (bar) bar.style.width = Math.max(0, 100 - (el / limit) * 100) + "%";
        if (latency != null) { clearInterval(tick); if (bar) bar.classList.add(latency <= limit ? "ok" : "late"); }
        else if (el >= limit) { clearInterval(tick); if (bar) bar.classList.add("late"); ctl.setMsg("時間切れ！でも最後まで言ってみよう。", "warn"); }
      }, 100);
      timers.push(tick);
      if (speechAvailable) ctl.start();
    };
    if (state.settings.ttsStage4) speak(q.ja, "ja-JP", begin); else begin();
  }
}

async function judgeQuestion(q, ans, via, latency, ctl) {
  const { stage } = session;
  ctl.disable();
  const res = $("#result");
  let correct = false, model = "", feedback = "", by = "local";
  if (stage === 2) {
    correct = matchesAny(ans.alts.concat([ans.text]), stage2Answers(q));
    model = stage2Model(q);
  } else {
    if (matchesAny(ans.alts.concat([ans.text]), q.answers)) {
      correct = true; model = q.answers[0]; feedback = "正解です！";
    } else {
      res.innerHTML = `<div class="judging"><span class="spinner"></span>判定しています…</div>`;
      try {
        const r = await api.judge(buildTranslateRequest(q, q.grammar, ans.text));
        correct = !!r.correct; model = r.corrected || q.answers[0]; feedback = r.feedback || ""; by = "ai";
      } catch (e) {
        // AIが使えないときは自己判定
        res.innerHTML = `<div class="panel"><div class="msg ng">AIで判定できませんでした（${esc(e.message)}）。</div>
          <p>正解例と比べて、自分で判定しよう。</p>
          <div class="model">${q.answers.map(esc).join("<br>")}</div>
          <div class="btn-row"><button class="btn primary" id="selfOk">言えた</button><button class="btn" id="selfNg">言えなかった</button></div></div>`;
        await new Promise((resolve) => {
          $("#selfOk").onclick = () => { correct = true; resolve(); };
          $("#selfNg").onclick = () => { correct = false; resolve(); };
        });
        model = q.answers[0]; by = "self";
      }
    }
  }
  const late = stage === 4 && (latency == null || latency > state.settings.stage4.timeLimitSec);
  const finalCorrect = correct && !late;
  session.log.push({ q: q.ja || q.text || q.answer, a: ans.text, correct: finalCorrect, contentCorrect: correct, latency: latency == null ? null : Math.round(latency * 10) / 10, via, by });

  const isLast = session.index + 1 >= session.qs.length;
  res.innerHTML = `<div class="panel">
    <div class="verdict ${finalCorrect ? "ok" : "ng"}">${finalCorrect ? "○ 正解" : (correct && late ? "△ 正しいけど時間オーバー" : "× おしい")}
      ${stage === 4 && latency != null ? `<small>話し始め ${latency.toFixed(1)}秒</small>` : ""}</div>
    <div class="model-line"><span>正しい英文</span><div class="model-row"><b>${esc(model)}</b><button class="listen" id="listen" aria-label="お手本を聞く">🔊 お手本</button></div></div>
    ${feedback && !(finalCorrect && feedback === "正解です！") ? `<div class="feedback">${esc(feedback)}</div>` : ""}
    <button class="btn primary big" id="next">${isLast ? "結果を見る" : "次へ"}</button>
  </div>`;
  $("#next").onclick = () => { session.index++; if (isLast) renderQuizResult(); else renderQuestion(); };
  $("#listen").onclick = () => speak(model, "en-US");
  $("#next").focus();
}

async function renderQuizResult() {
  const { i, stage, log } = session;
  const it = CONTENT[i];
  const conf = state.settings["stage" + stage];
  const score = log.filter((l) => l.correct).length, total = log.length;
  const passed = score / total >= conf.passRatio;
  render(`${header(`段階${stage}　結果`, true)}
    <main class="wrap">
      <section class="result-card ${passed ? "ok" : "ng"}">
        <div class="big-score">${score}<span>/${total}</span></div>
        <div class="verdict ${passed ? "ok" : "ng"}">${passed ? "合格！" : "もう少し！"}</div>
        <div class="sub">合格ライン ${pct(conf.passRatio)}%${stage === 4 ? `・${conf.timeLimitSec}秒以内に話し始める` : ""}</div>
      </section>
      <ol class="log">${log.map((l) => `<li class="${l.correct ? "ok" : "ng"}"><span class="mark">${l.correct ? "○" : "×"}</span>
        <span><span class="lq">${esc(l.q)}</span><span class="la">${esc(l.a)}${l.latency != null && stage === 4 ? `（${l.latency}秒）` : ""}</span></span></li>`).join("")}</ol>
      <div class="save" id="saveState">記録しています…</div>
      <div class="clear-info" id="clearInfo"></div>
      <div class="btn-row"><button class="btn primary" id="again">もう一度</button><button class="btn" id="toItem">項目にもどる</button></div>
      ${footerNote()}
    </main>`);
  bindBack(() => renderItem(i));
  $("#again").onclick = () => startQuiz(i, stage);
  $("#toItem").onclick = () => renderItem(i);
  const tags = stage === 4 && score === total && log.every((l) => l.latency != null && l.latency <= 2) ? ["quick"] : [];
  await saveResult({ itemId: it.id, stage, score, total, passed, tags, durationSec: Math.round((Date.now() - session.startedAt) / 1000), details: log });
}

/* ===== 管理者設定 ===== */
function renderSettings() {
  const s = state.settings;
  const num = (id, v, min, max, step, unit) => `<span class="num-in"><input type="number" id="${id}" value="${v}" min="${min}" max="${max}" step="${step || 1}">${unit || ""}</span>`;
  const chk = (id, v, label) => `<label class="check"><input type="checkbox" id="${id}" ${v ? "checked" : ""}> ${label}</label>`;
  render(`${header("管理者設定", true)}
    <main class="wrap">
      <section class="panel form">
        <h2>課題（生徒にマスターしてほしい項目）</h2>
        <div class="checks">${CONTENT.map((it, i) => chk("as_" + it.id, isAssigned(it.id), `${i + 1}. ${esc(it.title)}`)).join("")}</div>
        <p class="hint">チェックした項目が生徒の画面の「課題」に表示されます。チェックしなかった項目は「自由練習」に表示されます。</p>
        <h2>合格基準</h2>
        <div class="row"><span>段階1 合格ライン（ポイント達成率）</span>${num("s1p", pct(s.stage1.passRatio), 10, 100, 5, "%")}</div>
        <div class="row"><span>段階1 話し終わってから自動で判定するまでの時間</span>${num("s1s", s.stage1.silenceSec, 1, 10, 0.5, "秒")}</div>
        <div class="row"><span>段階2 出題数</span>${num("s2n", s.stage2.numQuestions, 1, 30, 1, "問")}</div>
        <div class="row"><span>段階2 合格ライン</span>${num("s2p", pct(s.stage2.passRatio), 10, 100, 5, "%")}</div>
        <div class="row"><span>段階3 出題数</span>${num("s3n", s.stage3.numQuestions, 1, 30, 1, "問")}</div>
        <div class="row"><span>段階3 合格ライン</span>${num("s3p", pct(s.stage3.passRatio), 10, 100, 5, "%")}</div>
        <div class="row"><span>段階4 出題数</span>${num("s4n", s.stage4.numQuestions, 1, 30, 1, "問")}</div>
        <div class="row"><span>段階4 合格ライン</span>${num("s4p", pct(s.stage4.passRatio), 10, 100, 5, "%")}</div>
        <div class="row"><span>段階4 話し始めまでの制限時間</span>${num("s4t", s.stage4.timeLimitSec, 1, 30, 0.5, "秒")}</div>
        <h2>クリアに必要な合格回数</h2>
        ${[1, 2, 3, 4].map((k) => `<div class="row"><span>段階${k}（${STAGE_NAMES[k - 1]}）</span>${num("r" + k, requiredPasses(k), 1, 10, 1, "回")}</div>`).join("")}
        <p class="hint">段階4をクリアすると、その項目は「マスター」になります。</p>
        <p class="hint">※各段階の問題の数より多い出題数にした場合は、ある問題すべてを出題します。</p>
        <h2>進め方</h2>
        ${chk("lock", s.lockProgression, "前の段階に合格しないと次の段階に進めない")}
        ${chk("allowText", s.allowText, "音声のほかに文字入力も使えるようにする")}
        ${chk("confirm", s.confirmBeforeSubmit, "段階2・3で、聞き取った文を確認してから答える")}
        ${chk("auto4", s.autoSubmitStage4, "段階4は確認なしで自動で答える")}
        ${chk("tts4", s.ttsStage4, "段階4で日本語を読み上げる")}
        <h2>段階1の聞き取り</h2>
        ${chk("eleven", s.sttStage1 === "elevenlabs", "ElevenLabs で文字起こしする（日本語と英語がまざっても聞き取れる）")}
        ${MODE === "demo" ? `<div class="row"><span>ElevenLabs APIキー<br><small>（お試しモード専用。この端末にだけ保存）</small></span><input type="password" id="elevenkey" value="${esc(lsGet("eg_eleven_key", ""))}" class="wide" autocomplete="off"></div>` : `<p class="hint">APIキーは Apps Script の「スクリプト プロパティ」（ELEVENLABS_API_KEY）で管理しています。${state.hasEleven ? "（設定済み）" : "（まだ設定されていません。設定されるまではブラウザの音声認識を使います）"}</p>`}
        <h2>AI</h2>
        <div class="row"><span>Claudeのモデル名</span><input type="text" id="model" value="${esc(s.model)}" class="wide"></div>
        ${MODE === "demo" ? `<div class="row"><span>Claude APIキー<br><small>（お試しモード専用。この端末にだけ保存）</small></span><input type="password" id="apikey" value="${esc(lsGet("eg_claude_key", ""))}" class="wide" autocomplete="off"></div>` : `<p class="hint">APIキーは Apps Script の「スクリプト プロパティ」（ANTHROPIC_API_KEY）で管理しています。</p>`}
        <div class="btn-row"><button class="btn" id="testAi">AIの接続テスト</button></div>
        <div class="msg" id="aiMsg"></div>
        <div class="btn-row"><button class="btn primary" id="saveSet">保存する</button></div>
        <div class="msg" id="setMsg"></div>
      </section>
    </main>`);
  bindBack(renderHome);
  const collect = () => {
    const v = (id) => parseFloat($("#" + id).value);
    const clampR = (x) => Math.min(1, Math.max(0.1, (isNaN(x) ? 80 : x) / 100));
    const clampN = (x) => Math.min(30, Math.max(1, Math.round(isNaN(x) ? 10 : x)));
    const clampP = (x) => Math.min(10, Math.max(1, Math.round(isNaN(x) ? 1 : x)));
    return {
      stage1: { passRatio: clampR(v("s1p")), silenceSec: Math.min(10, Math.max(1, isNaN(v("s1s")) ? 3 : v("s1s"))), requiredPasses: clampP(v("r1")) },
      stage2: { numQuestions: clampN(v("s2n")), passRatio: clampR(v("s2p")), requiredPasses: clampP(v("r2")) },
      stage3: { numQuestions: clampN(v("s3n")), passRatio: clampR(v("s3p")), requiredPasses: clampP(v("r3")) },
      stage4: { numQuestions: clampN(v("s4n")), passRatio: clampR(v("s4p")), timeLimitSec: Math.min(30, Math.max(1, isNaN(v("s4t")) ? 5 : v("s4t"))), requiredPasses: clampP(v("r4")) },
      assigned: CONTENT.every((it) => $("#as_" + it.id).checked) ? null : CONTENT.filter((it) => $("#as_" + it.id).checked).map((it) => it.id),
      sttStage1: $("#eleven").checked ? "elevenlabs" : "browser",
      lockProgression: $("#lock").checked,
      allowText: $("#allowText").checked,
      confirmBeforeSubmit: $("#confirm").checked,
      autoSubmitStage4: $("#auto4").checked,
      ttsStage4: $("#tts4").checked,
      model: $("#model").value.trim() || DEFAULT_SETTINGS.model
    };
  };
  const keepKey = () => {
    if ($("#apikey")) lsSet("eg_claude_key", $("#apikey").value.trim());
    if ($("#elevenkey")) { lsSet("eg_eleven_key", $("#elevenkey").value.trim()); state.hasEleven = !!$("#elevenkey").value.trim(); }
  };
  $("#saveSet").onclick = async () => {
    const ns = collect(); keepKey();
    const m = $("#setMsg"); m.textContent = "保存しています…"; m.className = "msg";
    try { await api.saveSettings(ns); state.settings = mergeSettings(ns); m.textContent = "保存しました"; m.className = "msg ok"; }
    catch (e) { m.textContent = "保存できませんでした：" + e.message; m.className = "msg ng"; }
  };
  $("#testAi").onclick = async () => {
    keepKey();
    const prevModel = state.settings.model; state.settings.model = $("#model").value.trim() || prevModel;
    const m = $("#aiMsg"); m.textContent = "テスト中…"; m.className = "msg";
    try {
      const r = await api.judge(buildTranslateRequest({ ja: "私は生徒です。", answers: ["I am a student."] }, "be動詞", "I am student"));
      m.textContent = `接続できました。テスト判定（"I am student"）→ ${r.correct ? "正解" : "不正解"}：${r.feedback}`; m.className = "msg ok";
    } catch (e) { m.textContent = "接続できませんでした：" + e.message; m.className = "msg ng"; }
    finally { state.settings.model = prevModel; }
  };
}

/* ===== 学習記録（先生用） ===== */
async function renderDashboard() {
  render(`${header("学習記録", true)}<main class="wrap"><div class="judging"><span class="spinner"></span>読み込んでいます…</div></main>`);
  bindBack(renderHome);
  let d;
  try { d = await api.dashboard(); }
  catch (e) { $("main").innerHTML = `<div class="msg ng">読み込めませんでした：${esc(e.message)}</div>`; return; }
  const head = CONTENT.map((it, i) => `<th title="${esc(it.title)}">${isAssigned(it.id) ? "★" : ""}${i + 1}<br><small>${esc(it.short)}</small></th>`).join("");
  const fmtD = (ts) => { const t = new Date(ts); return isNaN(t) ? "－" : `${t.getMonth() + 1}/${t.getDate()}`; };
  const rows = (d.students || []).map((st) => `<tr><th class="name">${esc(String(st.email).split("@")[0])}</th><td>${st.days != null ? st.days + "日" : "－"}</td><td>${st.last ? fmtD(st.last) : "－"}</td>${CONTENT.map((it) => {
    const pc = (st.progress[it.id] && st.progress[it.id].passCount) || [0, 0, 0, 0];
    const lv = [1, 2, 3, 4].filter((k) => pc[k - 1] >= requiredPasses(k)).length;
    return `<td class="lv lv${lv}">${lv === 4 ? "マスター" : lv ? "段階" + lv : "－"}</td>`;
  }).join("")}</tr>`).join("");
  const fmt = (ts) => { const t = new Date(ts); if (isNaN(t)) return String(ts || ""); const z = (n) => String(n).padStart(2, "0"); return `${t.getMonth() + 1}/${t.getDate()} ${z(t.getHours())}:${z(t.getMinutes())}`; };
  const recent = (d.recent || []).map((r) => `<tr><td>${esc(fmt(r.timestamp))}</td><td>${esc(String(r.email).split("@")[0])}</td><td>${esc((CONTENT.find((c) => c.id === r.itemId) || {}).short || r.itemId)}</td><td>段階${r.stage}</td><td>${r.score}/${r.total}</td><td>${r.passed ? "合格" : ""}</td></tr>`).join("");
  $("main").innerHTML = `
    <section class="panel"><h2>到達状況</h2><p class="hint">クリアした段階を表示しています（★は課題の項目）。</p>
      <div class="table-wrap"><table class="dash"><thead><tr><th></th><th>練習<br><small>した日数</small></th><th>最後に<br><small>練習した日</small></th>${head}</tr></thead><tbody>${rows || `<tr><td colspan="${CONTENT.length + 3}">まだ記録がありません</td></tr>`}</tbody></table></div></section>
    <section class="panel"><h2>最近の記録</h2>
      <div class="table-wrap"><table class="recent"><thead><tr><th>日時</th><th>生徒</th><th>項目</th><th>段階</th><th>得点</th><th></th></tr></thead><tbody>${recent || `<tr><td colspan="6">まだ記録がありません</td></tr>`}</tbody></table></div></section>
    ${MODE === "demo" ? `<div class="btn-row"><button class="btn danger" id="clear">この端末の記録を消す</button></div><div class="msg" id="clearMsg"></div>` : ""}`;
  if ($("#clear")) {
    let armed = false;
    $("#clear").onclick = () => {
      if (!armed) { armed = true; $("#clear").textContent = "本当に消す（もう一度タップ）"; return; }
      lsSet("eg_results", []); state.progress = {}; state.history = []; renderDashboard();
    };
  }
}

/* ---------- 起動 ---------- */
async function init() {
  app().innerHTML = `<div class="boot"><span class="spinner"></span>読み込んでいます…</div>`;
  if (MODE === "api" && !lsGet("eg_token", "")) return renderLogin("");
  try {
    const b = await api.bootstrap();
    state.email = b.email || "";
    state.isAdmin = !!b.isAdmin;
    state.viewAsStudent = state.isAdmin && !!lsGet("eg_preview", false);
    state.settings = mergeSettings(b.settings);
    state.progress = b.progress || {};
    state.history = b.history || [];
    state.hasEleven = !!b.hasEleven;
    renderHome();
  } catch (e) {
    if (e instanceof AuthError) return renderLogin(e.message);
    app().innerHTML = `<div class="boot ng">起動できませんでした：${esc(e.message)}</div>`;
  }
}
document.addEventListener("DOMContentLoaded", init);

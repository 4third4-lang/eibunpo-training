<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文法トレーニング</title>
<style>
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f7f9fc; --ink: #1d2433; --muted: #5f687c; --line: #e2e6ee;
  --accent: #1f6f8b; --accent-ink: #ffffff; --accent-soft: #e3f1f6; --orange: #f08a24; --orange-soft: #fff1e3; --gold: #d4a017;
  --ok: #1a8a60; --ok-bg: #e2f6ee; --ng: #d03a3a; --ng-bg: #fde8e8; --warn: #a86400; --warn-bg: #fff3dc;
  --s1: #7a55e0; --s2: #2775d6; --s3: #0e9583; --s4: #e07a26;
  --s1-bg: #efebfd; --s2-bg: #e7f0fb; --s3-bg: #e2f5f2; --s4-bg: #fcefe3;
  --chip: #edf1f7; --bar: #1f6f8b; --bar-ink: #ffffff; --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 14px rgba(20, 30, 60, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121821; --surface: #1b232e; --surface-2: #222c38; --ink: #e8edf3; --muted: #a3aebd; --line: #2f3a48;
    --accent: #5fb7d4; --accent-ink: #0b1a21; --accent-soft: #17323d; --orange: #ffa552; --orange-soft: #3a2a1a; --gold: #f0c64a;
    --ok: #4cc98f; --ok-bg: #163527; --ng: #ff7b7b; --ng-bg: #3a1f22; --warn: #f0b64a; --warn-bg: #3a2e14;
    --s1: #a68cff; --s2: #67a8ff; --s3: #3fd1bc; --s4: #ffa361;
    --s1-bg: #2a2547; --s2-bg: #1d2c42; --s3-bg: #17332f; --s4-bg: #3a2a1c;
    --chip: #263140; --bar: #163f4f; --bar-ink: #ffffff; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
    --bg: #121821; --surface: #1b232e; --surface-2: #222c38; --ink: #e8edf3; --muted: #a3aebd; --line: #2f3a48;
    --accent: #5fb7d4; --accent-ink: #0b1a21; --accent-soft: #17323d; --orange: #ffa552; --orange-soft: #3a2a1a; --gold: #f0c64a;
    --ok: #4cc98f; --ok-bg: #163527; --ng: #ff7b7b; --ng-bg: #3a1f22; --warn: #f0b64a; --warn-bg: #3a2e14;
    --s1: #a68cff; --s2: #67a8ff; --s3: #3fd1bc; --s4: #ffa361;
    --s1-bg: #2a2547; --s2-bg: #1d2c42; --s3-bg: #17332f; --s4-bg: #3a2a1c;
    --chip: #263140; --bar: #163f4f; --bar-ink: #ffffff; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", sans-serif;
  font-size: 16px; line-height: 1.6;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
.hidden { display: none !important; }

/* ヘッダー */
.bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); background: var(--bar); color: var(--bar-ink); }
.bar h1 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: rgba(255,255,255,.18); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 15px; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff; font-size: 26px; line-height: 1; padding-bottom: 3px; }
.who { font-size: 13px; color: rgba(255,255,255,.85); }
.badge { background: var(--warn-bg); color: var(--warn); padding: 2px 8px; border-radius: 99px; font-weight: 700; font-size: 12px; }

.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
.lead { color: var(--muted); margin: 4px 0 14px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 14px; }
.boot { padding: 60px 16px; text-align: center; color: var(--muted); }

/* ホームの項目カード */
.items { display: grid; gap: 10px; }
.item-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 14px 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.item-card:active { transform: scale(.99); }
.num { width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.item-main { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.item-title { font-weight: 700; font-size: 16px; }
.item-count { font-weight: 800; color: var(--muted); font-size: 15px; }
.dots { display: flex; gap: 6px; }
.dot { position: relative; overflow: hidden; width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 800; background: var(--chip); color: var(--muted); }
.dot b { position: relative; }
.dot i { position: absolute; left: 0; bottom: 0; top: 0; opacity: .35; }
.dot.s1 i { background: var(--s1); } .dot.s2 i { background: var(--s2); } .dot.s3 i { background: var(--s3); } .dot.s4 i { background: var(--s4); }
.item-card.mastered { border-color: var(--s4); }
.item-card.mastered .item-count { color: var(--s4); }
.sec { font-size: 15px; color: var(--muted); margin: 18px 4px 8px; }
.mic-side { flex: 1; min-width: 0; }
.level { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 8px; }
.level i { display: block; height: 100%; width: 0; background: var(--ng); transition: width .1s; }
.clear-info { font-weight: 700; color: var(--accent); margin-top: 8px; }
.clear-info:empty { display: none; }
.dot.on.s1 { background: var(--s1); color: #fff; } .dot.on.s2 { background: var(--s2); color: #fff; }
.dot.on.s3 { background: var(--s3); color: #fff; } .dot.on.s4 { background: var(--s4); color: #fff; }
.home-links { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
.link-btn { background: none; border: 1px solid var(--line); border-radius: 99px; padding: 8px 16px; color: var(--muted); font-size: 14px; }

/* 段階カード */
.stages { display: grid; gap: 12px; }
.stage-card { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); flex-wrap: wrap; }
.stage-no { flex: none; font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 10px; color: #fff; }
.stage-card.s1 .stage-no { background: var(--s1); } .stage-card.s2 .stage-no { background: var(--s2); }
.stage-card.s3 .stage-no { background: var(--s3); } .stage-card.s4 .stage-no { background: var(--s4); }
.stage-body { flex: 1; display: flex; flex-direction: column; min-width: 150px; }
.stage-name { font-weight: 700; font-size: 17px; }
.stage-desc { color: var(--muted); font-size: 13px; }
.tag { font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); }
.tag.ok { background: var(--ok-bg); color: var(--ok); }
.tag.lock { background: transparent; }

/* 問題カード */
.progress { height: 6px; background: var(--chip); }
.progress-bar { height: 100%; transition: width .3s; }
.progress-bar.s2 { background: var(--s2); } .progress-bar.s3 { background: var(--s3); } .progress-bar.s4 { background: var(--s4); }
.progress-text { text-align: right; font-size: 13px; color: var(--muted); padding: 6px 16px 0; max-width: 640px; margin: 0 auto; }
.q-card { border-radius: 18px; padding: 18px; margin-bottom: 14px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.q-card.s1 { border-top: 5px solid var(--s1); } .q-card.s2 { border-top: 5px solid var(--s2); }
.q-card.s3 { border-top: 5px solid var(--s3); } .q-card.s4 { border-top: 5px solid var(--s4); }
.q-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.q-main { font-size: 22px; font-weight: 700; line-height: 1.5; }
.q-main.en { font-size: 24px; letter-spacing: .01em; }
.q-sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
.q-context { color: var(--muted); font-size: 18px; margin-bottom: 4px; }
.blank { display: inline-block; min-width: 3em; border-bottom: 3px solid var(--s2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { padding: 6px 14px; border-radius: 10px; background: var(--chip); font-weight: 700; font-size: 18px; }
.chips.big .chip { font-size: 21px; padding: 8px 16px; }
.intro .rules { margin: 12px 0 0; padding-left: 20px; color: var(--ink); }
.countdown { height: 8px; border-radius: 99px; background: var(--chip); margin-top: 14px; overflow: hidden; }
.countdown-bar { height: 100%; width: 100%; background: var(--s4); transition: width .1s linear; }
.countdown-bar.ok { background: var(--ok); } .countdown-bar.late { background: var(--ng); }

/* 回答欄 */
.answer { margin-bottom: 14px; }
.transcript { min-height: 64px; padding: 14px 16px; border-radius: 14px; background: var(--surface-2); border: 1px dashed var(--line); font-size: 19px; margin-bottom: 12px; word-break: break-word; }
.transcript .ph { color: var(--muted); font-size: 15px; }
.transcript .interim { color: var(--muted); }
.mic-row { display: flex; align-items: center; gap: 14px; }
.mic { width: 76px; height: 76px; flex: none; border-radius: 50%; border: none; background: var(--accent); display: grid; place-items: center; box-shadow: 0 6px 18px rgba(45, 85, 224, .35); }
.mic-ico { width: 22px; height: 34px; border: 4px solid #fff; border-radius: 12px; position: relative; }
.mic-ico::after { content: ""; position: absolute; left: 50%; bottom: -12px; width: 4px; height: 8px; background: #fff; transform: translateX(-50%); }
.mic.on { background: var(--ng); animation: pulse 1.2s infinite; box-shadow: 0 6px 18px rgba(201, 60, 60, .35); }
.mic.on .mic-ico { border-radius: 4px; width: 26px; height: 26px; background: #fff; }
.mic.on .mic-ico::after { display: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(201, 60, 60, .45); } 70% { box-shadow: 0 0 0 18px rgba(201, 60, 60, 0); } 100% { box-shadow: 0 0 0 0 rgba(201, 60, 60, 0); } }
.mic-hint { color: var(--muted); font-size: 14px; }
.msg { font-size: 14px; margin-top: 8px; min-height: 0; }
.msg:empty { display: none; }
.msg.ok { color: var(--ok); } .msg.ng { color: var(--ng); } .msg.warn { color: var(--warn); font-weight: 700; }
.confirm { display: flex; gap: 10px; margin-top: 12px; }
.text-in { margin-top: 14px; }
.text-in summary { color: var(--muted); font-size: 14px; cursor: pointer; }
.text-row { display: flex; gap: 8px; margin-top: 8px; align-items: flex-start; }
.text-row input, .text-row textarea { flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

/* ボタン */
.btn { padding: 11px 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger { color: var(--ng); border-color: var(--ng); }
.btn.big { width: 100%; padding: 15px; font-size: 18px; margin-top: 6px; }
.btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

/* 判定結果 */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.panel h2 { font-size: 16px; margin: 4px 0 10px; }
.judging { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 14px 4px; }
.spinner { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--chip); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; }
@keyframes spin { to { transform: rotate(360deg); } }
.verdict { font-size: 22px; font-weight: 800; }
.verdict small { font-size: 14px; font-weight: 600; color: var(--muted); margin-left: 6px; }
.verdict.ok { color: var(--ok); } .verdict.ng { color: var(--ng); }
.points { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 6px; }
.points li { padding: 8px 12px; border-radius: 10px; font-size: 15px; }
.points li.met { background: var(--ok-bg); color: var(--ok); }
.points li.miss { background: var(--ng-bg); color: var(--ng); }
.feedback { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-top: 10px; font-size: 15px; }
.model-line { margin-top: 10px; font-size: 19px; font-weight: 700; }
.model-line span { display: block; font-size: 12px; color: var(--muted); font-weight: 700; }
.model { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; font-size: 15px; margin-top: 8px; }
.model-wrap { margin-top: 12px; } .model-wrap summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.checks { display: grid; gap: 8px; margin: 12px 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 15px; margin: 6px 0; }
.check input { margin-top: 5px; width: 18px; height: 18px; flex: none; }
.save { font-size: 13px; color: var(--muted); margin-top: 10px; }
.save.ok { color: var(--ok); } .save.ng { color: var(--ng); }

.result-card { text-align: center; padding: 24px 16px; border-radius: 20px; margin-bottom: 14px; background: var(--surface); border: 1px solid var(--line); }
.result-card.ok { background: var(--ok-bg); } .result-card.ng { background: var(--ng-bg); }
.big-score { font-size: 56px; font-weight: 800; line-height: 1; }
.big-score span { font-size: 24px; color: var(--muted); }
.result-card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.log { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.log li { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.log .mark { font-weight: 800; flex: none; }
.log li.ok .mark { color: var(--ok); } .log li.ng .mark { color: var(--ng); }
.log .lq { display: block; font-size: 14px; color: var(--muted); }
.log .la { display: block; font-size: 16px; word-break: break-word; }

/* 設定 */
.form .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.form .row > span:first-child { flex: 1; min-width: 180px; font-size: 15px; }
.num-in { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.form input[type=number] { width: 80px; font: inherit; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-align: right; }
.form input.wide { flex: 1; min-width: 200px; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.hint { font-size: 13px; color: var(--muted); }

/* 学習記録 */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th small { font-weight: 400; color: var(--muted); font-size: 11px; }
th.name { text-align: left; }
.lv { font-weight: 700; border-radius: 6px; }
.lv1 { color: var(--s1); } .lv2 { color: var(--s2); } .lv3 { color: var(--s3); } .lv4 { color: #fff; background: var(--s4); }

.ai-note { font-size: 12px; color: var(--muted); margin-top: 28px; text-align: center; }

.preview-bar { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 700; }
.preview-bar button { border: 1px solid var(--warn); background: var(--surface); color: var(--warn); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 700; }
.login a.btn { display: block; text-align: center; text-decoration: none; }

/* 先生用：画面の切りかえ・管理者画面 */
.view-switch { display: inline-flex; border: 1px solid rgba(255,255,255,.5); border-radius: 99px; overflow: hidden; flex: none; }
.view-switch button { border: 0; background: transparent; color: rgba(255,255,255,.85); font-size: 12px; font-weight: 700; padding: 6px 11px; }
.view-switch button.on { background: #fff; color: var(--bar); }
.admin-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); margin-bottom: 14px; }
.admin-card { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 16px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.ac-ico { font-size: 24px; }
.ac-title { font-weight: 800; font-size: 17px; }
.ac-desc { color: var(--muted); font-size: 13px; }
.summary { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14px; }
.summary dt { color: var(--muted); font-weight: 700; }
.summary dd { margin: 0; }
@media (max-width: 520px) { .summary { grid-template-columns: 1fr; } .summary dd { margin-bottom: 6px; } .bar .who { display: none; } }
.url-row { display: flex; gap: 8px; }
.url-row input { flex: 1; min-width: 0; font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }

/* ===== 生徒ホーム：自分のカード・スタンプカード ===== */
.me-card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 16px; margin-bottom: 14px; }
.me-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.me-hello { font-size: 20px; font-weight: 800; }
.me-sub { color: var(--muted); font-size: 14px; }
.me-stats { display: flex; gap: 8px; }
.stat { display: flex; flex-direction: column; align-items: center; min-width: 62px; padding: 6px 8px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); }
.stat b { font-size: 17px; }
.stat small { color: var(--muted); font-size: 11px; font-weight: 700; }
.stamp-card { display: block; width: 100%; text-align: left; margin-top: 14px; padding: 12px; border-radius: 14px; border: 2px dashed color-mix(in srgb, var(--orange) 55%, transparent); background: var(--orange-soft); }
.sc-head { display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; color: var(--orange); margin-bottom: 8px; }
.sc-more { color: var(--accent); }
.slots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.slot { aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 800; color: color-mix(in srgb, var(--orange) 55%, transparent); border: 2px solid color-mix(in srgb, var(--orange) 35%, transparent); background: var(--surface); }
.slot.on { background: var(--orange); border-color: var(--orange); color: #fff; font-size: 15px; }
.slot.today { animation: stampIn .6s ease-out; box-shadow: 0 0 0 3px color-mix(in srgb, var(--orange) 35%, transparent); }
.slots.wide { grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 420px; margin: 10px auto; }
.slot.big { font-size: 15px; }
.slot.big.on { font-size: 26px; }
@keyframes stampIn { 0% { transform: scale(1.8) rotate(-20deg); opacity: 0; } 60% { transform: scale(.9) rotate(4deg); opacity: 1; } 100% { transform: none; } }

/* 今日のおすすめ */
.next-card { background: linear-gradient(135deg, var(--accent-soft), var(--surface)); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
.next-label { font-size: 13px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
.next-body { display: flex; align-items: center; gap: 10px; }
.next-body .stage-no { color: #fff; padding: 6px 10px; border-radius: 10px; font-weight: 800; font-size: 13px; }
.stage-no.s1 { background: var(--s1); } .stage-no.s2 { background: var(--s2); } .stage-no.s3 { background: var(--s3); } .stage-no.s4 { background: var(--s4); }
.next-title { font-size: 18px; font-weight: 800; display: flex; flex-direction: column; }
.next-title small { font-size: 13px; color: var(--muted); font-weight: 700; }
.next-card.done .next-title { display: block; }

/* スタンプとバッジのページ */
.rw-stats { display: flex; flex-wrap: wrap; gap: 8px 16px; justify-content: center; color: var(--muted); font-size: 14px; }
.rw-stats b { color: var(--ink); font-size: 18px; }
.panel h2 small { color: var(--muted); font-weight: 700; font-size: 13px; margin-left: 6px; }
.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.bdg { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 12px 8px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--line); opacity: .55; }
.bdg.got { opacity: 1; background: color-mix(in srgb, var(--gold) 12%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.bdg-ico { font-size: 30px; }
.bdg-name { font-weight: 800; font-size: 14px; }
.bdg-desc { color: var(--muted); font-size: 12px; line-height: 1.4; }

/* ごほうびのお知らせ */
.gift-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(10, 20, 30, .55); display: grid; place-items: center; padding: 16px; animation: fadeIn .2s ease-out; }
.gift { position: relative; overflow: hidden; width: min(360px, 100%); background: var(--surface); border-radius: 22px; padding: 26px 20px 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.3); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
.gift-big { font-size: 72px; line-height: 1.1; animation: stampIn .7s ease-out; }
.gift-title { font-size: 20px; font-weight: 800; margin-top: 6px; }
.gift-text { color: var(--muted); margin: 4px 0 14px; }
.confetti { position: absolute; inset: 0; pointer-events: none; }
.confetti i { position: absolute; top: -12px; left: calc(var(--k) * 5.5%); width: 8px; height: 14px; border-radius: 2px; background: hsl(calc(var(--k) * 40), 85%, 60%); animation: fall 1.6s calc(var(--k) * 45ms) ease-in forwards; }
@keyframes fall { to { transform: translateY(420px) rotate(540deg); opacity: 0; } }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .gift, .gift-big, .confetti i, .slot.today, .gift-overlay { animation: none !important; } .confetti { display: none; } }

/* お手本音声 */
.model-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.listen { border: 1px solid var(--accent); color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 800; }

/* 全体の見やすさ */
.item-card, .stage-card { min-height: 64px; }
.btn.primary { box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 30%, transparent); }
.mic { background: var(--orange); box-shadow: 0 6px 18px color-mix(in srgb, var(--orange) 40%, transparent); }
.lead { font-size: 14px; }
.dash td, .dash th { font-size: 13px; }

/* ===== 着せ替え（テーマ色）：--skin の色でヘッダーとボタンの色を変える ===== */
:root[data-skin] { --bar: var(--skin); --accent: var(--skin); --accent-soft: color-mix(in srgb, var(--skin) 12%, #ffffff); }
@media (prefers-color-scheme: dark) {
  :root[data-skin]:not([data-theme="light"]) { --bar: color-mix(in srgb, var(--skin) 72%, #000000); --accent: color-mix(in srgb, var(--skin) 55%, #ffffff); --accent-soft: color-mix(in srgb, var(--skin) 28%, #1b232e); }
}
.wrap.wide { max-width: 940px; }
.center { text-align: center; justify-content: center; }
.btn.small { padding: 6px 12px; font-size: 13px; border-radius: 10px; }
.link-btn.small { padding: 2px 10px; font-size: 12px; }
.save .gain { font-weight: 800; color: var(--orange); }

/* ホームの自分カード（アバター・級） */
.me-top { flex-wrap: nowrap; justify-content: flex-start; }
.me-av { position: relative; flex: none; border: 0; background: none; padding: 0; line-height: 0; border-radius: 50%; box-shadow: 0 2px 10px rgba(20, 30, 60, .18); }
.me-av .av-edit { position: absolute; right: -4px; bottom: -2px; background: var(--surface); border-radius: 50%; font-size: 13px; line-height: 1; padding: 4px; box-shadow: var(--shadow); }
.me-info { flex: 1; min-width: 0; }
.lv-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.lv-chip { display: inline-flex; align-items: center; gap: 4px; background: linear-gradient(135deg, #3b2f2f, #6b4f3a); color: #ffe8a3; font-weight: 900; font-size: 14px; padding: 3px 10px; border-radius: 99px; letter-spacing: .04em; }
.lv-chip.small { font-size: 12px; padding: 2px 8px; }
.lv-next { font-size: 12px; color: var(--muted); font-weight: 700; }
.lv-bar { height: 8px; border-radius: 99px; background: var(--chip); overflow: hidden; margin-top: 6px; }
.lv-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--gold), var(--orange)); border-radius: 99px; }
.lv-row.big .lv-chip { font-size: 18px; padding: 5px 14px; }
.me-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
.stat { min-width: 0; }
.lv-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.lv-list span { display: flex; flex-direction: column; align-items: center; min-width: 52px; padding: 4px 6px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 13px; font-weight: 800; color: var(--muted); }
.lv-list span small { font-size: 10px; font-weight: 600; }
.lv-list span.got { background: color-mix(in srgb, var(--gold) 18%, var(--surface)); border-color: color-mix(in srgb, var(--gold) 50%, transparent); color: var(--ink); }

/* ホームのメニュー */
.quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; margin-bottom: 14px; }
.quick { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px 10px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.q-ico { font-size: 26px; line-height: 1.1; }
.q-label { font-size: 13px; font-weight: 800; }
.q-note { position: absolute; top: -6px; right: -4px; background: var(--orange); color: #fff; font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 99px; }
.q-note.new { background: var(--ng); }

/* アバター選び・着せ替え */
.av-pick-box { width: min(560px, 100%); max-height: 92vh; overflow-y: auto; text-align: center; }
.av-pick-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 8px; }
@media (max-width: 520px) { .av-pick-grid { grid-template-columns: repeat(4, 1fr); } }
.av-pick { display: flex; flex-direction: column; align-items: center; gap: 2px; background: var(--surface-2); border: 3px solid transparent; border-radius: 14px; padding: 6px 2px; font-size: 12px; font-weight: 700; }
.av-pick.active { border-color: var(--accent); background: var(--accent-soft); }
.av-skins, .av-bgs { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px 0 0; flex-wrap: wrap; }
.skin { width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }

.av-big { margin: 8px 0; min-height: 10px; }
.nick-row { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; font-size: 12px; color: var(--muted); font-weight: 700; text-align: left; }
.nick-row input, input.full { font: inherit; font-size: 16px; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.av-editor { display: grid; grid-template-columns: 250px 1fr; gap: 18px; align-items: start; }
@media (max-width: 700px) { .av-editor { grid-template-columns: 1fr; } .av-stage { position: static !important; } }
.av-stage { text-align: center; position: sticky; top: 70px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); }
.av-points { margin: 8px 0; font-size: 15px; font-weight: 700; }
.av-points b { font-size: 22px; color: var(--orange); }
.btn-row.center { justify-content: center; }
.btn-row.center .btn { flex: none; }
.nick-box { margin-top: 14px; text-align: left; font-size: 13px; font-weight: 700; color: var(--muted); }
.nick-box .url-row { margin-top: 4px; }
.nick-box input { font-size: 15px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.seg.center { justify-content: center; }
.av-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.av-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 3px solid transparent; border-radius: 16px; background: var(--surface); padding: 6px 4px; box-shadow: var(--shadow); }
.av-item .nm, .theme-item .nm, .shop-item .nm { font-size: 12px; font-weight: 800; line-height: 1.25; text-align: center; }

.av-item.locked .avatar-svg { filter: grayscale(1) brightness(.8); opacity: .5; }

.av-item:disabled { opacity: 1; }
.maker-parts { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.mk-row { margin-bottom: 8px; }
.mk-label { font-weight: 800; font-size: 13px; margin: 4px 0; }
.mk-opts { display: flex; flex-wrap: wrap; gap: 6px; }
.mk-opt { display: flex; flex-direction: column; align-items: center; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); padding: 3px 4px; }

.mk-opt.active { border-color: var(--accent); background: var(--accent-soft); }
.mk-color { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); padding: 0; }

.theme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.theme-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 16px; border: 3px solid transparent; background: var(--surface); box-shadow: var(--shadow); }
.theme-item.locked .swatch { filter: grayscale(.9); opacity: .45; }

.swatch.big { width: 64px; height: 64px; border-radius: 16px; }

/* お店 */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.shop-item { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 16px; background: color-mix(in srgb, var(--gold) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--gold) 35%, transparent); }
.shop-item.have { opacity: .65; }

/* おみくじ英文 */
.om-sentence { background: linear-gradient(180deg, #fffdf6, #fff6e0); border: 2px solid #f1d58a; border-radius: 18px; padding: 18px 16px; margin-bottom: 12px; text-align: center; color: #2b2118; }
.om-cat { display: inline-block; font-size: 12px; font-weight: 800; color: #9a6b00; background: #fff3bf; border-radius: 99px; padding: 2px 12px; }

.om-en { font-size: 28px; font-weight: 800; margin: 4px 0 8px; line-height: 1.35; font-family: Georgia, "Times New Roman", serif; }
.om-words { font-size: 22px; font-family: Georgia, "Times New Roman", serif; margin-bottom: 6px; }
.om-words .ok { color: var(--ok); } .om-words .ng { color: var(--ng); text-decoration: underline wavy; }
.omikuji-box { min-height: 150px; display: flex; align-items: center; justify-content: center; }
.omikuji-tube { font-size: 64px; }
.omikuji-box.shake .omikuji-tube { animation: shake .15s linear infinite; }
@keyframes shake { 0% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } 100% { transform: rotate(-12deg); } }
.om-result { max-width: 420px; margin: 0 auto; padding: 16px 18px 18px; text-align: center; color: #2b2118; border-radius: 12px; background: #fffdf6 repeating-linear-gradient(0deg, transparent 0 26px, rgba(232,197,107,.12) 26px 27px); border: 3px double #d9a520; box-shadow: 0 6px 20px rgba(160,110,0,.18); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); }
.om-top { font-size: 13px; letter-spacing: .5em; color: #b5121b; font-weight: 800; border-bottom: 2px solid #b5121b; display: inline-block; padding: 0 0 2px .5em; }
.fortune { font-size: 50px; font-weight: 900; letter-spacing: .2em; margin: 6px 0 2px; }
.fortune.f0 { color: #d93a3a; text-shadow: 0 0 14px rgba(255,200,0,.8); } .fortune.f1 { color: #e0703a; } .fortune.f2 { color: #2a9d8f; } .fortune.f3 { color: #1769aa; }
.om-msg { font-weight: 700; margin: 4px 0 12px; }
.om-lucks { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; text-align: left; margin: 0 auto 12px; max-width: 320px; }
.om-luck { display: flex; justify-content: space-between; font-size: 14px; border-bottom: 1px dotted #e8c56b; padding: 2px 0; }

.om-lucky { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.om-lucky > div { background: #fff; border: 1px solid #f1d58a; border-radius: 10px; padding: 6px 4px; display: flex; flex-direction: column; gap: 2px; }

.om-lucky span { font-size: 12px; color: #7a6a55; }
.om-dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px; vertical-align: middle; border: 1px solid rgba(0,0,0,.15); }
@media (max-width: 480px) { .om-lucky { grid-template-columns: 1fr; } .om-en { font-size: 23px; } }

/* ランキング */

.gift-art { line-height: 0; animation: stampIn .7s ease-out; }
.gift-items { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

/* 先生スタンプ */
.stamp-editor { display: grid; grid-template-columns: 170px 1fr; gap: 14px; align-items: start; }
@media (max-width: 600px) { .stamp-editor { grid-template-columns: 1fr; } }

.stamp-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; max-height: 320px; overflow-y: auto; padding: 2px; }
.stamp-opt { border: 3px solid transparent; border-radius: 14px; background: var(--surface-2); padding: 2px; line-height: 0; }
.stamp-opt.active { border-color: var(--accent); background: var(--accent-soft); }
.maker-form { display: grid; gap: 10px; }
.maker-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 800; }
.maker-form label.check { flex-direction: row; }
.maker-form select, .maker-form input[type=text] { font: inherit; font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.people-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; max-height: 360px; overflow-y: auto; }
.person { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px; border: 1px solid var(--line); font-size: 14px; font-weight: 700; }

.person input { width: 18px; height: 18px; }

.sent-row { display: flex; gap: 10px; align-items: center; font-size: 14px; }
table.people td, table.people th { vertical-align: middle; }

/* ===== 段階C：復習・締め切り・先生用の画面 ===== */
.chip.small { font-size: 13px; padding: 4px 10px; border: 0; }
button.chip { border: 1px solid var(--line); background: var(--chip); color: var(--ink); }
.review-tag { display: inline-block; font-size: 12px; font-weight: 800; color: var(--s3); background: var(--s3-bg); border-radius: 99px; padding: 3px 10px; margin-bottom: 8px; }
.review-list { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 6px; max-height: 360px; overflow-y: auto; }

.due-in input, .cls-sel, .toolbar select, .form-grid input, .edit-row input { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.form select { font: inherit; font-size: 14px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.toolbar.center { justify-content: center; }
.seg.small button { padding: 4px 12px; font-size: 12px; }
.sum-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-bottom: 14px; }
.sum-cards > div { display: flex; flex-direction: column; align-items: center; padding: 10px 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-align: center; }
.sum-cards b { font-size: 22px; } .sum-cards b.ng { color: var(--ng); } .sum-cards small { font-size: 11px; color: var(--muted); font-weight: 700; }
button.link { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 800; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.cls-tag { display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 800; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 0 6px; }
.dash td.asg { font-weight: 900; }
.due-mark { display: block; font-size: 10px; font-weight: 800; }
.due-mark.done { color: var(--ok); } .due-mark.over { color: var(--ng); } .due-mark.late { color: var(--warn); }
.lv4 .due-mark { color: #fff; }
.edit-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; text-align: left; }

.detail-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

.cal { display: flex; gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.cal-dow, .cal-col { display: flex; flex-direction: column; gap: 3px; align-items: center; }
.cal-dow span, .cal-dow small, .cal-col small { font-size: 10px; color: var(--muted); height: 14px; line-height: 14px; white-space: nowrap; }
.cal-col small { min-width: 26px; text-align: center; }

.log.small li { padding: 6px 10px; } .log.small .la { font-size: 14px; }

.chip-check { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); font-size: 13px; font-weight: 700; }
textarea.full { width: 100%; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }

.report-page h3 { font-size: 14px; margin: 14px 0 6px; padding-left: 8px; border-left: 4px solid #1f6f8b; }
.rp-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; border-bottom: 2px solid #1f6f8b; padding-bottom: 8px; }
.rp-title { font-size: 18px; font-weight: 900; } .rp-sub { font-size: 12px; color: #5f687c; }
.rp-who { display: flex; gap: 10px; align-items: baseline; font-size: 14px; } .rp-who b { font-size: 20px; }
.rp-sum { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 10px; }
.rp-sum > div { border: 1px solid #e2e6ee; border-radius: 8px; padding: 6px; text-align: center; display: flex; flex-direction: column; }
.rp-sum small { font-size: 10px; color: #5f687c; } .rp-sum b { font-size: 16px; }
.report-page table { font-size: 12px; } .report-page th, .report-page td { padding: 4px; border-bottom: 1px solid #e2e6ee; }
.report-page .hint { color: #5f687c; }
.report-page .cal-d { background: #edf1f7; } .report-page .cal-d.l1 { background: #a9dcc5; } .report-page .cal-d.l2 { background: #5fbf95; } .report-page .cal-d.l3 { background: #1a8a60; }
.rp-comment { height: 90px; border: 1px solid #c9ced8; border-radius: 8px; }
@media print {

  html, body { background: #fff !important; }

  .wrap, .report-wrap { max-width: none; padding: 0; margin: 0; }

  .report-page:last-child { page-break-after: auto; break-after: auto; }
}

/* ---------- 英文の正規化（音声認識の結果と正解を比べるため） ---------- */
const NUM_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty"];
const CONTRACTIONS = [
  [/\bi'?m\b/g, "i am"], [/\byou'?re\b/g, "you are"], [/\bwe're\b/g, "we are"], [/\bthey'?re\b/g, "they are"],
  [/\b(he|she|it|that|what|who|where|this|there|here|how)'s\b/g, "$1 is"],
  [/\bisn'?t\b/g, "is not"], [/\baren'?t\b/g, "are not"], [/\bwasn'?t\b/g, "was not"], [/\bweren't\b/g, "were not"],
  [/\bdon'?t\b/g, "do not"], [/\bdoesn'?t\b/g, "does not"], [/\bdidn'?t\b/g, "did not"],
  [/\bcan't\b/g, "can not"], [/\bcannot\b/g, "can not"], [/\bwon't\b/g, "will not"],
  [/\bi'll\b/g, "i will"], [/\byou'll\b/g, "you will"], [/\blet's\b/g, "let us"]
];
function normalize(s) {
  let t = String(s || "").toLowerCase().replace(/[’‘`´]/g, "'");
  t = t.replace(/\b([a-z])\.([a-z])\.?/g, "$1$2"); // T.V. → tv
  for (const [re, rep] of CONTRACTIONS) t = t.replace(re, rep);
  t = t.replace(/\b\d+\b/g, (n) => NUM_WORDS[+n] || n);
  t = t.replace(/[^a-z0-9' ]+/g, " ").replace(/'/g, "").replace(/\s+/g, " ").trim();
  return t;
}
const matchesAny = (cands, answers) => {
  const A = answers.map(normalize);
  return cands.some((c) => c && A.includes(normalize(c)));
};
function stage2Answers(q) {
  if (q.type === "choice") return [q.text.replace("( )", q.answer), q.answer];
  if (q.type === "order") return [q.answer];

}

/* ---------- 進捗の計算（記録から各項目・各段階の合格を求める） ---------- */
function computeProgress(results) {
  const p = {};
  for (const r of results) {
    if (!(r.stage >= 1 && r.stage <= 4)) continue; // 復習（段階0）は数えない
    const it = (p[r.itemId] = p[r.itemId] || { passed: [false, false, false, false], passCount: [0, 0, 0, 0], best: [0, 0, 0, 0], attempts: [0, 0, 0, 0] });
    const i = r.stage - 1;
    it.attempts[i]++;
    if (r.passed) { it.passed[i] = true; it.passCount[i]++; }
    const ratio = r.total ? r.score / r.total : 0;
    if (ratio > it.best[i]) it.best[i] = ratio;
  }
  return p;
}

const dayKey = (ts) => { const d = new Date(ts); return `${d.getFullYear()}-${z2(d.getMonth() + 1)}-${z2(d.getDate())}`; };

/* 級・段（けいけん値で上がる） */
const LEVELS = [[0, "10級"], [100, "9級"], [250, "8級"], [450, "7級"], [700, "6級"], [1000, "5級"], [1400, "4級"], [1900, "3級"], [2500, "2級"], [3200, "1級"],

function levelOf(xp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i][0]) idx = i;
  const next = LEVELS[idx + 1];
  return { index: idx, name: LEVELS[idx][1], from: LEVELS[idx][0], next: next ? next[1] : null, nextAt: next ? next[0] : null,
    progress: next ? Math.min(1, (xp - LEVELS[idx][0]) / (next[0] - LEVELS[idx][0])) : 1 };
}

/* 記録から、スタンプカード・連続日数・バッジ・級・ポイントを計算する
   settings：先生の設定 ／ itemIds：教材の項目ID ／ extra：{ omDays, teacherStamps, spent, owned, hasAvatar } */
function computeRewards(history, settings, itemIds, extra) {
  const h = (history || []).slice().sort((a, b) => (String(a.timestamp) < String(b.timestamp) ? -1 : 1));
  const x = extra || {}, st = settings || {};
  const need = (s) => Math.max(1, Math.round(Number((st["stage" + s] || {}).requiredPasses) || 1));
  const days = Array.from(new Set(h.map((r) => dayKey(r.timestamp)))).sort();
  const nums = days.map(dayNum);
  let best = 0, run = 0, comeback = false;
  nums.forEach((n, k) => { run = k && n - nums[k - 1] === 1 ? run + 1 : 1; best = Math.max(best, run); if (k && n - nums[k - 1] >= 8) comeback = true; });
  const today = dayNum(dayKey(Date.now()));
  let streak = 0;
  if (nums.length && today - nums[nums.length - 1] <= 1) { streak = 1; for (let k = nums.length - 1; k > 0 && nums[k] - nums[k - 1] === 1; k--) streak++; }
  const perDay = {}; h.forEach((r) => { const k = dayKey(r.timestamp); perDay[k] = (perDay[k] || 0) + 1; });
  const weekend = days.some((d) => new Date(d + "T00:00:00").getDay() === 6 && days.indexOf(dayKey(new Date(d + "T00:00:00").getTime() + 86400000)) >= 0);
  const pc = {}, passedAll = {};
  h.forEach((r) => {
    const a = (pc[r.itemId] = pc[r.itemId] || [0, 0, 0, 0]), b = (passedAll[r.itemId] = passedAll[r.itemId] || [false, false, false, false]);
    if (r.passed && r.stage >= 1 && r.stage <= 4) { a[r.stage - 1]++; b[r.stage - 1] = true; }
  });
  const clearedOf = (id) => [1, 2, 3, 4].filter((s) => (pc[id] || [0, 0, 0, 0])[s - 1] >= need(s)).length;
  const ids = itemIds || [];
  const assigned = Array.isArray(st.assigned) ? ids.filter((id) => st.assigned.indexOf(id) >= 0) : ids;
  const xp = h.reduce((a, r) => a + recordXP(r), 0);
  const level = levelOf(xp);
  const c = {
    total: h.length, passes: h.filter((r) => r.passed).length,
    perfect: h.filter((r) => r.stage >= 2 && r.total > 0 && r.score === r.total).length,
    explain: h.some((r) => r.stage === 1 && r.total > 0 && r.score === r.total),
    quick: h.some((r) => (r.tags || []).indexOf("quick") >= 0),
    cleared: ids.reduce((a, id) => a + clearedOf(id), 0),
    allStages: ids.some((id) => passedAll[id] && passedAll[id].every(Boolean)),
    mastered: ids.filter((id) => clearedOf(id) === 4).length,
    assignAll: assigned.length > 0 && assigned.every((id) => clearedOf(id) === 4),
    early: h.some((r) => new Date(r.timestamp).getHours() < 7),
    maxPerDay: Math.max.apply(null, [0].concat(Object.keys(perDay).map((k) => perDay[k])))
  };
  const tests = {
    first: c.total >= 1, streak3: best >= 3, streak7: best >= 7, streak30: best >= 30, card1: days.length >= STAMPS_PER_CARD,
    clear1: c.cleared >= 1, explain: c.explain, perfect: c.perfect >= 1, perfect10: c.perfect >= 10, quick: c.quick,
    allStages: c.allStages, master1: c.mastered >= 1, master3: c.mastered >= 3, assignAll: c.assignAll,
    pass10: c.passes >= 10, pass50: c.passes >= 50, daily5: c.maxPerDay >= 5, early: c.early, weekend: weekend, comeback: comeback,
    rank5: level.index >= 5, shodan: level.index >= 10, omikuji: (Number(x.omDays) || 0) >= 1,
    teacher: (Number(x.teacherStamps) || 0) >= 1, avatar: !!x.hasAvatar, shop1: (x.owned || []).length >= 1
  };
  const badges = new Set(BADGES.filter((b) => tests[b.id]).map((b) => b.id));
  const earned = 10 * days.length + 3 * c.passes + 20 * badges.size + 30 * c.mastered + 5 * (Number(x.omDays) || 0) + 10 * (Number(x.teacherStamps) || 0);
  const spent = Math.max(0, Number(x.spent) || 0);
  return {
    days: days.length, todayDone: days.indexOf(dayKey(Date.now())) >= 0, streak: streak, bestStreak: best,
    cards: Math.floor(days.length / STAMPS_PER_CARD), onCard: days.length % STAMPS_PER_CARD,
    badges: badges, xp: xp, level: level, mastered: c.mastered, liveBest: Number(x.liveBest) || 0,
    points: { earned: earned, spent: spent, avail: Math.max(0, earned - spent) }
  };
}

    setTimeout(fin, 8000); // 読み上げが終わらない端末への保険
    speechSynthesis.speak(u);
  } catch (e) { onDone && onDone(); }
}

function avatarHTML(av, size, opt) {

function stampArt(design, size) {
  if (!window.Art || !design) return "";
  if (typeof design === "string") return Art.design(design, size);
  if (design.id) return Art.design(design.id, size);
  if (design.make) { const m = design.make; return Art.stampSVG(m.a, m.t, size, { color: m.c, pose: m.po, expr: m.ex, crown: !!m.cr }); }

}
function applySkin(id) {

  let drawn = false;

    const rw = rewardState(state.history), owned = state.profile.owned || [];
    const changed = JSON.stringify([draft, theme]) !== saved();
    let side = "";
    if (tab === "make") {
      side = `<div class="maker-parts">${MAKER_GROUPS.map(([k, label]) => `<div class="mk-row"><div class="mk-label">${label}</div><div class="mk-opts">${A.MAKER[k].map((o) => {

/* ===== おみくじ英文（英文を読んでから引く） ===== */
const FORTUNE_ODDS = [[95, [50, 30, 15, 5]], [85, [30, 35, 25, 10]], [70, [15, 30, 30, 25]], [0, [5, 20, 35, 40]]];
const FORTUNE_NAMES = ["大吉", "中吉", "小吉", "吉"];
function drawFortune(acc) {
  const odds = FORTUNE_ODDS.find((o) => acc >= o[0])[1], x = Math.random() * 100;
  for (let i = 0, sum = 0; i < odds.length; i++) { sum += odds[i]; if (x < sum) return FORTUNE_NAMES[i]; }
  return "吉";
}
// 読めた単語の割合（語順もふくめて、いちばん長く一致した単語の数 ÷ 英文の単語の数）
function readAccuracy(target, said) {
  const t = normalize(target).split(" ").filter(Boolean), s = normalize(said).split(" ").filter(Boolean);
  if (!t.length) return { acc: 0, marks: [] };
  const dp = Array.from({ length: t.length + 1 }, () => new Array(s.length + 1).fill(0));
  for (let i = t.length - 1; i >= 0; i--) for (let j = s.length - 1; j >= 0; j--) dp[i][j] = t[i] === s[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const marks = []; let i = 0, j = 0;
  while (i < t.length) { if (j < s.length && t[i] === s[j]) { marks.push(true); i++; j++; } else if (j < s.length && dp[i][j + 1] >= dp[i + 1][j]) j++; else { marks.push(false); i++; } }
  return { acc: Math.round((dp[0][0] / t.length) * 100), marks, words: t };
}
function omikujiPool() {
  const O = window.OmikujiSet || { list: [] };
  const base = O.list.filter((x) => x.lv === 1);
  // 練習した文法の英文（課題の復習）もまぜる
  const done = CONTENT.filter((it) => itemProg(it.id).attempts.some((n) => n > 0));
  const review = done.flatMap((it) => it.stage3.questions.map((q) => ({ c: "review", en: q.answers[0], ja: q.ja })));
  return { base, review };
}
function renderOmikuji() {
  const O = window.OmikujiSet || { CATS: {}, MESSAGES: {}, WORDS: [["star", "星"]], COLORS: [["red", "赤", "#e03131"]], ITEMS: [["pencil", "えんぴつ"]], LUCK: [], STARS: {} };
  const { base, review } = omikujiPool();
  const pickFrom = review.length && Math.random() < 0.3 ? review : base;
  const s = pickFrom[Math.floor(Math.random() * pickFrom.length)] || { c: "pos", en: "You can do it.", ja: "あなたならできる。" };
  const today = state.profile.omLast === dayKey(Date.now());
  render(`${header("おみくじ英文", true)}
    <main class="wrap">
      <section class="om-sentence">
        <span class="om-cat">${esc(O.CATS[s.c] || "英文")}</span>
        <div class="om-ja">${esc(s.ja)}</div>
        <div class="om-en">${esc(s.en)}</div>
        <button class="listen" id="omListen">🔊 お手本</button>
      </section>
      <p class="hint center">英文を声に出して読んでから、おみくじを引こう。正しく読めるほど大吉が出やすくなります。${today ? "" : "今日はじめてのおみくじで +5pt！"}</p>
      ${answerBlock({ lang: "en-US", placeholder: "マイクをタップして英文を読もう", multiline: false })}
      <div id="result"></div>
      ${footerNote()}
    </main>`);
  bindBack(renderHome);
  $("#omListen").onclick = () => speak(s.en, "en-US");
  const ctl = mountAnswer({
    lang: "en-US", continuous: false, confirm: false,
    onSubmit: (ans) => {
      const best = [ans.text].concat(ans.alts || []).map((t) => readAccuracy(s.en, t)).sort((a, b) => b.acc - a.acc)[0];
      if (!best.acc) { ctl.setMsg("英文が聞き取れませんでした。もう一度読んでみよう。", "ng"); return; }
      ctl.disable();
      $("#result").innerHTML = `<div class="panel center"><div class="om-words">${best.words.map((w, k) => `<span class="${best.marks[k] ? "ok" : "ng"}">${esc(w)}</span>`).join(" ")}</div>
        <div class="verdict ${best.acc >= 85 ? "ok" : ""}">読めた割合 ${best.acc}%</div>
        <button class="btn primary big" id="omDraw">🎋 おみくじを引く</button>
        <button class="btn" id="omAgain">もう一度読む</button></div>`;
      $("#omAgain").onclick = renderOmikuji;
      $("#omDraw").onclick = () => drawOmikuji(drawFortune(best.acc), O);
    }
  });
}

  const box = $("#result");
  box.innerHTML = `<div class="omikuji-box shake"><div class="omikuji-tube">🎋</div></div><div class="hint center">カラカラ…</div>`;

/* 練習・交換などのあとに、新しくもらったものをお知らせする */
function rewardGifts(before) {
  const after = rewardState(state.history);
  const gifts = [];
  if (after.days > before.days) gifts.push({ big: "🐾", title: "今日のスタンプ！", text: after.onCard === 0 ? `スタンプカードが1枚うまりました（${after.cards}枚目）` : `スタンプカード ${after.onCard} / ${STAMPS_PER_CARD}` + (after.streak >= 2 ? `　🔥${after.streak}日連続` : "") });
  if (after.level.index > before.level.index) gifts.push({ big: "🥋", title: `${after.level.name}に昇級！`, text: `けいけん値 ${after.xp}。新しいキャラクターやアイテムが使えるようになるかも！` });
  const oldKeys = new Set(before.autoStamps.map((s) => s.key));
  after.autoStamps.filter((s) => !oldKeys.has(s.key)).forEach((s) => gifts.push({ html: stampArt(s.design, 160), title: "スタンプをもらいました！", text: s.note }));
  BADGES.filter((b) => after.badges.has(b.id) && !before.badges.has(b.id)).forEach((b) => gifts.push({ big: b.ico, title: "バッジ「" + b.name + "」", text: b.desc + "（+20pt）" }));
  const newItems = AVATAR_SET.list.filter((it) => after.unlocked.has(it.id) && !before.unlocked.has(it.id) && !shopPrice(it.un));
  const newThemes = THEMES.filter((t) => after.unlocked.has(t.id) && !before.unlocked.has(t.id) && !shopPrice(t.un));
  if (newItems.length || newThemes.length) {
    const av = state.profile.avatar || { b: "cat", bg: "bg_sky" };
    gifts.push({ html: `<div class="gift-items">${newItems.slice(0, 6).map((it) => { const a = Object.assign({}, av, { [it.k]: it.id }); if (it.k === "b") delete a.mk; return avatarHTML(a, 72); }).join("")}${newThemes.map((t) => `<span class="swatch big" style="background:${t.c}"></span>`).join("")}</div>`,
      title: "新しい着せ替えが使えるようになりました！", text: newItems.concat(newThemes).map((x) => x.name).join("、") });
  }
  showGifts(gifts);
  return { gained: after.points.avail - before.points.avail, after };
}

/* マイク操作をまとめたコントローラ */
function mountAnswer({ lang, continuous, silenceSec, confirm, onSubmit, onSpeechStart }) {
  let current = { text: "", alts: [] };
  const tEl = $("#transcript"), mic = $("#micBtn"), msg = $("#msg"), conf = $("#confirmRow");
  const setText = (t, interim) => { tEl.innerHTML = t ? `<span class="${interim ? "interim" : ""}">${esc(t)}</span>` : `<span class="ph">…</span>`; };
  const setMsg = (m, cls) => { msg.textContent = m || ""; msg.className = "msg " + (cls || ""); };
  let listening = false;
  const stopUI = () => { listening = false; mic && mic.classList.remove("on"); };
  function start() {
    if (!speechAvailable || listening) return;
    setMsg(""); conf.classList.add("hidden");
    listening = true; mic && mic.classList.add("on");
    setText("", true);
    activeRec = listen({
      lang, continuous, silenceSec,
      onSpeechStart: () => onSpeechStart && onSpeechStart(),
      onInterim: (t) => setText(t, true),
      onError: (err) => { if (err !== "aborted") setMsg(SR_ERRORS[err] || ("音声認識エラー: " + err), "ng"); },
      onEnd: (res) => {
        stopUI(); activeRec = null;
        if (!res.text) { if (!msg.textContent) setMsg(SR_ERRORS["no-speech"], "ng"); setText(""); return; }
        current = res; setText(res.text, false);
        if (confirm) conf.classList.remove("hidden"); else onSubmit(current, "voice");
      }
    });
  }
  function stop() { if (activeRec) { try { activeRec.stop(); } catch (e) {} } }
  if (mic) mic.onclick = () => (listening ? stop() : start());
  $("#submitBtn").onclick = () => { conf.classList.add("hidden"); onSubmit(current, "voice"); };
  $("#retryBtn").onclick = () => { conf.classList.add("hidden"); setText(""); start(); };
  const ti = $("#textIn"), ts = $("#textSubmit");
  if (ti && ts) {
    let firstKey = true;
    ti.addEventListener("input", () => { if (firstKey) { firstKey = false; onSpeechStart && onSpeechStart(); } });
    const go = () => { const v = ti.value.trim(); if (!v) return; setText(v, false); onSubmit({ text: v, alts: [v] }, "text"); };
    ts.onclick = go;
    if (ti.tagName === "INPUT") ti.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) go(); });
  }
  return {
    start, setMsg,
    disable() { if (mic) mic.disabled = true; if (ti) ti.disabled = true; if (ts) ts.disabled = true; conf.classList.add("hidden"); },
  };
}

      busy = true; lock();

}

async function saveResult(r) {
  const el = $("#saveState");

/* ===== 段階2〜4：問題を順に出す ===== */
function startQuiz(i, stage) {
  const it = CONTENT[i];
  const conf = state.settings["stage" + stage];
  let qs;
  if (stage === 2) qs = shuffle(it.stage2.questions);
  else if (stage === 3) qs = shuffle(it.stage3.questions).map((q) => Object.assign({ grammar: it.title }, q));
  else {
    // 段階4：この項目を中心に、それまでの項目もまぜる
    const tag = (src) => src.stage4.questions.concat(src.stage3.questions).map((q) => Object.assign({ grammar: src.title }, q));
    const cur = shuffle(tag(it));
    const prev = shuffle(CONTENT.slice(0, i).flatMap(tag));
    const n = conf.numQuestions;
    const fromCur = prev.length ? Math.ceil(n / 2) : n;
    qs = shuffle(cur.slice(0, fromCur).concat(prev.slice(0, n - Math.min(fromCur, cur.length))));
  }
  qs = qs.slice(0, Math.max(1, conf.numQuestions));
  session = { i, stage, qs, index: 0, log: [], startedAt: Date.now() };
  if (stage === 4) renderStage4Intro(); else renderQuestion();
}

  }
  return `<section class="q-card s${stage}"><div class="q-label">${stage === 3 ? "英語で言おう" : "すぐに英語で！"}</div>
    <div class="q-main ja">${esc(q.ja)}</div>
    ${stage === 4 ? `<div class="countdown"><div class="countdown-bar" id="cd"></div></div>` : ""}</section>`;
}

function renderQuestion() {
  const { qs, index } = session;
  const q = qs[index];
  const stage = q._st || session.stage; // 復習では問題ごとに段階がちがう
  render(`${quizHeader()}
    <main class="wrap">
      ${session.review ? `<div class="review-tag">${esc(q._from || "")}</div>` : ""}
      ${questionCard(q, stage)}
      ${answerBlock({ lang: "en-US", placeholder: stage === 4 ? "聞き取り中に英語で言おう" : "マイクをタップして英語で言おう", multiline: false })}
      <div id="result"></div>
    </main>`);
  bindBack(() => (session.review ? renderReview() : renderItem(session.i)));

  let shownAt = 0, latency = null;
  const limit = state.settings.stage4.timeLimitSec;
  const confirm = stage === 4 ? !state.settings.autoSubmitStage4 : state.settings.confirmBeforeSubmit;
  const ctl = mountAnswer({
    lang: "en-US", continuous: false, confirm,
    onSpeechStart: () => { if (latency == null && shownAt) latency = (performance.now() - shownAt) / 1000; },
    onSubmit: (ans, via) => judgeQuestion(q, ans, via, latency, ctl)
  });

  if (stage === 4) {
    const begin = () => {
      shownAt = performance.now();
      const bar = $("#cd");
      const tick = setInterval(() => {
        const el = (performance.now() - shownAt) / 1000;
        if (bar) bar.style.width = Math.max(0, 100 - (el / limit) * 100) + "%";
        if (latency != null) { clearInterval(tick); if (bar) bar.classList.add(latency <= limit ? "ok" : "late"); }
        else if (el >= limit) { clearInterval(tick); if (bar) bar.classList.add("late"); ctl.setMsg("時間切れ！でも最後まで言ってみよう。", "warn"); }
      }, 100);
      timers.push(tick);
      if (speechAvailable) ctl.start();
    };
    if (state.settings.ttsStage4) speak(q.ja, "ja-JP", begin); else begin();
  }
}

async function judgeQuestion(q, ans, via, latency, ctl) {
  const stage = q._st || session.stage;
  ctl.disable();
  const res = $("#result");
  let correct = false, model = "", feedback = "", by = "local";
  if (stage === 2) {
    correct = matchesAny(ans.alts.concat([ans.text]), stage2Answers(q));
    model = stage2Model(q);
  } else {
    if (matchesAny(ans.alts.concat([ans.text]), q.answers)) {
      correct = true; model = q.answers[0]; feedback = "正解です！";
    } else {
      res.innerHTML = `<div class="judging"><span class="spinner"></span>判定しています…</div>`;
      try {
        const r = await api.judge(buildTranslateRequest(q, q.grammar, ans.text));
        correct = !!r.correct; model = r.corrected || q.answers[0]; feedback = r.feedback || ""; by = "ai";
      } catch (e) {
        // AIが使えないときは自己判定
        res.innerHTML = `<div class="panel"><div class="msg ng">AIで判定できませんでした（${esc(e.message)}）。</div>
          <p>正解例と比べて、自分で判定しよう。</p>
          <div class="model">${q.answers.map(esc).join("<br>")}</div>
          <div class="btn-row"><button class="btn primary" id="selfOk">言えた</button><button class="btn" id="selfNg">言えなかった</button></div></div>`;
        await new Promise((resolve) => {
          $("#selfOk").onclick = () => { correct = true; resolve(); };
          $("#selfNg").onclick = () => { correct = false; resolve(); };
        });
        model = q.answers[0]; by = "self";
      }
    }
  }
  const late = stage === 4 && (latency == null || latency > state.settings.stage4.timeLimitSec);
  const finalCorrect = correct && !late;
  session.log.push({ qid: q.qid, st: stage, q: qText(q), a: ans.text, correct: finalCorrect, contentCorrect: correct, latency: latency == null ? null : Math.round(latency * 10) / 10, via, by });

  const isLast = session.index + 1 >= session.qs.length;
  res.innerHTML = `<div class="panel">
    <div class="verdict ${finalCorrect ? "ok" : "ng"}">${finalCorrect ? "○ 正解" : (correct && late ? "△ 正しいけど時間オーバー" : "× おしい")}
      ${stage === 4 && latency != null ? `<small>話し始め ${latency.toFixed(1)}秒</small>` : ""}</div>
    <div class="model-line"><span>正しい英文</span><div class="model-row"><b>${esc(model)}</b><button class="listen" id="listen" aria-label="お手本を聞く">🔊 お手本</button></div></div>
    ${feedback && !(finalCorrect && feedback === "正解です！") ? `<div class="feedback">${esc(feedback)}</div>` : ""}
    <button class="btn primary big" id="next">${isLast ? "結果を見る" : "次へ"}</button>
  </div>`;
  $("#next").onclick = () => { session.index++; if (isLast) renderQuizResult(); else renderQuestion(); };
  $("#listen").onclick = () => speak(model, "en-US");
  $("#next").focus();
}

async function renderQuizResult() {
  if (session.review) return renderReviewResult();
  const { i, stage, log } = session;
  const it = CONTENT[i];
  const conf = state.settings["stage" + stage];

  const passed = score / total >= conf.passRatio;
  render(`${header(`段階${stage}　結果`, true)}
    <main class="wrap">
      <section class="result-card ${passed ? "ok" : "ng"}">
        <div class="big-score">${score}<span>/${total}</span></div>
        <div class="verdict ${passed ? "ok" : "ng"}">${passed ? "合格！" : "もう少し！"}</div>

/* ===== 復習（まちがえた問題だけ） ===== */
const reviewItems = () => (state.mistakes || []).map((m) => ({ m, x: QINDEX[m.qid] })).filter((e) => e.x);
// 練習の結果を、まちがえたままの問題のリストに反映する
function applyToMistakes(details, ts) {
  const map = new Map((state.mistakes || []).map((m) => [m.qid, m]));
  (details || []).forEach((d) => {
    if (!d || !d.qid) return;
    const ok = d.contentCorrect !== undefined && d.contentCorrect !== null ? d.contentCorrect : d.correct;
    if (ok) map.delete(d.qid);
    else { const e = Object.assign({ qid: d.qid, wrong: 0 }, map.get(d.qid) || {}); e.wrong++; e.a = d.a || ""; e.ts = ts; map.set(d.qid, e); }
  });
  state.mistakes = Array.from(map.values());
}
function renderReview() {
  const list = reviewItems(), byItem = {};
  list.forEach(({ x }) => { byItem[x.it.id] = (byItem[x.it.id] || 0) + 1; });
  render(`${header("復習", true)}
    <main class="wrap">
      <section class="panel">
        <h2>まちがえた問題の復習 <small>${list.length}問</small></h2>
        ${list.length ? `<p class="hint">段階2〜4でまちがえたままの問題です。正解すると、このリストから消えます。</p>
          <div class="chips">${CONTENT.filter((it) => byItem[it.id]).map((it) => `<span class="chip small">${esc(it.short)} ${byItem[it.id]}問</span>`).join("")}</div>
          <ul class="review-list">${list.slice(0, 40).map(({ m, x }) => `<li><span class="lq">${esc(qText(x.q))}</span><span class="la">あなたの答え：${esc(m.a || "（なし）")}${m.wrong > 1 ? `<small>（${m.wrong}回まちがい）</small>` : ""}</span></li>`).join("")}</ul>
          <button class="btn primary big" id="goReview">復習をはじめる（${Math.min(10, list.length)}問）</button>`

  bindBack(renderHome);

}
function startReview() {
  const list = shuffle(reviewItems()).slice(0, 10);
  if (!list.length) return renderReview();
  // 段階4の問題も、復習では時間制限なしの「日本語→英語」として出す
  const qs = list.map(({ x }) => Object.assign({ grammar: x.it.title, _st: x.stage === 2 ? 2 : 3, _from: `${x.it.short}・段階${x.stage}の問題` }, x.q));
  session = { i: 0, stage: 3, review: true, qs, index: 0, log: [], startedAt: Date.now() };
  renderQuestion();
}

const personName = (p) => (p && p.name) || String((p && p.email) || "").split("@")[0];
const itemShort = (id) => (id === "review" ? "復習" : (CONTENT.find((c) => c.id === id) || {}).short || id);
const stageLabel = (st) => (Number(st) === 0 ? "復習" : "段階" + st);
function clsSelect(id, classes, cur, allLabel) {
  if (!classes || !classes.length) return "";
  return `<select id="${id}" class="cls-sel"><option value="">${esc(allLabel || "すべてのクラス")}</option>${classes.map((c) => `<option value="${esc(c)}" ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;

const loadingMain = (title, back) => { render(`${header(title, true)}<main class="wrap"><div class="judging"><span class="spinner"></span>読み込んでいます…</div></main>`); bindBack(back || renderHome); };
const failMain = (e) => { $("main").innerHTML = `<div class="msg ng">読み込めませんでした：${esc(e.message)}</div>`; };
const DUE_LABEL = { done: "✓期限内", late: "期限後", over: "期限切れ", open: "" };
function dueText(d) {
  if (!d) return "";
  const base = `〆${fmtDue(d.due)}`;
  if (d.state === "done") return `<span class="due ok">${base} ✓期限内</span>`;
  if (d.state === "late") return `<span class="due">${base} 期限後にマスター</span>`;
  if (d.state === "over") return `<span class="due ng">${base} 期限切れ</span>`;
  return `<span class="due ${d.left <= 2 ? "warn" : ""}">${base}（あと${d.left}日）</span>`;
}
// 練習した日のカレンダー（月曜はじまり・weeks 週ぶん）
function calendarHTML(dayCounts, weeks) {
  const today = new Date(dayKey(Date.now()) + "T00:00:00");
  const start = today.getTime() - ((today.getDay() + 6) % 7) * 86400000 - (weeks - 1) * 7 * 86400000;
  let cols = "";
  for (let w = 0; w < weeks; w++) {
    let cells = "";
    for (let d = 0; d < 7; d++) {
      const t = new Date(start + (w * 7 + d) * 86400000), k = dayKey(t), n = (dayCounts || {})[k] || 0;
      cells += `<i class="cal-d l${n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : 3} ${t > today ? "fut" : ""}" title="${k}：${n}回"></i>`;
    }
    cols += `<div class="cal-col"><small>${new Date(start + w * 7 * 86400000).getMonth() + 1}/${new Date(start + w * 7 * 86400000).getDate()}</small>${cells}</div>`;
  }
  return `<div class="cal"><div class="cal-dow"><small>&nbsp;</small><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>${cols}</div>`;
}
// 文法ごとの進み具合の表（詳しい記録・レポート共通）
function progressTable(sum) {
  const rows = CONTENT.map((it) => {
    const p = (sum.progress || {})[it.id] || {}, pc = p.passCount || [0, 0, 0, 0], best = p.best || [0, 0, 0, 0], at = p.attempts || [0, 0, 0, 0];
    const assigned = !Array.isArray(sum.assigned) || sum.assigned.includes(it.id);
    const cells = [1, 2, 3, 4].map((k) => {
      const need = requiredPasses(k), ok = pc[k - 1] >= need;
      return `<td class="${ok ? "clr" : ""}">${ok ? "✓" : pc[k - 1] ? `${pc[k - 1]}/${need}` : at[k - 1] ? pct(best[k - 1]) + "%" : "－"}</td>`;
    }).join("");
    const m = (sum.masteredAt || {})[it.id];
    return `<tr><th class="name">${assigned ? "★" : ""}${esc(it.title)}</th>${cells}<td>${m ? fmtDate(m) : ""}</td><td>${dueText((sum.due || {})[it.id])}</td></tr>`;
  }).join("");
  return `<table class="prog"><thead><tr><th class="name">文法（★は課題）</th><th>段階1</th><th>段階2</th><th>段階3</th><th>段階4</th><th>マスター</th><th>締め切り</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">✓＝クリア　n/m＝合格回数／クリアに必要な回数　％＝最高の正答率（まだ合格していない段階）</p>`;
}
function mistakeList(mistakes, max) {
  const list = (mistakes || []).map((m) => ({ m, x: QINDEX[m.qid] })).filter((e) => e.x).slice(0, max || 50);
  if (!list.length) return `<p class="hint">まちがえたままの問題はありません。</p>`;
  return `<table class="miss"><thead><tr><th>問題</th><th>生徒の答え</th><th>正しい答え（例）</th></tr></thead><tbody>${list.map(({ m, x }) =>
    `<tr><td><small>${esc(x.it.short)}・段階${x.stage}</small><br>${esc(qText(x.q))}</td><td class="ng">${esc(m.a || "（なし）")}${m.wrong > 1 ? `<small>（${m.wrong}回）</small>` : ""}</td><td>${esc(qModel(x.q))}</td></tr>`).join("")}</tbody></table>`;
}

function parseRoster(text) {
  const lines = String(text || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], errors: [] };
  const split = (l) => (l.includes("\t") ? l.split("\t") : l.split(/[,，]/)).map((c) => c.trim().replace(/^"|"$/g, ""));
  let map = null, start = 0;
  const h = split(lines[0]);
  if (!h.some((c) => c.includes("@"))) { // 1行目が見出し
    const find = (re) => h.findIndex((c) => re.test(c));
    map = { email: find(/メール|mail/i), cls: find(/クラス|組|class/i), no: find(/番号|出席|no|num/i), name: find(/名前|氏名|name/i) };
    start = 1;
  }
  const rows = [], errors = [];
  lines.slice(start).forEach((l, k) => {
    const c = split(l);
    let r;
    if (map && map.email >= 0) r = { email: c[map.email] || "", cls: map.cls >= 0 ? c[map.cls] || "" : "", no: map.no >= 0 ? c[map.no] || "" : "", name: map.name >= 0 ? c[map.name] || "" : "" };
    else { const ei = c.findIndex((x) => x.includes("@")); const rest = c.filter((x, i) => i !== ei); r = { email: ei >= 0 ? c[ei] : "", cls: rest[0] || "", no: rest[1] || "", name: rest[2] || "" }; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) errors.push(`${k + 1 + start}行目：メールアドレスが見つかりません`);
    else rows.push(r);
  });
  return { rows, errors };
}

async function renderMistakes(cls, itemId) {
  if (cls === undefined) cls = lsGet("eg_cls", "");
  loadingMain("まちがいの多い問題");
  let d;
  try { d = await api.mistakeStats({ cls, itemId }); } catch (e) { return failMain(e); }
  const list = d.list || [];
  $("main").innerHTML = `
    <div class="toolbar">${clsSelect("missCls", d.classes || [], cls)}<select id="missItem"><option value="">すべての文法</option>${CONTENT.map((it) => `<option value="${it.id}" ${it.id === itemId ? "selected" : ""}>${esc(it.short)}</option>`).join("")}</select></div>
    <section class="panel"><h2>まちがいの多い問題 <small>${list.length}問</small></h2>

      <div class="table-wrap"><table class="miss"><thead><tr><th>問題</th><th>解答数</th><th>まちがい</th><th>人数</th><th>よくある答え</th><th>正しい答え（例）</th></tr></thead><tbody>
      ${list.map((e) => {
        const x = QINDEX[e.qid], rate = e.n ? e.wrong / e.n : 0;
        return `<tr><td><small>${esc(itemShort(e.itemId))}・段階${e.stage}</small><br>${esc(x ? qText(x.q) : e.q)}</td><td>${e.n}</td>
          <td><div class="rate"><i style="width:${pct(rate)}%"></i></div><small>${pct(rate)}%（${e.wrong}回）</small></td><td>${e.people}人</td>
          <td>${(e.answers || []).slice(0, 3).map((a) => `<span class="ans">${esc(a.a)}<small>×${a.n}</small></span>`).join("")}</td><td>${esc(x ? qModel(x.q) : "")}</td></tr>`;
      }).join("") || `<tr><td colspan="6">まだまちがいの記録はありません</td></tr>`}
      </tbody></table></div></section>`;
  if ($("#missCls")) $("#missCls").onchange = (e) => { lsSet("eg_cls", e.target.value); renderMistakes(e.target.value, itemId); };

}

        <label class="hint">名簿にまだないクラス（「、」区切り）<input type="text" id="tExtra" class="full" placeholder="例：2A、2B"></label>

const STAMP_COLORS = ["#e03131", "#e64980", "#f76707", "#f08c00", "#2b8a3e", "#1971c2", "#7048e8", "#495057"];
async function renderTeacherStamps() {
  const SS = window.StampSet || { list: [] };
  const choices = SS.list.filter((d) => d.k !== "lv").sort((a, b) => (a.rules ? 1 : 0) - (b.rules ? 1 : 0));
  const st = { mode: "pick", design: { id: (choices[0] || {}).id }, make: { a: "cat", t: "よくできました", c: "#e03131", po: "banzai", ex: "sparkle", cr: false }, to: new Set(), all: false, msg: "", students: null, sent: null };
  render(`${header("先生スタンプ", true)}<main class="wrap"><div class="judging"><span class="spinner"></span>読み込んでいます…</div></main>`);
  bindBack(renderHome);
  try { const [a, b] = await Promise.all([api.students(), api.sentStamps()]); st.students = a.students || []; st.classes = a.classes || []; st.sent = b.stamps || []; }
  catch (e) { $("main").innerHTML = `<div class="msg ng">読み込めませんでした：${esc(e.message)}</div>`; return; }
  const cur = () => (st.mode === "make" ? { make: Object.assign({}, st.make) } : st.design);
  function draw() {
    const A = window.Art || { SPECIES: {}, POSES: {}, EXPRS: {} };
    const designBox = st.mode === "pick"
      ? `<div class="stamp-pick">${choices.map((d) => `<button class="stamp-opt ${st.design.id === d.id ? "active" : ""}" data-sid="${d.id}">${stampArt(d.id, 78)}</button>`).join("")}</div>`
      : `<div class="maker-form">
          <label>キャラクター<select id="mkA">${Object.keys(A.SPECIES).map((k) => `<option value="${k}" ${st.make.a === k ? "selected" : ""}>${esc(A.SPECIES[k].name || k)}</option>`).join("")}</select></label>
          <label>ポーズ<select id="mkPo">${Object.keys(A.POSES).map((k) => `<option value="${k}" ${st.make.po === k ? "selected" : ""}>${esc(A.POSES[k])}</option>`).join("")}</select></label>
          <label>表情<select id="mkEx">${Object.keys(A.EXPRS).map((k) => `<option value="${k}" ${st.make.ex === k ? "selected" : ""}>${esc(A.EXPRS[k])}</option>`).join("")}</select></label>
          <label>ことば（12文字まで）<input type="text" id="mkT" maxlength="12" value="${esc(st.make.t)}"></label>
          <div class="mk-row"><div class="mk-label">ことばの色</div><div class="mk-opts">${STAMP_COLORS.map((c) => `<button type="button" class="mk-color ${st.make.c === c ? "active" : ""}" data-col="${c}" style="background:${c}" aria-label="色"></button>`).join("")}</div></div>
          <label class="check"><input type="checkbox" id="mkCr" ${st.make.cr ? "checked" : ""}> 王冠をつける</label>
        </div>`;
    const people = st.students.map((p) => `<label class="person ${st.to.has(p.email) ? "on" : ""}"><input type="checkbox" data-to="${esc(p.email)}" ${st.to.has(p.email) || (st.all && !p.teacher) ? "checked" : ""} ${st.all ? "disabled" : ""}>${avatarHTML(p.avatar, 30)}<span>${p.cls ? `<small>${esc(p.cls)} ${esc(p.no || "")}</small>` : ""}${esc(personName(p))}${p.nickname ? `<small>${esc(p.nickname)}</small>` : ""}</span></label>`).join("");
    $("main").innerHTML = `
      <section class="panel"><h2>1. スタンプをえらぶ・つくる</h2>
        <div class="seg"><button data-m="pick" class="${st.mode === "pick" ? "on" : ""}">えらぶ</button><button data-m="make" class="${st.mode === "make" ? "on" : ""}">つくる</button></div>
        <div class="stamp-editor"><div class="stamp-preview">${stampArt(cur(), 150)}</div>${designBox}</div></section>
      <section class="panel"><h2>2. 送る相手</h2>
        <label class="check"><input type="checkbox" id="toAll" ${st.all ? "checked" : ""}> 全員に送る（${st.students.filter((p) => !p.teacher).length}人）</label>
        ${(st.classes || []).length && !st.all ? `<div class="chips">${st.classes.map((c) => `<button class="chip small" data-pickcls="${esc(c)}">${esc(c)} の全員をえらぶ</button>`).join("")}</div>` : ""}
        <div class="people-pick">${people || `<p class="hint">まだ生徒がいません（一度アプリを開いた生徒が表示されます）。</p>`}</div></section>
      <section class="panel"><h2>3. ひとこと（なくてもOK）</h2>
        <input type="text" class="full" id="stMsg" maxlength="60" value="${esc(st.msg)}" placeholder="例：毎日よくがんばっていますね！">
        <div class="btn-row"><button class="btn primary big" id="sendSt">💌 スタンプを送る</button></div><div class="msg" id="stMsgOut"></div>
        <p class="hint">送ったスタンプは、生徒が次にアプリを開いたときに表示されます。スタンプ1つにつき生徒に +10pt。</p></section>
      <section class="panel"><h2>送ったスタンプ</h2>
        ${st.sent.length ? `<div class="sent-list">${st.sent.slice(0, 40).map((s) => `<div class="sent-row">${stampArt(s.design, 56)}<div><b>${fmtDate(s.ts)}</b> ${s.to.length > 3 ? `${s.to.length}人` : s.to.map((e) => esc(String(e).split("@")[0])).join("、")}${s.msg ? `<div class="hint">「${esc(s.msg)}」</div>` : ""}<div class="hint">見た人 ${s.seen} / ${s.to.length}</div></div></div>`).join("")}</div>` : `<p class="hint">まだ送っていません。</p>`}</section>
      <p class="hint">自動のスタンプ（はじめての練習・週3日練習など）は、管理者設定でオン・オフできます。</p>`;
    $$(".seg button[data-m]").forEach((b) => (b.onclick = () => { st.mode = b.dataset.m; draw(); }));
    $$("[data-sid]").forEach((b) => (b.onclick = () => { st.design = { id: b.dataset.sid }; draw(); }));
    const upd = () => { $(".stamp-preview").innerHTML = stampArt(cur(), 150); };
    if ($("#mkA")) {
      $("#mkA").onchange = (e) => { st.make.a = e.target.value; upd(); };
      $("#mkPo").onchange = (e) => { st.make.po = e.target.value; upd(); };
      $("#mkEx").onchange = (e) => { st.make.ex = e.target.value; upd(); };
      $("#mkT").oninput = (e) => { st.make.t = e.target.value; upd(); };
      $("#mkCr").onchange = (e) => { st.make.cr = e.target.checked; upd(); };
      $$("[data-col]").forEach((b) => (b.onclick = () => { st.make.c = b.dataset.col; draw(); }));
    }
    $("#toAll").onchange = (e) => { st.all = e.target.checked; draw(); };
    $$("[data-pickcls]").forEach((b) => (b.onclick = () => { st.students.filter((p) => p.cls === b.dataset.pickcls).forEach((p) => st.to.add(p.email)); draw(); }));
    $$("[data-to]").forEach((c) => (c.onchange = () => { if (c.checked) st.to.add(c.dataset.to); else st.to.delete(c.dataset.to); c.closest(".person").classList.toggle("on", c.checked); }));
    $("#stMsg").oninput = (e) => { st.msg = e.target.value; };
    $("#sendSt").onclick = async (e) => {
      const m = $("#stMsgOut");
      const to = st.all ? "all" : Array.from(st.to);
      if (to !== "all" && !to.length) { m.textContent = "送る相手をえらんでください。"; m.className = "msg ng"; return; }
      if (st.mode === "make" && !st.make.t.trim()) { m.textContent = "ことばを入れてください。"; m.className = "msg ng"; return; }
      e.target.disabled = true;
      try {
        const r = await api.sendStamp({ to, design: cur(), message: st.msg.trim() });
        const b = await api.sentStamps(); st.sent = b.stamps || [];
        if (MODE === "demo") state.tstamps = lsGet("eg_tstamps", []);
        st.to.clear(); st.all = false; st.msg = "";
        draw();
        const m2 = $("#stMsgOut"); m2.textContent = `${r.sent}人にスタンプを送りました 💌`; m2.className = "msg ok";
      } catch (err) { m.textContent = "送れませんでした：" + err.message; m.className = "msg ng"; e.target.disabled = false; }
    };
  }
  draw();
}

/* ---------- 起動 ---------- */
async function init() {
  app().innerHTML = `<div class="boot"><span class="spinner"></span>読み込んでいます…</div>`;
  if (MODE === "api" && !lsGet("eg_token", "")) return renderLogin("");
  try {
    const b = await api.bootstrap();
    state.email = b.email || "";
    state.isAdmin = !!b.isAdmin;
    state.viewAsStudent = state.isAdmin && !!lsGet("eg_preview", false);
    state.progress = b.progress || {};
    state.history = b.history || [];
    state.hasEleven = !!b.hasEleven;
    state.profile = Object.assign({}, DEFAULT_PROFILE, b.profile || {});
    applySettings(b.settings);
    state.tstamps = b.tstamps || [];
    state.mistakes = b.mistakes || [];
    state.teacher = b.teacher || null;
    state.classes = b.classes || [];
    renderHome();
  } catch (e) {
    if (e instanceof AuthError) return renderLogin(e.message);
    if (/名簿に登録されていない/.test(e.message)) {
      app().innerHTML = `<header class="bar"><span class="logo">G</span><h1>英文法トレーニング</h1></header><main class="wrap"><section class="panel login">
        <h2>まだ使えません</h2><p class="msg ng">${esc(e.message)}</p><p>先生が名簿に登録すると使えるようになります。別のアカウントでログインしている場合は、ログインし直してください。</p>
        <button class="btn primary big" id="relogin">ログインし直す</button></section></main>`;
      $("#relogin").onclick = () => { lsSet("eg_token", ""); renderLogin(""); };
      return;
    }
    app().innerHTML = `<div class="boot ng">起動できませんでした：${esc(e.message)}</div>`;
  }
}
document.addEventListener("DOMContentLoaded", init);

</script>
</body>
</html>

 sister?","options":["is","does","are"],"answer":"is"},{"type":"order","words":["how","many","cats","do","you","have"],"answer":"How many cats do you have?","hint":"疑問文"},{"type":"order","words":["how","much","is","this","T-shirt"],"answer":"How much is this T-shirt?","hint":"疑問文"},{"type":"transform","text":"I have three dogs.","instruction":"下線部「three」をたずねる疑問文にしよう","answers":["How many dogs do you have?"]}]},"stage3":{"questions":[{"ja":"あなたはペンを何本持っていますか。","answers":["How many pens do you have?"]},{"ja":"このかばんはいくらですか。","answers":["How much is this bag?"]},{"ja":"あなたは何歳ですか。—13歳です。","answers":["How old are you? I am thirteen.","How old are you? I am thirteen years old."]},{"ja":"あなたには兄弟が何人いますか。","answers":["How many brothers do you have?"]},{"ja":"このお寺はどのくらい古いですか。","answers":["How old is this temple?"]},{"ja":"あなたは本を何冊持っていますか。","answers":["How many books do you have?"]},{"ja":"このりんごはいくらですか。—100円です。","answers":["How much is this apple? It is one hundred yen."]},{"ja":"あなたのお父さんは何歳ですか。","answers":["How old is your father?"]}]},"stage4":{"questions":[{"ja":"あなたはネコを何匹飼っていますか。","answers":["How many cats do you have?"]},{"ja":"これはいくらですか。","answers":["How much is this?"]},{"ja":"彼女は何歳ですか。","answers":["How old is she?"]},{"ja":"あなたはCDを何枚持っていますか。","answers":["How many CDs do you have?"]},{"ja":"そのくつはいくらですか。","answers":["How much are the shoes?","How much are those shoes?"]}]}},{"id":"tm1","grade":1,"title":"What time ～? と時刻・曜日・日付","short":"時刻・曜日・日付","stage1":{"question":"時刻・曜日・日付のたずね方と答え方を説明してください。","points":[{"id":"p1","text":"時刻は What time is it? でたずね、It is〜. で答える"},{"id":"p2","text":"「何時に〜しますか」は What time do you〜? でたずね、at＋時刻で答える"},{"id":"p3","text":"曜日は What day is it (today)? でたずね、It is Monday. などと答える"},{"id":"p4","text":"日付は What's the date (today)? でたずね、It is May 5. などと答える"},{"id":"p5","text":"時刻・曜日・天気などを表す文の主語には it を使い、「それ」とは訳さない"}],"model":"時刻は What time is it? とたずね、It's ten o'clock. のように答えます。「何時に〜しますか」は What time do you get up? とたずね、at six のように at を使って答えます。曜日は What day is it today?、日付は What's the date today? とたずねます。時刻や曜日を表す文の主語は it で、「それ」とは訳しません。"},"stage2":{"questions":[{"type":"choice","text":"( ) is seven thirty.","options":["It","This","That"],"answer":"It","context":"What time is it?"},{"type":"choice","text":"I get up ( ) six.","options":["at","on","in"],"answer":"at","context":"What time do you get up?"},{"type":"choice","text":"What ( ) is it today?","options":["day","date","time"],"answer":"day","reply":"It's Friday."},{"type":"choice","text":"What's the ( ) today?","options":["date","day","time"],"answer":"date","reply":"It's April 10."},{"type":"choice","text":"( ) time do you go to bed?","options":["What","How","When"],"answer":"What"},{"type":"choice","text":"I play tennis ( ) Sunday.","options":["on","at","in"],"answer":"on"},{"type":"order","words":["what","time","does","the","movie","start"],"answer":"What time does the movie start?","hint":"疑問文"},{"type":"order","words":["what","day","is","it","today"],"answer":"What day is it today?","hint":"疑問文"},{"type":"transform","text":"I eat breakfast at seven.","instruction":"下線部「at seven」をたずねる疑問文にしよう","answers":["What time do you eat breakfast?"]}]},"stage3":{"questions":[{"ja":"今、何時ですか。—10時です。","answers":["What time is it now? It is ten.","What time is it now? It is ten o'clock."]},{"ja":"あなたは何時に寝ますか。","answers":["What time do you go to bed?"]},{"ja":"今日は何曜日ですか。—水曜日です。","answers":["What day is it today? It is Wednesday."]},{"ja":"今日は何日ですか。","answers":["What is the date today?","What's the date today?"]},{"ja":"私は6時半に起きます。","answers":["I get up at six thirty.","I wake up at six thirty.","I get up at half past six."]},{"ja":"私は土曜日にピアノを練習します。","answers":["I practice the piano on Saturday.","I practice the piano on Saturdays."]},{"ja":"彼は何時に学校に来ますか。","answers":["What time does he come to school?"]},{"ja":"私の誕生日は8月3日です。","answers":["My birthday is August 3.","My birthday is August third.","My birthday is on August third."]}]},"stage4":{"questions":[{"ja":"何時ですか。","answers":["What time is it?"]},{"ja":"あなたは何時に家を出ますか。","answers":["What time do you leave home?","What time do you leave your house?"]},{"ja":"今日は月曜日です。","answers":["It is Monday today.","Today is Monday."]},{"ja":"私は7時に朝ごはんを食べます。","answers":["I eat breakfast at seven.","I have breakfast at seven."]},{"ja":"今日は何曜日ですか。","answers":["What day is it today?","What day is today?"]}]}},{"id":"im1","grade":1,"title":"命令文・Let's ～.","short":"命令文","stage1":{"question":"命令文と Let's の文の作り方を説明してください。","points":[{"id":"p1","text":"命令文は主語を置かず、動詞の原形で文を始める（Open the door.）"},{"id":"p2","text":"be動詞の命令文は Be で始める（Be quiet.）"},{"id":"p3","text":"「〜してはいけない」は Don't＋動詞の原形で始める"},{"id":"p4","text":"Please をつけるとていねいな言い方になる（文の最初か、コンマをつけて最後）"},{"id":"p5","text":"「〜しよう」と誘うときは Let's＋動詞の原形を使う"}],"model":"命令文は主語を置かずに、Open the door. のように動詞の原形で始めます。be動詞のときは Be quiet. のように Be で始めます。「〜してはいけない」は Don't＋動詞の原形で始めます。Please をつけるとていねいになります。「〜しよう」と誘うときは Let's＋動詞の原形を使います。"},"stage2":{"questions":[{"type":"choice","text":"( ) the window, please.","options":["Open","Opens","Opening"],"answer":"Open"},{"type":"choice","text":"( ) quiet in the library.","options":["Be","Are","Is"],"answer":"Be"},{"type":"choice","text":"( ) run in the classroom.","options":["Don't","Not","No"],"answer":"Don't"},{"type":"choice","text":"Let's ( ) soccer after school.","options":["play","plays","playing"],"answer":"play"},{"type":"choice","text":"( ) kind to your friends.","options":["Be","Are","Do"],"answer":"Be"},{"type":"choice","text":"Please ( ) down.","options":["sit","sits","sitting"],"answer":"sit"},{"type":"order","words":["don't","use","your","phone","here"],"answer":"Don't use your phone here."},{"type":"order","words":["let's","go","to","the","park"],"answer":"Let's go to the park."},{"type":"transform","text":"You are careful.","instruction":"「〜しなさい」という文にしよう","answers":["Be careful."]},{"type":"transform","text":"You eat in this room.","instruction":"「〜してはいけない」という文にしよう","answers":["Don't eat in this room."]}]},"stage3":{"questions":[{"ja":"窓を開けてください。","answers":["Please open the window.","Open the window, please."]},{"ja":"ここで走ってはいけません。","answers":["Don't run here."]},{"ja":"静かにしなさい。","answers":["Be quiet."]},{"ja":"いっしょに昼ごはんを食べよう。","answers":["Let's eat lunch together.","Let's have lunch together."]},{"ja":"私の話を聞いてください。","answers":["Please listen to me.","Listen to me, please."]},{"ja":"遅れてはいけません。","answers":["Don't be late."]},{"ja":"ドアを閉めて。","answers":["Close the door.","Shut the door."]},{"ja":"公園に行きましょう。","answers":["Let's go to the park."]}]},"stage4":{"questions":[{"ja":"ここに来て。","answers":["Come here."]},{"ja":"ここで写真をとってはいけません。","answers":["Don't take pictures here.","Don't take photos here."]},{"ja":"気をつけて。","answers":["Be careful."]},{"ja":"英語を話そう。","answers":["Let's speak English."]},{"ja":"座ってください。","answers":["Please sit down.","Sit down, please."]}]}},{"id":"cn1","grade":1,"title":"can の文","short":"can","stage1":{"question":"助動詞 can のルールを説明してください。","points":[{"id":"p1","text":"can は「〜できる」という意味を表す助動詞"},{"id":"p2","text":"can は動詞の前に置く"},{"id":"p3","text":"can のあとの動詞はいつも原形（s をつけない）"},{"id":"p4","text":"主語が何であっても can の形は変わらない（cans にしない）"}],"model":"can は「〜できる」という意味の助動詞で、動詞の前に置きます。can のあとの動詞はいつも原形で、主語が he や she でも s をつけません。can の形も変わりません。"},"stage2":{"questions":[{"type":"choice","text":"I can ( ) fast.","options":["swim","swims","swimming"],"answer":"swim"},{"type":"choice","text":"She can ( ) the piano.","options":["play","plays","playing"],"answer":"play"},{"type":"choice","text":"My brother ( ) cook well.","options":["can","cans","is can"],"answer":"can"},{"type":"choice","text":"Ken can ( ) three languages.","options":["speak","speaks","speaking"],"answer":"speak"},{"type":"choice","text":"We ( ) see Mt. Fuji from here.","options":["can","are","do"],"answer":"can"},{"type":"choice","text":"Tom can ( ) Japanese.","options":["read","reads","reading"],"answer":"read"},{"type":"order","words":["my","sister","can","ride","a","unicycle"],"answer":"My sister can ride a unicycle."},{"type":"order","words":["I","can","make","a","cake"],"answer":"I can make a cake."},{"type":"transform","text":"He runs fast.","instruction":"「〜できる」という文にしよう","answers":["He can run fast."]}]},"stage3":{"questions":[{"ja":"私は速く泳ぐことができます。","answers":["I can swim fast."]},{"ja":"彼女は上手にピアノを弾くことができます。","answers":["She can play the piano well."]},{"ja":"私の兄は車を運転することができます。","answers":["My brother can drive a car.","My brother can drive."]},{"ja":"ケンは英語を上手に話すことができます。","answers":["Ken can speak English well."]},{"ja":"ここから海が見えます。","answers":["We can see the sea from here.","You can see the sea from here.","I can see the sea from here."]},{"ja":"私の祖母はケーキを作ることができます。","answers":["My grandmother can make cakes.","My grandmother can make a cake."]},{"ja":"彼は一輪車に乗ることができます。","answers":["He can ride a unicycle."]},{"ja":"私はギターを弾くことができます。","answers":["I can play the guitar."]}]},"stage4":{"questions":[{"ja":"私は料理ができます。","answers":["I can cook."]},{"ja":"彼は高く跳ぶことができます。","answers":["He can jump high."]},{"ja":"私たちは星を見ることができます。","answers":["We can see stars.","We can see the stars."]},{"ja":"彼女は漢字を書くことができます。","answers":["She can write kanji."]},{"ja":"私の犬は速く走ることができます。","answers":["My dog can run fast."]}]}},{"id":"cn2","grade":1,"title":"can の否定文・疑問文","short":"can の否定・疑問","stage1":{"question":"can の否定文と疑問文の作り方を説明してください。","points":[{"id":"p1","text":"否定文は can のあとに not を置き、cannot または can't にする"},{"id":"p2","text":"疑問文は can を主語の前に出す（Can you〜?）"},{"id":"p3","text":"否定文・疑問文でも動詞は原形のまま"},{"id":"p4","text":"答えるときは Yes, 主語＋can. ／ No, 主語＋can't. を使う"},{"id":"p5","text":"Can you〜? で「〜してくれますか」と頼んだり、Can I〜? で「〜してもいいですか」とたずねたりできる"}],"model":"can の否定文は can のあとに not を置き、cannot か can't にします。疑問文は Can you swim? のように can を主語の前に出します。どちらも動詞は原形のままです。答えるときは Yes, I can. か No, I can't. を使います。Can you〜? は「〜してくれますか」、Can I〜? は「〜してもいいですか」という意味にもなります。"},"stage2":{"questions":[{"type":"transform","text":"She can ski.","instruction":"否定文にしよう","answers":["She cannot ski.","She can not ski."]},{"type":"transform","text":"You can play the guitar.","instruction":"疑問文にしよう","answers":["Can you play the guitar?"]},{"type":"transform","text":"Ken can read this kanji.","instruction":"疑問文にしよう","answers":["Can Ken read this kanji?"]},{"type":"choice","text":"Yes, I ( ).","options":["can","do","am"],"answer":"can","context":"Can you swim?"},{"type":"choice","text":"No, he ( ).","options":["can't","doesn't","isn't"],"answer":"can't","context":"Can he cook?"},{"type":"choice","text":"I can't ( ) coffee.","options":["drink","drinks","drinking"],"answer":"drink"},{"type":"choice","text":"( ) I use your pen?","options":["Can","Do","Am"],"answer":"Can","reply":"Sure."},{"type":"choice","text":"( ) you help me?","options":["Can","Are","Is"],"answer":"Can","reply":"OK."},{"type":"order","words":["can","you","speak","Chinese"],"answer":"Can you speak Chinese?","hint":"疑問文"},{"type":"order","words":["my","father","cannot","swim"],"answer":"My father cannot swim."}]},"stage3":{"questions":[{"ja":"私はスキーができません。","answers":["I cannot ski.","I can not ski."]},{"ja":"あなたはこの漢字が読めますか。","answers":["Can you read this kanji?"]},{"ja":"彼女はピアノが弾けますか。—はい、弾けます。","answers":["Can she play the piano? Yes, she can."]},{"ja":"私の弟は泳げません。","answers":["My brother cannot swim.","My little brother cannot swim.","My younger brother cannot swim."]},{"ja":"窓を開けてくれますか。","answers":["Can you open the window?"]},{"ja":"あなたの辞書を使ってもいいですか。","answers":["Can I use your dictionary?"]},{"ja":"彼は速く走れますか。—いいえ、走れません。","answers":["Can he run fast? No, he cannot."]},{"ja":"私はその質問に答えられません。","answers":["I cannot answer the question.","I cannot answer that question."]}]},"stage4":{"questions":[{"ja":"あなたは料理ができますか。","answers":["Can you cook?"]},{"ja":"私は英語が話せません。","answers":["I cannot speak English."]},{"ja":"手伝ってくれますか。","answers":["Can you help me?"]},{"ja":"ここに座ってもいいですか。","answers":["Can I sit here?"]},{"ja":"彼女は車を運転できません。","answers":["She cannot drive a car.","She cannot drive."]}]}},{"id":"pg1","grade":1,"title":"現在進行形","short":"現在進行形","stage1":{"question":"現在進行形のルールを説明してください。","points":[{"id":"p1","text":"現在進行形は「（今）〜している」という、している最中の動作を表す"},{"id":"p2","text":"形は be動詞（am, is, are）＋動詞の ing 形"},{"id":"p3","text":"be動詞は主語に合わせて使い分ける"},{"id":"p4","text":"e で終わる動詞は e をとって ing をつける（make → making）"},{"id":"p5","text":"〈短母音＋子音字〉で終わる動詞は最後の文字を重ねて ing をつける（run → running）"},{"id":"p6","text":"like や know など状態を表す動詞はふつう進行形にしない"}],"model":"現在進行形は「今〜している」という、している最中の動作を表し、be動詞＋動詞の ing 形で作ります。be動詞は主語に合わせて am, is, are を使い分けます。make のように e で終わる動詞は e をとって ing、run のような語は最後の文字を重ねて ing をつけます。like や know のような状態を表す動詞はふつう進行形にしません。"},"stage2":{"questions":[{"type":"choice","text":"I am ( ) TV now.","options":["watching","watch","watches"],"answer":"watching"},{"type":"choice","text":"She ( ) playing the piano.","options":["is","are","does"],"answer":"is"},{"type":"choice","text":"They are ( ) in the pool.","options":["swimming","swiming","swim"],"answer":"swimming"},{"type":"choice","text":"My mother is ( ) dinner now.","options":["making","makeing","makes"],"answer":"making"},{"type":"choice","text":"Look! The dog ( ) running.","options":["is","are","does"],"answer":"is"},{"type":"choice","text":"I ( ) Ken very well.","options":["know","am knowing","knowing"],"answer":"know"},{"type":"order","words":["my","brother","is","studying","in","his","room"],"answer":"My brother is studying in his room."},{"type":"order","words":["we","are","having","lunch","now"],"answer":"We are having lunch now."},{"type":"transform","text":"I read a book.","instruction":"「今〜している」という文にしよう","answers":["I am reading a book."]},{"type":"transform","text":"He writes a letter.","instruction":"「今〜している」という文にしよう","answers":["He is writing a letter."]}]},"stage3":{"questions":[{"ja":"私は今、宿題をしています。","answers":["I am doing my homework now.","I am doing homework now."]},{"ja":"彼女は部屋で音楽を聞いています。","answers":["She is listening to music in her room."]},{"ja":"子どもたちは公園で走っています。","answers":["The children are running in the park."]},{"ja":"私の父は今、車を洗っています。","answers":["My father is washing the car now.","My father is washing his car now."]},{"ja":"見て！あの鳥が飛んでいます。","answers":["Look! That bird is flying."]},{"ja":"私たちは昼ごはんを食べています。","answers":["We are eating lunch.","We are having lunch."]},{"ja":"ケンは図書館で勉強しています。","answers":["Ken is studying in the library."]},{"ja":"雨が降っています。","answers":["It is raining."]}]},"stage4":{"questions":[{"ja":"私は本を読んでいます。","answers":["I am reading a book."]},{"ja":"彼はテニスをしています。","answers":["He is playing tennis."]},{"ja":"彼らは歌っています。","answers":["They are singing."]},{"ja":"私の母は料理をしています。","answers":["My mother is cooking."]},{"ja":"雪が降っています。","answers":["It is snowing."]}]}},{"id":"pg2","grade":1,"title":"現在進行形の否定文・疑問文","short":"進行形の否定・疑問","stage1":{"question":"現在進行形の否定文と疑問文の作り方を説明してください。","points":[{"id":"p1","text":"否定文は be動詞のあとに not を置く（I am not playing.）"},{"id":"p2","text":"疑問文は be動詞を主語の前に出す（Are you playing?）"},{"id":"p3","text":"ing 形はそのまま使う"},{"id":"p4","text":"答えるときは Yes, 主語＋be動詞. ／ No, 主語＋be動詞＋not. を使う"},{"id":"p5","text":"「何をしていますか」は What are you doing? でたずねる"}],"model":"現在進行形は be動詞を使う文なので、否定文は be動詞のあとに not を置き、疑問文は be動詞を主語の前に出します。ing 形はそのままです。答えるときは Yes, I am. や No, he isn't. のように be動詞を使います。「何をしていますか」は What are you doing? とたずねます。"},"stage2":{"questions":[{"type":"transform","text":"He is watching TV.","instruction":"否定文にしよう","answers":["He is not watching TV."]},{"type":"transform","text":"You are studying English.","instruction":"疑問文にしよう","answers":["Are you studying English?"]},{"type":"transform","text":"They are playing soccer.","instruction":"疑問文にしよう","answers":["Are they playing soccer?"]},{"type":"choice","text":"Yes, I ( ).","options":["am","do","are"],"answer":"am","context":"Are you reading a book?"},{"type":"choice","text":"No, she ( ).","options":["isn't","doesn't","aren't"],"answer":"isn't","context":"Is she cooking?"},{"type":"choice","text":"What are you ( )?","options":["doing","do","does"],"answer":"doing","reply":"I'm drawing a picture."},{"type":"choice","text":"I'm not ( ) now.","options":["sleeping","sleep","sleeps"],"answer":"sleeping"},{"type":"choice","text":"What ( ) Ken doing?","options":["is","does","are"],"answer":"is"},{"type":"order","words":["what","are","you","making"],"answer":"What are you making?","hint":"疑問文"},{"type":"order","words":["she","is","not","listening","to","me"],"answer":"She is not listening to me."}]},"stage3":{"questions":[{"ja":"私は今テレビを見ていません。","answers":["I am not watching TV now."]},{"ja":"あなたは何をしているのですか。","answers":["What are you doing?"]},{"ja":"彼は眠っていますか。—はい、眠っています。","answers":["Is he sleeping? Yes, he is."]},{"ja":"彼らはサッカーをしていますか。—いいえ、していません。","answers":["Are they playing soccer? No, they are not."]},{"ja":"私の妹は宿題をしていません。","answers":["My sister is not doing her homework.","My little sister is not doing her homework.","My younger sister is not doing her homework."]},{"ja":"ケンは何を食べていますか。","answers":["What is Ken eating?"]},{"ja":"あなたは私の話を聞いていますか。","answers":["Are you listening to me?"]},{"ja":"雨は降っていません。","answers":["It is not raining."]}]},"stage4":{"questions":[{"ja":"あなたは何をしていますか。","answers":["What are you doing?"]},{"ja":"彼女は泣いていますか。","answers":["Is she crying?"]},{"ja":"私は勉強していません。","answers":["I am not studying."]},{"ja":"彼らは何を作っていますか。","answers":["What are they making?"]},{"ja":"雨が降っていますか。","answers":["Is it raining?"]}]}},{"id":"ps1","grade":1,"title":"一般動詞の過去形（規則動詞）","short":"過去形（規則）","stage1":{"question":"一般動詞の過去形（規則動詞）のルールを説明してください。","points":[{"id":"p1","text":"過去のことを表すときは、動詞を過去形にする"},{"id":"p2","text":"規則動詞は語の終わりに ed をつける（play → played）"},{"id":"p3","text":"e で終わる動詞は d だけをつける（use → used）"},{"id":"p4","text":"〈子音字＋y〉で終わる動詞は y を i にかえて ed をつける（study → studied）"},{"id":"p5","text":"過去形は主語が何でも同じ形"},{"id":"p6","text":"yesterday, last〜, 〜 ago など過去を表す語といっしょに使うことが多い"}],"model":"過去のことを表すときは動詞を過去形にします。規則動詞は played のように ed をつけます。use のように e で終わる語は d だけ、study のように子音字＋y で終わる語は y を i にかえて ed をつけます。過去形は主語が何でも同じ形です。yesterday や last week などといっしょによく使います。"},"stage2":{"questions":[{"type":"choice","text":"I ( ) tennis yesterday.","options":["played","play","plays"],"answer":"played"},{"type":"choice","text":"She ( ) English last night.","options":["studied","studyed","studies"],"answer":"studied"},{"type":"choice","text":"We ( ) the computer yesterday.","options":["used","useed","use"],"answer":"used"},{"type":"choice","text":"He ( ) his room last Sunday.","options":["cleaned","cleans","clean"],"answer":"cleaned"},{"type":"choice","text":"They ( ) in Osaka ten years ago.","options":["lived","live","lives"],"answer":"lived"},{"type":"choice","text":"I ( ) my friend last week.","options":["visited","visit","visits"],"answer":"visited"},{"type":"order","words":["I","watched","a","movie","last","night"],"answer":"I watched a movie last night."},{"type":"order","words":["my","mother","cooked","dinner","yesterday"],"answer":"My mother cooked dinner yesterday."},{"type":"transform","text":"I play soccer.","instruction":"文の最後に yesterday をつけて過去の文にしよう","answers":["I played soccer yesterday."]},{"type":"transform","text":"She studies math.","instruction":"文の最後に last night をつけて過去の文にしよう","answers":["She studied math last night."]}]},"stage3":{"questions":[{"ja":"私は昨日テニスをしました。","answers":["I played tennis yesterday.","Yesterday I played tennis."]},{"ja":"彼は昨夜英語を勉強しました。","answers":["He studied English last night."]},{"ja":"私たちは先週、京都を訪れました。","answers":["We visited Kyoto last week."]},{"ja":"私の母は昨日、夕食を料理しました。","answers":["My mother cooked dinner yesterday."]},{"ja":"私は3日前に部屋をそうじしました。","answers":["I cleaned my room three days ago."]},{"ja":"彼女は去年、東京に住んでいました。","answers":["She lived in Tokyo last year."]},{"ja":"私は昨夜、映画を見ました。","answers":["I watched a movie last night."]},{"ja":"彼らはパーティーを楽しみました。","answers":["They enjoyed the party."]}]},"stage4":{"questions":[{"ja":"私は昨日サッカーをしました。","answers":["I played soccer yesterday."]},{"ja":"彼女は昨夜テレビを見ました。","answers":["She watched TV last night."]},{"ja":"私は数学を勉強しました。","answers":["I studied math."]},{"ja":"私たちは歩いて家に帰りました。","answers":["We walked home."]},{"ja":"彼は先週おじを訪ねました。","answers":["He visited his uncle last week."]}]}},{"id":"ps2","grade":1,"title":"一般動詞の過去形（不規則動詞）","short":"過去形（不規則）","stage1":{"question":"不規則動詞の過去形について説明してください。","points":[{"id":"p1","text":"ed をつけずに、形が不規則に変わる動詞がある"},{"id":"p2","text":"go → went、see → saw、eat → ate、have → had などがある"},{"id":"p3","text":"make → made、get → got、come → came、buy → bought なども不規則に変わる"},{"id":"p4","text":"不規則動詞も、過去形は主語が何でも同じ形"},{"id":"p5","text":"read や cut のように、形は変わらず読み方や意味だけ過去になる動詞もある"}],"model":"動詞の中には ed をつけずに形が不規則に変わるものがあります。go は went、see は saw、eat は ate、have は had、make は made、buy は bought になります。不規則動詞も、主語が何でも過去形は同じ形です。read のように形が同じで読み方だけ変わるものもあります。"},"stage2":{"questions":[{"type":"choice","text":"I ( ) to the zoo yesterday.","options":["went","goed","go"],"answer":"went"},{"type":"choice","text":"She ( ) a nice bag last week.","options":["bought","buyed","buys"],"answer":"bought"},{"type":"choice","text":"We ( ) a big fish in the river.","options":["saw","seed","see"],"answer":"saw"},{"type":"choice","text":"He ( ) curry for lunch.","options":["ate","eated","eats"],"answer":"ate"},{"type":"choice","text":"I ( ) a good time at the party.","options":["had","haved","has"],"answer":"had"},{"type":"choice","text":"My father ( ) home at nine.","options":["came","comed","comes"],"answer":"came"},{"type":"choice","text":"Mai ( ) a cake for me.","options":["made","maked","makes"],"answer":"made"},{"type":"order","words":["I","got","up","at","six","this","morning"],"answer":"I got up at six this morning."},{"type":"order","words":["we","went","to","the","beach","last","summer"],"answer":"We went to the beach last summer."},{"type":"transform","text":"I see a rainbow.","instruction":"文の最後に yesterday をつけて過去の文にしよう","answers":["I saw a rainbow yesterday."]}]},"stage3":{"questions":[{"ja":"私は昨日、図書館に行きました。","answers":["I went to the library yesterday.","Yesterday I went to the library."]},{"ja":"彼は今朝、6時に起きました。","answers":["He got up at six this morning.","He woke up at six this morning."]},{"ja":"私たちは昨夜、星を見ました。","answers":["We saw stars last night.","We saw the stars last night."]},{"ja":"彼女は新しいくつを買いました。","answers":["She bought new shoes."]},{"ja":"私は朝ごはんにパンを食べました。","answers":["I ate bread for breakfast.","I had bread for breakfast."]},{"ja":"母は私にケーキを作ってくれました。","answers":["My mother made a cake for me.","My mother made me a cake."]},{"ja":"ケンは昨日、学校に遅れて来ました。","answers":["Ken came to school late yesterday."]},{"ja":"私は夏休みに楽しい時を過ごしました。","answers":["I had a good time during the summer vacation.","I had a good time in the summer vacation.","I had a good time during summer vacation."]}]},"stage4":{"questions":[{"ja":"私は昨日、公園に行きました。","answers":["I went to the park yesterday."]},{"ja":"彼はりんごを食べました。","answers":["He ate an apple."]},{"ja":"私はおもしろい映画を見ました。","answers":["I saw an interesting movie."]},{"ja":"彼女はペンを買いました。","answers":["She bought a pen."]},{"ja":"私は7時に起きました。","answers":["I got up at seven.","I woke up at seven."]}]}},{"id":"ps3","grade":1,"title":"過去形の否定文・疑問文","short":"過去の否定・疑問","stage1":{"question":"一般動詞の過去の否定文と疑問文の作り方を説明してください。","points":[{"id":"p1","text":"否定文は動詞の前に did not（didn't）を置く"},{"id":"p2","text":"疑問文は文の最初に Did を置く"},{"id":"p3","text":"did を使うとき、動詞は原形にする（過去形にしない）"},{"id":"p4","text":"主語が何でも did を使う（do / does のような使い分けはない）"},{"id":"p5","text":"答えるときは Yes, 主語＋did. ／ No, 主語＋didn't. を使う"}],"model":"過去の否定文は動詞の前に did not（didn't）を置き、疑問文は文の最初に Did を置きます。did を使うときは、動詞は過去形ではなく原形にします。主語が何でも did を使います。答えるときは Yes, I did. か No, I didn't. を使います。"},"stage2":{"questions":[{"type":"transform","text":"He played tennis yesterday.","instruction":"否定文にしよう","answers":["He did not play tennis yesterday."]},{"type":"transform","text":"You went to the park.","instruction":"疑問文にしよう","answers":["Did you go to the park?"]},{"type":"transform","text":"She ate breakfast this morning.","instruction":"否定文にしよう","answers":["She did not eat breakfast this morning."]},{"type":"choice","text":"Yes, I ( ).","options":["did","do","was"],"answer":"did","context":"Did you watch TV last night?"},{"type":"choice","text":"No, he ( ).","options":["didn't","doesn't","wasn't"],"answer":"didn't","context":"Did Ken come to school?"},{"type":"choice","text":"I didn't ( ) my homework.","options":["do","did","does"],"answer":"do"},{"type":"choice","text":"( ) she buy a new bag?","options":["Did","Does","Was"],"answer":"Did"},{"type":"choice","text":"What did you ( ) yesterday?","options":["do","did","done"],"answer":"do"},{"type":"order","words":["did","you","have","a","good","time"],"answer":"Did you have a good time?","hint":"疑問文"},{"type":"order","words":["I","did","not","see","him","yesterday"],"answer":"I did not see him yesterday."}]},"stage3":{"questions":[{"ja":"私は昨日、テレビを見ませんでした。","answers":["I did not watch TV yesterday."]},{"ja":"あなたは昨夜、英語を勉強しましたか。","answers":["Did you study English last night?"]},{"ja":"彼は昨日、学校に来ましたか。—はい、来ました。","answers":["Did he come to school yesterday? Yes, he did."]},{"ja":"あなたはその映画を見ましたか。—いいえ、見ませんでした。","answers":["Did you see the movie? No, I did not.","Did you watch the movie? No, I did not."]},{"ja":"私は今朝、朝ごはんを食べませんでした。","answers":["I did not eat breakfast this morning.","I did not have breakfast this morning."]},{"ja":"あなたは昨日、何をしましたか。","answers":["What did you do yesterday?"]},{"ja":"彼女はどこへ行きましたか。","answers":["Where did she go?"]},{"ja":"私たちは先週、サッカーをしませんでした。","answers":["We did not play soccer last week."]}]},"stage4":{"questions":[{"ja":"あなたは宿題をしましたか。","answers":["Did you do your homework?"]},{"ja":"私は彼に会いませんでした。","answers":["I did not see him.","I did not meet him."]},{"ja":"あなたは何を買いましたか。","answers":["What did you buy?"]},{"ja":"彼は来ませんでした。","answers":["He did not come."]},{"ja":"あなたは楽しみましたか。","answers":["Did you have fun?","Did you enjoy it?","Did you have a good time?"]}]}},{"id":"bp1","grade":1,"title":"be動詞の過去形","short":"be動詞の過去","stage1":{"question":"be動詞の過去形のルールを説明してください。","points":[{"id":"p1","text":"be動詞の過去形は was と were の2つ"},{"id":"p2","text":"am と is の過去形は was、are の過去形は were"},{"id":"p3","text":"主語が I や三人称単数のときは was、you や複数のときは were を使う"},{"id":"p4","text":"否定文は was / were のあとに not を置く（wasn't, weren't）"},{"id":"p5","text":"疑問文は was / were を主語の前に出す"}],"model":"be動詞の過去形は was と were です。am と is の過去形が was、are の過去形が were なので、主語が I や he のときは was、you や複数のときは were を使います。否定文は was や were のあとに not を置き、疑問文は was や were を主語の前に出します。"},"stage2":{"questions":[{"type":"choice","text":"I ( ) busy yesterday.","options":["was","were","am"],"answer":"was"},{"type":"choice","text":"They ( ) in the gym an hour ago.","options":["were","was","are"],"answer":"were"},{"type":"choice","text":"You ( ) late this morning.","options":["were","was","are"],"answer":"were"},{"type":"choice","text":"It ( ) rainy last Sunday.","options":["was","were","is"],"answer":"was"},{"type":"choice","text":"No, I ( ).","options":["wasn't","weren't","didn't"],"answer":"wasn't","context":"Were you at home yesterday?"},{"type":"choice","text":"( ) your father a teacher?","options":["Was","Were","Did"],"answer":"Was"},{"type":"order","words":["the","movie","was","very","exciting"],"answer":"The movie was very exciting."},{"type":"order","words":["were","they","in","the","library"],"answer":"Were they in the library?","hint":"疑問文"},{"type":"transform","text":"I am tired.","instruction":"文の最後に yesterday をつけて過去の文にしよう","answers":["I was tired yesterday."]},{"type":"transform","text":"We are in Kyoto.","instruction":"文の最後に last week をつけて過去の文にしよう","answers":["We were in Kyoto last week."]}]},"stage3":{"questions":[{"ja":"私は昨日、とても忙しかったです。","answers":["I was very busy yesterday."]},{"ja":"彼らは昨夜、家にいました。","answers":["They were at home last night.","They were home last night."]},{"ja":"その試合はわくわくしました。","answers":["The game was exciting."]},{"ja":"あなたは昨日、病気でしたか。—はい、そうでした。","answers":["Were you sick yesterday? Yes, I was."]},{"ja":"昨日は寒くありませんでした。","answers":["It was not cold yesterday."]},{"ja":"私の祖父は医者でした。","answers":["My grandfather was a doctor."]},{"ja":"ケンとマイは教室にいましたか。","answers":["Were Ken and Mai in the classroom?"]},{"ja":"その本はおもしろくありませんでした。","answers":["The book was not interesting."]}]},"stage4":{"questions":[{"ja":"私は疲れていました。","answers":["I was tired."]},{"ja":"昨日は晴れでした。","answers":["It was sunny yesterday."]},{"ja":"あなたたちは図書館にいましたか。","answers":["Were you in the library?"]},{"ja":"彼は怒っていませんでした。","answers":["He was not angry."]},{"ja":"私たちは中学生でした。","answers":["We were junior high school students."]}]}},{"id":"pp1","grade":1,"title":"過去進行形","short":"過去進行形","stage1":{"question":"過去進行形のルールを説明してください。","points":[{"id":"p1","text":"過去進行形は「（そのとき）〜していた」という、過去のある時点でしている最中の動作を表す"},{"id":"p2","text":"形は was / were＋動詞の ing 形"},{"id":"p3","text":"主語が I や三人称単数なら was、you や複数なら were を使う"},{"id":"p4","text":"否定文は was / were のあとに not、疑問文は was / were を主語の前に出す"},{"id":"p5","text":"at that time や then, at seven yesterday など過去の時点を表す語とよく使う"}],"model":"過去進行形は「そのとき〜していた」という、過去のある時点でしている最中の動作を表し、was か were＋動詞の ing 形で作ります。主語が I や he なら was、you や複数なら were です。否定文は was や were のあとに not を置き、疑問文は was や were を前に出します。at that time などといっしょによく使います。"},"stage2":{"questions":[{"type":"choice","text":"I was ( ) TV at that time.","options":["watching","watched","watch"],"answer":"watching"},{"type":"choice","text":"They ( ) playing soccer then.","options":["were","was","are"],"answer":"were"},{"type":"choice","text":"She ( ) cooking at six.","options":["was","were","is"],"answer":"was"},{"type":"choice","text":"Yes, I ( ).","options":["was","were","did"],"answer":"was","context":"Were you sleeping?"},{"type":"choice","text":"What were you ( ) then?","options":["doing","did","do"],"answer":"doing"},{"type":"choice","text":"We ( ) not studying at that time.","options":["were","was","did"],"answer":"were"},{"type":"order","words":["my","father","was","reading","a","newspaper","then"],"answer":"My father was reading a newspaper then."},{"type":"order","words":["what","were","you","doing","at","eight","last","night"],"answer":"What were you doing at eight last night?","hint":"疑問文"},{"type":"transform","text":"I study English.","instruction":"文の最後に at that time をつけて「そのとき〜していた」という文にしよう","answers":["I was studying English at that time."]}]},"stage3":{"questions":[{"ja":"私はそのとき、テレビを見ていました。","answers":["I was watching TV at that time.","I was watching TV then."]},{"ja":"彼らは公園で走っていました。","answers":["They were running in the park."]},{"ja":"あなたは昨夜9時に何をしていましたか。","answers":["What were you doing at nine last night?"]},{"ja":"私の母は台所で料理をしていました。","answers":["My mother was cooking in the kitchen."]},{"ja":"私たちはそのとき勉強していませんでした。","answers":["We were not studying at that time.","We were not studying then."]},{"ja":"彼女は電話で話していましたか。—はい、話していました。","answers":["Was she talking on the phone? Yes, she was."]},{"ja":"私が家に帰ったとき、雨が降っていました。","answers":["It was raining when I got home.","When I got home, it was raining."]},{"ja":"ケンはお風呂に入っていました。","answers":["Ken was taking a bath."]}]},"stage4":{"questions":[{"ja":"私は寝ていました。","answers":["I was sleeping."]},{"ja":"彼はテニスをしていました。","answers":["He was playing tennis."]},{"ja":"あなたは何をしていましたか。","answers":["What were you doing?"]},{"ja":"雪が降っていました。","answers":["It was snowing."]},{"ja":"私たちは歌っていませんでした。","answers":["We were not singing."]}]}},{"id":"ar1","grade":1,"title":"冠詞 a / an / the","short":"冠詞","stage1":{"question":"冠詞 a, an, the の使い方を説明してください。","points":[{"id":"p1","text":"a, an は数えられる名詞の単数形の前に置き、「1つの・ある」という意味を表す"},{"id":"p2","text":"母音（ア・イ・ウ・エ・オの音）で始まる語の前では an を使う（an apple）"},{"id":"p3","text":"the は話の中ですでに出てきたものや、何を指すかわかっているものにつける"},{"id":"p4","text":"世界に1つしかないもの（the sun, the moon）や楽器を演奏するとき（play the piano）にも the を使う"},{"id":"p5","text":"複数形や数えられない名詞には a, an はつけない"}],"model":"a や an は数えられる名詞の単数形の前に置き、「1つの」という意味を表します。apple のように母音の音で始まる語には an を使います。the は前に出てきたものや、何を指すかわかっているものにつけます。the sun のように1つしかないものや、play the piano のように楽器を演奏するときにも the を使います。複数形や数えられない名詞には a や an はつけません。"},"stage2":{"questions":[{"type":"choice","text":"I have ( ) orange.","options":["an","a","the"],"answer":"an"},{"type":"choice","text":"She is ( ) teacher.","options":["a","an","the"],"answer":"a"},{"type":"choice","text":"I play ( ) guitar.","options":["the","a","an"],"answer":"the"},{"type":"choice","text":"Look at ( ) moon.","options":["the","a","an"],"answer":"the"},{"type":"choice","text":"I have a dog. ( ) dog is white.","options":["The","A","An"],"answer":"The"},{"type":"choice","text":"He is ( ) honest boy.","options":["an","a","the"],"answer":"an"},{"type":"choice","text":"I want ( ) water.","options":["some","a","an"],"answer":"some"},{"type":"order","words":["I","have","a","cat","and","a","dog"],"answer":"I have a cat and a dog."},{"type":"order","words":["please","close","the","door"],"answer":"Please close the door."}]},"stage3":{"questions":[{"ja":"私は卵を1個食べます。","answers":["I eat an egg.","I have an egg."]},{"ja":"彼女は歌手です。","answers":["She is a singer."]},{"ja":"私の姉はバイオリンを弾きます。","answers":["My sister plays the violin.","My older sister plays the violin."]},{"ja":"太陽は東からのぼります。","answers":["The sun rises in the east."]},{"ja":"私は犬を飼っています。その犬はとても大きいです。","answers":["I have a dog. The dog is very big."]},{"ja":"彼はおもしろい本を持っています。","answers":["He has an interesting book."]},{"ja":"ドアを開けてください。","answers":["Please open the door.","Open the door, please."]},{"ja":"私は1時間テレビを見ます。","answers":["I watch TV for an hour.","I watch TV for one hour."]}]},"stage4":{"questions":[{"ja":"私はりんごを1個ほしいです。","answers":["I want an apple."]},{"ja":"彼は医者です。","answers":["He is a doctor."]},{"ja":"私はピアノを弾きます。","answers":["I play the piano."]},{"ja":"窓を閉めて。","answers":["Close the window."]},{"ja":"空を見て。","answers":["Look at the sky."]}]}},{"id":"fu1","grade":2,"title":"be going to ～","short":"be going to","stage1":{"question":"be going to を使った未来の表し方を説明してください。","points":[{"id":"p1","text":"be going to＋動詞の原形で「〜するつもりだ・〜する予定だ」という未来を表す"},{"id":"p2","text":"be動詞は主語に合わせて am, is, are を使い分ける"},{"id":"p3","text":"to のあとの動詞はいつも原形"},{"id":"p4","text":"否定文は be動詞のあとに not、疑問文は be動詞を主語の前に出す"},{"id":"p5","text":"前から決めている予定や、今の様子から「〜しそうだ」と言うときに使う"}],"model":"be going to＋動詞の原形で「〜するつもりです」という未来を表します。be動詞は主語に合わせて使い分け、to のあとの動詞は原形です。否定文は be動詞のあとに not を置き、疑問文は be動詞を前に出します。前から決めている予定を言うときによく使います。"},"stage2":{"questions":[{"type":"choice","text":"I am going to ( ) my uncle tomorrow.","options":["visit","visits","visiting"],"answer":"visit"},{"type":"choice","text":"She ( ) going to play tennis this weekend.","options":["is","are","will"],"answer":"is"},{"type":"choice","text":"We are going ( ) a party next Sunday.","options":["to have","have","having"],"answer":"to have"},{"type":"choice","text":"Yes, I ( ).","options":["am","do","will"],"answer":"am","context":"Are you going to study tonight?"},{"type":"choice","text":"What are you going to ( ) tomorrow?","options":["do","doing","did"],"answer":"do"},{"type":"choice","text":"It's going to ( ) this afternoon.","options":["rain","rains","raining"],"answer":"rain"},{"type":"order","words":["I","am","going","to","watch","a","movie","tonight"],"answer":"I am going to watch a movie tonight."},{"type":"order","words":["what","are","you","going","to","buy"],"answer":"What are you going to buy?","hint":"疑問文"},{"type":"transform","text":"He is going to go to Kyoto.","instruction":"否定文にしよう","answers":["He is not going to go to Kyoto."]},{"type":"transform","text":"They are going to clean the room.","instruction":"疑問文にしよう","answers":["Are they going to clean the room?"]}]},"stage3":{"questions":[{"ja":"私は明日、祖母を訪ねるつもりです。","answers":["I am going to visit my grandmother tomorrow."]},{"ja":"彼は来週、京都に行く予定です。","answers":["He is going to go to Kyoto next week.","He is going to visit Kyoto next week."]},{"ja":"あなたは今夜、何をするつもりですか。","answers":["What are you going to do tonight?"]},{"ja":"私たちは今度の土曜日にサッカーをするつもりです。","answers":["We are going to play soccer this Saturday.","We are going to play soccer next Saturday."]},{"ja":"彼女はケーキを作るつもりはありません。","answers":["She is not going to make a cake."]},{"ja":"あなたは夏休みに海へ行くつもりですか。","answers":["Are you going to go to the sea during the summer vacation?","Are you going to go to the beach during summer vacation?","Are you going to go to the sea in the summer vacation?"]},{"ja":"雨が降りそうです。","answers":["It is going to rain."]},{"ja":"私は将来、先生になるつもりです。","answers":["I am going to be a teacher in the future.","I am going to become a teacher in the future."]}]},"stage4":{"questions":[{"ja":"私は本を読むつもりです。","answers":["I am going to read a book."]},{"ja":"あなたは何を買うつもりですか。","answers":["What are you going to buy?"]},{"ja":"彼は明日テニスをする予定です。","answers":["He is going to play tennis tomorrow."]},{"ja":"私たちは駅で会うつもりです。","answers":["We are going to meet at the station."]},{"ja":"雪が降りそうです。","answers":["It is going to snow."]}]}},{"id":"fu2","grade":2,"title":"will","short":"will","stage1":{"question":"助動詞 will を使った未来の表し方を説明してください。","points":[{"id":"p1","text":"will＋動詞の原形で「〜するだろう」「〜します（今決めた意志）」という未来を表す"},{"id":"p2","text":"主語が何でも will の形は変わらず、後ろの動詞は原形"},{"id":"p3","text":"否定文は will not（won't）＋動詞の原形"},{"id":"p4","text":"疑問文は will を主語の前に出し、Yes, 主語＋will. ／ No, 主語＋won't. で答える"},{"id":"p5","text":"I will は I'll のように短くできる"}],"model":"will＋動詞の原形で「〜するだろう」という未来や、「〜します」というその場で決めた意志を表します。主語が何でも will の形は変わらず、後ろの動詞は原形です。否定文は will not（won't）、疑問文は will を主語の前に出し、Yes, he will. や No, he won't. で答えます。"},"stage2":{"questions":[{"type":"choice","text":"It will ( ) sunny tomorrow.","options":["be","is","being"],"answer":"be"},{"type":"choice","text":"She will ( ) fourteen next month.","options":["be","is","are"],"answer":"be"},{"type":"choice","text":"I'll ( ) you later.","options":["call","calls","calling"],"answer":"call"},{"type":"choice","text":"No, I ( ).","options":["won't","don't","am not"],"answer":"won't","context":"Will you be busy tomorrow?"},{"type":"choice","text":"Ken ( ) come to the party.","options":["will not","not will","does not will"],"answer":"will not"},{"type":"choice","text":"( ) it be cold tomorrow?","options":["Will","Is","Does"],"answer":"Will"},{"type":"order","words":["I","will","help","you","with","your","homework"],"answer":"I will help you with your homework."},{"type":"order","words":["will","he","come","back","soon"],"answer":"Will he come back soon?","hint":"疑問文"},{"type":"transform","text":"He plays tennis.","instruction":"will を使って未来の文にしよう","answers":["He will play tennis."]},{"type":"transform","text":"It will rain tomorrow.","instruction":"否定文にしよう","answers":["It will not rain tomorrow."]}]},"stage3":{"questions":[{"ja":"明日は晴れるでしょう。","answers":["It will be sunny tomorrow.","It will be fine tomorrow."]},{"ja":"私があなたを手伝いましょう。","answers":["I will help you."]},{"ja":"彼はパーティーに来ないでしょう。","answers":["He will not come to the party."]},{"ja":"あなたは明日ひまですか。","answers":["Will you be free tomorrow?"]},{"ja":"私は来年15歳になります。","answers":["I will be fifteen next year."]},{"ja":"彼女はすぐに戻ってくるでしょう。","answers":["She will come back soon."]},{"ja":"私はもう二度と遅刻しません。","answers":["I will never be late again.","I will not be late again."]},{"ja":"明日は寒くなるでしょうか。","answers":["Will it be cold tomorrow?"]}]},"stage4":{"questions":[{"ja":"明日は雨でしょう。","answers":["It will rain tomorrow.","It will be rainy tomorrow."]},{"ja":"私があとで電話します。","answers":["I will call you later."]},{"ja":"彼は来ないでしょう。","answers":["He will not come."]},{"ja":"私がドアを開けます。","answers":["I will open the door."]},{"ja":"あなたは来ますか。","answers":["Will you come?"]}]}},{"id":"md1","grade":2,"title":"must / have to","short":"must / have to","stage1":{"question":"must と have to の使い方を説明してください。","points":[{"id":"p1","text":"must＋動詞の原形で「〜しなければならない」という意味を表す"},{"id":"p2","text":"have to＋動詞の原形も「〜しなければならない」で、主語が三人称単数なら has to になる"},{"id":"p3","text":"must not（mustn't）は「〜してはいけない」という禁止を表す"},{"id":"p4","text":"don't have to は「〜しなくてもよい・〜する必要はない」という意味になる"},{"id":"p5","text":"過去のことは had to（〜しなければならなかった）で表す"}],"model":"must＋動詞の原形と have to＋動詞の原形は、どちらも「〜しなければならない」という意味です。主語が三人称単数なら has to になり、過去は had to です。否定にすると意味が変わり、must not は「〜してはいけない」、don't have to は「〜しなくてもよい」になります。"},"stage2":{"questions":[{"type":"choice","text":"You must ( ) your hands.","options":["wash","washes","washing"],"answer":"wash"},{"type":"choice","text":"He ( ) to get up s":["You must not eat here."]},{"ja":"あなたは来なくてもいいです。","answers":["You don't have to come.","You do not have to come."]},{"ja":"彼は働かなければなりません。","answers":["He has to work.","He must work."]},{"ja":"私たちは待たなければなりませんでした。","answers":["We had to wait."]}]}},{"id":"md2","grade":2,"title":"should / may","short":"should / may","stage1":{"question":"助動詞 should と may の使い方を説明してください。","points":[{"id":"p1","text":"should＋動詞の原形で「〜すべきだ・〜したほうがよい」という意味を表す"},{"id":"p2","text":"may＋動詞の原形で「〜してもよい」という許可を表す"},{"id":"p3","text":"may は「〜かもしれない」という推量も表す"},{"id":"p4","text":"助動詞のあとの動詞は原形で、主語が何でも助動詞の形は変わらない"},{"id":"p5","text":"否定文は should not / may not、疑問文は助動詞を主語の前に出す"}],"model":"should は「〜すべきだ」、may は「〜してもよい」という許可や「〜かもしれない」という推量を表す助動詞です。どちらも後ろの動詞は原形で、主語が何でも形は変わりません。否定文は should not や may not、疑問文は Should I〜? のように助動詞を前に出します。"},"stage2":{"questions":[{"type":"choice","text":"You should ( ) to bed early.","options":["go","goes","going"],"answer":"go"},{"type":"choice","text":"You ( ) use this pen. It's free.","options":["may","must not","should not"],"answer":"may"},{"type":"choice","text":"It may ( ) tomorrow.","options":["rain","rains","raining"],"answer":"rain"},{"type":"choice","text":"You should not ( ) so much.","options":["eat","eats","eating"],"answer":"eat"},{"type":"choice","text":"( ) I open the window?","options":["May","Must","Will"],"answer":"May","reply":"Sure."},{"type":"choice","text":"She ( ) be at home now. I'm not sure.","options":["may","must","should"],"answer":"may"},{"type":"order","words":["you","should","see","a","doctor"],"answer":"You should see a doctor."},{"type":"order","words":["he","may","be","busy","today"],"answer":"He may be busy today."},{"type":"transform","text":"You read this book.","instruction":"「〜したほうがよい」という文にしよう","answers":["You should read this book."]},{"type":"transform","text":"You can use my bike.","instruction":"may を使って書きかえよう","answers":["You may use my bike."]}]},"stage3":{"questions":[{"ja":"あなたはもっと野菜を食べるべきです。","answers":["You should eat more vegetables."]},{"ja":"あなたはこの部屋を使ってもよいです。","answers":["You may use this room."]},{"ja":"彼は明日来ないかもしれません。","answers":["He may not come tomorrow."]},{"ja":"私たちはお年寄りに親切にすべきです。","answers":["We should be kind to old people.","We should be kind to elderly people."]},{"ja":"明日は雪が降るかもしれません。","answers":["It may snow tomorrow."]},{"ja":"私は何をすべきですか。","answers":["What should I do?"]},{"ja":"あなたは夜おそくまで起きているべきではありません。","answers":["You should not stay up late.","You should not stay up late at night."]},{"ja":"その話は本当かもしれません。","answers":["The story may be true."]}]},"stage4":{"questions":[{"ja":"あなたは休むべきです。","answers":["You should rest.","You should take a rest."]},{"ja":"入ってもいいですよ。","answers":["You may come in."]},{"ja":"彼女は疲れているかもしれません。","answers":["She may be tired."]},{"ja":"私はどこに行くべきですか。","answers":["Where should I go?"]},{"ja":"あなたはそれを食べるべきではありません。","answers":["You should not eat it."]}]}},{"id":"md3","grade":2,"title":"依頼・許可・申し出の表現","short":"依頼・許可","stage1":{"question":"依頼・許可・申し出・誘いの表現を説明してください。","points":[{"id":"p1","text":"Will you〜? ／ Can you〜? は「〜してくれますか」という依頼を表す"},{"id":"p2","text":"Could you〜? ／ Would you〜? はよりていねいな依頼になる"},{"id":"p3","text":"May I〜? ／ Can I〜? は「〜してもいいですか」と許可を求める表現"},{"id":"p4","text":"Shall I〜? は「（私が）〜しましょうか」という申し出を表す"},{"id":"p5","text":"Shall we〜? は「（いっしょに）〜しましょうか」という誘いを表す"}],"model":"Will you〜? や Can you〜? は「〜してくれますか」という依頼で、Could you〜? や Would you〜? にするとよりていねいになります。May I〜? は「〜してもいいですか」と許可を求めます。Shall I〜? は「私が〜しましょうか」という申し出、Shall we〜? は「いっしょに〜しましょうか」という誘いです。"},"stage2":{"questions":[{"type":"choice","text":"( ) you help me?","options":["Will","Shall","May"],"answer":"Will","reply":"Sure."},{"type":"choice","text":"( ) I use your phone?","options":["May","Shall","Will"],"answer":"May","reply":"Yes, of course."},{"type":"choice","text":"( ) I carry your bag?","options":["Shall","Will","Would"],"answer":"Shall","reply":"Yes, please."},{"type":"choice","text":"( ) we go to the movies?","options":["Shall","Will","May"],"answer":"Shall","reply":"Yes, let's."},{"type":"choice","text":"( ) you tell me the way to the station?","options":["Could","Shall","May"],"answer":"Could"},{"type":"choice","text":"( ), please.","options":["Yes","Sure","No"],"answer":"Yes","context":"Shall I open the window?"},{"type":"order","words":["could","you","speak","more","slowly"],"answer":"Could you speak more slowly?","hint":"疑問文"},{"type":"order","words":["shall","we","have","lunch","together"],"answer":"Shall we have lunch together?","hint":"疑問文"},{"type":"transform","text":"Please close the door.","instruction":"Will you で始まる依頼の文にしよう","answers":["Will you close the door?"]}]},"stage3":{"questions":[{"ja":"手伝ってくれますか。","answers":["Will you help me?","Can you help me?","Could you help me?"]},{"ja":"この本を借りてもいいですか。","answers":["May I borrow this book?","Can I borrow this book?"]},{"ja":"窓を開けましょうか。","answers":["Shall I open the window?"]},{"ja":"いっしょにテニスをしましょうか。","answers":["Shall we play tennis together?","Shall we play tennis?"]},{"ja":"もう一度言っていただけますか。","answers":["Could you say that again?","Would you say that again?","Could you say it again?"]},{"ja":"駅への道を教えていただけますか。","answers":["Could you tell me the way to the station?","Would you tell me the way to the station?"]},{"ja":"ここに座ってもいいですか。","answers":["May I sit here?","Can I sit here?"]},{"ja":"あなたのかばんを運びましょうか。","answers":["Shall I carry your bag?"]}]},"stage4":{"questions":[{"ja":"窓を閉めてくれますか。","answers":["Will you close the window?","Can you close the window?","Could you close the window?"]},{"ja":"入ってもいいですか。","answers":["May I come in?","Can I come in?"]},{"ja":"手伝いましょうか。","answers":["Shall I help you?"]},{"ja":"踊りましょうか。","answers":["Shall we dance?"]},{"ja":"ゆっくり話していただけますか。","answers":["Could you speak slowly?","Would you speak slowly?","Could you speak more slowly?"]}]}},{"id":"in1","grade":2,"title":"不定詞（名詞的用法）","short":"不定詞（名詞的）","stage1":{"question":"不定詞の名詞的用法を説明してください。","points":[{"id":"p1","text":"to＋動詞の原形の形を不定詞という"},{"id":"p2","text":"名詞的用法は「〜すること」という意味で、名詞と同じ働きをする"},{"id":"p3","text":"want to〜（〜したい）、like to〜（〜するのが好き）、try to〜（〜しようとする）などで動詞の目的語になる"},{"id":"p4","text":"主語や be動詞のあと（My dream is to〜）にも置ける"},{"id":"p5","text":"to のあとの動詞は、主語や時に関係なくいつも原形"}],"model":"to＋動詞の原形を不定詞といいます。名詞的用法は「〜すること」という意味で、名詞と同じ働きをします。want to や like to のように動詞の目的語になったり、My dream is to be a doctor. のように be動詞のあとに置いたりします。to のあとの動詞はいつも原形です。"},"stage2":{"questions":[{"type":"choice","text":"I want ( ) a new bike.","options":["to buy","buy","buying"],"answer":"to buy"},{"type":"choice","text":"She likes to ( ) pictures.","options":["draw","draws","drew"],"answer":"draw"},{"type":"choice","text":"My dream is ( ) a singer.","options":["to be","be","is"],"answer":"to be"},{"type":"choice","text":"He tried ( ) the box.","options":["to open","open","opens"],"answer":"to open"},{"type":"choice","text":"They started to ( ) the song.","options":["sing","sang","sings"],"answer":"sing"},{"type":"choice","text":"What do you want to ( ) in the future?","options":["be","is","are"],"answer":"be"},{"type":"order","words":["I","want","to","go","to","Australia"],"answer":"I want to go to Australia."},{"type":"order","words":["my","hobby","is","to","collect","stamps"],"answer":"My hobby is to collect stamps."},{"type":"transform","text":"I play the guitar.","instruction":"「〜したい」という文にしよう","answers":["I want to play the guitar."]}]},"stage3":{"questions":[{"ja":"私は医者になりたいです。","answers":["I want to be a doctor.","I want to become a doctor."]},{"ja":"彼女は本を読むのが好きです。","answers":["She likes to read books.","She likes reading books."]},{"ja":"私の夢は世界中を旅行することです。","answers":["My dream is to travel around the world.","My dream is to travel all over the world."]},{"ja":"雨が降り始めました。","answers":["It started to rain.","It began to rain.","It started raining."]},{"ja":"あなたは何を食べたいですか。","answers":["What do you want to eat?"]},{"ja":"彼は英語を勉強しようとしました。","answers":["He tried to study English."]},{"ja":"私は将来、外国で働きたいです。","answers":["I want to work abroad in the future.","I want to work in a foreign country in the future."] ","text":"Playing video games ( ) fun.","options":["is","are","be"],"answer":"is"},{"type":"order","words":["my","hobby","is","taking","pictures"],"answer":"My hobby is taking pictures."},{"type":"order","words":["how","about","going","shopping"],"answer":"How about going shopping?","hint":"疑問文"},{"type":"transform","text":"I like to play soccer.","instruction":"動名詞を使って書きかえよう","answers":["I like playing soccer."]}]},"stage3":{"questions":[{"ja":"私は音楽を聞くことが好きです。","answers":["I like listening to music.","I like to listen to music."]},{"ja":"本を読むことは楽しいです。","answers":["Reading books is fun."]},{"ja":"私たちはパーティーで歌うことを楽しみました。","answers":["We enjoyed singing at the party."]},{"ja":"彼女は泳ぐのが得意です。","answers":["She is good at swimming."]},{"ja":"彼は宿題を終えました。","answers":["He finished doing his homework.","He finished his homework."]},{"ja":"私の趣味は切手を集めることです。","answers":["My hobby is collecting stamps."]},{"ja":"手伝ってくれてありがとう。","answers":["Thank you for helping me."]},{"ja":"雨がやみました。","answers":["It stopped raining."]}]},"stage4":{"questions":[{"ja":"私は料理をすることが好きです。","answers":["I like cooking.","I like to cook."]},{"ja":"英語を話すことは楽しいです。","answers":["Speaking English is fun."]},{"ja":"彼はテレビを見て楽しみました。","answers":["He enjoyed watching TV."]},{"ja":"私は走るのが得意です。","answers":["I am good at running."]},{"ja":"来てくれてありがとう。","answers":["Thank you for coming."]}]}},{"id":"gr2","grade":2,"title":"不定詞と動名詞の使い分け","short":"不定詞と動名詞","stage1":{"question":"不定詞と動名詞の使い分けを説明してください。","points":[{"id":"p1","text":"like, start, begin などは、後ろに不定詞と動名詞のどちらも置ける"},{"id":"p2","text":"want, hope, decide などは、後ろに不定詞だけを置く"},{"id":"p3","text":"enjoy, finish, stop などは、後ろに動名詞だけを置く"},{"id":"p4","text":"前置詞（at, for, of など）のあとには動名詞を置く"},{"id":"p5","text":"stop は、stop＋動名詞で「〜するのをやめる」、stop to〜で「〜するために立ち止まる」と意味が変わる"}],"model":"like や start は不定詞と動名詞のどちらも後ろに置けます。want、hope、decide などは不定詞だけ、enjoy、finish、stop などは動名詞だけを置きます。前置詞のあとは動名詞にします。stop は stop talking なら「話すのをやめる」、stop to talk なら「話すために立ち止まる」と意味が変わります。"},"stage2":{"questions":[{"type":"choice","text":"I want ( ) a dog.","options":["to have","having","have"],"answer":"to have"},{"type":"choice","text":"We enjoyed ( ) in the sea.","options":["swimming","to swim","swim"],"answer":"swimming"},{"type":"choice","text":"He decided ( ) abroad.","options":["to study","studying","study"],"answer":"to study"},{"type":"choice","text":"Please stop ( ).","options":["talking","to talk","talk"],"answer":"talking"},{"type":"choice","text":"I hope ( ) you again.","options":["to see","seeing","see"],"answer":"to see"},{"type":"choice","text":"She is interested in ( ) books.","options":["reading","to read","read"],"answer":"reading"},{"type":"choice","text":"Have you finished ( ) the book?","options":["reading","to read","read"],"answer":"reading"},{"type":"order","words":["he","decided","to","join","the","soccer","team"],"answer":"He decided to join the soccer team."},{"type":"order","words":["I","finished","cleaning","my","room"],"answer":"I finished cleaning my room."},{"type":"transform","text":"I like to watch movies.","instruction":"動名詞を使って書きかえよう","answers":["I like watching movies."]}]},"stage3":{"questions":[{"ja":"私はカナダに行きたいです。","answers":["I want to go to Canada."]},{"ja":"彼は絵をかくのを楽しみました。","answers":["He enjoyed drawing pictures.","He enjoyed painting pictures."]},{"ja":"彼女は留学することに決めました。","answers":["She decided to study abroad."]},{"ja":"話すのをやめなさい。","answers":["Stop talking."]},{"ja":"私はまたあなたに会えるといいなと思います。","answers":["I hope to see you again."]},{"ja":"私は昼食を食べ終えました。","answers":["I finished eating lunch.","I finished eating my lunch.","I finished my lunch."]},{"ja":"彼は日本の歴史に興味があります。","answers":["He is interested in Japanese history."]},{"ja":"私は写真をとることに興味があります。","answers":["I am interested in taking pictures.","I am interested in taking photos."]}]},"stage4":{"questions":[{"ja":"私はピザが食べたいです。","answers":["I want to eat pizza."]},{"ja":"私たちは歌って楽しみました。","answers":["We enjoyed singing."]},{"ja":"彼は医者になる決心をしました。","answers":["He decided to be a doctor.","He decided to become a doctor."]},{"ja":"走るのをやめなさい。","answers":["Stop running."]},{"ja":"私は宿題をし終えました。","answers":["I finished doing my homework.","I finished my homework."]}]}},{"id":"cj1","grade":2,"title":"接続詞 when / if / because","short":"when / if / because","stage1":{"question":"接続詞 when, if, because の使い方を説明してください。","points":[{"id":"p1","text":"when は「〜するとき」、if は「もし〜なら」、because は「〜なので・なぜなら」という意味を表す"},{"id":"p2","text":"接続詞のあとには〈主語＋動詞〉が続く"},{"id":"p3","text":"when や if のまとまりを文の前に置くときは、間にコンマを入れる"},{"id":"p4","text":"when や if のまとまりの中では、未来のことでも現在形を使う"},{"id":"p5","text":"Why〜? の質問には Because〜. で理由を答えられる"}],"model":"when は「〜するとき」、if は「もし〜なら」、because は「〜なので」という意味の接続詞で、後ろに主語と動詞が続きます。when や if のまとまりを前に置くときはコンマを入れます。また、when や if のまとまりの中では、未来のことでも現在形を使います。Why〜? には Because〜. で理由を答えられます。"},"stage2":{"questions":[{"type":"choice","text":"( ) I got home, my sister was sleeping.","options":["When","If","Because"],"answer":"When"},{"type":"choice","text":"( ) it rains tomorrow, I will stay home.","options":["If","Because","When"],"answer":"If"},{"type":"choice","text":"I didn't go out ( ) it was cold.","options":["because","if","when"],"answer":"because"},{"type":"choice","text":"If it ( ) sunny tomorrow, we will go hiking.","options":["is","will be","was"],"answer":"is"},{"type":"choice","text":"( ) I missed the bus.","options":["Because","If","When"],"answer":"Because","context":"Why were you late?"},{"type":"choice","text":"I'll call you when I ( ) at the station.","options":["arrive","will arrive","arrived"],"answer":"arrive"},{"type":"order","words":["I","was","watching","TV","when","he","called","me"],"answer":"I was watching TV when he called me."},{"type":"order","words":["if","you","are","tired","you","should","go","to","bed"],"answer":"If you are tired, you should go to bed."},{"type":"transform","text":"It was raining. I stayed home.","instruction":"because を使って1つの文にしよう","answers":["I stayed home because it was raining.","Because it was raining, I stayed home."]}]},"stage3":{"questions":[{"ja":"私が家に帰ったとき、母は料理をしていました。","answers":["When I got home, my mother was cooking.","My mother was cooking when I got home.","When I came home, my mother was cooking."]},{"ja":"もし明日晴れたら、私たちはテニスをします。","answers":["If it is sunny tomorrow, we will play tennis.","We will play tennis if it is sunny tomorrow.","If it is fine tomorrow, we will play tennis."]},{"ja":"私は疲れていたので、早く寝ました。","answers":["I went to bed early because I was tired.","Because I was tired, I went to bed early."]},{"ja":"私は小さいころ、犬が好きでした。","answers":["I liked dogs when I was little.","When I was little, I liked dogs.","When I was a child, I liked dogs."]},{"ja":"もしひまなら、手伝ってくれますか。","answers":["If you are free, will you help me?","If you are free, can you help me?","Can you help me if you are free?"]},{"ja":"なぜあなたはその本が好きなのですか。—おもしろいからです。","answers":["Why do you like the book? Because it is interesting.","Why do you like that book? Because it is interesting."]},{"ja":"駅に着いたら電話してください。","answers":["Please call me when you get to the station.","Call me when you arrive at the station.","Please call me when you arrive at the station."]},{"ja":"雨が降っていたので、私たちは外出しませんでした。","answers":["We did not go out because it was raining.","Because it was raining, we did not go out."]}]},"stage4":{"questions":[{"ja":"私が起きたとき、雪が降っていました。","answers":["When I got up, it was snowing.","It was snowing when I got up.","When I woke up, it was snowing."]},{"ja":"もし疲れていたら休みなさい。","answers":["If you are tired, take a rest.","Rest if you are tired.","If you are tired, rest."]},{"ja":"私は空腹だったのでたくさん食べました。","answers":["I ate a lot because I was hungry.","Because I was hungry, I ate a lot."]},{"ja":"もし雨なら家にいます。","answers":["If it rains, I will stay home.","I will stay home if it rains.","If it is rainy, I will stay home."]},{"ja":"私は10歳のとき、京都に住んでいました。","answers":["I lived in Kyoto when I was ten.","When I was ten, I lived in Kyoto.","When I was ten years old, I lived in Kyoto."]}]}},{"id":"cj2","grade":2,"title":"接続詞 that","short":"接続詞 that","stage1":{"question":"接続詞 that の使い方を説明してください。","points":[{"id":"p1","text":"that＋主語＋動詞で「〜ということ」という意味のまとまりを作る"},{"id":"p2","text":"think, know, hope, believe などの動詞のあとに置き、目的語にする"},{"id":"p3","text":"この that はよく省略される"},{"id":"p4","text":"I'm sure that〜（きっと〜だと思う）、I'm glad that〜 のように形容詞のあとにも使える"},{"id":"p5","text":"前の動詞が過去形なら、that のあとの動詞もふつう過去形にそろえる"}],"model":"接続詞 that は、that のあとに主語と動詞を続けて「〜ということ」というまとまりを作ります。I think that he is kind. のように think や know、hope などのあとに置き、この that はよく省略されます。I'm sure that〜 のように形容詞のあとにも使えます。前の動詞が過去形なら、that のあとの動詞もふつう過去形にそろえます。"},"stage2":{"questions":[{"type":"choice","text":"I think ( ) he is right.","options":["that","what","when"],"answer":"that"},{"type":"choice","text":"I know that she ( ) Chinese.","options":["speaks","speak","speaking"],"answer":"speaks"},{"type":"choice","text":"I hope ( ) will be sunny tomorrow.","options":["it","that","this"],"answer":"it"},{"type":"choice","text":"I'm sure that you ( ) win the game.","options":["will","are","do"],"answer":"will"},{"type":"choice","text":"I thought that the test ( ) easy.","options":["was","is","be"],"answer":"was"},{"type":"choice","text":"Do you think that he ( ) come?","options":["will","is","does"],"answer":"will"},{"type":"order","words":["I","think","that","English","is","important"],"answer":"I think that English is important."},{"type":"order","words":["I","know","he","likes","music"],"answer":"I know he likes music."},{"type":"transform","text":"He is a good teacher.","instruction":"I think を前につけた文にしよう","answers":["I think that he is a good teacher.","I think he is a good teacher."]}]},"stage3":{"questions":[{"ja":"私は彼が正しいと思います。","answers":["I think that he is right.","I think he is right."]},{"ja":"私は彼女がピアノを弾けることを知っています。","answers":["I know that she can play the piano.","I know she can play the piano."]},{"ja":"明日晴れるといいですね。","answers":["I hope that it will be sunny tomorrow.","I hope it will be sunny tomorrow.","I hope it will be fine tomorrow."]},{"ja":"私はその話は本当ではないと思います。","answers":["I do not think that the story is true.","I don't think the story is true.","I do not think the story is true."]},{"ja":"きっとあなたは試合に勝つと思います。","answers":["I am sure that you will win the game.","I am sure you will win the game.","I'm sure you will win the game."]},{"ja":"私はその本はおもしろいと思いました。","answers":["I thought that the book was interesting.","I thought the book was interesting."]},{"ja":"あなたは彼が来ると思いますか。","answers":["Do you think that he will come?","Do you think he will come?"]},{"ja":"私はあなたが来てくれてうれしいです。","answers":["I am glad that you came.","I am glad you came.","I am happy that you came."]}]},"stage4":{"questions":[{"ja":"私は英語は大切だと思います。","answers":["I think that English is important.","I think English is important."]},{"ja":"私は彼が忙しいことを知っています。","answers":["I know that he is busy.","I know he is busy."]},{"ja":"あなたが合格するといいですね。","answers":["I hope that you will pass.","I hope you will pass.","I hope you pass."]},{"ja":"私はそれは正しくないと思います。","answers":["I do not think that it is right.","I don't think it is right.","I do not think it is right."]},{"ja":"きっと彼は来ますよ。","answers":["I am sure that he will come.","I am sure he will come.","I'm sure he will come."]}]}},{"id":"th1","grade":2,"title":"There is / There are ～.","short":"There is / are","stage1":{"question":"There is / There are の文のルールを説明してください。","points":[{"id":"p1","text":"There is / are＋名詞＋場所 で「（場所に）〜がある・いる」という意味を表す"},{"id":"p2","text":"後ろの名詞が単数なら is、複数なら are を使う"},{"id":"p3","text":"過去は There was / There were にする"},{"id":"p4","text":"否定文は is / are のあとに not、疑問文は Is / Are を there の前に出す"},{"id":"p5","text":"my bag や the cat のように特定のものには使わず、My bag is on the desk. のように言う"}],"model":"There is / There are のあとに名詞と場所を続けて、「〜に…がある・いる」という意味を表します。後ろの名詞が単数なら is、複数なら are を使い、過去は was や were にします。否定文は is や are のあとに not、疑問文は Is there〜? のようにします。my bag のような特定のものには使いません。"},"stage2":{"questions":[{"type":"choice","text":"There ( ) a cat under the table.","options":["is","are","am"],"answer":"is"},{"type":"choice","text":"There ( ) many students in the gym.","options":["are","is","be"],"answer":"are"},{"type":"choice","text":"There ( ) a big tree here ten years ago.","options":["was","were","is"],"answer":"was"},{"type":"choice","text":"Yes, there ( ).","options":["is","are","was"],"answer":"is","context":"Is there a hospital near here?"},{"type":"choice","text":"( ) there any eggs in the box?","options":["Are","Is","Do"],"answer":"Are"},{"type":"choice","text":"How many people ( ) there in your family?","options":["are","is","do"],"answer":"are"},{"type":"order","words":["there","are","seven","days","in","a","week"],"answer":"There are seven days in a week."},{"type":"order","words":["is","there","a","convenience","store","near","your","house"],"answer":"Is there a convenience store near your house?","hint":"疑問文"},{"type":"transform","text":"There is a pen on the desk.","instruction":"下線部の「a pen」を「three pens」にかえよう","answers":["There are three pens on the desk."]},{"type":"transform","text":"There are some books in the bag.","instruction":"疑問文にしよう","answers":["Are there any books in the bag?"]}]},"stage3":{"questions":[{"ja":"机の上に本が1冊あります。","answers":["There is a book on the desk."]},{"ja":"公園にはたくさんの子どもがいます。","answers":["There are many children in the park.","There are a lot of children in the park."]},{"ja":"この近くに駅はありますか。—はい、あります。","answers":["Is there a station near here? Yes, there is."]},{"ja":"箱の中には何もありません。","answers":["There is nothing in the box."]},{"ja":"昨日ここに大きな犬がいました。","answers":["There was a big dog here yesterday."]},{"ja":"あなたの町には図書館がありますか。","answers":["Is there a library in your town?"]},{"ja":"あなたのクラスには何人の生徒がいますか。","answers":["How many students are there in your class?"]},{"ja":"冷蔵庫に牛乳はありません。","answers":["There is no milk in the fridge.","There is not any milk in the fridge.","There is no milk in the refrigerator."]}]},"stage4":{"questions":[{"ja":"部屋にネコがいます。","answers":["There is a cat in the room."]},{"ja":"机の上にペンが3本あります。","answers":["There are three pens on the desk."]},{"ja":"この近くに公園はありますか。","answers":["Is there a park near here?"]},{"ja":"1年には12か月あります。","answers":["There are twelve months in a year."]},{"ja":"そこにはだれもいませんでした。","answers":["There was nobody there.","There was no one there."]}]}},{"id":"cp1","grade":2,"title":"比較級（-er than）","short":"比較級","stage1":{"question":"比較級の文のルールを説明してください。","points":[{"id":"p1","text":"2つ（2人）をくらべて「〜よりも…だ」と言うときは、形容詞・副詞を比較級にする"},{"id":"p2","text":"比較級はふつう語の終わりに er をつける（tall → taller）"},{"id":"p3","text":"比較級のあとに than（〜よりも）を置く"},{"id":"p4","text":"e で終わる語は r だけ（large → larger）、〈子音字＋y〉は y を i にかえて er（easy → easier）、big は bigger のように文字を重ねるものもある"},{"id":"p5","text":"good / well の比較級は better になる"}],"model":"2つをくらべて「〜よりも…だ」と言うときは、形容詞や副詞を比較級にして、あとに than を置きます。比較級はふつう tall → taller のように er をつけます。large は r だけ、easy は easier、big は bigger のようになります。good や well の比較級は better です。"},"stage2":{"questions":[{"type":"choice","text":"Ken is ( ) than Taro.","options":["taller","tall","tallest"],"answer":"taller"},{"type":"choice","text":"This box is bigger ( ) that one.","options":["than","then","as"],"answer":"than"},{"type":"choice","text":"Math is ( ) than English for me.","options":["easier","easyer","more easy"],"answer":"easier"},{"type":"choice","text":"My dog is ( ) than your dog.","options":["bigger","biger","big"],"answer":"bigger"},{"type":"choice","text":"She sings ( ) than me.","options":["better","gooder","well"],"answer":"better"},{"type":"choice","text":"Which is ( ), the sun or the moon?","options":["larger","large","largest"],"answer":"larger"},{"type":"order","words":["my","brother","is","older","than","me"],"answer":"My brother is older than me."},{"type":"order","words":["this","bag","is","lighter","than","that","one"],"answer":"This bag is lighter than that one."},{"type":"transform","text":"Tom is tall.","instruction":"「ケン（Ken）よりも」をつけて比較の文にしよう","answers":["Tom is taller than Ken."]}]},"stage3":{"questions":[{"ja":"私の兄は私よりも背が高いです。","answers":["My brother is taller than me.","My brother is taller than I.","My older brother is taller than me."]},{"ja":"今日は昨日より寒いです。","answers":["It is colder today than yesterday.","Today is colder than yesterday."]},{"ja":"このかばんはあのかばんよりも小さいです。","answers":["This bag is smaller than that one.","This bag is smaller than that bag."]},{"ja":"彼は私よりも速く走ります。","answers":["He runs faster than me.","He runs faster than I do.","He runs faster than I."]},{"ja":"日本はアメリカよりも小さいです。","answers":["Japan is smaller than America.","Japan is smaller than the U.S."]},{"ja":"私の犬はあなたの犬よりも大きいです。","answers":["My dog is bigger than your dog.","My dog is bigger than yours."]},{"ja":"彼女は私よりも上手に英語を話します。","answers":["She speaks English better than me.","She speaks English better than I do."]},{"ja":"理科は数学よりも簡単です。","answers":["Science is easier than math."]}]},"stage4":{"questions":[{"ja":"私は彼よりも背が高いです。","answers":["I am taller than him.","I am taller than he is.","I am taller than he."]},{"ja":"これはあれよりも大きいです。","answers":["This is bigger than that."]},{"ja":"彼は私よりも年上です。","answers":["He is older than me.","He is older than I am.","He is older than I."]},{"ja":"今日は昨日より暑いです。","answers":["It is hotter today than yesterday.","Today is hotter than yesterday."]},{"ja":"彼女は私よりも上手に歌います。","answers":["She sings better than me.","She sings better than I do."]}]}},{"id":"cp2","grade":2,"title":"最上級（the -est）","short":"最上級","stage1":{"question":"最上級の文のルールを説明してください。","points":[{"id":"p1","text":"3つ（3人）以上の中で「いちばん〜だ」と言うときは、形容詞・副詞を最上級にする"},{"id":"p2","text":"最上級はふつう語の終わりに est をつけ、前に the を置く（the tallest）"},{"id":"p3","text":"「〜の中で」は、in＋場所・グループ（in my class）、of＋複数を表す語（of the three, of all）で表す"},{"id":"p4","text":"e で終わる語は st だけ、〈子音字＋y〉は y を i にかえて est、big は biggest のように文字を重ねるものもある"},{"id":"p5","text":"good / well の最上級は best になる"}],"model":"3つ以上の中で「いちばん〜だ」と言うときは、形容詞や副詞を最上級にして、前に the を置きます。最上級はふつう the tallest のように est をつけます。「〜の中で」は、in my class のように場所やグループには in、of the three のように複数を表す語には of を使います。good や well の最上級は best です。"},"stage2":{"questions":[{"type":"choice","text":"Ken is the ( ) in his class.","options":["tallest","taller","tall"],"answer":"tallest"},{"type":"choice","text":"This is the biggest dog ( ) the five.","options":["of","in","than"],"answer":"of"},{"type":"choice","text":"Mt. Fuji is the highest mountain ( ) Japan.","options":["in","of","than"],"answer":"in"},{"type":"choice","text":"Winter is the ( ) season of the four.","options":["coldest","colder","cold"],"answer":"coldest"},{"type":"choice","text":"She is the ( ) singer in our school.","options":["best","better","goodest"],"answer":"best"},{"type":"choice","text":"This is the ( ) question of all.","options":["easiest","easyest","easier"],"answer":"easiest"},{"type":"order","words":["he","is","the","youngest","of","the","three"],"answer":"He is the youngest of the three."},{"type":"order","words":["which","is","the","longest","river","in","the","world"],"answer":"Which is the longest river in the world?","hint":"疑問文"},{"type":"transform","text":"Tom is tall.","instruction":"「クラスの中でいちばん」という文にしよう","answers":["Tom is the tallest in his class.","Tom is the tallest in the class."]}]},"stage3":{"questions":[{"ja":"彼はクラスでいちばん背が高いです。","answers":["He is the tallest in his class.","He is the tallest in the class."]},{"ja":"信濃川は日本でいちばん長い川です。","answers":["The Shinano River is the longest river in Japan.","The Shinano is the longest river in Japan."]},{"ja":"この問題は全部の中でいちばんやさしいです。","answers":["This question is the easiest of all."]},{"ja":"彼女は3人の中でいちばん速く走ります。","answers":["She runs the fastest of the three.","She runs fastest of the three."]},{"ja":"これはこの店でいちばん大きいケーキです。","answers":["This is the biggest cake in this store.","This is the biggest cake in this shop."]},{"ja":"私は春がいちばん好きです。","answers":["I like spring the best.","I like spring best."]},{"ja":"彼は私たちのチームでいちばん上手な選手です。","answers":["He is the best player on our team.","He is the best player in our team."]},{"ja":"8月は1年でいちばん暑い月です。","answers":["August is the hottest month of the year.","August is the hottest month in the year."]}]},"stage4":{"questions":[{"ja":"彼女は家族でいちばん背が高いです。","answers":["She is the tallest in her family."]},{"ja":"これはいちばん小さいです。","answers":["This is the smallest."]},{"ja":"彼は4人の中でいちばん年上です。","answers":["He is the oldest of the four."]},{"ja":"私は夏がいちばん好きです。","answers":["I like summer the best.","I like summer best."]},{"ja":"今日は今年いちばん寒い日です。","answers":["Today is the coldest day of the year.","Today is the coldest day this year."]}]}},{"id":"cp3","grade":2,"title":"as ～ as ...","short":"as ～ as","stage1":{"question":"as〜as を使った比較の文を説明してください。","points":[{"id":"p1","text":"as＋形容詞・副詞の原級＋as で「…と同じくらい〜だ」という意味を表す"},{"id":"p2","text":"as と as の間の形容詞・副詞は、er や est をつけない元の形（原級）にする"},{"id":"p3","text":"not as〜as で「…ほど〜ではない」という意味になる"},{"id":"p4","text":"as〜as のあとの人を表す語は me や him の形がよく使われる（as tall as me）"}],"model":"as＋形容詞の元の形＋as で「…と同じくらい〜だ」という意味を表します。as と as の間の語は er や est をつけない元の形にします。not as〜as にすると「…ほど〜ではない」という意味になります。"},"stage2":{"questions":[{"type":"choice","text":"Ken is as ( ) as Taro.","options":["tall","taller","tallest"],"answer":"tall"},{"type":"choice","text":"This bag is as heavy ( ) that one.","options":["as","than","so"],"answer":"as"},{"type":"choice","text":"I am not as old ( ) my brother.","options":["as","than","of"],"answer":"as"},{"type":"choice","text":"She can swim as ( ) as her sister.","options":["fast","faster","fastest"],"answer":"fast"},{"type":"choice","text":"My cat is as big ( ) your dog.","options":["as","than","of"],"answer":"as"},{"type":"choice","text":"This movie is not as ( ) as that one.","options":["interesting","more interesting","most interesting"],"answer":"interesting"},{"type":"order","words":["Tom","is","as","tall","as","his","father"],"answer":"Tom is as tall as his father."},{"type":"order","words":["today","is","not","as","cold","as","yesterday"],"answer":"Today is not as cold as yesterday."},{"type":"transform","text":"Ken is taller than me.","instruction":"not as ～ as を使って「私（I）」を主語にした文にしよう","answers":["I am not as tall as Ken."]}]},"stage3":{"questions":[{"ja":"私は母と同じくらいの背の高さです。","answers":["I am as tall as my mother."]},{"ja":"今日は昨日ほど暑くありません。","answers":["It is not as hot today as yesterday.","Today is not as hot as yesterday."]},{"ja":"このかばんはあのかばんと同じくらい重いです。","answers":["This bag is as heavy as that one.","This bag is as heavy as that bag."]},{"ja":"私は兄ほど速く走れません。","answers":["I cannot run as fast as my brother.","I can't run as fast as my brother."]},{"ja":"彼女は私と同じくらい上手に英語を話します。","answers":["She speaks English as well as me.","She speaks English as well as I do."]},{"ja":"この本はあの本ほどおもしろくありません。","answers":["This book is not as interesting as that one.","This book is not as interesting as that book."]},{"ja":"私の犬はあなたのネコと同じくらい小さいです。","answers":["My dog is as small as your cat."]},{"ja":"数学は英語ほど難しくありません。","answers":["Math is not as difficult as English.","Math is not as hard as English."]}]},"stage4":{"questions":[{"ja":"彼は私と同じくらい背が高いです。","answers":["He is as tall as me.","He is as tall as I am.","He is as tall as I."]},{"ja":"これはあれと同じくらい大きいです。","answers":["This is as big as that."]},{"ja":"私は彼ほど年をとっていません。","answers":["I am not as old as him.","I am not as old as he is.","I am not as old as he."]},{"ja":"今日は昨日ほど寒くありません。","answers":["It is not as cold today as yesterday.","Today is not as cold as yesterday."]},{"ja":"彼女は私と同じくらい速く走ります。","answers":["She runs as fast as me.","She runs as fast as I do."]}]}},{"id":"cp4","grade":2,"title":"more / most を使う比較","short":"more / most","stage1":{"question":"more や most を使う比較の文を説明してください。","points":[{"id":"p1","text":"beautiful, interesting, difficult, popular などの長い語は、er / est をつけない"},{"id":"p2","text":"比較級は前に more を置く（more interesting than）"},{"id":"p3","text":"最上級は前に the most を置く（the most interesting）"},{"id":"p4","text":"「AよりBが好き」は like B better than A、「〜がいちばん好き」は like〜 the best で表す"},{"id":"p5","text":"Which do you like better, A or B? で好みをたずねる"}],"model":"beautiful や interesting のような長い語は er や est をつけず、比較級は前に more、最上級は前に the most を置きます。「AよりBが好き」は like B better than A、「〜がいちばん好き」は like〜 the best で表し、Which do you like better, A or B? でたずねます。"},"stage2":{"questions":[{"type":"choice","text":"This book is ( ) than that one.","options":["more interesting","interestinger","most interesting"],"answer":"more interesting"},{"type":"choice","text":"She is the ( ) singer in Japan.","options":["most popular","popularest","more popular"],"answer":"most popular"},{"type":"choice","text":"Math is ( ) difficult than science.","options":["more","most","much"],"answer":"more"},{"type":"choice","text":"I like dogs ( ) than cats.","options":["better","more good","best"],"answer":"better"},{"type":"choice","text":"Which do you like ( ), tea or coffee?","options":["better","best","more"],"answer":"better"},{"type":"choice","text":"This is the most ( ) picture of all.","options":["beautiful","beautifuler","more beautiful"],"answer":"beautiful"},{"type":"order","words":["this","question","is","more","difficult","than","that","one"],"answer":"This question is more difficult than that one."},{"type":"order","words":["what","sport","do","you","like","the","best"],"answer":"What sport do you like the best?","hint":"疑問文"},{"type":"transform","text":"This flower is beautiful.","instruction":"「あの花（that one）よりも」をつけて比較の文にしよう","answers":["This flower is more beautiful than that one."]}]},"stage3":{"questions":[{"ja":"この本はあの本よりおもしろいです。","answers":["This book is more interesting than that one.","This book is more interesting than that book."]},{"ja":"彼女は日本でいちばん人気のある歌手です。","answers":["She is the most popular singer in Japan."]},{"ja":"英語は数学より難しいです。","answers":["English is more difficult than math.","English is harder than math."]},{"ja":"私はネコより犬のほうが好きです。","answers":["I like dogs better than cats."]},{"ja":"あなたは夏と冬ではどちらが好きですか。","answers":["Which do you like better, summer or winter?"]},{"ja":"これは全部の中でいちばん美しい写真です。","answers":["This is the most beautiful picture of all.","This is the most beautiful photo of all."]},{"ja":"私は全部の教科の中で英語がいちばん好きです。","  be動詞のあとに not、疑問文は be動詞を主語の前に出し、Yes, it was. や No, it wasn't. で答えます。When was this temple built? のように疑問詞を前に置いてたずねることもできます。"},"stage2":{"questions":[{"type":"choice","text":"This temple ( ) built 500 years ago.","options":["was","is","were"],"answer":"was"},{"type":"choice","text":"These pictures were ( ) by my father.","options":["taken","took","take"],"answer":"taken"},{"type":"choice","text":"The window was not ( ) by Ken.","options":["broken","broke","break"],"answer":"broken"},{"type":"choice","text":"Yes, it ( ).","options":["was","did","is"],"answer":"was","context":"Was this letter written by Mai?"},{"type":"choice","text":"( ) these cookies made by your sister?","options":["Were","Was","Did"],"answer":"Were"},{"type":"choice","text":"When ( ) this bridge built?","options":["was","did","is"],"answer":"was"},{"type":"order","words":["this","book","was","written","by","a","famous","writer"],"answer":"This book was written by a famous writer."},{"type":"order","words":["where","was","this","bag","made"],"answer":"Where was this bag made?","hint":"疑問文"},{"type":"transform","text":"My brother broke the cup.","instruction":"受け身の文にしよう","answers":["The cup was broken by my brother."]},{"type":"transform","text":"This song is sung in Japan.","instruction":"疑問文にしよう","answers":["Is this song sung in Japan?"]}]},"stage3":{"questions":[{"ja":"このお寺は400年前に建てられました。","answers":["This temple was built four hundred years ago."]},{"ja":"これらの写真は私の父によってとられました。","answers":["These pictures were taken by my father.","These photos were taken by my father."]},{"ja":"その窓はケンによって割られたのではありません。","answers":["The window was not broken by Ken."]},{"ja":"この手紙はマイによって書かれましたか。—はい、そうです。","answers":["Was this letter written by Mai? Yes, it was."]},{"ja":"このかばんはどこで作られましたか。","answers":["Where was this bag made?"]},{"ja":"その試合は多くの人に見られました。","answers":["The game was watched by many people.","The game was seen by many people."]},{"ja":"この部屋は昨日そうじされませんでした。","answers":["This room was not cleaned yesterday."]},{"ja":"その本はいつ書かれましたか。","answers":["When was the book written?","When was that book written?"]}]},"stage4":{"questions":[{"ja":"この家は10年前に建てられました。","answers":["This house was built ten years ago."]},{"ja":"このケーキは母によって作られました。","answers":["This cake was made by my mother."]},{"ja":"この本は英語で書かれていますか。","answers":["Is this book written in English?"]},{"ja":"私はパーティーに招待されませんでした。","answers":["I was not invited to the party."]},{"ja":"この写真はどこでとられましたか。","answers":["Where was this picture taken?","Where was this photo taken?"]}]}},{"id":"lk1","grade":2,"title":"look ＋ 形容詞 など（SVC）","short":"look ＋ 形容詞","stage1":{"question":"look や become などのあとに形容詞が続く文を説明してください。","points":[{"id":"p1","text":"look＋形容詞で「〜に見える」という意味を表す"},{"id":"p2","text":"become＋名詞・形容詞で「〜になる」、get＋形容詞で「〜になる」という意味を表す"},{"id":"p3","text":"sound＋形容詞は「〜に聞こえる・〜そうだ」、feel＋形容詞は「〜に感じる」という意味"},{"id":"p4","text":"これらの動詞のあとの形容詞は主語の様子を表し、主語＝形容詞の関係になる"},{"id":"p5","text":"look のあとに名詞を置くときは look like＋名詞（〜のように見える）にする"}],"model":"look＋形容詞で「〜に見える」、become や get＋形容詞で「〜になる」、sound＋形容詞で「〜に聞こえる」、feel＋形容詞で「〜に感じる」という意味です。あとの形容詞は主語の様子を表し、主語＝形容詞の関係になります。名詞を続けて「〜のように見える」と言うときは look like を使います。"},"stage2":{"questions":[{"type":"choice","text":"You look ( ) today.","options":["happy","happily","happiness"],"answer":"happy"},{"type":"choice","text":"That ( ) great!","options":["sounds","looks at","hears"],"answer":"sounds"},{"type":"choice","text":"She became a ( ).","options":["doctor","doctorly","to doctor"],"answer":"doctor"},{"type":"choice","text":"It's getting ( ).","options":["dark","darkly","darkness"],"answer":"dark"},{"type":"choice","text":"That cloud looks ( ) a fish.","options":["like","as","to"],"answer":"like"},{"type":"choice","text":"I feel ( ) now.","options":["sick","sickly","sickness"],"answer":"sick"},{"type":"order","words":["your","sister","looks","very","young"],"answer":"Your sister looks very young."},{"type":"order","words":["he","became","famous","after","the","movie"],"answer":"He became famous after the movie."},{"ty  a letter ( ) him.","options":["to","for","with"],"answer":"to"},{"type":"choice","text":"Ms. Sato teaches ( ) English.","options":["us","we","our"],"answer":"us"},{"type":"choice","text":"Can you tell me ( ) way to the station?","options":["the","a","an"],"answer":"the"},{"type":"order","words":["my","mother","bought","me","a","new","bike"],"answer":"My mother bought me a new bike."},{"type":"order","words":["please","tell","me","your","phone","number"],"answer":"Please tell me your phone number."},{"type":"transform","text":"He gave me a pen.","instruction":"to を使って書きかえよう","answers":["He gave a pen to me."]},{"type":"transform","text":"My aunt made a dress for me.","instruction":"〈動詞＋人＋もの〉の文に書きかえよう","answers":["My aunt made me a dress."]}]},"stage3":{"questions":[{"ja":"父は私に時計をくれました。","answers":["My father gave me a watch.","My father gave a watch to me."]},{"ja":"あなたのノートを私に見せてください。","answers":["Please show me your notebook.","Show me your notebook, please."]},{"ja":"佐藤先生は私たちに英語を教えています。","answers":["Ms. Sato teaches us English.","Mr. Sato teaches us English.","Ms. Sato teaches English to us."]},{"ja":"母は私にケーキを作ってくれました。","answers":["My mother made me a cake.","My mother made a cake for me."]},{"ja":"私はおじに手紙を送りました。","answers":["I sent my uncle a letter.","I sent a letter to my uncle."]},{"ja":"駅への道を教えてくれますか。","answers":["Can you tell me the way to the station?","Will you tell me the way to the station?","Could you tell me the way to the station?"]},{"ja":"彼は彼女に花を買いました。","answers":["He bought her some flowers.","He bought flowers for her.","He bought her flowers."]},{"ja":"私にその写真を見せてください。","answers":["Please show me the picture.","Show me the picture, please.","Please show me the photo."]}]},"stage4":{"questions":[{"ja":"私にペンを貸してください。","answers":["Please lend me a pen.","Lend me a pen, please.","Please lend me your pen."]},{"ja":"彼は私に本をくれました。","answers":["He gave me a book.","He gave a book to me."]},{"ja":"あなたの名前を教えてください。","answers":["Please tell me your name.","Tel

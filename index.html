","for","of"],"answer":"to"},{"type":"order","words":["can","you","show","me","how","to","play","this","game"],"answer":"Can you show me how to play this game?","hint":"疑問文"},{"type":"order","words":["I","don't","know","what","to","buy","for","her"],"answer":"I don't know what to buy for her."},{"type":"transform","text":"I don't know. What should I do?","instruction":"疑問詞＋to を使って1つの文にしよう","answers":["I don't know what to do.","I do not know what to do."]}]},"stage3":{"questions":[{"ja":"私はこのコンピューターの使い方を知っています。","answers":["I know how to use this computer."]},{"ja":"私は何と言えばよいかわかりませんでした。","answers":["I did not know what to say.","I didn't know what to say."]},{"ja":"どこへ行けばよいか教えてください。","answers":["Please tell me where to go.","Tell me where to go, please."]},{"ja":"あなたはケーキの作り方を知っていますか。","answers":["Do you know how to make a cake?","Do you know how to make cakes?"]},{"ja":"いつ出発すればよいか教えてください。","answers":["Please tell me when to start.","Please tell me when to leave."]},{"ja":"私は彼女のために何を買えばよいかわかりません。","answers":["I do not know what to buy for her.","I don't know what to buy for her."]},{"ja":"駅への行き方を教えてくれますか。","answers":["Can you tell me how to get to the station?","Could you tell me how to get to the station?","Can you tell me how to go to the station?"]},{"ja":"彼は私にピアノの弾き方を教えてくれました。","answers":["He taught me how to play the piano."]}]},"stage4":{"questions":[{"ja":"私は泳ぎ方を知っています。","answers":["I know how to swim."]},{"ja":"私は何をすればよいかわかりません。","answers":["I do not know what to do.","I don't know what to do."]},{"ja":"どこで降りればよいか教えてください。","answers":["Please tell me where to get off.","Tell me where to get off, please."]},{"ja":"私に料理のしかたを教えてください。","answers":["Please teach me how to cook.","Please tell me how to cook."]},{"ja":"いつ来ればよいか教えてください。","answers":["Please tell me when to come."]}]}},{"id":"it1","grade":2,"title":"It is ～ (for 人) to ...","short":"It is ～ to ...","stage1":{"question":"It is〜 (for 人) to... の文を説明してください。","points":[{"id":"p1","text":"It is＋形容詞＋to＋動詞の原形で「…す u read this book?","options":["have","did","are"],"answer":"have"},{"type":"order","words":["I","have","been","to","Australia","once"],"answer":"I have been to Australia once."},{"type":"order","words":["have","you","ever","played","the","guitar"],"answer":"Have you ever played the guitar?","hint":"疑問文"},{"type":"transform","text":"I visit Nara.","instruction":"「2回訪れたことがある」という文にしよう（twice を使う）","answers":["I have visited Nara twice."]},{"type":"transform","text":"He has seen a panda.","instruction":"疑問文にしよう（ever を使う）","answers":["Has he ever seen a panda?"]}]},"stage3":{"questions":[{"ja":"私は以前その映画を見たことがあります。","answers":["I have seen the movie before.","I have seen that movie before.","I have watched the movie before."]},{"ja":"彼女は京都を3回訪れたことがあります。","answers":["She has visited Kyoto three times.","She has been to Kyoto three times."]},{"ja":"あなたは今までに沖縄に行ったことがありますか。","answers":["Have you ever been to Okinawa?"]},{"ja":"私は一度も海外に行ったことがありません。","answers":["I have never been abroad.","I have never been to a foreign country."]},{"ja":"彼は今までに富士山に登ったことがありますか。—はい、あります。","answers":["Has he ever climbed Mt. Fuji? Yes, he has."]},{"ja":"私はパンダを一度見たことがあります。","answers":["I have seen a panda once."]},{"ja":"あなたは何回その本を読んだことがありますか。","answers":["How many times have you read the book?","How many times have you read that book?"]},{"ja":"私は一度もすしを食べたことがありません。","answers":["I have never eaten sushi."]}]},"stage4":{"questions":[{"ja":"私は北海道に行ったことがあります。","answers":["I have been to Hokkaido."]},{"ja":"あなたは今までにギターを弾いたことがありますか。","answers":["Have you ever played the guitar?"]},{"ja":"私は一度もそれを見たことがありません。","answers":["I have never seen it."]},{"ja":"彼女は2回ここに来たことがあります。","answers":["She has come here twice.","She has been here twice."]},{"ja":"私はその本を読んだことがあります。","answers":["I have read the book.","I have read that book."]}]}},{"id":"pf2","grade":3,"title":"現在完了形（継続）","short":"現在完了（継続）","stage1":{"question":"現在完了形の「継続」の用法を説明してください。","points":[{"id":"p1","text":"継続の用法は「（ずっと）〜している」という、過去から今まで続いている状態を表す"},{"id":"p2","text":"形は have / has＋過去分詞"},{"id":"p3","text":"for＋期間（〜の間）、since＋始まった時（〜から・〜以来）といっしょによく使う"},{"id":"p4","text":"期間をたずねるときは How long have you〜? を使う"},{"id":"p5","text":"live, know, be, want など、状態を表す動詞によく使う"}],"model":"継続の用法は、have か has＋過去分詞で「ずっと〜している」という、過去から今まで続いている状態を表します。for three years のように for＋期間、since 2020 のように since＋始まった時をよく使います。期間をたずねるときは How long have you〜? を使います。live や know のような状態を表す動詞によく使います。"},"stage2":{"questions":[{"type":"choice","text":"I have lived here ( ) ten years.","options":["for","since","from"],"answer":"for"},{"type":"choice","text":"She has been busy ( ) last week.","options":["since","for","from"],"answer":"since"},{"type":"choice","text":"How ( ) have you known him?","options":["long","many","much"],"answer":"long"},{"type":"choice","text":"We have ( ) friends since we were children.","options":["been","are","were"],"answer":"been"},{"type":"choice","text":"He ( ) wanted a dog for a long time.","options":["has","have","is"],"answer":"has"},{"type":"choice","text":"No, I ( ).","options":["haven't","don't","didn't"],"answer":"haven't","context":"Have you lived in Hiroshima for a long time?"},{"type":"order","words":["I","have","known","her","for","five","years"],"answer":"I have known her for five years."},{"type":"order","words":["how","long","have","you","been","in","Japan"],"answer":"How long have you been in Japan?","hint":"疑問文"},{"type":"transform","text":"I live in Osaka.","instruction":"「2015年から住んでいる」という文にしよう（since 2015 を使う）","answers":["I have lived in Osaka since 2015."]}]},"stage3":{"questions":[{"ja":"私は10年間ここに住んでいます。","answers":["I have lived here for ten years."]},{"ja":"彼女は先週からずっと忙しいです。","answers":["She has been busy since last week."]},{"ja":"あなたはどのくらいの間、彼を知っていますか。","answers":["How long have you known him?"]},{"ja":"私たちは子どものころからずっと友達です。","answers":["We have been friends since we were children.","We have been friends since we were little."]},{"ja":"彼は長い間、犬をほしがっています。","answers":["He has wanted a dog for a long time."]},{"ja":"私は昨日からずっと具合が悪いです。","answers":["I have been sick since yesterday."]},{"ja":"あなたはどのくらい日本にいますか。—3年間です。","answers":["How long have you been in Japan? For three years."]},{"ja":"私の兄は5年間テニス部に入っています。","answers":["My brother has been on the tennis team for five years.","My brother has been in the tennis club for five years.","My brother has been a member of the tennis club for five years."]}]},"stage4":{"questions":[{"ja":"私は3年間ここに住んでいます。","answers":["I have lived here for three years."]},{"ja":"彼女は朝からずっと忙しいです。","answers":["She has been busy since this morning."]},{"ja":"あなたはどのくらいここにいますか。","answers":["How long have you been here?"]},{"ja":"私は彼を長い間知っています。","answers":["I have known him for a long time."]},{"ja":"私たちは2020年から友達です。","answers":["We have been friends since 2020."]}]}},{"id":"pf3","grade":3,"title":"現在完了形（完了）","short":"現在完了（完了）","stage1":{"question":"現在完了形の「完了」の用法を説明してください。","points":[{"id":"p1","text":"完了の用法は「（ちょうど・もう）〜してしまった・〜したところだ」という意味を表す"},{"id":"p2","text":"形は have / has＋過去分詞"},{"id":"p3","text":"just（ちょうど）、already（もう・すでに）を have と過去分詞の間に置くことが多い"},{"id":"p4","text":"疑問文の「もう〜しましたか」、否定文の「まだ〜していない」には yet を文の最後に置く"},{"id":"p5","text":"yesterday や ago など、はっきり過去を表す語とはいっしょに使わない"}],"model":"完了の用法は、have か has＋過去分詞で「ちょうど〜したところだ」「もう〜してしまった」という意味を表します。just や already は have と過去分詞の間に置きます。疑問文の「もう〜しましたか」や否定文の「まだ〜していない」は、文の最後に yet を置きます。yesterday のような過去をはっきり表す語とはいっしょに使いません。"},"stage2":{"questions":[{"type":"choice","text":"I have just ( ) my homework.","options":["finished","finish","finishing"],"answer":"finished"},{"type":"choice","text":"She has ( ) eaten lunch.","options":["already","yet","ever"],"answer":"already"},{"type":"choice","text":"Have you cleaned your room ( )?","options":["yet","already","just"],"answer":"yet"},{"type":"choice","text":"The train ( ) just left.","options":["has","have","is"],"answer":"has"},{"type":"choice","text":"I haven't read the book ( ).","options":["yet","already","just"],"answer":"yet"},{"type":"choice","text":"No, he ( ).","options":["hasn't","doesn't","didn't"],"answer":"hasn't","context":"Has he come home yet?"},{"type":"order","words":["I","have","already","done","my","homework"],"answer":"I have already done my homework."},{"type":"order","words":["have","you","washed","the","dishes","yet"],"answer":"Have you washed the dishes yet?","hint":"疑問文"},{"type":"transform","text":"He has arrived at the station.","instruction":"疑問文にしよう（yet を使う）","answers":["Has he arrived at the station yet?"]},{"type":"transform","text":"I have finished my homework.","instruction":"「まだ〜していない」という文にしよう（yet を使う）","answers":["I have not finished my homework yet.","I haven't finished my homework yet."]}]},"stage3":{"questions":[{"ja":"私はちょうど宿題を終えたところです。","answers":["I have just finished my homework."]},{"ja":"彼女はもう昼ごはんを食べてしまいました。","answers":["She has already eaten lunch.","She has already had lunch."]},{"ja":"あなたはもう部屋をそうじしましたか。","answers":["Have you cleaned your room yet?"]},{"ja":"電車はちょうど出発したところです。","answers":["The train has just left."]},{"ja":"私はまだその本を読んでいません。","answers":["I have not read the book yet.","I haven't read the book yet."]},{"ja":"彼はもう家に帰ってきましたか。—いいえ、まだです。","answers":["Has he come home yet? No, not yet.","Has he come home yet? No, he has not."]},{"ja":"私はもう切符を買いました。","answers":["I have already bought the ticket.","I have already bought a ticket."]},{"ja":"私たちはちょうど駅に着いたところです。","answers":["We have just arrived at the station.","We have just got to the station."]}]},"stage4":{"questions":[{"ja":"私はちょうど昼ごはんを食べたところです。","answers":["I have just eaten lunch.","I have just had lunch."]},{"ja":"あなたはもう宿題をしましたか。","answers":["Have you done your homework yet?","Have you finished your homework yet?"]},{"ja":"彼はもう出発しました。","answers":["He has already left.","He has already started."]},{"ja":"私はまだそれを見ていません。","answers":["I have not seen it yet.","I haven't seen it yet."]},{"ja":"バスはちょうど来たところです。","answers":["The bus has just come.","The bus has just arrived."]}]}},{"id":"pfp","grade":3,"title":"現在完了進行形","short":"現在完了進行形","stage1":{"question":"現在完了進行形のルールを説明してください。","points":[{"id":"p1","text":"現在完了進行形は「（ずっと）〜し続けている」という、過去から今まで続いている動作を表す"},{"id":"p2","text":"形は have / has been＋動詞の ing 形"},{"id":"p3","text":"for＋期間、since＋始まった時といっしょによく使う"},{"id":"p4","text":"期間をたずねるときは How long have you been〜ing? を使う"},{"id":"p5","text":"状態を表す動詞（live, know など）は現在完了の継続、動作を表す動詞（study, run など）は現在完了進行形を使う"}],"model":"現在完了進行形は have か has been＋動詞の ing 形で、「ずっと〜し続けている」という、過去から今まで続いている動作を表します。for や since とよく使い、期間は How long have you been〜ing? でたずねます。know のような状態を表す動詞は現在完了の継続、study のような動作を表す動詞は現在完了進行形を使います。"},"stage2":{"questions":[{"type":"choice","text":"I have been ( ) for two hours.","options":["studying","studied","study"],"answer":"studying"},{"type":"choice","text":"It has ( ) raining since this morning.","options":["been","be","being"],"answer":"been"},{"type":"choice","text":"She ( ) been playing the piano since noon.","options":["has","have","is"],"answer":"has"},{"type":"choice","text":"How long have you been ( ) for the bus?","options":["waiting","waited","wait"],"answer":"waiting"},{"type":"choice","text":"They have been talking ( ) an hour.","options":["for","since","from"],"answer":"for"},{"type":"choice","text":"I have ( ) him for ten years.","options":["known","been knowing","knowing"],"answer":"known"},{"type":"order","words":["he","has","been","reading","a","book","since","lunch"],"answer":"He has been reading a book since lunch."},{"type":"order","words":["how","long","have","you","been","playing","the","game"],"answer":"How long have you been playing the game?","hint":"疑問文"},{"type":"transform","text":"I am waiting for him.","instruction":"「1時間ずっと待っている」という文にしよう（for an hour を使う）","answers":["I have been waiting for him for an hour."]}]},"stage3":{"questions":[{"ja":"私は2時間ずっと勉強しています。","answers":["I have been studying for two hours."]},{"ja":"今朝からずっと雨が降っています。","answers":["It has been raining since this morning."]},{"ja":"彼女は正午からずっとピアノを弾いています。","answers":["She has been playing the piano since noon."]},{"ja":"あなたはどのくらいバスを待っているのですか。","answers":["How long have you been waiting for the bus?"]},{"ja":"彼らは1時間ずっと話しています。","answers":["They have been talking for an hour.","They have been talking for one hour."]},{"ja":"私の弟は朝からずっとテレビを見ています。","answers":["My brother has been watching TV since this morning.","My little brother has been watching TV since this morning."]},{"ja":"私たちは3年間英語を勉強し続けています。","answers":["We have been studying English for three years."]},{"ja":"彼は昼ごはんのあとからずっと本を読んでいます。","answers":["He has been reading a book since lunch."]}]},"stage4":{"questions":[{"ja":"私は1時間ずっと走っています。","answers":["I have been running for an hour.","I have been running for one hour."]},{"ja":"昨日からずっと雪が降っています。","answers":["It has been snowing since yesterday."]},{"ja":"彼はずっと寝ています。","answers":["He has been sleeping."]},{"ja":"あなたはどのくらい待っているのですか。","answers":["How long have you been waiting?"]},{"ja":"私たちは朝からずっと働いています。","answers":["We have been working since this morning."]}]}},{"id":"pt1","grade":3,"title":"現在分詞の後置修飾","short":"現在分詞の修飾","stage1":{"question":"現在分詞が名詞を後ろから修飾するルールを説明してください。","points":[{"id":"p1","text":"動詞の ing 形（現在分詞）は「〜している」という意味で名詞を修飾できる"},{"id":"p2","text":"現在分詞が1語だけのときは名詞の前に置く（a sleeping baby）"},{"id":"p3","text":"現在分詞にほかの語句がつくときは、名詞の後ろに置く（the boy playing tennis）"},{"id":"p4","text":"修飾される名詞と ing 形の間には「名詞が〜している」という関係がある"},{"id":"p5","text":"〈名詞＋ing 形＋語句〉のまとまり全体が、文の主語や目的語になる"}],"model":"動詞の ing 形は「〜している」という意味で名詞を修飾できます。a sleeping baby のように1語だけなら名詞の前に置き、the boy playing tennis のように後ろに語句がつくときは名詞の後ろに置きます。名詞と ing 形の間には「名詞が〜している」という関係があります。"},"stage2":{"questions":[{"type":"choice","text":"The boy ( ) tennis is my brother.","options":["playing","played","plays"],"answer":"playing"},{"type":"choice","text":"Look at the ( ) baby.","options":["sleeping","slept","sleeps"],"answer":"sleeping"},{"type":"choice","text":"Do you know the girl ( ) under the tree?","options":["standing","stood","stands"],"answer":"standing"},{"type":"choice","text":"The man talking with Ken ( ) our teacher.","options":["is","are","am"],"answer":"is"},{"type":"choice","text":"I have a friend ( ) in Canada.","options":["living","lived","lives"],"answer":"living"},{"type":"choice","text":"Who is that woman ( ) the piano?","options":["playing","played","play"],"answer":"playing"},{"type":"order","words":["the","girl","reading","a","book","is","my","sister"],"answer":"The girl reading a book is my sister."},{"type":"order","words":["look","at","the","dog","running","in","the","park"],"answer":"Look at the dog running in the park."},{"type":"transform","text":"Look at the boy. He is swimming in the river.","instruction":"現在分詞を使って1つの文にしよう","answers":["Look at the boy swimming in the river."]}]},"stage3":{"questions":[{"ja":"テニスをしている男の子は私の兄です。","answers":["The boy playing tennis is my brother.","The boy who is playing tennis is my brother."]},{"ja":"眠っている赤ちゃんを見てください。","answers":["Look at the sleeping baby.","Please look at the sleeping baby."]},{"ja":"あなたは木の下に立っている女の子を知っていますか。","answers":["Do you know the girl standing under the tree?"]},{"ja":"ケンと話している男の人は私たちの先生です。","answers":["The man talking with Ken is our teacher.","The man talking to Ken is our teacher."]},{"ja":"私にはカナダに住んでいる友達がいます。","answers":["I have a friend living in Canada."]},{"ja":"ピアノを弾いているあの女の人はだれですか。","answers":["Who is that woman playing the piano?"]},{"ja":"公園で走っている犬を見て。","answers":["Look at the dog running in the park."]},{"ja":"ベンチに座っている男の子はトムです。","answers":["The boy sitting on the bench is Tom."]}]},"stage4":{"questions":[{"ja":"本を読んでいる女の子は私の妹です。","answers":["The girl reading a book is my sister.","The girl reading a book is my little sister."]},{"ja":"泣いている赤ちゃんを見て。","answers":["Look at the crying baby."]},{"ja":"歌っている男の子はだれですか。","answers":["Who is the boy singing?","Who is the singing boy?"]},{"ja":"走っている男の人は私の父です。","answers":["The man running is my father.","The running man is my father."]},{"ja":"私はあそこで泳いでいる男の子を知っています。","answers":["I know the boy swimming over there."]}]}},{"id":"pt2","grade":3,"title":"過去分詞の後置修飾","short":"過去分詞の修飾","stage1":{"question":"過去分詞が名詞を後ろから修飾するルールを説明してください。","points":[{"id":"p1","text":"過去分詞は「〜された・〜されている」という意味で名詞を修飾できる"},{"id":"p2","text":"過去分詞が1語だけのときは名詞の前に置く（a broken window）"},{"id":"p3","text":"過去分詞にほかの語句がつくときは、名詞の後ろに置く（a car made in Japan）"},{"id":"p4","text":"修飾される名詞と過去分詞の間には「名詞が〜される」という受け身の関係がある"},{"id":"p5","text":"「〜している」なら現在分詞、「〜される」なら過去分詞と使い分ける"}],"model":"過去分詞は「〜された」という意味で名詞を修飾できます。a broken window のように1語だけなら名詞の前、a car made in Japan のように語句がつくときは名詞の後ろに置きます。名詞と過去分詞の間には「名詞が〜される」という受け身の関係があります。「〜している」なら現在分詞、「〜される」なら過去分詞を使います。"},"stage2":{"questions":[{"type":"choice","text":"This is a car ( ) in Japan.","options":["made","making","makes"],"answer":"made"},{"type":"choice","text":"I have a book ( ) in English.","options":["written","writing","wrote"],"answer":"written"},{"type":"choice","text":"Look at the ( ) window.","options":["broken","breaking","broke"],"answer":"broken"},{"type":"choice","text":"The language ( ) in Brazil is Portuguese.","options":["spoken","speaking","speaks"],"answer":"spoken"},{"type":"choice","text":"The girl ( ) Aki is my friend.","options":["called","calling","calls"],"answer":"called"},{"type":"choice","text":"These are pictures ( ) by my father.","options":["taken","taking","took"],"answer":"taken"},{"type":"order","words":["this","is","a","temple","built","300","years","ago"],"answer":"This is a temple built 300 years ago."},{"type":"order","words":["I","want","a","bag","made","in","Italy"],"answer":"I want a bag made in Italy."},{"type":"transform","text":"This is a cake. My mother made it.","instruction":"過去分詞を使って「母によって作られたケーキ」という文にしよう","answers":["This is a cake made by my mother."]}]},"stage3":{"questions":[{"ja":"これは日本で作られた車です。","answers":["This is a car made in Japan."]},{"ja":"私は英語で書かれた本を持っています。","answers":["I have a book written in English."]},{"ja":"割れた窓を見てください。","answers":["Look at the broken window.","Please look at the broken window."]},{"ja":"ブラジルで話されている言語はポルトガル語です。","answers":["The language spoken in Brazil is Portuguese."]},{"ja":"これらは私の父によってとられた写真です。","answers":["These are pictures taken by my father.","These are photos taken by my father."]},{"ja":"これは300年前に建てられたお寺です。","answers":["This is a temple built three hundred years ago."]},{"ja":"彼は世界中で愛されている歌手です。","answers":["He is a singer loved all over the world.","He is a singer loved around the world."]},{"ja":"私はイタリアで作られたかばんがほしいです。","answers":["I want a bag made in Italy."]}]},"stage4":{"questions":[{"ja":"これは中国製のペンです。","answers":["This is a pen made in China."]},{"ja":"私はゆで卵が好きです。","answers":["I like boiled eggs."]},{"ja":"これは彼女によって書かれた手紙です。","answers":["This is a letter written by her."]},{"ja":"彼は中古車を買いました。","answers":["He bought a used car."]},{"ja":"これは多くの人に読まれている本です。","answers":["This is a book read by many people.","This is a book read by a lot of people."]}]}},{"id":"rl1","grade":3,"title":"関係代名詞 who（主格）","short":"関係代名詞 who","stage1":{"question":"関係代名詞 who の使い方を説明してください。","points":[{"id":"p1","text":"関係代名詞は、名詞を後ろから説明する文をつなぐ働きをする"},{"id":"p2","text":"説明される名詞（先行詞）が人のときは who を使う"},{"id":"p3","text":"〈人＋who＋動詞〜〉の語順で、who が後ろの文の主語の働きをする（主格）"},{"id":"p4","text":"who のあとの動詞は、先行詞の人数や時に合わせる（a boy who lives / boys who live）"}],"model":"関係代名詞は名詞を後ろから説明する文をつなぎます。説明される名詞が人のときは who を使い、a friend who lives in Tokyo のように〈人＋who＋動詞〉の語順にします。この who は後ろの文の主語の働きをします。who のあとの動詞は、先行詞の人数や時に合わせます。"},"stage2":{"questions":[{"type":"choice","text":"I have a friend ( ) lives in Osaka.","options":["who","which","what"],"answer":"who"},{"type":"choice","text":"The girl who ( ) speaking is Mai.","options":["is","are","am"],"answer":"is"},{"type":"choice","text":"He is a teacher who ( ) us English.","options":["teaches","teach","teaching"],"answer":"teaches"},{"type":"choice","text":"I know a boy who ( ) speak French.","options":["can","cans","is"],"answer":"can"},{"type":"choice","text":"The people who ( ) here are kind.","options":["live","lives","living"],"answer":"live"},{"type":"choice","text":"She is the stude const S1FILL = {"be1": ["be動詞（現在形）には{am@a}、{is@a}、{are@a}の3種類があり、{主語}が変わるとbe動詞の{形|種類}が変わる。", "主語が I のときは{am}、you や複数のときは{are}、I と you 以外の1人・1つ（単数）のときは{is}を使う。", "be動詞は「〜{です}」や「〜に{いる|ある}」という意味を表す。"], "be2": ["否定文は be動詞の{あと|後ろ}に{not}を置く。", "is not は{isn't}、are not は{aren't}と短くできる。", "疑問文は be動詞を{主語}の{前}に出し、最後に{クエスチョンマーク|?|はてなマーク}をつける。", "答えるときは Yes, 主語＋{be動詞}. ／ No, 主語＋be動詞＋{not}. を使う。"], "wh1": ["what は「{何}」をたずねるときに使い、文の{最初|はじめ}に置く。", "what のあとは、ふつうの{疑問文}の語順にする。", "答えるときは{Yes@a}や{No@a}ではなく、たずねられたことを{具体的}に答える。", "what＋{名詞}で「何の〜」「どんな〜」とたずねられる。"], "wh2": ["who は「{だれ}」、whose は「{だれの}（もの）」をたずねるときに使う。", "疑問詞は文の{最初|はじめ}に置き、そのあとは{疑問文}の語順にする。", "whose は後ろに{名詞}をつけて「だれの〜」とたずねることもできる。", "whose の質問には Ken's や{mine}のように「〜の（もの）」で答える。"], "pl1": ["2つ以上のものを表すときは、名詞を{複数形}にする。", "ふつうは語の終わりに{s}をつけ、s, x, sh, ch で終わる語には{es}をつける。", "〈子音字＋y〉で終わる語は、y を{i}にかえて{es}をつける。", "man → {men}、child → {children}のように不規則に変わる語もある。", "water などの{数えられない}名詞は複数形にしない。"], "ar1": ["a, an は数えられる名詞の{単数形}の前に置き、「{1つの|ひとつの}」という意味を表す。", "{母音}で始まる語の前では{an}を使う。", "the は、すでに話に出てきたものや、何を指すか{わかっている}ものにつける。", "the sun のように世界に{1つ|ひとつ}しかないものや、楽器を{演奏する}ときにも the を使う。"], "gv1": ["一般動詞は{be動詞}以外の動詞で、{動作@a}や{状態@a}を表す。", "語順は「{主語}＋{一般動詞}＋〜を（{目的語}）」。", "be動詞と一般動詞は1つの文で{いっしょに}使わない。", "主語が I や you のときは、動詞の形を{変えずに}使う。"], "gv2": ["否定文は動詞の{前}に{do not|don't}を置く。", "疑問文は文の{最初|はじめ}に{Do}を置く。", "否定文・疑問文でも、動詞は{原形}のまま。", "答えるときは Yes, 主語＋{do}. ／ No, 主語＋{don't}. を使う。"], "tp1": ["主語が I・you 以外の{単数}で、{現在}の文のときを「三人称単数現在」という。", "そのとき一般動詞の終わりに{s}をつける。", "s, x, sh, ch, o で終わる動詞には{es}をつける。", "〈子音字＋y〉で終わる動詞は、y を{i}にかえて{es}をつける。", "have は{has}になる。"], "tp2": ["否定文は動詞の前に{does not|doesn't}を置く。", "疑問文は文の{最初|はじめ}に{Does}を置く。", "does を使うときは、動詞を{原形}にする。", "答えるときは Yes, 主語＋{does}. ／ No, 主語＋{doesn't}. を使う。"], "pr1": ["代名詞は、文の中での{働き}によって形が変わる。", "「〜は」と主語になるときは I、「〜の」は{my}、「〜を・〜に」は{me}、「〜のもの」は{mine}を使う。", "he は his・{him}・his、she は{her}・her・{hers}と変わる。", "「〜の」の形の後ろには{名詞}が続く。"], "cn1": ["can は「〜{できる}」という意味を表す{助動詞}。", "can は動詞の{前}に置く。", "can のあとの動詞はいつも{原形}にする。", "主語が何であっても、can の形は{変わらない}。"], "cn2": ["否定文は can のあとに not を置き、{cannot@a}または{can't@a}にする。", "疑問文は can を{主語}の{前}に出す。", "答えるときは Yes, 主語＋{can}. ／ No, 主語＋{can't}. を使う。", "Can you〜? で「〜{してくれますか}」と頼み、Can I〜? で「〜{してもいいですか}」とたずねられる。"], "im1": ["命令文は{主語}を置かずに、動詞の{原形}で文を始める。", "be動詞の命令文は{Be}で始める。", "「〜してはいけない」は{Don't}＋動詞の原形で始める。", "{Please}をつけると、ていねいな言い方になる。", "「〜しよう」とさそうときは{Let's}＋動詞の原形を使う。"], "pg1": ["現在進行形は「（今）〜{している}」という、している{最中}の動作を表す。", "形は{be動詞}＋動詞の{ing形}。", "e で終わる動詞は{e}をとって ing をつける。", "run → {running}のように、最後の文字を{重ねる}動詞もある。", "like や know など{状態}を表す動詞は、ふつう進行形にしない。"], "pg2": ["否定文は be動詞の{あと|後ろ}に{not}を置く。", "疑問文は be動詞を{主語}の{前}に出す。", "答えるときは Yes, 主語＋{be動詞}. ／ No, 主語＋be動詞＋{not}. を使う。", "「何をしていますか」は What are you {doing}? でたずねる。"], "wh4": ["which は「{どちら|どれ}」、how は「{どのように|どうやって}」や「どんな様子」をたずねるときに使う。", "疑問詞は文の{最初|はじめ}に置き、そのあとは{疑問文}の語順にする。", "which＋{名詞}で「どちらの〜」とたずね、{A or B}で選ぶものを示せる。", "How do you go to school? は{手段}を、How are you? は{調子|様子}をたずねる。"], "wh3": ["where は「{どこ}」、when は「{いつ}」をたずねるときに使う。", "疑問詞は文の{最初|はじめ}に置き、そのあとは{疑問文}の語順にする。", "where には{場所}で、when には{時}で答える。"], "hm1": ["How many は{数}をたずねるときに使い、後ろに名詞の{複数形}を置く。", "How much は{値段|値段や量}をたずねるときに使う。", "How old は{年齢}や古さをたずねるときに使う。", "How many＋名詞のあとは、{疑問文}の語順にする。"], "ps1": ["過去のことを表すときは、動詞を{過去形}にする。", "規則動詞は、語の終わりに{ed}をつける。", "e で終わる動詞は{d}だけをつける。", "〈子音字＋y〉で終わる動詞は、y を{i}にかえて{ed}をつける。", "過去形は、主語が何でも{同じ}形。", "{yesterday@a}、{last@a}〜、〜{ago@a}など、過去を表す語といっしょに使うことが多い。"], "ps2": ["ed をつけずに、形が{不規則}に変わる動詞がある。", "go → {went}、see → {saw}、eat → {ate}、have → {had}。", "come → {came}、buy → {bought}、make → {made}。", "不規則動詞も、過去形は主語が何でも{同じ}形。", "read や cut のように、{形}は変わらない動詞もある。"], "ps3": ["否定文は動詞の前に{did not|didn't}を置く。", "疑問文は文の{最初|はじめ}に{Did}を置く。", "did を使うときは、動詞を{原形}にする。", "主語が何でも{did}を使う。", "答えるときは Yes, 主語＋{did}. ／ No, 主語＋{didn't}. を使う。"], "bp1": ["be動詞の過去形は{was@a}と{were@a}の2つ。", "am と is の過去形は{was}、are の過去形は{were}。", "否定文は was / were の{あと|後ろ}に{not}を置く。", "疑問文は was / were を{主語}の{前}に出す。"], "pp1": ["過去進行形は「（そのとき）〜{していた}」という、過去のある時点でしている最中の動作を表す。", "形は{was|was / wer me@a}、{him@a}、{her@a}などの形にする。"], "wt1": ["〈{疑問詞}＋to＋動詞の原形〉で、名詞と同じ働きをするまとまりを作る。", "how to〜 は「〜の{しかた}」という意味。", "what to〜 は「{何}を〜すればよいか」、where to〜 は「{どこ}へ〜すればよいか」、when to〜 は「{いつ}〜すればよいか」。", "{know@a}、{tell@a}、{show@a}などの動詞のあとに置くことが多い。"], "ot1": ["want＋人＋to〜 で「（人）に〜{してほしい}」という意味を表す。", "tell＋人＋to〜 で「（人）に〜するように{言う}」という意味を表す。", "ask＋人＋to〜 で「（人）に〜するように{頼む}」という意味を表す。", "人を表す代名詞は{me@a}、{him@a}、{her@a}などの形にする。", "to のあとの動詞は、いつも{原形}にする。"], "gr1": ["動詞の{ing形}で「〜{すること}」という意味を表すものを{動名詞}という。", "動名詞は動詞の{目的語@a}にも、文の{主語@a}にもなる。", "{前置詞}のあとに動詞を置くときは、動名詞にする。", "{enjoy@a}、{finish@a}、{stop@a}などのあとは、動名詞を使う。"], "gr2": ["{like@a}、{start@a}、{begin@a}などは、後ろに不定詞と動名詞の{どちらも}置ける。", "{want@b}、{hope@b}、{decide@b}などは、後ろに{不定詞}だけを置く。", "{enjoy@c}、{finish@c}、{stop@c}などは、後ろに{動名詞}だけを置く。", "stop＋動名詞は「〜するのを{やめる}」、stop to〜 は「〜するために{立ち止まる}」。"], "cj1": ["when は「〜する{とき}」、if は「もし〜{なら}」、because は「〜{なので}」という意味を表す。", "接続詞のあとには〈{主語@a}＋{動詞@a}〉が続く。", "when や if のまとまりを文の前に置くときは、間に{コンマ}を入れる。", "when や if のまとまりの中では、未来のことでも{現在形}を使う。"], "cj2": ["that＋主語＋動詞で「〜{ということ}」という意味のまとまりを作る。", "{think@a}、{know@a}、{hope@a}などの動詞のあとに置く。", "この that はよく{省略}される。", "前の動詞が過去形なら、that のあとの動詞もふつう{過去形}にそろえる。"], "lk1": ["look＋形容詞で「〜に{見える}」という意味を表す。", "{become@a}や{get@a}＋形容詞で「〜になる」という意味を表す。", "sound＋形容詞は「〜に{聞こえる}」、feel＋形容詞は「〜に{感じる}」という意味。", "これらの文では「{主語}＝{形容詞}」の関係になる。", "look のあとに名詞を置くときは、look {like}＋名詞にする。"], "sv1": ["{give@a}、{show@a}、{tell@a}などは、後ろに「{人}」と「{もの}」の2つを置ける。", "語順は〈動詞＋{人}＋{もの}〉で、「人に もの を〜する」という意味。", "〈動詞＋もの＋{to@c}／{for@c}＋人〉に書きかえられる。", "give や show は{to}、buy や make は{for}を使う。"], "sv2": ["call A B で「A を B と{呼ぶ}」という意味を表す。", "name A B で「A を B と{名づける}」という意味を表す。", "make A＋形容詞で「A を〜の状態に{する}」という意味を表す。", "A と B の間には「A{＝|イコール}B」の関係がある。"], "cp3": ["{as}＋形容詞・副詞の{原級}＋as で「…と{同じくらい}〜だ」という意味を表す。", "as と as の間には、er や est をつけない{元の形|原級}を置く。", "{not}as〜as で「…{ほど}〜ではない」という意味になる。"], "cp1": ["2つをくらべて「〜よりも…だ」と言うときは、形容詞・副詞を{比較級}にする。", "比較級はふつう、語の終わりに{er}をつける。", "比較級のあとに{than}（〜よりも）を置く。", "big は{bigger}、easy は{easier}になる。", "good と well の比較級は{better}。"], "c /* ---------- 英文の正規化（音声認識の結果と正解を比べるため） ---------- */
const NUM_WORDS = ["zero", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen", "twenty"];
const CONTRACTIONS = [
  [/\bi'?m\b/g, "i am"], [/\byou'?re\b/g, "you are"], [/\bwe're\b/g, "we are"], [/\bthey'?re\b/g, "they are"],
  [/\b(he|she|it|that|what|who|where|this|there|here|how)'s\b/g, "$1 is"],
  [/\bisn'?t\b/g, "is not"], [/\baren'?t\b/g, "are not"], [/\bwasn'?t\b/g, "was not"], [/\bweren't\b/g, "were not"],
  [/\bdon'?t\b/g, "do not"], [/\bdoesn'?t\b/g, "does not"], [/\bdidn'?t\b/g, "did not"],
  [/\bcan't\b/g, "can not"], [/\bcannot\b/g, "can not"], [/\bwon't\b/g, "will not"],
  [/\bi'll\b/g, "i will"], [/\byou'll\b/g, "you will"], [/\blet's\b/g, "let us"]
];
function normalize(s) {
  let t = String(s || "").toLowerCase().replace(/[’‘`´]/g, "'");
  t = t.replace(/\b([a-z])\.([a-z])\.?/g, "$1$2"); // T.V. → tv
  for (const [re, rep] of CONTRACTIONS) t = t.replace(re, rep);
  t = t.replace(/\b\d+\b/g, (n) => NUM_WORDS[+n] || n);
  t = t.replace(/[^a-z0-9' ]+/g, " ").replace(/'/g, "").replace(/\s+/g, " ").trim();
  return t;
}
const matchesAny = (cands, answers) => {
  const A = answers.map(normalize);
  return cands.some((c) => c && A.includes(normalize(c)));
};
function stage2Answers(q) {
  if (q.type === "choice") return [q.text.replace("( )", q.answer), q.answer];
  if (q.type === "order") return [q.answer];
  return q.answers;
}

/* ---------- 進捗の計算（記録から各項目・各段階の合格を求める） ---------- */
function computeProgress(results) {
  const p = {};
  for (const r of results) {
    if (!(r.stage >= 1 && r.stage <= 4)) continue; // 復習（段階0）は数えない
    const it = (p[r.itemId] = p[r.itemId] || { passed: [false, false, false, false], passCount: [0, 0, 0, 0], best: [0, 0, 0, 0], attempts: [0, 0, 0, 0] });
    const i = r.stage - 1;
    it.attempts[i]++;
    if (r.passed) { it.passed[i] = true; it.passCount[i]++; }
    const ratio = r.total ? r.score / r.total : 0;
    if (ratio > it.best[i]) it.best[i] = ratio;
  }
  return p;
}

const LEVELS = [[0, "10級"], [100, "9級"], [250, "8級"], [450, "7級"], [700, "6級"], [1000, "5級"], [1400, "4級"], [1900, "3級"], [2500, "2級"], [3200, "1級"],

function levelOf(xp) {
  let idx = 0;
  for (let i = 0; i < LEVELS.length; i++) if (xp >= LEVELS[i][0]) idx = i;

/* 記録から、スタンプカード・連続日数・バッジ・級・ポイントを計算する
   settings：先生の設定 ／ itemIds：教材の項目ID ／ extra：{ omDays, teacherStamps, spent, owned, hasAvatar } */
function computeRewards(history, settings, itemIds, extra) {
  const h = (history || []).slice().sort((a, b) => (String(a.timestamp) < String(b.timestamp) ? -1 : 1));
  const x = extra || {}, st = settings || {};
  const need = (s) => Math.max(1, Math.round(Number((st["stage" + s] || {}).requiredPasses) || 1));
  const days = Array.from(new Set(h.map((r) => dayKey(r.timestamp)))).sort();
  const nums = days.map(dayNum);
  let best = 0, run = 0, comeback = false;
  nums.forEach((n, k) => { run = k && n - nums[k - 1] === 1 ? run + 1 : 1; best = Math.max(best, run); if (k && n - nums[k - 1] >= 8) comeback = true; });
  const today = dayNum(dayKey(Date.now()));
  let streak = 0;
  if (nums.length && today - nums[nums.length - 1] <= 1) { streak = 1; for (let k = nums.length - 1; k > 0 && nums[k] - nums[k - 1] === 1; k--) streak++; }
  const perDay = {}; h.forEach((r) => { const k = dayKey(r.timestamp); perDay[k] = (perDay[k] || 0) + 1; });
  const weekend = days.some((d) => new Date(d + "T00:00:00").getDay() === 6 && days.indexOf(dayKey(new Date(d + "T00:00:00").getTime() + 86400000)) >= 0);
  const pc = {}, passedAll = {};
  h.forEach((r) => {
    const a = (pc[r.itemId] = pc[r.itemId] || [0, 0, 0, 0]), b = (passedAll[r.itemId] = passedAll[r.itemId] || [false, false, false, false]);
    if (r.passed && r.stage >= 1 && r.stage <= 4) { a[r.stage - 1]++; b[r.stage - 1] = true; }
  });
  const clearedOf = (id) => [1, 2, 3, 4].filter((s) => (pc[id] || [0, 0, 0, 0])[s - 1] >= need(s)).length;
  const ids = itemIds || [];
  const assigned = Array.isArray(st.assigned) ? ids.filter((id) => st.assigned.indexOf(id) >= 0) : ids;
  const xp = h.reduce((a, r) => a + recordXP(r), 0);
  const level = levelOf(xp);
  const c = {
    total: h.length, passes: h.filter((r) => r.passed).length,
    perfect: h.filter((r) => r.stage >= 2 && r.total > 0 && r.score === r.total).length,
    explain: h.some((r) => r.stage === 1 && r.total > 0 && r.score === r.total),
    quick: h.some((r) => (r.tags || []).indexOf("quick") >= 0),
    cleared: ids.reduce((a, id) => a + clearedOf(id), 0),
    allStages: ids.some((id) => passedAll[id] && passedAll[id].every(Boolean)),
    mastered: ids.filter((id) => clearedOf(id) === 4).length,
    assignAll: assigned.length > 0 && assigned.every((id) => clearedOf(id) === 4),
    early: h.some((r) => new Date(r.timestamp).getHours() < 7),
    maxPerDay: Math.max.apply(null, [0].concat(Object.keys(perDay).map((k) => perDay[k])))
  };
  const tests = {
    first: c.total >= 1, streak3: best >= 3, streak7: best >= 7, streak30: best >= 30, card1: days.length >= STAMPS_PER_CARD,
    clear1: c.cleared >= 1, explain: c.explain, perfect: c.perfect >= 1, perfect10: c.perfect >= 10, quick: c.quick,
    allStages: c.allStages, master1: c.mastered >= 1, master3: c.mastered >= 3, assignAll: c.assignAll,
    pass10: c.passes >= 10, pass50: c.passes >= 50, daily5: c.maxPerDay >= 5, early: c.early, weekend: weekend, comeback: comeback,
    rank5: level.index >= 5, shodan: level.index >= 10, omikuji: (Number(x.omDays) || 0) >= 1,
    teacher: (Number(x.teacherStamps) || 0) >= 1, avatar: !!x.hasAvatar, shop1: (x.owned || []).length >= 1
  };
  const badges = new Set(BADGES.filter((b) => tests[b.id]).map((b) => b.id));
  const earned = 10 * days.length + 3 * c.passes + 20 * badges.size + 30 * c.mastered + 5 * (Number(x.omDays) || 0) + 10 * (Number(x.teacherStamps) || 0);
  const spent = Math.max(0, Number(x.spent) || 0);
  return {
    days: days.length, todayDone: days.indexOf(dayKey(Date.now())) >= 0, streak: streak, bestStreak: best,
    cards: Math.floor(days.length / STAMPS_PER_CARD), onCard: days.length % STAMPS_PER_CARD,
    badges: badges, xp: xp, level: level, mastered: c.mastered, liveBest: Number(x.liveBest) || 0, masters: mastersDone(h).length,
    points: { earned: earned, spent: spent, avail: Math.max(0, earned - spent) }
  };
}

    const all = CONTENT.map((it, i) => [it, i]);
    const key = foldText(q);
    const hitQ = ([it]) => !key || foldText(it.title + " " + it.short + " " + gradeOf(it) + "-" + itemNo(it)).includes(key);
    const card = ([it, i], why) => itemCardHTML(it, i).replace('<span class="item-title">', `<span class="item-title">`).replace("</span><span class=\"dots\">", `${!isAssigned(it.id) || !free.length ? "" : `<span class="task-tag">📌課題</span>`}${why ? `<span class="why">${esc(why)}</span>` : ""}</span><span class="dots">`);

        why = ([it]) => `最後に練習：${fmtDate(lastAt[it.id])}`;
      }
      const empty = { todo: "未クリアの文法はありません。すごい！", weak: "いまは苦手な文法はありません。", recent: "まだ練習した文法がありません。", all: "見つかりませんでした。" }[mode];
      html = `<p class="free-count">${L.length ? `${L.length}こ` : ""}</p><div class="items">${L.map((x) => card(x, why(x))).join("") || `<p class="center hint">${key ? "見つかりませんでした。ほかのことばでさがしてみよう。" : empty}</p>`}</div>`;

    $$(".free-chips button").forEach((x) => x.classList.toggle("on", x === b)); draw();
  }));
  draw();
}

    <div id="pmCrop" class="pm-crop hidden">
      <p class="hint">画像を指でうごかして位置を、つまみで大きさを決めよう。丸の中がアバターになります。</p>
      <label class="pm-zoom">🔍 <input type="range" id="pmZoom" min="1" max="4" step="0.01" value="1"></label>
      <div class="btn-row center"><button class="btn primary" id="pmCropOk">この位置で決める</button><button class="btn" id="pmCropCancel">やめる</button></div>
    </div>
    <div id="pmTools" class="pm-tools">

        <button type="button" class="pm-btn" id="pmEraser">🧽 消しゴム</button>
        <button type="button" class="pm-btn" id="pmFill">🪣 ぬりつぶし</button>
      </div>
      <div class="pm-row">
        <button type="button" class="pm-btn" id="pmUndo">↩ もどす</button>
        <button type="button" class="pm-btn" id="pmClear">🗑 ぜんぶ消す</button>
        <button type="button" class="pm-btn" id="pmPhoto">🖼️ 画像を取りこむ</button>
        <input type="file" id="pmFile" accept="image/*" class="hidden">
      </div>
      <p class="hint">人の顔の写真や、ほかの人がかいた絵・キャラクターの絵は使わないでね。先生が確認してから、みんなに見えるようになります。</p>
      <div class="btn-row center"><button class="btn primary big" id="pmDone">このアバターにする</button><button class="btn" id="pmCancel">やめる</button></div>
      <div class="msg ng" id="pmErr"></div>
    </div></div>`;
  const cv = $("#pmCanvas", el), cx = cv.getContext("2d");
  cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, N, N);
  let color = PEN_COLORS[0], width = 14, tool = "pen", undo = [], drawing = false, last = null, crop = null;
  const snap = () => { undo.push(cx.getImageData(0, 0, N, N)); if (undo.length > 25) undo.shift(); };
  const pos = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * N / r.width, y: (e.clientY - r.top) * N / r.height }; };

    const t = [d[i0], d[i0 + 1], d[i0 + 2]], n = parseInt(hex.slice(1), 16), c = [(n >> 16) & 255, (n >> 8) & 255, n & 255];

    const near = (k) => Math.abs(d[k] - t[0]) + Math.abs(d[k + 1] - t[1]) + Math.abs(d[k + 2] - t[2]) < 90;

  function drawCrop() {

  $("#pmCropOk", el).onclick = () => { crop = null; $("#pmCrop", el).classList.add("hidden"); $("#pmTools", el).classList.remove("hidden"); };
  $("#pmCropCancel", el).onclick = () => { crop = null; if (undo.length) cx.putImageData(undo.pop(), 0, 0); $("#pmCrop", el).classList.add("hidden"); $("#pmTools", el).classList.remove("hidden"); if (mode === "photo" && !undo.length) {} };
  $$(".pm-color", el).forEach((b) => (b.onclick = () => { color = b.dataset.c; if (tool === "eraser") setTool("pen"); $$(".pm-color", el).forEach((x) => x.classList.toggle("active", x === b)); }));
  $$(".pm-size", el).forEach((b) => (b.onclick = () => { width = +b.dataset.w; if (tool === "fill") setTool("pen"); $$(".pm-size", el).forEach((x) => x.classList.toggle("active", x === b)); }));
  $("#pmEraser", el).onclick = () => setTool(tool === "eraser" ? "pen" : "eraser");
  $("#pmFill", el).onclick = () => setTool(tool === "fill" ? "pen" : "fill");
  $("#pmUndo", el).onclick = () => { if (undo.length) cx.putImageData(undo.pop(), 0, 0); };
  $("#pmClear", el).onclick = () => { snap(); cx.fillStyle = "#ffffff"; cx.fillRect(0, 0, N, N); };
  $("#pmPhoto", el).onclick = () => $("#pmFile", el).click();

  const close = () => el.remove();
  $("#pmCancel", el).onclick = close;
  $("#pmDone", el).onclick = async (e) => {
    const out = document.createElement("canvas"); out.width = out.height = 160;

    catch (err) { $("#pmErr", el).textContent = err.message; e.target.disabled = false; }
  };

}

/* ===== おみくじ（これまでに取り組んだ問題に答えてから引く） =====
   正解なら大吉が出やすく（80%）、不正解なら大凶が出やすい（50%）。段階1の問題は出さない */
const FORTUNE_ODDS = { ok: [["大吉", 80], ["中吉", 10], ["小吉", 6], ["吉", 4]], ng: [["大凶", 50], ["凶", 25], ["吉", 15], ["小吉", 10]] };
const FORTUNE_CLS = { "大吉": "f0", "中吉": "f1", "小吉": "f2", "吉": "f3", "凶": "f4", "大凶": "f5" };
function drawFortune(correct) {
  const odds = FORTUNE_ODDS[correct ? "ok" : "ng"];
  let x = Math.random() * 100;
  for (const [name, w] of odds) { if (x < w) return name; x -= w; }
  return odds[0][0];
}
/* 出題する問題：段階2〜4で取り組んだことのある文法の、その段階の問題（まちがえたままの問題も入る） */
function omikujiPool() {
  const seen = new Set(), out = [];
  const add = (x) => { if (x && x.q && !seen.has(x.q.qid)) { seen.add(x.q.qid); out.push(x); } };
  (state.mistakes || []).forEach((m) => add(QINDEX[m.qid]));
  Object.values(QINDEX).forEach((x) => {
    if (x.set) return;
    const p = itemProg(x.it.id);
    if (p && p.attempts && p.attempts[x.stage - 1] > 0) add(x);
  });
  return out;
}
function renderOmikuji() {
  const O = window.OmikujiSet || { MESSAGES: {}, WORDS: [["star", "星"]], COLORS: [["red", "赤", "#e03131"]], ITEMS: [["pencil", "えんぴつ"]], LUCK: [], STARS: {} };
  const today = state.profile.omLast === dayKey(Date.now());
  const pool = omikujiPool();
  if (!pool.length) {
    render(`${header("おみくじ", true)}
      <main class="wrap"><section class="panel center">
        <div class="omikuji-box"><div class="omikuji-tube">🎋</div></div>
        <p>おみくじは、これまでに練習した<b>段階2〜4の問題</b>から1問出て、正解するとよい運勢が出やすくなります。</p>
        <p class="hint">まずは「自由練習」や課題で、段階2の練習をしてみよう！</p>
        <button class="btn primary" id="omHome">ホームへ</button></section>${footerNote()}</main>`);
    bindBack(renderHome);
    $("#omHome").onclick = renderHome;
    return;
  }
  const x = pool[Math.floor(Math.random() * pool.length)];
  const st = x.stage === 2 ? 2 : 3; // 段階4の問題も時間制限なしで出す
  const q = Object.assign({ grammar: x.it.title }, x.q);
  render(`${header("おみくじ", true)}
    <main class="wrap">
      <p class="hint om-q-note">これまでに取り組んだ問題から1問！ 正解すると<b>大吉</b>が出やすくなるよ。${today ? "" : "今日はじめてのおみくじで +5pt！"}</p>
      <div class="om-odds"><span>⭕ 正解 → 大吉 80%</span><span>❌ 不正解 → 大凶 50%</span></div>
      <div class="review-tag">${esc(x.it.short)}・段階${x.stage}の問題</div>
      ${questionCard(q, st)}
      ${answerBlock({ lang: "en-US", placeholder: "マイクをタップして英語で言おう", multiline: false })}
      <div id="result"></div>
      ${footerNote()}
    </main>`);
  bindBack(renderHome);
  const ctl = mountAnswer({ lang: "en-US", continuous: false, confirm: state.settings.confirmBeforeSubmit, onSubmit: (ans) => judgeOmikuji(q, st, ans, ctl, O) });
}
async function judgeOmikuji(q, st, ans, ctl, O) {
  ctl.disable();
  const res = $("#result");
  let correct = false, model = "", feedback = "";
  const said = ans.alts.concat([ans.text]);
  if (st === 2) { correct = matchesAny(said, stage2Answers(q)); model = stage2Model(q); }
  else if (matchesAny(said, q.answers)) { correct = true; model = q.answers[0]; }
  else {
    res.innerHTML = `<div class="judging"><span class="spinner"></span>判定しています…</div>`;
    try { const r = await api.judge(buildTranslateRequest(q, q.grammar, ans.text)); correct = !!r.correct; model = r.corrected || q.answers[0]; feedback = r.feedback || ""; }
    catch (e) { model = q.answers[0]; feedback = "AIで判定できなかったので、正解例と同じかどうかで判定しました。"; }
  }
  res.innerHTML = `<div class="panel center">
    <div class="om-verdict ${correct ? "ok" : "ng"}">${correct ? "⭕ 正解！ 大吉のチャンス！" : "❌ ざんねん…"}</div>
    <div class="model-line"><span>正しい英文</span><div class="model-row"><b>${esc(model)}</b><button class="listen" id="omListen" aria-label="お手本を聞く">🔊 お手本</button></div></div>
    ${feedback ? `<div class="feedback">${esc(feedback)}</div>` : ""}
    <button class="btn primary big" id="omDraw">🎋 おみくじを引く</button></div>`;
  $("#omListen").onclick = () => speak(model, "en-US");
  $("#omDraw").onclick = () => drawOmikuji(drawFortune(correct), O);
}
async function drawOmikuji(fortune, O) {
  const box = $("#result");
  box.innerHTML = `<div class="omikuji-box shake"><div class="omikuji-tube">🎋</div></div><div class="hint center">カラカラ…</div>`;

/* 練習・交換などのあとに、新しくもらったものをお知らせする */
function rewardGifts(before) {
  const after = rewardState(state.history);
  const gifts = [];
  if (after.days > before.days) gifts.push({ big: "🐾", title: "今日のスタンプ！", text: after.onCard === 0 ? `スタンプカードが1枚うまりました（${after.cards}枚目）` : `スタンプカード ${after.onCard} / ${STAMPS_PER_CARD}` + (after.streak >= 2 ? `　🔥${after.streak}日連続` : "") });
  if (after.level.index > before.level.index) gifts.push({ big: "🥋", title: `${after.level.name}に昇級！`, text: `けいけん値 ${after.xp}。新しいキャラクターやアイテムが使えるようになるかも！` });
  const oldKeys = new Set(before.autoStamps.map((s) => s.key));
  after.autoStamps.filter((s) => !oldKeys.has(s.key)).forEach((s) => (s.rule === "boss" ? gifts.unshift({ html: stampArt(s.design, 220), title: "👑 伝説のスタンプをもらいました！", text: s.note }) : gifts.push({ html: stampArt(s.design, 160), title: "スタンプをもらいました！", text: s.note }))); // ラスボスのスタンプはいちばん先に
  BADGES.filter((b) => after.badges.has(b.id) && !before.badges.has(b.id)).forEach((b) => gifts.push({ big: b.ico, title: "バッジ「" + b.name + "」", text: b.desc + "（+20pt）" }));
  const newItems = AVATAR_SET.list.filter((it) => after.unlocked.has(it.id) && !before.unlocked.has(it.id) && !shopPrice(it.un));
  const newThemes = THEMES.filter((t) => after.unlocked.has(t.id) && !before.unlocked.has(t.id) && !shopPrice(t.un));
  if (newItems.length || newThemes.length) {
    const av = state.profile.avatar || { b: "cat", bg: "bg_sky" };
    gifts.push({ html: `<div class="gift-items">${newItems.slice(0, 6).map((it) => { const a = Object.assign({}, av, { [it.k]: it.id }); if (it.k === "b") delete a.mk; return avatarHTML(a, 72); }).join("")}${newThemes.map((t) => `<span class="swatch big" style="background:${t.c}"></span>`).join("")}</div>`,
      title: "新しい着せ替えが使えるようになりました！", text: newItems.concat(newThemes).map((x) => x.name).join("、") });
  }
  showGifts(gifts);
  return { gained: after.points.avail - before.points.avail, after };
}

function answerBlock({ lang, placeholder, multiline }) {
  const textOnly = !speechAvailable;
  return `<div class="answer">
    <div class="transcript" id="transcript" aria-live="polite"><span class="ph">${esc(placeholder)}</span></div>
    <div class="mic-row">

      <div class="mic-hint" id="micHint">${textOnly ? "" : (lang.startsWith("ja") ? `タップして話そう。話し終わって${state.settings.stage1.silenceSec}秒たつと自動で判定します` : "タップして英語で話そう")}</div>
    </div>
    <div class="msg" id="msg"></div>
    <div class="confirm hidden" id="confirmRow">
      <button class="btn primary" id="submitBtn">これで答える</button>
      <button class="btn" id="retryBtn">言い直す</button>
    </div>
    ${state.settings.allowText || textOnly ? `<details class="text-in" ${textOnly ? "open" : ""}><summary>文字で入力する</summary>
      <div class="text-row">${multiline ? `<textarea id="textIn" rows="3" placeholder="ここに入力"></textarea>` : `<input id="textIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力">`}
      <button class="btn primary" id="textSubmit">答える</button></div></details>` : ""}
  </div>`;
}
/* マイク操作をまとめたコントローラ */
function mountAnswer({ lang, continuous, silenceSec, confirm, onSubmit, onSpeechStart }) {
  let current = { text: "", alts: [] };
  const tEl = $("#transcript"), mic = $("#micBtn"), msg = $("#msg"), conf = $("#confirmRow"), hint = $("#micHint");
  const hint0 = hint ? hint.textContent : "";
  const setText = (t, interim) => { tEl.innerHTML = t ? `<span class="${interim ? "interim" : ""}">${esc(t)}</span>` : `<span class="ph">…</span>`; };
  const setMsg = (m, cls) => { msg.textContent = m || ""; msg.className = "msg " + (cls || ""); };
  const hasText = !!$("#textIn");
  let listening = false, rec = null, byUser = false, t0 = 0, retries = 0, misses = 0, done = false;
  const alive = () => document.body.contains(tEl);
  const stopUI = () => { listening = false; if (mic) mic.classList.remove("on"); if (hint) hint.textContent = hint0; };
  // auto=true：何も聞こえなかったので、自動でもう一度聞き取る
  function start(auto) {
    if (!speechAvailable || done || !alive()) return;
    if (listening && rec && rec.active) return;
    if (!auto) { t0 = Date.now(); retries = 0; }
    byUser = false;
    setMsg(""); conf.classList.add("hidden");
    listening = true; if (mic) mic.classList.add("on");
    if (hint) hint.textContent = "聞いています…　話し終わったら、もう一度タップしても止まります";
    if (!auto) setText("", true);
    rec = activeRec = listen({
      lang, continuous, silenceSec,
      onSpeechStart: () => onSpeechStart && onSpeechStart(),
      onInterim: (t) => setText(t, true),
      onEnd: (res) => {
        if (activeRec === rec) activeRec = null;
        rec = null;
        if (!alive() || done) return;
        if (!res.text) {
          const err = res.error || "";
          // 何も聞こえなかったときは、25秒までは自動で聞き直す（タップし直さなくてよいように）
          if (!byUser && (!err || err === "no-speech" || err === "aborted") && retries < 4 && Date.now() - t0 < 25000) {
            retries++; listening = false; start(true); return;
          }
          stopUI(); setText("");
          misses++;
          setMsg((SR_ERRORS[err] || SR_ERRORS["no-speech"]) + (misses >= 2 && hasText ? "（「文字で入力する」でも答えられます）" : ""), err && err !== "no-speech" && err !== "aborted" ? "ng" : "warn");
          return;
        }
        stopUI(); misses = 0;
        current = res; setText(res.text, false);
        if (confirm) conf.classList.remove("hidden"); else { done = true; onSubmit(current, "voice"); }
      }
    });
  }
  function stop() { byUser = true; if (rec) rec.stop(); else stopUI(); }
  if (mic) mic.onclick = () => (listening && rec && rec.active ? stop() : start());
  $("#submitBtn").onclick = () => { conf.classList.add("hidden"); done = true; onSubmit(current, "voice"); };
  $("#retryBtn").onclick = () => { conf.classList.add("hidden"); setText(""); start(); };
  const ti = $("#textIn"), ts = $("#textSubmit");
  if (ti && ts) {
    let firstKey = true;
    ti.addEventListener("input", () => { if (firstKey) { firstKey = false; onSpeechStart && onSpeechStart(); } });
    const go = () => {
      const v = ti.value.trim();
      if (!v) { setMsg("答えを入力してから「答える」を押してね。", "warn"); ti.focus(); return; }
      if (rec) { byUser = true; rec.abort(); rec = null; stopUI(); }
      done = true; setText(v, false); onSubmit({ text: v, alts: [v] }, "text");
    };
    ts.onclick = go;
    if (ti.tagName === "INPUT") ti.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) go(); });
  }
  return {
    start, setMsg,
    disable() { done = true; if (rec) { rec.abort(); rec = null; } stopUI(); if (mic) mic.disabled = true; if (ti) ti.disabled = true; if (ts) ts.disabled = true; conf.classList.add("hidden"); },
  };
}

/* ===== 段階1：ルールの（　）をうめて読む（前の形式の教材は、ルールを説明する） ===== */
/* 段階1の問題カード（穴埋めの箇条書き／前の形式は質問文） */
function stage1Card(s1, note) {
  const f = s1Fill(s1);
  if (f) return `<section class="q-card s1">
        <div class="q-label">段階1・（　）をうめて読もう</div>
        ${s1FillHTML(f, "blank")}
        <div class="q-sub">${esc(s1.question || S1_QUESTION)}${note ? "　" + esc(note) : ""}</div>
      </section>`;
  return `<section class="q-card s1">
        <div class="q-label">段階1・ルールを説明</div>
        <div class="q-main ja">${esc(s1.question)}</div>
        <div class="q-sub">日本語で、できるだけくわしく説明しよう。${esc(note || "")}</div>
      </section>`;
}
function renderStage1(i) {
  if (useEleven()) return renderStage1Rec(i);
  renderStage1Browser(i);
}
async function judgeStage1(i, text, segAlts) {
  const it = CONTENT[i], f = s1Fill(it.stage1);
  // すべての（　）がその場でたしかめられたら、AI を待たずに合格
  if (f && s1LocalAllMet(s1LocalSpec(f), text)) return finishStage1(i, text, new Set(f.blanks.map((b) => b.id)), "", "local");
  $("#result").innerHTML = `<div class="judging"><span class="spinner"></span>判定しています…</div>`;
  let r;
  try { r = await api.judge(buildStage1Request(it, text, segAlts)); }
  catch (e) { return showSelfCheck(i, text, e.message); }
  const metIds = new Set((r.points || []).filter((p) => p.met).map((p) => p.id));
  finishStage1(i, text, metIds, r.feedback || "", "ai");
}
/* ElevenLabs で文字起こしする版（日本語と英語がまざっても聞き取れる） */
function renderStage1Rec(i) {
  const it = CONTENT[i], s1 = it.stage1;
  const sec = state.settings.stage1.silenceSec;
  render(`${header("段階1　" + it.short, true)}
    <main class="wrap">
      ${stage1Card(s1, "英単語はそのまま英語で言ってOK。")}
      <div class="answer">
        <div class="transcript" id="transcript" aria-live="polite"><span class="ph">${s1Fill(s1) ? "マイクをタップして、（　）をうめながら読もう" : "マイクをタップして説明しよう"}</span></div>
        <div class="mic-row">
          <button class="mic" id="micBtn" aria-label="話す"><span class="mic-ico"></span></button>
          <div class="mic-side">
            <div class="mic-hint" id="micHint">タップして話そう。話し終わって${sec}秒たつと自動で判定します</div>
            <div class="level hidden" id="level"><i id="levelBar"></i></div>
          </div>
        </div>
        <div class="msg" id="msg"></div>
        ${state.settings.allowText ? `<details class="text-in"><summary>文字で入力する</summary>
          <div class="text-row"><textarea id="textIn" rows="3" placeholder="ここに入力"></textarea>
          <button class="btn primary" id="textSubmit">答える</button></div></details>` : ""}
      </div>
      <div id="result"></div>
      ${footerNote()}
    </main>`, { keepMic: true });
  bindBack(() => renderItem(i));
  const mic = $("#micBtn"), tEl = $("#transcript"), msg = $("#msg"), hint = $("#micHint"), level = $("#level"), bar = $("#levelBar");
  const setMsg = (m, cls) => { msg.textContent = m || ""; msg.className = "msg " + (cls || ""); };
  let recording = null, busy = false;
  const ti = $("#textIn"), ts = $("#textSubmit");
  const lock = () => { mic.disabled = true; if (ti) ti.disabled = true; if (ts) ts.disabled = true; };
  const unlock = () => { busy = false; mic.disabled = false; mic.classList.remove("on", "wait"); level.classList.add("hidden"); if (ti) ti.disabled = false; if (ts) ts.disabled = false; };
  const again = (m, cls) => { unlock(); hint.textContent = "もう一度タップして話そう"; tEl.innerHTML = `<span class="ph">…</span>`; if (m) setMsg(m, cls || "warn"); };
  mic.onclick = async () => {
    if (busy) return;
    if (recording) { recording.stop(); mic.classList.add("wait"); hint.textContent = "止めています…"; return; }
    setMsg("");
    const ac = newAudioCtx(); // タップした瞬間に作る（iPad で音の大きさを調べるため）
    try {
      recording = startRecording({ silenceSec: sec, ac,
        onLevel: (v) => { bar.style.width = Math.round(v * 100) + "%"; },
        onNoLevel: () => { level.classList.add("hidden"); hint.textContent = "録音中…　話し終わったら、マイクをタップしてね"; } });
      mic.classList.add("on"); level.classList.remove("hidden");
      hint.textContent = "録音中…　話し終わると自動で止まります（タップでも止まります）";
      tEl.innerHTML = `<span class="ph">録音しています…</span>`;
      const r = await recording.done;
      if (busy) return; // 録音中に「文字で入力」で答えたとき
      recording = null; mic.classList.remove("on", "wait"); level.classList.add("hidden");
      if (r.cancelled) return again("");
      if (!r.spoke || r.blob.size < 1000) return again(SR_ERRORS["no-speech"] + (r.levelOk ? "（マイクに近づいて、はっきり話してみよう）" : ""));
      busy = true; lock();
      hint.textContent = "";
      tEl.innerHTML = `<span class="judging"><span class="spinner"></span>文字に起こして判定しています…</span>`;
      // 文字起こし → その場の判定 → （必要なときだけ）AI の判定 を、サーバーで1回の通信でまとめて行う
      const f = s1Fill(s1), PH = "\u0000書き起こし\u0000";
      const res = await api.transcribeJudge(r.blob, { req: buildStage1Request(it, PH, null), ph: PH, spec: f ? s1LocalSpec(f) : null });
      const text = res.text || "";
      if (!text) return again(SR_ERRORS["no-speech"]);
      tEl.innerHTML = `<span>${esc(text)}</span>`;
      if (res.local && f) return finishStage1(i, text, new Set(f.blanks.map((b) => b.id)), "", "local");
      if (res.judgeError || !res.judge) return showSelfCheck(i, text, res.judgeError || "判定できませんでした");
      finishStage1(i, text, new Set((res.judge.points || []).filter((p) => p.met).map((p) => p.id)), res.judge.feedback || "", "ai");
    } catch (e) {
      recording = null;
      const m = String(e && (e.name || "")).includes("NotAllowed") ? SR_ERRORS["not-allowed"] : ("聞き取りに失敗しました：" + (e.message || e));
      again(m + (ti ? "（文字で入力して答えることもできます）" : ""), "ng");
    }
  };
  if (ti && ts) ts.onclick = () => {
    const v = ti.value.trim();
    if (busy) return;
    if (!v) { setMsg("答えを入力してから「答える」を押してね。", "warn"); ti.focus(); return; }
    if (recording) { recording.stop(); recording = null; }
    busy = true; lock(); mic.classList.remove("on", "wait"); level.classList.add("hidden"); tEl.innerHTML = `<span>${esc(v)}</span>`; judgeStage1(i, v, null);
  };
}

async function finishStage1(i, text, metIds, feedback, by) {
  const it = CONTENT[i], s1 = it.stage1, f = s1Fill(s1);
  const pts = f ? f.points : s1.points;

    ${f ? `${s1FillHTML(f, "answer", metIds)}<p class="hint">緑は言えた（　）、赤は言えなかった（　）です。赤の言葉をおぼえて、もう一度読んでみよう。</p>`
      : `<ul class="points">${s1.points.map((p) => `<li class="${metIds.has(p.id) ? "met" : "miss"}">${metIds.has(p.id) ? "✓" : "✗"} ${esc(p.text)}</li>`).join("")}</ul>`}
    ${feedback ? `<div class="feedback">${esc(feedback)}</div>` : ""}

  await saveResult({ itemId: it.id, stage: 1, score, total, passed, details: [{ q: s1.question, a: text, met: Array.from(metIds), by }] });

/* ===== 記録の保存（待たずに次へ進める）=====
   1) まず端末の中で、進み具合・ポイント・スタンプを更新する（すぐに次へ進める）
   2) 記録は「送信待ち」として端末に保存し、うしろで送る。混み合って送れないときは、あとで自動で送り直す
      （アプリを開いたとき・次に記録するとき・ネットにつながったとき）。しるし rid があるので2回書きこまれない
   3) サーバーが受けつけなかった記録（条件を満たしていないなど）は、端末からも取り消す */
const pendingKey = () => "eg_pending_" + (state.email || "x");
const pendingList = () => lsGet(pendingKey(), []);
const newRid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const TRANSIENT_RE = /混み合って|通信できません|時間がかかりすぎ|サーバーの応答|ログイン/;
let syncRun = null;
function syncPending() {
  if (syncRun) return syncRun;
  syncRun = (async () => {
    let ok = true;
    while (pendingList().length) {
      const rec = pendingList()[0];
      try {
        await api.saveResult(rec);
        lsSet(pendingKey(), pendingList().filter((x) => x.rid !== rec.rid));
      } catch (e) {
        if (e instanceof AuthError || TRANSIENT_RE.test(e.message || "")) { ok = false; break; } // あとで送り直す
        // サーバーが受けつけなかった：端末の記録からも消す
        lsSet(pendingKey(), pendingList().filter((x) => x.rid !== rec.rid));
        state.history = state.history.filter((h) => h.rid !== rec.rid);
        state.progress = computeProgress(state.history);
        toast("記録できませんでした：" + e.message, 6000);
      }
    }
    syncRun = null;
    updateSyncBadge();
    return ok;
  })();
  return syncRun;
}
// 送信待ちがあるときは、画面の右下に小さく出す
function updateSyncBadge() {
  let el = document.getElementById("syncBadge");
  const n = MODE === "api" ? pendingList().length : 0;
  if (!n) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement("button"); el.id = "syncBadge"; el.className = "sync-badge"; el.onclick = () => { el.textContent = "送っています…"; syncPending(); }; document.body.appendChild(el); }
  el.textContent = `⏳ 送信待ちの記録 ${n}件（タップで送る）`;
}
window.addEventListener("online", () => { if (pendingList().length) syncPending(); });
setInterval(() => { if (MODE === "api" && state.email && pendingList().length && !syncRun) syncPending(); }, 60000);
async function saveResult(r) {
  const el = $("#saveState");
  const before = rewardState(state.history);
  const rec = Object.assign({ rid: newRid() }, r);
  const ts = new Date().toISOString();
  // 1) 端末の中で先に反映
  state.history = state.history.concat([{ timestamp: ts, itemId: r.itemId, stage: r.stage, score: r.score, total: r.total, passed: r.passed, tags: r.tags || [], rid: rec.rid }]);
  state.progress = computeProgress(state.history);
  applyToMistakes(r.details, ts);
  snapPush(state.history[state.history.length - 1]);
  const { gained, after } = rewardGifts(before);
  const gainHTML = `<span class="gain">けいけん値 +${after.xp - before.xp}${gained > 0 ? `　🪙 +${gained}pt` : ""}</span>`;
  if (el) { el.innerHTML = `記録しています…　${gainHTML}`; }
  const ci = $("#clearInfo");
  if (ci && r.passed && r.stage >= 1 && r.stage <= 4) {
    const need = requiredPasses(r.stage), n = itemProg(r.itemId).passCount[r.stage - 1];
    ci.textContent = n >= need ? (r.stage === 4 ? "🎉 この文法をマスターしました！" : `段階${r.stage}クリア！ 段階${r.stage + 1}に進めます。`)
      : `段階${r.stage}クリアまで、あと${need - n}回合格しよう（${n}/${need}回）`;
  }
  // 2) 送信待ちに入れて、うしろで送る（待たずに次へ進んでよい）
  lsSet(pendingKey(), pendingList().concat([rec]));
  const ok = await syncPending();
  const stillHere = el && document.body.contains(el);
  const sent = !pendingList().some((x) => x.rid === rec.rid);
  if (!stillHere) return;
  if (sent && state.history.some((h) => h.rid === rec.rid)) { el.innerHTML = `記録しました　${gainHTML}`; el.classList.add("ok"); }
  else if (!sent) { el.innerHTML = `この端末に保存しました（混み合っているので、あとで自動で送ります）　${gainHTML}`; el.classList.add("warn"); }
  else { el.textContent = "記録できませんでした"; el.classList.add("ng"); }
}

/* ===== 段階2〜4：問題を順に出す ===== */
function startQuiz(i, stage) {
  const it = CONTENT[i];
  const conf = state.settings["stage" + stage];
  // 課題で PDF・Word の問題セットが選ばれていれば、段階2〜4はその問題を使う
  const set = activeSet(it.id);
  const pool = (s) => (set && (set.q[s] || []).length ? set.q[s] : it["stage" + s].questions);
  let qs;
  if (stage === 2) qs = shuffle(pool(2));
  else if (stage === 3) qs = shuffle(pool(3)).map((q) => Object.assign({ grammar: it.title }, q));
  else {
    // 段階4：この項目を中心に、それまでの項目もまぜる
    const tag = (src) => src.stage4.questions.concat(src.stage3.questions).map((q) => Object.assign({ grammar: src.title }, q));
    const cur = shuffle(set && (set.q[4] || []).length ? set.q[4].map((q) => Object.assign({ grammar: it.title }, q)) : tag(it));
    const prev = shuffle(CONTENT.slice(0, i).flatMap(tag));
    const n = conf.numQuestions;
    const fromCur = prev.length ? Math.ceil(n / 2) : n;
    qs = shuffle(cur.slice(0, fromCur).concat(prev.slice(0, n - Math.min(fromCur, cur.length))));
  }
  qs = qs.slice(0, Math.max(1, conf.numQuestions));
  session = { i, stage, qs, index: 0, log: [], startedAt: Date.now() };
  if (stage === 4) renderStage4Intro(); else renderQuestion();
}

function renderQuestion() {
  const { qs, index } = session;
  const q = qs[index];
  const stage = q._st || session.stage; // 復習では問題ごとに段階がちがう
  render(`${quizHeader()}

      ${questionCard(q, stage)}
      ${answerBlock({ lang: "en-US", placeholder: stage === 4 ? "聞き取り中に英語で言おう" : "マイクをタップして英語で言おう", multiline: false })}
      <div id="result"></div>
    </main>`);
  bindBack(() => (session.boss ? quitBoss() : session.range ? quitRange() : session.story ? renderStory() : session.master ? backToTask(session.master) : session.review ? renderReview() : renderItem(session.i)));

  let shownAt = 0, latency = null;
  const seq = navSeq; // この画面の番号（ほかの画面に移ったら、聞き取りを始めない）
  const limit = state.settings.stage4.timeLimitSec;
  const confirm = stage === 4 ? !state.settings.autoSubmitStage4 : state.settings.confirmBeforeSubmit;
  const ctl = mountAnswer({
    lang: "en-US", continuous: false, confirm,
    onSpeechStart: () => { if (latency == null && shownAt) latency = (performance.now() - shownAt) / 1000; },
    onSubmit: (ans, via) => judgeQuestion(q, ans, via, latency, ctl)
  });

  if (stage === 4) {
    const begin = () => {
      shownAt = performance.now();
      const bar = $("#cd");
      const tick = setInterval(() => {
        const el = (performance.now() - shownAt) / 1000;
        if (bar) bar.style.width = Math.max(0, 100 - (el / limit) * 100) + "%";
        if (latency != null) { clearInterval(tick); if (bar) bar.classList.add(latency <= limit ? "ok" : "late"); }
        else if (el >= limit) { clearInterval(tick); if (bar) bar.classList.add("late"); ctl.setMsg("時間切れ！でも最後まで言ってみよう。", "warn"); }
      }, 100);
      timers.push(tick);
      // 読み上げの直後は、iPad でマイクの音が入らないことがあるので少し待つ
      if (speechAvailable) timers.push(setTimeout(() => { if (seq === navSeq) ctl.start(); }, state.settings.ttsStage4 ? 400 : 0));
    };
    if (state.settings.ttsStage4) speak(q.ja, "ja-JP", () => { if (seq === navSeq) begin(); }); else begin();
  }
}

async function judgeQuestion(q, ans, via, latency, ctl) {
  const stage = q._st || session.stage;
  ctl.disable();
  const res = $("#result");
  let correct = false, model = "", feedback = "", by = "local";
  if (stage === 2) {
    correct = matchesAny(ans.alts.concat([ans.text]), stage2Answers(q));
    model = stage2Model(q);
  } else {
    if (matchesAny(ans.alts.concat([ans.text]), q.answers)) {
      correct = true; model = q.answers[0]; feedback = "正解です！";
    } else {
      res.innerHTML = `<div class="judging"><span class="spinner"></span>判定しています…</div>`;
      try {
        const r = await api.judge(buildTranslateRequest(q, q.grammar, ans.text));
        correct = !!r.correct; model = r.corrected || q.answers[0]; feedback = r.feedback || ""; by = "ai";
      } catch (e) {
        // AIが使えないときは自己判定
        res.innerHTML = `<div class="panel"><div class="msg ng">AIで判定できませんでした（${esc(e.message)}）。</div>
          <p>正解例と比べて、自分で判定しよう。</p>
          <div class="model">${q.answers.map(esc).join("<br>")}</div>
          <div class="btn-row"><button class="btn primary" id="selfOk">言えた</button><button class="btn" id="selfNg">言えなかった</button></div></div>`;
        await new Promise((resolve) => {
          $("#selfOk").onclick = () => { correct = true; resolve(); };
          $("#selfNg").onclick = () => { correct = false; resolve(); };
        });
        model = q.answers[0]; by = "self";
      }
    }
  }
  const late = stage === 4 && (latency == null || latency > state.settings.stage4.timeLimitSec);
  const finalCorrect = correct && !late;
  session.log.push({ qid: q.qid, st: stage, q: qText(q), a: ans.text, correct: finalCorrect, contentCorrect: correct, latency: latency == null ? null : Math.round(latency * 10) / 10, via, by });
  const extra = session.boss ? bossAfter(q, finalCorrect) : session.range ? rangeAfter(q, finalCorrect) : ""; // 総復習：記録のしるし・まちがえたときの練習と再確認

  const isLast = session.index + 1 >= session.qs.length;
  res.innerHTML = `<div class="panel">
    <div class="verdict ${finalCorrect ? "ok" : "ng"}">${finalCorrect ? "○ 正解" : (correct && late ? "△ 正しいけど時間オーバー" : "× おしい")}
      ${stage === 4 && latency != null ? `<small>話し始め ${latency.toFixed(1)}秒</small>` : ""}</div>
    <div class="model-line"><span>正しい英文</span><div class="model-row"><b>${esc(model)}</b><button class="listen" id="listen" aria-label="お手本を聞く">🔊 お手本</button></div></div>
    ${feedback && !(finalCorrect && feedback === "正解です！") ? `<div class="feedback">${esc(feedback)}</div>` : ""}
    ${extra}
    <button class="btn primary big" id="next">${isLast ? "結果を見る" : "次へ"}</button>
  </div>`;
  $("#next").onclick = () => { session.index++; if (isLast) renderQuizResult(); else renderQuestion(); };
  $("#listen").onclick = () => speak(model, "en-US");
  $("#next").focus();
}

/* ===== 復習（まちがえた問題だけ） ===== */
const reviewItems = () => (state.mistakes || []).map((m) => ({ m, x: QINDEX[m.qid] })).filter((e) => e.x);
// 練習の結果を、まちがえたままの問題のリストに反映する
function applyToMistakes(details, ts) {
  const map = new Map((state.mistakes || []).map((m) => [m.qid, m]));
  (details || []).forEach((d) => {
    if (!d || !d.qid) return;
    const ok = d.contentCorrect !== undefined && d.contentCorrect !== null ? d.contentCorrect : d.correct;
    if (ok) map.delete(d.qid);
    else { state.wrongs = state.wrongs || {}; state.wrongs[d.qid] = (state.wrongs[d.qid] || 0) + 1; const e = Object.assign({ qid: d.qid, wrong: 0 }, map.get(d.qid) || {}); e.wrong++; e.a = d.a || ""; e.ts = ts; map.set(d.qid, e); }
  });
  state.mistakes = Array.from(map.values());
}
function renderReview() {
  const list = reviewItems(), byItem = {};
  list.forEach(({ x }) => { byItem[x.it.id] = (byItem[x.it.id] || 0) + 1; });
  render(`${header("復習", true)}
    <main class="wrap">
      <section class="panel">
        <h2>まちがえた問題の復習 <small>${list.length}問</small></h2>
        ${list.length ? `<p class="hint">段階2〜4でまちがえたままの問題です。正解すると、このリストから消えます。</p>
          <div class="chips">${CONTENT.filter((it) => byItem[it.id]).map((it) => `<span class="chip small">${esc(it.short)} ${byItem[it.id]}問</span>`).join("")}</div>
          <ul class="review-list">${list.slice(0, 40).map(({ m, x }) => `<li><span class="lq">${esc(qText(x.q))}</span><span class="la">あなたの答え：${esc(m.a || "（なし）")}${m.wrong > 1 ? `<small>（${m.wrong}回まちがい）</small>` : ""}</span></li>`).join("")}</ul>
          <button class="btn primary big" id="goReview">復習をはじめる（${Math.min(10, list.length)}問）</button>`
        : `<p class="center">まちがえたままの問題はありません。すばらしい！ 🎉</p>`}

  bindBack(renderHome);

function startReview() {
  const list = shuffle(reviewItems()).slice(0, 10);

// 1問答えたあと：記録のしるしを残し、まちがえたら練習と再確認を足す（返り値：結果の下に出すHTML）

/* ===== 先生用の共通部品 ===== */
const personName = (p) => (p && p.name) || String((p && p.email) || "").split("@")[0];
const itemShort = (id) => (id === "review" ? "復習" : (CONTENT.find((c) => c.id === id) || {}).short || id);
const stageLabel = (st) => (Number(st) === 0 ? "復習" : "段階" + st);
function clsSelect(id, classes, cur, allLabel) {
  if (!classes || !classes.length) return "";
  return `<select id="${id}" class="cls-sel"><option value="">${esc(allLabel || "すべてのクラス")}</option>${classes.map((c) => `<option value="${esc(c)}" ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
}
const loadingMain = (title, back) => { render(`${header(title, true)}<main class="wrap"><div class="judging"><span class="spinner"></span>読み込んでいます…</div></main>`); bindBack(back || renderHome); };
const failMain = (e) => { $("main").innerHTML = `<div class="msg ng">読み込めませんでした：${esc(e.message)}</div>`; };
const DUE_LABEL = { done: "✓期限内", late: "期限後", over: "期限切れ", open: "" };
function dueText(d) {
  if (!d) return "";
  const base = `〆${fmtDue(d.due)}`;
  if (d.state === "done") return `<span class="due ok">${base} ✓期限内</span>`;
  if (d.state === "late") return `<span class="due">${base} 期限後にマスター</span>`;
  if (d.state === "over") return `<span class="due ng">${base} 期限切れ</span>`;
  return `<span class="due ${d.left <= 2 ? "warn" : ""}">${base}（${dueLeft(d)}）</span>`;
}
// 練習した日のカレンダー（月曜はじまり・weeks 週ぶん）
function calendarHTML(dayCounts, weeks) {
  const today = new Date(dayKey(Date.now()) + "T00:00:00");
  const start = today.getTime() - ((today.getDay() + 6) % 7) * 86400000 - (weeks - 1) * 7 * 86400000;
  let cols = "";
  for (let w = 0; w < weeks; w++) {
    let cells = "";
    for (let d = 0; d < 7; d++) {
      const t = new Date(start + (w * 7 + d) * 86400000), k = dayKey(t), n = (dayCounts || {})[k] || 0;
      cells += `<i class="cal-d l${n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : 3} ${t > today ? "fut" : ""}" title="${k}：${n}回"></i>`;
    }
    cols += `<div class="cal-col"><small>${new Date(start + w * 7 * 86400000).getMonth() + 1}/${new Date(start + w * 7 * 86400000).getDate()}</small>${cells}</div>`;
  }
  return `<div class="cal"><div class="cal-dow"><small>&nbsp;</small><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>${cols}</div>`;
}
// 文法ごとの進み具合の表（詳しい記録・レポート共通）
function progressTable(sum) {
  const tried = (it) => (((sum.progress || {})[it.id] || {}).attempts || []).some((n) => n > 0);
  let items = CONTENT.filter((it) => (Array.isArray(sum.assigned) && sum.assigned.includes(it.id)) || tried(it));
  if (!items.length) items = CONTENT.filter((it) => gradeOf(it) === 1);
  const rows = items.map((it) => {
    const p = (sum.progress || {})[it.id] || {}, pc = p.passCount || [0, 0, 0, 0], best = p.best || [0, 0, 0, 0], at = p.attempts || [0, 0, 0, 0];
    const assigned = !Array.isArray(sum.assigned) || sum.assigned.includes(it.id);
    const cells = [1, 2, 3, 4].map((k) => {
      const need = requiredPasses(k), ok = pc[k - 1] >= need;
      return `<td class="${ok ? "clr" : ""}">${ok ? "✓" : pc[k - 1] ? `${pc[k - 1]}/${need}` : at[k - 1] ? pct(best[k - 1]) + "%" : "－"}</td>`;
    }).join("");
    const m = (sum.masteredAt || {})[it.id];
    return `<tr><th class="name">${assigned ? "★" : ""}${esc(it.title)}</th>${cells}<td>${m ? fmtDate(m) : ""}</td><td>${dueText((sum.due || {})[it.id])}</td></tr>`;
  }).join("");
  return `<table class="prog"><thead><tr><th class="name">文法（★は課題。課題と練習した文法だけ）</th><th>段階1</th><th>段階2</th><th>段階3</th><th>段階4</th><th>マスター</th><th>締め切り</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">✓＝クリア　n/m＝合格回数／クリアに必要な回数　％＝最高の正答率（まだ合格していない段階）</p>`;
}
function mistakeList(mistakes, max) {
  const list = (mistakes || []).map((m) => ({ m, x: QINDEX[m.qid] })).filter((e) => e.x).slice(0, max || 50);
  if (!list.length) return `<p class="hint">まちがえたままの問題はありません。</p>`;
  return `<table class="miss"><thead><tr><th>問題</th><th>生徒の答え</th><th>正しい答え（例）</th></tr></thead><tbody>${list.map(({ m, x }) =>
    `<tr><td><small>${esc(x.it.short)}・段階${x.stage}</small><br>${esc(qText(x.q))}</td><td class="ng">${esc(m.a || "（なし）")}${m.wrong > 1 ? `<small>（${m.wrong}回）</small>` : ""}</td><td>${esc(qModel(x.q))}</td></tr>`).join("")}</tbody></table>`;
}

/* ===== 生徒一覧・名簿（先生用） ===== */
function parseRoster(text) {
  const lines = String(text || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], errors: [] };
  const split = (l) => (l.includes("\t") ? l.split("\t") : l.split(/[,，]/)).map((c) => c.trim().replace(/^"|"$/g, ""));
  let map = null, start = 0;
  const h = split(lines[0]);
  if (!h.some((c) => c.includes("@"))) { // 1行目が見出し
    const find = (re) => h.findIndex((c) => re.test(c));
    map = { email: find(/メール|mail/i), cls: find(/クラス|組|class/i), no: find(/番号|出席|no|num/i), name: find(/名前|氏名|name/i) };
    start = 1;
  }
  const rows = [], errors = [];
  lines.slice(start).forEach((l, k) => {
    const c = split(l);
    let r;
    if (map && map.email >= 0) r = { email: c[map.email] || "", cls: map.cls >= 0 ? c[map.cls] || "" : "", no: map.no >= 0 ? c[map.no] || "" : "", name: map.name >= 0 ? c[map.name] || "" : "" };
    else { const ei = c.findIndex((x) => x.includes("@")); const rest = c.filter((x, i) => i !== ei); r = { email: ei >= 0 ? c[ei] : "", cls: rest[0] || "", no: rest[1] || "", name: rest[2] || "" }; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) errors.push(`${k + 1 + start}行目：メールアドレスが見つかりません`);
    else rows.push(r);
  });
  return { rows, errors };
}

        (r.rows.length ? `<div class="table-wrap"><table class="people"><thead><tr><th>メール</th><th>クラス</th><th>番号</th><th>名前</th></tr></thead><tbody>${r.rows.slice(0, 50).map((x) => `<tr><td>${esc(x.email)}</td><td>${esc(x.cls)}</td><td>${esc(x.no)}</td><td>${esc(x.name)}</td></tr>`).join("")}</tbody></table></div>
          ${r.rows.length > 50 ? `<p class="hint">ほか ${r.rows.length - 50}人</p>` : ""}<div class="btn-row"><button class="btn primary" id="rosterGo">この ${r.rows.length}人 を登録する</button></div>` : "");
      if ($("#rosterGo")) $("#rosterGo").onclick = async (e) => {
        e.target.disabled = true;
        try {
          const res = await api.importRoster(r.rows);

    }));
    $$("[data-edit]").forEach((b) => (b.onclick = () => {
      const p = list.find((x) => x.email === b.dataset.edit), tr = b.closest("tr");
      tr.innerHTML = `<td colspan="11"><div class="edit-row"><b>${esc(p.email)}</b>
        <label>クラス<input type="text" id="edCls" value="${esc(p.cls || "")}" list="clsList" maxlength="20"></label>
        <label>番号<input type="text" id="edNo" value="${esc(p.no || "")}" maxlength="10"></label>
        <label>名前<input type="text" id="edName" value="${esc(p.name || "")}" maxlength="40"></label>
        <datalist id="clsList">${classes.map((c) => `<option value="${esc(c)}">`).join("")}</datalist>
        <button class="btn small primary" id="edSave">保存</button>${p.reg ? `<button class="btn small" id="edOut">名簿から外す</button>` : ""}<button class="btn small" id="edCancel">やめる</button></div></td>`;
      $("#edCancel").onclick = draw;
      $("#edSave").onclick = async () => {
        try { await api.updateStudent({ email: p.email, cls: $("#edCls").value.trim(), no: $("#edNo").value.trim(), name: $("#edName").value.trim(), reg: true }); renderStudents(cls); }
        catch (e) { msg(e.message); }
      };
      if ($("#edOut")) $("#edOut").onclick = async (e) => {
        if (e.target.dataset.armed !== "1") { e.target.dataset.armed = "1"; e.target.textContent = "本当に外す"; return; }
        try { await api.updateStudent({ email: p.email, reg: false }); renderStudents(cls); } catch (err) { msg(err.message); }
      };
    }));
  }
  draw();
}

    const det = (r.details || []).filter((x) => !x.met).map((x) => `<li class="${x.correct ? "ok" : "ng"}"><span class="mark">${x.correct ? "○" : (x.contentCorrect ? "△" : "×")}</span><span><span class="lq">${esc(x.q)}</span><span class="la">${esc(x.a)}${x.latency != null ? `（${x.latency}秒）` : ""}</span></span></li>`).join("");

    <section class="panel"><h2>練習した日 <small>最近10週</small></h2>${calendarHTML(d.dayCounts, 10)}</section>

    <section class="panel"><h2>バッジ</h2><div class="badge-row">${BADGES.filter((b) => d.badges.includes(b.id)).map((b) => `<span class="chip small" title="${esc(b.desc)}">${b.ico} ${esc(b.name)}</span>`).join("") || `<span class="hint">まだありません</span>`}</div></section>`;

async function renderMistakes(cls, itemId) {
  if (cls === undefined) cls = lsGet("eg_cls", "");

  try { d = await api.mistakeStats({ cls, itemId }); } catch (e) { return failMain(e); }
  const list = d.list || [];
  $("main").innerHTML = `
    <div class="toolbar">${clsSelect("missCls", d.classes || [], cls)}<select id="missItem"><option value="">すべての文法</option>${CONTENT.map((it) => `<option value="${it.id}" ${it.id === itemId ? "selected" : ""}>${esc(it.short)}</option>`).join("")}</select></div>

      <div class="table-wrap"><table class="miss"><thead><tr><th>問題</th><th>解答数</th><th>まちがい</th><th>人数</th><th>よくある答え</th><th>正しい答え（例）</th></tr></thead><tbody>
      ${list.map((e) => {
        const x = QINDEX[e.qid], rate = e.n ? e.wrong / e.n : 0;

          <td><div class="rate"><i style="width:${pct(rate)}%"></i></div><small>${pct(rate)}%（${e.wrong}回）</small></td><td>${e.people}人</td>
          <td>${(e.answers || []).slice(0, 3).map((a) => `<span class="ans">${esc(a.a)}<small>×${a.n}</small></span>`).join("")}</td><td>${esc(x ? qModel(x.q) : "")}</td></tr>`;
      }).join("") || `<tr><td colspan="6">まだまちがいの記録はありません</td></tr>`}

}

/* Word（.docx）から文字を取り出す（.docx は zip。中の word/document.xml を読む） */
async function docxText(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Word のファイルを読めませんでした（.docx で保存し直してください）。");
  let p = dv.getUint32(eocd + 16, true);
  const n = dv.getUint16(eocd + 10, true);
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    if (name === "word/document.xml") {
      const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      let data = u8.subarray(start, start + csize);
      if (method === 8) {
        if (typeof DecompressionStream === "undefined") throw new Error("このブラウザでは Word を読めません。PDF で保存して読みこんでください。");
        data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      }
      const xml = new TextDecoder().decode(data);
      return xml.replace(/<w:tab\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n").replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
        .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&").replace(/\n{3,}/g, "\n\n").trim();
    }
    p += 46 + nlen + xlen + clen;
  }
  throw new Error("Word のファイルの中に本文が見つかりませんでした。");
}
const fileToBase64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("ファイルを読めませんでした。")); r.readAsDataURL(file); });

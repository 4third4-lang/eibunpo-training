      } else if (/\.docx$/i.test(f.name)) {
        req.kind = "text"; req.text = await docxText(await f.arrayBuffer());
        if (!/[A-Za-z]/.test(req.text)) return fail("Word のファイルに英文が見つかりませんでした。");
      } else if (/\.doc$/i.test(f.name)) return fail("古い Word の形式（.doc）は読めません。Word で「.docx」または PDF で保存し直してください。");
      else return fail("PDF か Word（.docx）のファイルを選んでください。");
      m.innerHTML = `<span class="spinner"></span> AI が読みこんで問題を作っています…（1〜2分かかることがあります。この画面のままお待ちください）`; m.className = "msg";
      const r = await api.importSentences(req);
      if (!r.sentences || !r.sentences.length) return fail(r.message || "英文が見つかりませんでした。");
      r.sentences.forEach((s) => { s.use = Object.assign({}, formats); });
      renderSetEditor({ draft: { itemId, name: f.name.replace(/\.[^.]+$/, "").slice(0, 60), file: f.name, formats, sentences: r.sentences, message: r.message }, back, onSaved: opt.onSaved });
    } catch (e) { fail("読みこめませんでした：" + e.message); }
  };
}

/* 読みこんだ問題の確認・修正 */
function renderSetEditor({ draft, setId, back, onSaved }) {
  const S = draft.sentences;
  const val = (v) => esc(v == null ? "" : v);
  const card = (s, k) => {
    const c = s.choice || { text: "", options: ["", "", "", ""], answer: "" }, opts = (c.options || []).concat(["", "", "", ""]).slice(0, 4);
    const ai = c.options ? opts.indexOf(c.answer) : -1, u = s.use || {};
    return `<div class="sent-card ${s.off ? "off" : ""}" id="sc_${k}">
      <div class="sent-head"><b>${k + 1}</b><label class="check"><input type="checkbox" id="on_${k}" ${s.off ? "" : "checked"}> この文を使う</label></div>
      ${(s.warn || []).length ? `<div class="hint warn">⚠ ${s.warn.map(esc).join("／")}</div>` : ""}
      <label class="fld">英文（答え）<input type="text" id="en_${k}" value="${val(s.en)}" class="en"></label>
      <label class="fld">日本語訳 <small class="hint">${s.jaSrc ? "問題集の訳" : "AIの訳"}・段階3・4で使う</small><input type="text" id="ja_${k}" value="${val(s.ja)}"></label>
      <div class="fmt"><label class="check"><input type="checkbox" id="uc_${k}" ${u.choice !== false && s.choice ? "checked" : ""}> 穴うめ（4択）</label>
        <input type="text" id="ct_${k}" value="${val(c.text)}" placeholder="( ) を1つ入れた文" class="en">
        <div class="opts">${opts.map((o, j) => `<label class="opt"><input type="radio" name="ca_${k}" value="${j}" ${j === ai ? "checked" : ""} aria-label="正解"><input type="text" id="co_${k}_${j}" value="${val(o)}" class="en" placeholder="選択肢${j + 1}"></label>`).join("")}</div>
        <small class="hint">○ をつけたものが正解</small></div>
      <div class="fmt"><label class="check"><input type="checkbox" id="uo_${k}" ${u.order !== false ? "checked" : ""}> 並べかえ</label> <small class="hint">英文の単語をばらばらにして出します</small></div>
      <div class="fmt"><label class="check"><input type="checkbox" id="ut_${k}" ${u.transform !== false && s.transform ? "checked" : ""}> 書きかえ</label>
        <input type="text" id="tt_${k}" value="${val((s.transform || {}).text)}" placeholder="見せる文（これを英文にもどす）" class="en">
        <input type="text" id="ti_${k}" value="${val((s.transform || {}).instruction)}" placeholder="指示（例：肯定文にしよう）"></div>
      <div class="fmt"><label class="check"><input type="checkbox" id="uf_${k}" ${u.form !== false && s.form ? "checked" : ""}> （　）の語を正しい形に</label>
        <input type="text" id="ft_${k}" value="${val((s.form || {}).text)}" placeholder="例：He (play) tennis yesterday." class="en"></div>
      <div class="msg" id="er_${k}"></div>
    </div>`;
  };
  render(`${header(setId ? "問題セットを直す" : "読みこんだ問題の確認", true)}
    <main class="wrap">
      ${draft.message ? `<div class="notice">${esc(draft.message)}</div>` : ""}
      <section class="panel">
        <div class="form-grid">
          <label>問題セットの名前 <input type="text" id="seName" maxlength="60" value="${val(draft.name)}"></label>
          <label>文法項目 ${itemSelect("seItem", draft.itemId, true)}</label>
        </div>
        <p class="hint">${S.length}文を読みこみました。AI が作った答え・訳・問題をたしかめて、ちがうところは直してください。使わない文や問題はチェックを外します。</p>
        <div class="fmt-row"><span>まとめて：</span>${Object.keys(FORMAT_NAMES).map((k) => `<button type="button" class="btn small" data-all="${k}">${FORMAT_NAMES[k]}を全部オン／オフ</button>`).join("")}</div>
      </section>
      <div class="sent-list">${S.map(card).join("")}</div>
      <div class="btn-row sticky-save"><button class="btn primary" id="seSave">保存する</button></div>
      <div class="msg" id="seMsg"></div>
    </main>`);
  bindBack(() => { if (confirm("保存していない変更は消えます。もどりますか？")) back(); });
  const ids = { choice: "uc", order: "uo", transform: "ut", form: "uf" };
  $$("[data-all]").forEach((b) => (b.onclick = () => {
    const boxes = S.map((_, k) => $(`#${ids[b.dataset.all]}_${k}`));
    const to = !boxes.every((x) => x.checked);
    boxes.forEach((x) => { x.checked = to; });
  }));
  S.forEach((_, k) => { $("#on_" + k).onchange = (e) => $("#sc_" + k).classList.toggle("off", !e.target.checked); });
  $("#seSave").onclick = async () => {
    const out = [], m = $("#seMsg");
    let bad = -1;
    S.forEach((s, k) => {
      const g = (id) => $("#" + id + "_" + k).value.trim(), on = (id) => $("#" + id + "_" + k).checked;
      const en = g("en"), errs = [];
      const opts = [0, 1, 2, 3].map((j) => $(`#co_${k}_${j}`).value.trim()), ar = $(`[name="ca_${k}"]:checked`);
      const choice = { text: g("ct"), options: opts, answer: ar ? opts[+ar.value] : "" };
      const transform = { text: g("tt"), instruction: g("ti") || "書きかえよう" }, form = { text: g("ft") };
      const use = { choice: on("uc"), order: on("uo"), transform: on("ut"), form: on("uf") };
      const off = !on("on");
      if (!off) {
        if (!/[A-Za-z]/.test(en)) errs.push("英文を入れてください");
        if (use.choice) {
          if (choice.text.split("( )").length !== 2) errs.push("穴うめ：文に ( ) を1つ入れてください");
          else if (opts.some((o) => !o) || new Set(opts).size !== 4) errs.push("穴うめ：選択肢を4つ（ちがうもの）入れてください");
          else if (!choice.answer) errs.push("穴うめ：正解に ○ をつけてください");
          else if (normalize(choice.text.replace("( )", choice.answer)) !== normalize(en)) errs.push("穴うめ：( ) に正解を入れた文が、英文と同じになりません");
        }
        if (use.transform && (!transform.text || normalize(transform.text) === normalize(en))) errs.push("書きかえ：英文とちがう文を入れてください");
        if (use.form && !/\(.+\)/.test(form.text)) errs.push("語形：（　）に入れた語がある文にしてください");
      }
      const er = $("#er_" + k);
      er.textContent = errs.join("／"); er.className = errs.length ? "msg ng" : "msg";
      if (errs.length && bad < 0) bad = k;
      out.push({ sid: Number.isInteger(s.sid) ? s.sid : 1000 + k, en, ja: g("ja"), choice: choice.text || opts.some(Boolean) ? choice : null, transform: transform.text ? transform : null, form: form.text ? form : null, use, off });
    });
    if (bad >= 0) { m.textContent = "直すところがあります（赤い字の文）。"; m.className = "msg ng"; $("#sc_" + bad).scrollIntoView({ block: "center" }); return; }
    if (!out.some((s) => !s.off)) { m.textContent = "使う文がありません。"; m.className = "msg ng"; return; }
    $("#seSave").disabled = true; m.textContent = "保存しています…"; m.className = "msg";
    try {
      const r = await api.saveSet({ id: setId || "", name: $("#seName").value.trim() || "PDFの問題", itemId: $("#seItem").value, file: draft.file || "", formats: draft.formats || null, sentences: out });
      state.sets = r.sets || state.sets; indexQuestions();
      if (onSaved) return onSaved(r.id, $("#seItem").value);
      const used = setUsedBy(r.id);
      renderMaterials(`保存しました。${used.length ? "その課題には、すぐに反映されます。" : "「📌 課題」で課題を作るとき、この文法の「問題」の欄から選ぶと、生徒の課題になります。"}`);
    } catch (e) { $("#seSave").disabled = false; m.textContent = "保存できませんでした：" + e.message; m.className = "msg ng"; }
  };
}

/* サーバーから届いた教材を使う（先生がはじめて開いたときは、アプリの教材をスプレッドシートに書き出す） */
async function applyContent(c) {
  c = c || { seeded: false };
  if (state.isAdmin && (!c.seeded || (c.builtinVer !== undefined && c.builtinVer !== BUILTIN_VER))) {
    try { await api.seedContent({ items: BUILTIN, mode: "add", builtinVer: BUILTIN_VER }); c = await api.getContent(); } catch (e) { console.warn("教材の書き出し", e); }
  }
  state.sets = c.sets || {};
  state.problems = c.problems || [];
  state.sheetUrl = c.sheetUrl || "";
  if (c.seeded) {
    let items = c.items;
    if (items) lsSet("eg_content", { ver: c.ver, items });
    else { const cached = lsGet("eg_content", null); if (cached && cached.ver === c.ver) items = cached.items; }
    if (items && items.length) setContent(items);
  }
  indexQuestions();
}
/* 起動：前回の内容（この端末に保存）があれば、すぐにホームを表示し、うしろで最新の内容に更新する */
const snapKey = () => { const t = String(lsGet("eg_token", "") || ""); return t ? t.slice(-24) : ""; };
function snapSave(b) {
  if (MODE !== "api") return;
  try {
    const c = b.content || {};
    lsSet("eg_boot", { k: snapKey(), at: Date.now(), b: Object.assign({}, b, { content: { seeded: c.seeded, ver: c.ver, sets: c.sets, builtinVer: c.builtinVer, sheetUrl: c.sheetUrl } }) });
  } catch (e) {}
}
// 記録したら、保存してある前回の内容にも足しておく（次に開いたときに、すぐ正しく表示するため）
function snapPush(h) {
  if (MODE !== "api") return;
  const s = lsGet("eg_boot", null);
  if (!s || s.k !== snapKey() || !s.b) return;
  s.b.history = (s.b.history || []).concat([h]);
  s.b.progress = state.progress; s.b.mistakes = state.mistakes; s.b.wrongs = state.wrongs;
  lsSet("eg_boot", s);
}
async function applyBoot(b) {
  state.email = b.email || "";
  state.isAdmin = !!b.isAdmin;
  state.viewAsStudent = state.isAdmin && !!lsGet("eg_preview", false);
  state.history = b.history || [];
  state.picWait = b.picWait || 0;
  state.hasEleven = !!b.hasEleven;
  state.profile = Object.assign({}, DEFAULT_PROFILE, b.profile || {});
  applySettings(b.settings);
  state.tstamps = b.tstamps || [];
  state.mistakes = b.mistakes || [];
  state.wrongs = b.wrongs || {};
  state.teacher = b.teacher || null;
  state.classes = b.classes || [];
  // まだ送れていない記録（この端末にだけある）も足す
  const have = new Set(state.history.map((h) => h.rid).filter(Boolean));
  pendingList().forEach((r) => { if (!have.has(r.rid)) { state.history.push({ timestamp: new Date(parseInt(String(r.rid).slice(0, 8), 36) || Date.now()).toISOString(), itemId: r.itemId, stage: r.stage, score: r.score, total: r.total, passed: r.passed, tags: r.tags || [], rid: r.rid }); applyToMistakes(r.details, new Date().toISOString()); } });
  state.progress = pendingList().length ? computeProgress(state.history) : (b.progress || {});
  await applyContent(b.content);
}
async function init() {
  if (MODE === "api" && !lsGet("eg_token", "")) return renderLogin("");
  const snap = MODE === "api" ? lsGet("eg_boot", null) : null;
  let shown = false, seqShown = -1;
  if (snap && snap.k && snap.k === snapKey() && snap.b && (Date.now() - (snap.at || 0)) < 14 * 86400000) {
    try { await applyBoot(snap.b); renderHome(); shown = true; seqShown = navSeq; } catch (e) { shown = false; }
  }
  if (!shown) app().innerHTML = `<div class="boot"><span class="spinner"></span>読み込んでいます…</div>`;
  try {
    const b = await api.bootstrap();
    snapSave(b);
    const stillHome = !shown || navSeq === seqShown;
    await applyBoot(b);
    // 前回の内容で表示したあと、まだホームのままなら最新の内容で表示し直す（ほかの画面に移っていたら、内容だけ新しくする）
    if (stillHome) { const y = window.scrollY; renderHome(); if (shown) window.scrollTo(0, y); }
    if (MODE === "api" && pendingList().length) syncPending();
    updateSyncBadge();
  } catch (e) {
    if (e instanceof AuthError) { lsSet("eg_boot", null); return renderLogin(e.message); }
    if (/名簿に登録されていない/.test(e.message)) {
      lsSet("eg_boot", null);
      app().innerHTML = `<header class="bar"><span class="logo">ハ</span><h1>話す英文法（ハナブン）</h1></header><main class="wrap"><section class="panel login">
        <h2>まだ使えません</h2><p class="msg ng">${esc(e.message)}</p><p>先生が名簿に登録すると使えるようになります。別のアカウントでログインしている場合は、ログインし直してください。</p>
        <button class="btn primary big" id="relogin">ログインし直す</button></section></main>`;
      $("#relogin").onclick = () => { lsSet("eg_token", ""); renderLogin(""); };
      return;
    }
    // 前回の内容で表示できているときは、そのまま使える（記録は送信待ちに入る）
    if (shown) { toast("最新の内容を読みこめませんでした。前回の内容で表示しています。", 5000); return; }
    app().innerHTML = `<div class="boot ng">起動できませんでした：${esc(e.message)}</div>`;
  }
}
document.addEventListener("DOMContentLoaded", init);

    ["灯台の国 ルミエール", "クラヤミイカ", "fish-2", "灯台に火がともり、海の向こうまで光がとどいた。光のとどいた先に、砂の大陸サルマが小さく見えた。"],
    ["雲の上の村 ニンブス", "カミナリドリ", "bat-0", "雲の上の村に、虹の橋がかかった。ポポは虹の橋を見て、「…前にも、だれかとここを飛んだ気がする」とつぶやいた。"],
    ["森の王都 シルヴァーナ", "ネジレジュボク", "plant-3", "王都の大樹が若葉をつけた。森の女王は{name}の手をにぎった。「あなたの剣、さっきより少しだけ、ひびが小さくなっているわ」"],
    ["風の神殿 アエリア", "ハリケーンジャ", "dragon-4", "大陸の主をたおし、フェルナに風がもどった。神殿の祭壇には、七色の宝石が一つはめこまれていた。残りのくぼみは、あと二つ。"],
    // ---- 砂と潮の大陸 サルマ（28） ----
    ["港町 マリーナ", "フジツボガニ", "fish-0", "港に船がもどり、市場がにぎわいを取りもどした。船乗りたちは、{name}たちを「七つの海の恩人」とよんで、魚を山ほどくれた。"],
    ["砂漠の入り口 デューナ", "スナモグラ", "golem-3", "砂の中にうもれていた井戸から、水がわいた。ラクダ使いの少女が言った。「鉄のガルドが、この先の国を檻でかこっているよ」"],
    ["ラクダの宿場 キャラバ", "スナボウズ", "ghost-1", "旅の商人たちのキャラバンが、ふたたび砂漠を行き来しはじめた。ラクダの背にゆられて、ポポは三日ぶりにぐっすり眠った。"],
    ["オアシスの国 ミラージュ", "シンキロウヘビ", "dragon-2", "まぼろしの湖が、本物の湖になった。湖の水面に、一瞬だけ、黒い翼の青年が映って消えた。"],
    ["商人の都 バザール", "キンカクシガラス", "bat-5", "百の店が開き、千の声が飛びかった。ポポは屋台の料理を全部食べようとして、三軒目でたおれた。"],
    ["風の塔の町 ミナレット", "スナトンビ", "bat-2", "塔のてっぺんの鐘が鳴り、町に朝が来た。鐘守りのおじいさんが言った。「百年前、黒い翼の青年が、この塔で一晩だけ休んでいったよ。とても悲しそうな顔をしていた」"],
    ["鉄の檻の国 ケージア", "テツゴウシ", "golem-6", "国をかこんでいた鉄の檻がくずれた。檻の中で、子どもたちは元気に遊んでいた。鉄のガルドは、子どもたちにだけは手を出さなかったらしい。"],
    ["塩の湖 サリナ", "シオダマリ", "slime-1", "真っ白な塩の湖が、鏡のように空を映した。湖のまん中で、灰の騎士が剣をみがいていた。その剣にも、同じひびがあった。"],
    ["サボテンの里 カクタ", "トゲトゲダルマ", "plant-5", "サボテンが一斉に花を咲かせた。花のみつは、ポポの好物になった。「お前らの好み、昔から変わんねえな」とポポは言って、自分で首をかしげた。"],
    ["ピラミッドの国 ファラオン", "ミイラドク", "ghost-0", "ピラミッドのとびらが開いた。壁画には、空から落ちる大きな星と、それを両手で受け止める黒い服の人が描かれていた。"],
    ["真珠の島 パーリア", "オオシャコガイ", "fish-4", "海の底で眠っていた真珠が、いっせいに光った。島の巫女は言った。「百年前、星が落ちた夜も、真珠はこうして光ったのです」"],
    ["風紋の国 ザンド", "スナアラシ", "dragon-3", "砂嵐がやみ、砂の上に美しい模様が広がった。模様をつなぐと、地図になった。北の大陸の、さらに北をさしていた。"],
    ["潮の神殿 タイダル", "ウズシオドラ", "dragon-5", "神殿に潮がもどった。たおれた鉄のガルドがつぶやいた。「ノクスさまは、百年ずっと、一人で痛みにたえておられる…」"],
    ["夜市の国 ルナバザ", "ヨルノコモリ", "bat-6", "夜だけ開く市場に、ちょうちんの灯りがともった。占い師の老婆が{name}の手を見て言った。「あんたの手は、一度だれかの手を離したことがあるね」"],
    ["ガラス細工の国 クリスタラ", "ワレモノゴーレム", "golem-5", "砂から作られたガラスの町が、太陽の光で七色にかがやいた。職人のおばさんが、ポポの片翼の形をしたガラスのお守りをくれた。"],
    ["地下水路の都 アクエド", "スイロワニ", "fish-6", "地下水路に水が流れ、都じゅうの噴水が歌い出した。水路の奥の石板には、ミラの若いころの名前が、勇者の仲間としてきざまれていた。"],
    ["砂の城 カスティラ", "スナノキシ", "golem-1", "くずれかけた砂の城が、金色にかがやいた。城の王は言った。「時のセレンが近くにいる。あの女は、時を止める」"],
    ["ヤシの浜辺 パームリ", "ヤシガニンジャ", "fish-3", "浜辺にヤシの実が転がり、子どもたちが波と遊んだ。ポポは初めて海に足をつけて、「つめてっ」と飛び上がった。"],
    ["星降る丘 アストラ", "ナガレボシモドキ", "ghost-4", "丘の上に、流れ星がたくさん見えた。でも、一つだけ空にとどまり続ける赤い星があった。ミラは「あれが、百年前に落ちてきた星のかけらじゃ」と言った。"],
    ["サンゴの海の国 コーラル", "サンゴノアクマ", "fish-4", "白くなっていたサンゴ礁に色がもどり、魚たちが帰ってきた。海の底にしずんだ古い船の名前が、やっと読めた。『ノクス号』。"],
    ["機械じかけの町 ギアロ", "ゼンマイオウ", "golem-0", "町じゅうの機械が動き出した。発明家の少年が、ポポのために小さな飛行用の帽子を作ってくれた。片方の翼の代わりに、プロペラがついていた。"],
    ["香辛料の国 スパイシア", "カラシドラゴン", "dragon-0", "百のスパイスの香りがもどった。からい料理を食べたポポが火をふいた。ポポが火をふいたのは、生まれて初めてだった。"],
    ["止まった時の国 クロノス", "トキトメネコ", "ghost-2", "止まっていた時間が動き出し、落ちる途中で止まっていた鳥が、空へ飛んでいった。時のセレンは、ポポの黒い翼を見て、なぜか泣きそうな顔をした。"],
    ["人魚の入り江 セイレン", "ウタヌスミ", "fish-1", "入り江に人魚の歌がもどった。その歌は、百年前に二人の勇者が別れたときの歌だった。ポポは、最後まで聞いていられなかった。"],
    ["月の神殿 ルナリア", "ツキクイオオカミ", "dragon-6", "神殿の天井から月の光がさしこみ、床に黒い翼の影が映った。ポポの影だった。でも、両方の翼があった。"],
    ["大灯台の国 ファロス", "クラゲノヌシ", "fish-5", "大灯台が北の海を照らした。光の先に、氷の大陸ノルディアが白くかがやいていた。もう、ふり返らない。"],
    ["王の砂漠 キングスサンド", "サバクノオウジャ", "golem-4", "砂の王をたおすと、砂の下から古い石碑が出てきた。『二人の勇者と、黒き友。三人で星を受け止めるべし』。三人？"],
    ["潮騒の大神殿 ポセイドラ", "リヴァイアサン", "dragon-2", "大陸の主をたおし、サルマに潮の音がもどった。祭壇に、二つ目の七色の宝石がはまった。残りのくぼみは、あと一つ。"],
    // ---- 氷星の大陸 ノルディア（13） ----
    ["氷の港 フロスタ", "コオリクラーケン", "fish-2", "こおっていた港がとけ、船が着けるようになった。港の人々は「黒の王の塔に近づくほど、寒さはきびしくなる」と、あたたかい毛布をくれた。"],
    ["雪の村 スノウィ", "ユキダルマン", "slime-4", "村に雪合戦の声がもどった。シエルが雪玉を投げてきて、{name}の顔に命中した。仮面をとった彼が、はじめて大声で笑った。"],
    ["オーロラの国 ボレアリス", "ヒカリクイ", "ghost-5", "空のオーロラが七色にもどった。オーロラの光が、剣ルミナのひびに吸いこまれていった。ひびは、もう指一本分しか残っていない。"],
    ["氷の図書館 グラキエス", "コオリノショモツ", "golem-6", "こおっていた本がとけ、破られていたページが見つかった。そこには、百年前のことが、すべて書かれていた。"],
    ["白熊の国 ベアリア", "シロクマオウ", "dragon-1", "白熊の戦士たちが目を覚まし、{name}たちの旅に力を貸すと約束した。「塔へ行くなら、我らの背に乗れ」"],
    ["霜の森 フロストウッド", "シモバシラジュ", "plant-6", "森の木々が霜の花を咲かせた。霧のヴェイルが森の奥で待っていた。もう、戦うつもりはないようだった。"],
    ["星読みの塔 アストロノミア", "ホシクイドリ", "bat-1", "塔の天井に、百年前と同じ星空が映し出された。ミラは言った。「あの夜の星の並び、もう一度見られるとは思わなかった」"],
    ["鏡の湖 ミラーレイク", "カガミノマジョ", "ghost-3", "湖が鏡のようにすみわたった。のぞきこむと、{name}とシエルが、一人の人の姿で映った。"],
    ["吹雪の峠 ブリザード", "フブキノオニ", "ghost-6", "吹雪がやみ、塔へ続く道が見えた。ポポの翼が、根もとから少しずつ白くなり始めていた。"],
    ["凍った玉座の国 フローズン", "コオリノオウ", "golem-3", "こおった玉座がとけ、王国の旗がひるがえった。旗には、二本の剣と一枚の黒い翼が描かれていた。"],
    ["星の門 ゲートオブスター", "モンバンリュウ", "dragon-0", "星の門が開いた。門の向こうから、黒の王ノクスの声がひびいた。「…来るな」"],
    ["終わりの星のふもと エンドオール", "ホシノシモベ", "ghost-0", "赤い星のかけらが静まり、空気があたたかくなった。塔のてっぺんまで、あと少し。"],
    ["黒の塔 ノクティス", "クロキツバサ", "dragon-6", "最後の封印がとけ、黒い塔が白い光につつまれた。祭壇に、三つ目の七色の宝石がはまった。"]
  ],
  // 本編：第0話（はじめから読める）〜第66話（とりもどした王国の数で読める）
  chapters: [
    { t: "目ざめ", s: "目を開けると、空も草も、すべてが灰色だった。手には、ひびの入った剣が一本。自分がだれなのかも思い出せない。\n「やっと起きたか、{name}。お前、百年も寝てたんだぞ」\n声のほうを見ると、片方の翼しかない小さなドラゴンが、こちらをにらんでいた。\n「おれはポポ。この世界はな、黒の王に66の王国を石にされちまった。王国にすみついた封印獣をたおさないかぎり、元にはもどらねえ」\nポポは、遠くの灰色の村を指さした。「ほら、最初の一匹がいるぜ。…ま、おれは見てるだけだけどな」" },
    { t: "最初の色", s: "封印獣がたおれた瞬間、村に色がもどった。赤い屋根、青い空、黄色い花。\n剣のひびが、ほんの少しだけ光った。そして、たおれた封印獣から小さな光のかけらが飛び出し、{name}の胸に吸いこまれた。\n——炎の中で、だれかが叫んでいる。「約束だ！ 手を離すなよ！」\n「…今の、なに？」\n「記憶のかけら、だろうな」ポポは目をそらした。「お前がなくしたもんだ」" },
    { t: "片方の翼", s: "たき火の前で、ポポはパンを三つたいらげた。\n「ねえ、どうして翼が片方しかないの？」\n「…知らねえ。気づいたらこうだった」\nポポは背中を向けて丸くなった。でも、寝息が聞こえるまで、その翼は小さくふるえていた。" },
    { t: "仮面のうわさ", s: "旅人たちのあいだで、うわさが広がっていた。灰色の仮面をつけた騎士が、ひとりで封印獣をたおして回っているらしい。\n「おれたちより先に？」ポポがむっとした。\n「でもね」と宿屋のおかみは声をひそめた。「その騎士がたおした封印獣の王国は、色がもどらないんだって」" },
    { t: "灰の騎士", s: "封印獣の前で、その騎士と鉢合わせした。灰色の仮面、灰色のマント。\n騎士は{name}の剣を見て、一瞬だけ動きを止めた。\n「その剣…どこで手に入れた」\n答える前に、騎士は背を向けた。「この獲物はゆずってやる。だが、次はない」\n騎士の剣にも、同じようなひびがあった気がした。" },
    { t: "丘の上の二人", s: "二つ目の記憶のかけらが、胸にとけた。\n——夕焼けの丘。木の剣で打ち合う二人の子ども。どちらの顔も、光でよく見えない。\n「お前、また手かげんしただろ」\n「してないよ。きみが強くなったんだ」\n笑い声だけが、はっきりと耳に残った。" },
    { t: "星読みのミラ", s: "星見の里で、腰の曲がったおばあさんが{name}を待っていた。\n「わしはミラ。星を読む者じゃ。…よく来たね、百年待ったよ」\nミラは、ひびの入った剣にそっとふれた。\n「百年前、勇者は二人いた。そして剣は、二つに割れた。それ以上は、星が許してくれん」" },
    { t: "霧のヴェイル", s: "とりもどしたはずの王国が、また霧につつまれていた。霧の中から、細身の男が現れた。\n「はじめまして、勇者のなりそこない。私は霧のヴェイル。黒の王さまにつかえる三将の一人だ」\nヴェイルは指を鳴らした。霧が、ポポの体にからみついた。" },
    { t: "ポポを守れ", s: "霧の中で、{name}は夢中で剣をふった。ポポをつかんでいた霧の手が、ちぎれて消えた。\nヴェイルは目を細めた。「その剣…まだ生きていたか」そして霧とともに消えた。\nポポは、しばらく何も言わなかった。それから、小さな声で言った。\n「…ありがとな」" },
    { t: "横取り", s: "巨大な封印獣に追いつめられたとき、灰色の風が横切った。灰の騎士だった。\n二人の剣がそろったとき、封印獣は一撃でたおれた。\n「助けてくれたの？」\n「勘ちがいするな。獲物を横取りされたくなかっただけだ」\n去っていく背中を見て、ポポがつぶやいた。「あいつの剣の動き、お前とそっくりだな」" },
    { t: "割れる剣", s: "三つ目の記憶のかけら。\n——まっ黒な空。落ちてくる赤い星。光る剣が、まっぷたつに割れる音。\nだれかの手が、指のあいだからすべり落ちていく。\n{name}は、汗びっしょりで目を覚ました。剣のひびが、あの夢と同じ形をしていた。" },
    { t: "顔のない像", s: "とりもどした王国の広場に、勇者の像があった。剣をかかげた、二人の勇者の像。\nでも、二人とも顔がけずり取られていた。\n「だれがこんなことを…」\n村人は首をふった。「百年前、ある日とつぜん、国じゅうの勇者の顔が消えたんです」" },
    { t: "消された名前", s: "ミラは、たき火の炎を見つめていた。\n「勇者の名は、この世界から消された。黒の王が、その名をおそれたからじゃ」\n「おそれた？」\n「…あるいは、その名を聞くのが、つらかったのかもしれんがね」\nミラはそれ以上、何も言わなかった。" },
    { t: "ポポ、とぶ", s: "がけから落ちそうになった{name}の服を、ポポが口でくわえた。片方の翼を必死に動かす。\n一瞬、二人の体が、ふわりと宙にうかんだ。\n地面に転がったあと、ポポは目をまるくしていた。\n「…今、おれ、飛んだ？」\n二人は、日が暮れるまで笑い合った。" },
    { t: "一騎打ち", s: "灰の騎士が、道の真ん中に立っていた。\n「剣を抜け。お前が、その剣を持つにふさわしいか、たしかめる」\n打ち合うたびに、二本の剣のひびが光った。勝負はつかなかった。\n息を切らしながら、騎士は言った。「…まだ足りない。だが、悪くない」" },
    { t: "ノクス", s: "四つ目の記憶のかけら。\n——「ノクス！ 待って、ノクス！」\n自分の声だった。黒い服の少年が、ふり返って笑った。\n「心配するなよ。三人なら、どんな星だって受け止められるさ」\n目を覚ますと、ポポがじっとこちらを見ていた。「…今、ノクスって言ったか？」" },
    { t: "霧の谷へ", s: "霧のヴェイルからの手紙がとどいた。\n『霧の谷で待つ。お前が本物の勇者なら、来るがいい』\n「わなに決まってるだろ」とポポ。\n「うん。でも、谷の王国の人たちが待ってる」\nポポはため息をついて、{name}の肩に乗った。「…しょうがねえな」" },
    { t: "霧の向こう", s: "霧の谷で、ヴェイルの霧を切りさいた。ヴェイルはひざをついた。\n「なぜだ…なぜ、お前が勝てる」\nそして、ヴェイルは言った。\n「お前は何も知らない。黒の王さまが、百年、何を守っているのか」\n霧が晴れたとき、ヴェイルの姿はもうなかった。" },
    { t: "守っている？", s: "「黒の王が、何かを守ってる…？」\n世界を灰色にした悪い王。ずっとそう思っていた。\nミラは星を見上げた。「物語には、いつも二つの面があるもんじゃよ」\nその夜、{name}はなかなか眠れなかった。" },
    { t: "仮面の下", s: "灰の騎士が、封印獣との戦いで大けがをした。{name}はかけよって、手当てをした。\n「なぜ助ける」\n「なぜって…仲間でしょ」\n騎士はしばらくだまっていた。仮面に手をかけ、そして、やめた。\n「…いつか話す。いつか、な」" },
    { t: "黒い翼の夢", s: "ポポが、うなされて目を覚ました。\n「夢を見た。おれ、だれかの肩に乗って、空を飛んでた。そいつの背中には、まっ黒な翼が…」\nポポは自分の片方の翼を見つめた。その翼の根もとが、ほんの少し黒ずんでいるのに、{name}は気づいた。" },
    { t: "答えの一つ", s: "フェルナの大陸のいちばん奥に、風の神殿がある。\n「そこに、答えの一つがある」とミラは言った。「ただし、大陸の主が守っておる。お前ひとりでは、勝てんかもしれん」\n「ひとりじゃないよ」\nポポが胸をはった。「おう。おれもいるからな」" },
    { t: "大陸の主", s: "神殿を守る封印獣は、嵐そのもののような怪物だった。剣がはじき飛ばされ、もうだめだと思ったそのとき——\n灰色のマントが、嵐の中にひるがえった。\n「立て。お前がたおれたら、だれがこの大陸を救う」\n二本の剣が、同時に光った。" },

/* =====================================================================
   ストーリーモード「七色の剣と黒の王」と、ホームの「現在地」
   ・王国は文法の順番どおり（学年→順番）。1つの王国＝1つの文法＝1体の封印獣
   ・封印獣の体力＝その文法の段階1〜4（重み 1・2・3・4）。マスターすると体力0
   ・「とどめの一撃」＝その文法と、それまでの文法がまざった問題。合格すると王国がもどる
   ・とどめに合格できるのは、前の王国をすべてとりもどし、その王国までの文法をすべてマスターしたときだけ
   ===================================================================== */
const STAGE_W = [1, 2, 3, 4];
const storyName = () => (state.profile.nickname || "きみ");
const storyText = (s) => esc(String(s || "").replace(/\{name\}/g, storyName())).replace(/\n/g, "<br>");
// 全体の現在地（使う文法をすべてマスター＝100）
function positionOf(progress) {
  if (!CONTENT.length) return 0;
  let got = 0;
  CONTENT.forEach((it) => { const pc = ((progress || {})[it.id] || {}).passCount || [0, 0, 0, 0]; STAGE_W.forEach((w, k) => { if (pc[k] >= requiredPasses(k + 1)) got += w; }); });
  return Math.round((got / (CONTENT.length * 10)) * 1000) / 10;
}
// その文法の封印獣の残り体力（0〜10）
function monsterHP(id, progress) {
  const pc = ((progress || state.progress)[id] || {}).passCount || [0, 0, 0, 0];
  return 10 - STAGE_W.reduce((a, w, k) => a + (pc[k] >= requiredPasses(k + 1) ? w : 0), 0);
}
// 王国の情報：その文法が、大陸（学年）の中で何番目かで決まる。大陸の最後の文法は「大陸の主」
function kingdomOf(it) {
  const g = Math.min(3, Math.max(1, gradeOf(it)));
  const inG = CONTENT.filter((c) => Math.min(3, Math.max(1, gradeOf(c))) === g), j = inG.indexOf(it), n = inG.length;
  const start = STORY.counts.slice(0, g - 1).reduce((a, b) => a + b, 0), L = STORY.kingdoms.slice(start, start + STORY.counts[g - 1]);
  const K = j >= 0 && j === n - 1 ? L[L.length - 1] : j >= 0 && j < L.length - 1 ? L[j] : null;
  if (K) return { name: K[0], monster: K[1], kind: K[2], episode: K[3] };
  const h = strHash(it.id);
  const kinds = ["slime", "bat", "plant", "fish", "golem", "ghost", "dragon"];
  return { name: "なぞの国 " + it.short, monster: "ナゾノフウインジュウ", kind: kinds[h % 7] + "-" + (h % 7), episode: "王国に色がもどった。人々は、{name}の名前を、ずっと語りついでいくと約束した。" };
}
function storyState(history) {
  const done = new Set(storyDone(history || state.history));
  const order = CONTENT.slice();
  let cur = order.findIndex((it) => !done.has(it.id));
  if (cur < 0) cur = order.length; // すべてとりもどした
  const restored = order.filter((it) => done.has(it.id)).length;
  // 本編：大陸（学年）ごとに、その大陸の王国をとりもどした割合だけ、その部の話が読める
  let chapters = 0, left = cur;
  for (let g = 1; g <= 3; g++) {
    const n = order.filter((it) => Math.min(3, Math.max(1, gradeOf(it))) === g).length, act = STORY.acts[g - 1];
    if (left >= n) { chapters = act.from + act.len - 1; left -= n; continue; }
    chapters = act.from - 1 + Math.ceil((left * act.len) / n);
    break;
  }
  if (!order.length) chapters = 0;
  return { done, order, cur, restored, chapters, total: order.length };
}
// 次の王国に、とどめの一撃を打てるか（その王国までの文法をすべてマスター）
function storyReady(st, k) {
  return st.order.slice(0, k + 1).every((it) => clearedCount(it.id) === 4);
}

const MON_COLORS = ["#7950f2", "#e8590c", "#2f9e44", "#1c7ed6", "#c2255c", "#495057", "#0b7285"];
function monsterSVG(kind, size, opt) {
  opt = opt || {};

/* ---------- とどめの一撃（この文法＋それまでの文法がまざる。アプリの問題から出す） ---------- */
function startStoryBattle(k) {
  const st = storyState(), it = st.order[k], K = kingdomOf(it), sc = state.settings.story || {};
  const num = Math.max(3, Math.min(30, Math.round(Number(sc.num) || 10)));
  const pool = (x) => ({
    s2: shuffle(x.stage2.questions).map((q) => Object.assign({ grammar: x.title, _st: 2, _from: x.short }, q)),
    s4: shuffle(x.stage4.questions.concat(x.stage3.questions)).map((q) => Object.assign({ grammar: x.title, _st: 4, _from: x.short }, q))
  });
  const cur = pool(it), prev = st.order.slice(0, k).map(pool);
  const qs = [], fromCur = prev.length ? Math.ceil(num / 2) : num;
  for (let n = 0; n < fromCur; n++) { const q = cur[n % 2 ? "s4" : "s2"].shift() || cur[n % 2 ? "s2" : "s4"].shift(); if (q) qs.push(q); }
  const P = shuffle(prev.slice());
  for (let n = 0; qs.length < num && n < num * 6 && P.length; n++) { const L = P[n % P.length], w = Math.floor(n / P.length) % 2 ? "s4" : "s2"; const q = L[w].shift() || L[w === "s2" ? "s4" : "s2"].shift(); if (q) qs.push(q); }
  while (qs.length < num) { const q = cur.s2.shift() || cur.s4.shift(); if (!q) break; qs.push(q); }
  const pass = Math.min(1, Math.max(0.1, Number(sc.pass) || 0.8));
  session = { i: CONTENT.indexOf(it), stage: 2, story: { k, it, K, pass, need: Math.ceil(qs.length * pass) }, qs: shuffle(qs), index: 0, log: [], startedAt: Date.now() };
  render(`${header("とどめの一撃", true)}
    <main class="wrap story">
      <section class="battle-card intro">
        <div class="bc-monster shake">${monsterSVG(K.kind, 140)}</div>
        <h2>${esc(K.monster)} があらわれた！</h2>
        <ul class="rules">
          <li>全部で <b>${session.qs.length}問</b>。「${esc(it.short)}」と、これまでの王国の文法がまざって出る。</li>
          <li>段階2の問題と、制限時間のある段階4の問題（<b>${state.settings.stage4.timeLimitSec}秒以内</b>に話し始める）。</li>
          <li><b>${session.story.need}問</b>正解すると、${esc(K.monster)} をたおせる！</li>
        </ul>
      </section>
      <button class="btn primary big" id="go">たたかう！</button>
      ${footerNote()}
    </main>`);
  bindBack(() => renderStory());
  $("#go").onclick = renderQuestion;
}

/* ---------- 先生用：現在地の分布 ---------- */
function positionFromSummary(progress) { return positionOf(progress); }
function distributionHTML(list) {
  if (!list.length) return "";
  const pos = list.map((st) => positionFromSummary(st.progress));
  const bins = Array.from({ length: 10 }, () => 0);
  pos.forEach((p) => { bins[Math.min(9, Math.floor(p / 10))]++; });
  const max = Math.max(1, ...bins), avg = Math.round((pos.reduce((a, b) => a + b, 0) / pos.length) * 10) / 10;
  const twoWeeks = Date.now() - 14 * 86400000;
  const idle = list.filter((st) => !st.last || new Date(st.last).getTime() < twoWeeks);
  const stories = list.map((st) => (st.story || []).length);
  const sAvg = Math.round((stories.reduce((a, b) => a + b, 0) / stories.length) * 10) / 10;
  return `<section class="panel"><h2>現在地の分布</h2>
    <p class="hint">すべての文法をマスター＝100。平均 <b>${avg}</b>　／　ストーリーモードでとりもどした王国の平均 <b>${sAvg}</b></p>
    <div class="dist">${bins.map((n, k) => `<div class="dist-col"><span class="dist-n">${n || ""}</span><i style="height:${(n / max) * 100}%"></i><small>${k * 10}〜</small></div>`).join("")}</div>
    ${idle.length ? `<details class="idle"><summary>2週間以上練習していない生徒（要確認）：${idle.length}人</summary><p class="hint">欠席などの理由もあるので、声かけの参考にしてください（生徒には表示されません）。</p><div class="chips">${idle.map((st) => `<span class="chip small">${esc(personName(st))}${st.cls ? `（${esc(st.cls)}）` : ""}</span>`).join("")}</div></details>` : ""}
  </section>`;
}

        <label class="check kind-opt"><input type="radio" name="tkKind" id="tkKindN" value="normal" ${t.kind !== "mm" ? "checked" : ""}> <b>課題（通常）</b>　選んだ文法をすべてマスター（段階1〜4をクリア）するとクリア</label>
        <label class="check kind-opt"><input type="radio" name="tkKind" id="tkKindM" value="mm" ${t.kind === "mm" ? "checked" : ""}> <b>課題（マスターモード）</b>　選んだ文法をすべてマスターしたあと、まとめ問題に合格するとクリア</label>
        <label class="check kind-opt"><input type="radio" name="tkKind" id="tkKindR" value="range" ${t.kind === "range" ? "checked" : ""}> <b>課題（範囲の総復習）</b>　選んだ文法の「観点」（確かめるポイント）を、日をあけてすべて確かめるとクリア（ダンジョン形式）</label>
        <p class="hint" id="tkKindHint"></p>
        <div class="btn-row"><button class="btn primary" id="tkSave">保存する</button><button class="btn" id="tkCancel">やめる</button></div>
        <div class="msg" id="tkMsg"></div>
      </section>
    </main>`);
  const back = () => renderTaskAdmin();
  bindBack(back);
  $("#tkCancel").onclick = back;
  $("#tkFolder").onchange = (e) => { $("#tkNewFolder").hidden = e.target.value !== "__new"; if (e.target.value === "__new") $("#tkNewFolder").focus(); };
  const picked = () => CONTENT.filter((it) => $(`[data-ti="${it.id}"]`).checked);
  const sync = () => {
    const P = picked();
    $$("[data-ts]").forEach((x) => { const on = $(`[data-ti="${x.dataset.ts}"]`).checked; x.disabled = !on; if (!on) x.value = ""; });
    $("#tkPicked").innerHTML = P.length ? `<b>選んだ文法（${P.length}つ・教材の順）</b>：${P.map((it, k) => `<span class="chip small ${k === P.length - 1 && P.length > 1 && $("#tkKindM").checked ? "on" : ""}">${gradeOf(it)}-${itemNo(it)} ${esc(it.short)}</span>`).join(" ")}` : `<span class="hint">下の一覧から、課題にする文法を選んでください。</span>`;
    const mmOk = P.length >= 2;
    $("#tkKindM").disabled = !mmOk;
    if (!mmOk && $("#tkKindM").checked) $("#tkKindN").checked = true;
    $("#tkKindHint").innerHTML = $("#tkKindR").checked ? (P.length ? `課題（範囲の総復習）では、次の観点を1つずつ確かめます（全部で${P.reduce((a, it) => a + vpDefs(it.id).length, 0)}こ）。それぞれ、別の日に${rc.need}回正解し、最初の正解から${rc.gap}日以上あけても正解すれば確認済みです。弱点から優先して出題し、まちがえたら練習と再確認をします。すべて確かめる（ダンジョン制覇＝課題クリア）と、おまけのラスボス（まちがえた問題を中心に${rc.bossQ}問・全問正解でたおせる・1日1回）が出て、たおすと特別なスタンプがもらえます。<ul class="rg-vplist">${P.map((it) => `<li><b>${esc(it.short)}</b>：${vpDefs(it.id).map((v) => esc(v.name)).join("／")}</li>`).join("")}</ul>` : "下の一覧から文法を選ぶと、確かめる観点が表示されます。")
      : !mmOk ? "課題（マスターモード）は、文法を2つ以上選ぶと選べます（文法が1つの課題はマスターモードにできません）。"
      : `課題（マスターモード）では、先に出てくる文法（${P.slice(0, -1).map((it) => esc(it.short)).join("・")}）を、これまでの既習事項としてまとめ問題で復習します。まとめ問題には、すべての文法をマスターしてから挑戦できます。`;
  };
  // 配信する生徒（選んだクラスの生徒全員にチェック → 外した生徒には配信しない）
  const selCls = () => $$("[data-tc]").filter((x) => x.checked).map((x) => x.value);
  const pool = () => { const C = selCls(); return (taskAdminCache || []).filter((st) => !C.length || C.indexOf(st.cls) >= 0); };
  const drawStu = () => {
    if (!taskAdminCache) return;
    const P = pool(), groups = {};
    P.forEach((st) => { (groups[st.cls || ""] = groups[st.cls || ""] || []).push(st); });
    const on = P.filter((st) => !off.has(st.email)).length;
    $("#tkStu").innerHTML = !P.length ? `<span class="hint">この条件の生徒は、まだ名簿にいません（名簿に入った生徒にはあとから配信されます）。</span>`
      : `<div class="tk-stu-head"><b>配信する生徒 ${on} / ${P.length}人</b>${on < P.length ? `<span class="chip small on">個別に配信</span>` : `<span class="chip small">全員に配信</span>`}</div>` +
        Object.keys(groups).sort().map((c) => `<div class="tk-stu-grp"><div class="tk-stu-cls"><b>${c ? esc(c) : "クラスなし"}</b>（${groups[c].filter((st) => !off.has(st.email)).length} / ${groups[c].length}人）
          <button type="button" class="link-btn small" data-son="${esc(c)}">全員にチェック</button><button type="button" class="link-btn small" data-soff="${esc(c)}">全員のチェックを外す</button></div>
          <div class="tk-stu-list">${groups[c].map((st) => `<label class="check stu-pick"><input type="checkbox" data-st="${esc(st.email)}" ${off.has(st.email) ? "" : "checked"}> ${st.no ? `<small>${esc(st.no)}</small> ` : ""}${esc(personName(st))}</label>`).join("")}</div></div>`).join("");
    $$("[data-st]").forEach((x) => (x.onchange = () => { if (x.checked) off.delete(x.dataset.st); else off.add(x.dataset.st); drawStu(); }));
    $$("[data-son]").forEach((b) => (b.onclick = () => { P.filter((st) => (st.cls || "") === b.dataset.son).forEach((st) => off.delete(st.email)); drawStu(); }));
    $$("[data-soff]").forEach((b) => (b.onclick = () => { P.filter((st) => (st.cls || "") === b.dataset.soff).forEach((st) => off.add(st.email)); drawStu(); }));
  };
  // クラスを選びなおしたら、そのクラスの生徒は全員チェックした状態から
  $$("[data-tc]").forEach((x) => (x.onchange = () => { (taskAdminCache || []).filter((st) => st.cls === x.value).forEach((st) => off.delete(st.email)); drawStu(); }));
  if (taskAdminCache) drawStu();
  else api.dashboard().then((d) => {
    taskAdminCache = d.students || []; state.classes = d.classes || state.classes;
    if (!$("#tkStu")) return;
    if (Array.isArray(t.students) && t.students.length) taskAdminCache.forEach((st) => { if (t.students.indexOf(st.email) < 0) off.add(st.email); });
    // 名簿のクラスが増えていたら、クラスの選択肢も出しなおす
    const known = $$("[data-tc]").map((x) => x.value), add = Array.from(new Set(taskAdminCache.map((st) => st.cls).filter((c) => c && known.indexOf(c) < 0))).sort();
    if (add.length) { const box = $(".tk-cls"); if (!known.length) box.innerHTML = ""; box.insertAdjacentHTML("beforeend", add.map((c) => `<label class="cls-pick"><input type="checkbox" data-tc value="${esc(c)}"><span>${esc(c)}</span></label>`).join("")); $$("[data-tc]").forEach((x) => (x.onchange = () => { taskAdminCache.filter((st) => st.cls === x.value).forEach((st) => off.delete(st.email)); drawStu(); })); }
    drawStu();
  }).catch((e) => { if ($("#tkStu")) $("#tkStu").innerHTML = `<span class="hint">生徒の一覧を読みこめませんでした（${esc(e.message)}）。クラス単位で配信されます。</span>`; });
  $$("[data-ti]").forEach((x) => (x.onchange = sync));
  $$("[name=tkKind]").forEach((x) => (x.onchange = sync));
  sync();
  const read = () => {
    const P = picked();
    const out = { id: t.id || newId("t"), name: $("#tkName").value.trim().slice(0, 40), folder: $("#tkFolder").value, items: P.map((it) => it.id).concat(t.items.filter((x) => !CONTENT.some((c) => c.id === x))),
      kind: $("#tkKindR").checked ? "range" : $("#tkKindM").checked && P.length >= 2 ? "mm" : "normal", due: dueJoin($("#tkDue").value, $("#tkDueT").value), classes: selCls(), src: {} };
    if (taskAdminCache) { const L = pool(), on = L.filter((st) => !off.has(st.email)); if (on.length < L.length) out.students = on.map((st) => st.email); }
    else if (Array.isArray(t.students) && t.students.length) out.students = t.students.slice(); // 一覧を読めなかったときは、前の配信先のまま
    P.forEach((it) => { const v = $(`[data-ts="${it.id}"]`).value; if (v && v !== "new") out.src[it.id] = v; });
    return out;
  };
  const msg = (x, ok) => { const m = $("#tkMsg"); m.textContent = x; m.className = "msg " + (ok ? "ok" : "ng"); };
  const save = async () => {
    const x = read();
    if (!x.name) { msg("課題の名前を入れてください。"); $("#tkName").focus(); return null; }
    if (!x.items.length) { msg("文法を1つ以上選んでください。"); return null; }
    if (x.students && !x.students.length) { msg("配信する生徒が1人もいません。生徒にチェックを入れてください。"); return null; }
    const nf = x.folder === "__new" ? ($("#tkNewFolder").value.trim() || "課題").slice(0, 30) : null;
    await saveRaw((ns) => {
      if (nf) { const f = { id: newId("f"), name: nf }; ns.folders.push(f); x.folder = f.id; }
      const k = ns.tasks.findIndex((y) => y.id === x.id);
      if (k >= 0) ns.tasks[k] = x; else ns.tasks.push(x);
    });
    t.id = x.id; t.folder = x.folder;
    return x;
  };
  $("#tkSave").onclick = async () => {
    try { const x = await save(); if (x) { taskAdminCache = null; renderTaskAdmin(); } }
    catch (e) { msg("保存できませんでした：" + e.message); }
  };
  $$("[data-ts]").forEach((sel) => (sel.onchange = async (e) => {
    if (e.target.value !== "new") return;
    e.target.value = t.src[sel.dataset.ts] || "";
    if (!confirm("この課題をいったん保存してから、PDF・Word から問題を作る画面に移ります。よろしいですか？")) return;
    try {
      const x = await save();
      if (x) renderImport({ itemId: sel.dataset.ts, back: () => renderTaskEdit(x.id), onSaved: async (setId, iid) => {
        // 作った問題を、この課題のその文法の問題にする
        try { await saveRaw((ns) => { const y = ns.tasks.find((z) => z.id === x.id); if (y && y.items.indexOf(iid) >= 0) { y.src = y.src || {}; y.src[iid] = setId; } }); } catch (e2) {}
        renderTaskEdit(x.id);
      } });
    }
    catch (err) { msg("保存できませんでした：" + err.message); }
  }));
}

// 課題（範囲の総復習）の進み具合：生徒 × 観点の一覧と、声をかけたい生徒
function rangeProgressHTML(t, X, cls) {
  const items = CONTENT.filter((it) => t.items.indexOf(it.id) >= 0);
  const cols = []; items.forEach((it) => vpDefs(it.id).forEach((v, k) => cols.push({ it, k, name: v.name })));
  const mark = { done: ["○", "lv lv4"], prog: ["△", "lv lv2"], weak: ["×", "lv rg-weak"], new: ["－", ""] };
  const vpOf = (x, iid, k) => ((x && x.vps) || []).find((v) => v.i === iid && v.k === k) || { s: "new", l: 0 };
  const call = X.filter(({ x }) => x && (x.stuck || (x.weak || 0) >= 2)).map(({ st, x }) => {
    const L = (x.vps || []).filter((v) => v.x || v.s === "weak");
    return `<li><button class="link" data-detail="${esc(st.email)}">${st.no ? `<small>${esc(st.no)}</small> ` : ""}${esc(personName(st))}</button>${!cls && st.cls ? `<small class="cls-tag">${esc(st.cls)}</small>` : ""}
      <span class="rg-call">${L.map((v) => { const it = CONTENT.find((c) => c.id === v.i); return `<span class="chip small ${v.x ? "rg-stuck" : ""}">${v.x ? "🛑 " : "× "}${it ? esc(it.short) : esc(v.i)}：${esc(vpName(v.i, v.k))}</span>`; }).join(" ")}</span></li>`;
  });
  const bossN = X.filter(({ x }) => x && x.boss).length;
  return `<p class="hint boss-sum">👑 ラスボスをたおした生徒：<b>${bossN}</b>人（ラスボスは、ダンジョン制覇のあとのおまけです）</p><div class="table-wrap"><table class="dash rg-table"><thead>
      <tr><th></th>${items.map((it) => `<th colspan="${vpDefs(it.id).length}" title="${esc(it.title)}">${gradeOf(it)}-${itemNo(it)} ${esc(it.short)}</th>`).join("")}<th>観点</th><th>状況</th></tr>
      <tr><th></th>${cols.map((c) => `<th title="${esc(c.name)}"><small>${c.k + 1}</small></th>`).join("")}<th></th><th></th></tr></thead>
    <tbody>${X.map(({ st, x }) => `<tr><th class="name"><button class="link" data-detail="${esc(st.email)}">${st.no ? `<small>${esc(st.no)}</small> ` : ""}${esc(personName(st))}</button>${!cls && st.cls ? `<small class="cls-tag">${esc(st.cls)}</small>` : ""}</th>
      ${cols.map((c) => { const v = vpOf(x, c.it.id, c.k), m = mark[v.s] || mark.new; return `<td class="${m[1]} ${v.x ? "rg-stuck" : ""}" title="${esc(c.it.short + "：" + c.name)}">${v.x ? "🛑" : m[0]}</td>`; }).join("")}
      <td>${x ? `${x.n} / ${x.total}` : ""}</td><td>${x && x.done ? `<span class="ok">🏆 制覇${x.doneAt ? `（${fmtDate(x.doneAt)}）` : ""}</span>${x.boss ? `<br><span class="boss-ok">👑 ラスボス撃破</span>` : ""}` : x && x.due && x.due.state === "over" ? `<span class="ng">期限切れ</span>` : "とりくみ中"}</td></tr>`).join("") || `<tr><td colspan="${cols.length + 3}">対象の生徒がいません</td></tr>`}</tbody></table></div>
    <p class="hint">○ 確認済み（別の日に正解し、日をあけても正解）　△ 確認中　× 苦手（いちばん新しい答えがまちがい）　🛑 同じ観点で3回まちがえて、その日を終えた（まだ正解していない）　－ まだ出ていない</p>
    <details class="rg-legend"><summary>観点の一覧</summary>${items.map((it) => `<div><b>${gradeOf(it)}-${itemNo(it)} ${esc(it.short)}</b>：${vpDefs(it.id).map((v, k) => `${k + 1}. ${esc(v.name)}`).join("　")}</div>`).join("")}</details>
    <h2>🙋 声をかけたい生徒</h2>
    ${call.length ? `<ul class="rg-calls">${call.join("")}</ul>` : `<p class="hint">いまはいません（同じ観点で3回まちがえた生徒、苦手な観点が2つ以上ある生徒が出ます）。</p>`}`;
}

// 1つの課題の進み具合（生徒ごと）
async function renderTaskProgress(id, cls) {
  const t = (state.rawSettings.tasks || []).find((x) => x.id === id);
  if (!t) return renderTaskAdmin();
  loadingMain("課題の進み具合", () => renderTaskAdmin());
  let d;
  try { d = await api.dashboard(); } catch (e) { return failMain(e); }
  taskAdminCache = d.students || []; state.classes = d.classes || state.classes;
  const all = taskTargets(t, d.students || []);
  const classes = Array.from(new Set(all.map((st) => st.cls).filter(Boolean))).sort();
  if (cls && classes.indexOf(cls) < 0) cls = "";
  const list = all.filter((st) => !cls || st.cls === cls);
  const items = CONTENT.filter((it) => t.items.indexOf(it.id) >= 0), mm = isMasterTask(t);
  const X = list.map((st) => ({ st, x: studentTaskState(st, t) }));
  const done = X.filter((r) => r.x.done).length, over = X.filter((r) => r.x.due && r.x.due.state === "over").length;
  const lvOf = (st, iid) => { const pc = (st.progress[iid] && st.progress[iid].passCount) || [0, 0, 0, 0]; return [1, 2, 3, 4].filter((k) => pc[k - 1] >= requiredPasses(k)).length; };
  const stateText = (x) => x.done ? `<span class="ok">✓ クリア${x.doneAt ? `（${fmtDate(x.doneAt)}）` : ""}</span>${x.due && x.due.state === "late" ? `<small class="due-mark late">期限後</small>` : ""}`
    : x.due && x.due.state === "over" ? `<span class="ng">期限切れ</span>` : x.mm && x.ready ? "まとめ問題まで" : "とりくみ中";
  render(`${header("課題の進み具合", true)}
    <main class="wrap wide">
      <section class="panel">
        <h2>${esc(t.name)} ${kindChip(t)}</h2>
        <p class="hint">${items.map((it) => esc(it.short)).join("・")}　｜　${esc(taskClassText(t))}　｜　${t.due ? `締め切り ${fmtDueW(t.due)}` : "締め切りなし"}</p>
        <div class="toolbar">${classes.length > 1 ? clsSelect("tpCls", classes, cls) : ""}<button class="btn small" id="tpEdit">課題を直す</button></div>
        <div class="sum-cards"><div><b>${list.length}</b><small>対象の生徒</small></div><div><b class="ok">${done}</b><small>${isRangeTask(t) ? "制覇" : "クリア"}</small></div><div><b>${list.length - done}</b><small>まだ</small></div><div><b class="${over ? "ng" : ""}">${over}</b><small>期限切れ</small></div></div>
        ${isRangeTask(t) ? rangeProgressHTML(t, X, cls) : `<div class="table-wrap"><table class="dash"><thead><tr><th></th>${items.map((it) => `<th title="${esc(it.title)}">${gradeOf(it)}-${itemNo(it)}<br><small>${esc(it.short)}</small></th>`).join("")}${mm ? `<th class="mcol">まとめ<br><small>問題</small></th>` : ""}<th>状況</th></tr></thead>
          <tbody>${X.map(({ st, x }) => `<tr><th class="name"><button class="link" data-detail="${esc(st.email)}">${st.no ? `<small>${esc(st.no)}</small> ` : ""}${esc(personName(st))}</button>${!cls && st.cls ? `<small class="cls-tag">${esc(st.cls)}</small>` : ""}</th>
            ${items.map((it) => { const lv = lvOf(st, it.id); return `<td class="lv lv${lv}">${lv === 4 ? "マスター" : lv ? "段階" + lv : "－"}</td>`; }).join("")}
            ${mm ? `<td class="mcol ${x.passed ? "lv lv4" : ""}">${x.passed ? "合格" : x.ready ? "挑戦できる" : "－"}</td>` : ""}<td>${stateText(x)}</td></tr>`).join("") || `<tr><td colspan="${items.length + 3}">対象の生徒がいません</td></tr>`}</tbody></table></div>`}
        <p class="hint">名前を押すと、その生徒の詳しい記録が見られます。</p>
      </section>
      ${footerNote()}
    </main>`);
  bindBack(() => renderTaskAdmin());
  if ($("#tpCls")) $("#tpCls").onchange = (e) => renderTaskProgress(id, e.target.value);
  $("#tpEdit").onclick = () => renderTaskEdit(id);
  $$("[data-detail]").forEach((b) => (b.onclick = () => renderStudentDetail(b.dataset.detail, () => renderTaskProgress(id, cls))));
}

</script>

h I were〜.）"},{"id":"p4","text":"「〜できたらいいのに」は I wish I could〜. で表す"},{"id":"p5","text":"実現の可能性がある願いには I hope〜. を使う"}],"model":"I wish のあとに主語と動詞の過去形を続けて、「〜ならいいのに」という、今の事実と違う願いを表します。形は過去形ですが、意味は今のことです。be動詞は主語が何でも were を使い、「〜できたらいいのに」は I wish I could〜. で表します。実現しそうな願いには I hope を使います。"},"stage2":{"questions":[{"type":"choice","text":"I wish I ( ) a bird.","options":["were","am","be"],"answer":"were"},{"type":"choice","text":"I wish I ( ) speak English well.","options":["could","can","will"],"answer":"could"},{"type":"choice","text":"I wish I ( ) a dog.","options":["had","have","has"],"answer":"had"},{"type":"choice","text":"I wish it ( ) sunny today.","options":["were","is","be"],"answer":"were"},{"type":"choice","text":"I wish my brother ( ) here.","options":["were","is","be"],"answer":"were"},{"type":"choice","text":"I wish I ( ) more time.","options":["had","have","having"],"answer":"had"},{"type":"order","words":["I","wish","I","could","play","the","piano"],"answer":"I wish I could play the piano."},{"type":"order","words":["I","wish","I","knew","her","phone","number"],"answer":"I wish I knew her phone number."},{"type":"transform","text":"I am sorry I am not tall.","instruction":"I wish を使って書きかえよう","answers":["I wish I were tall."]},{"type":"transform","text":"I am sorry I can't swim.","instruction":"I wish を使って書きかえよう","answers":["I wish I could swim."]}]},"stage3":{"questions":[{"ja":"私が鳥ならいいのに。","answers":["I wish I were a bird."]},{"ja":"英語を上手に話せたらいいのに。","answers":["I wish I could speak English well."]},{"ja":"犬を飼っていたらいいのに。","answers":["I wish I had a dog."]},{"ja":"今日晴れていたらいいのに。","answers":["I wish it were sunny today.","I wish it were fine today."]},{"ja":"兄がここにいたらいいのに。","answers":["I wish my brother were here."]},{"ja":"もっと時間があればいいのに。","answers":["I wish I had more time."]},{"ja":"ピアノが弾けたらいいのに。","answers":["I wish I could play the piano."]},{"ja":"彼女の電話番号を知っていたらいいのに。","answers":["I wish I knew her phone number."]}]},"stage4":{"questions":[{"ja":"私が背が高ければいいのに。"   if (activeRec) { try { activeRec.abort(); } catch (e) {} activeRec = null; }
  timers.forEach(clearInterval); timers.forEach(clearTimeout); timers = [];
  try { speechSynthesis.cancel(); } catch (e) {}
}

function render(html, opts) { stopAll(); if (!(opts && opts.keepMic)) releaseMic(); app().innerHTML = html; if (!(opts && opts.keepScroll)) window.scrollTo(0, 0); }

/* ===== 絵（アバター・スタンプ）とテーマ色 ===== */
function avatarHTML(av, size, opt) {
  size = size || 48;
  if (av && av.b && window.Art) return Art.avatar(av, size, opt);
  return `<svg class="avatar-svg" width="${size}" height="${size}" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="58" fill="#e9ecef"/><text x="60" y="78" text-anchor="middle" font-size="52" font-weight="800" fill="#adb5bd">?</text></svg>`;
}
function stampArt(design, size) {
  if (!window.Art || !design) return "";
  if (typeof design === "string") return Art.design(design, size);
  if (design.id) return Art.design(design.id, size);
  if (design.make) { const m = design.make; return Art.stampSVG(m.a, m.t, size, { color: m.c, pose: m.po, expr: m.ex, crown: !!m.cr }); }
  return "";
}
function applySkin(id) {
  const t = THEMES.find((x) => x.id === id) || THEMES[0];
  const root = document.documentElement;
  if (t.id === "umi") { delete root.dataset.skin; root.style.removeProperty("--skin"); }
  else { root.dataset.skin = t.id; root.style.setProperty("--skin", t.c); }
  lsSet("eg_skin", t.id);
}
applySkin(lsGet("eg_skin", "umi"));
function unlockText(un) {
  const p = String(un || "").split(":"), v = p[1];
  if (p[0] === "lv") return (LEVELS[+v] ? LEVELS[+v][1] : "") + "になると";
  if (p[0] === "card") return "練習した日が" + v + "日で";
  if (p[0] === "badge") { const b = BADGES.find((x) => x.id === v); return "バッジ「" + (b ? b.name : v) + "」で"; }
  if (p[0] === "shop") return "お店で " + v + "pt";
  if (p[0] === "live") return +v === 1 ? "ライブで1位になると" : "ライブで" + v + "位以内に入ると";
  if (p[0] === "master") return "マスターモードに" + (+v === 1 ? "成功すると" : v + "回成功すると");
  return "";
}
const fmtDate = (ts) => { const t = new Date(ts); return isNaN(t) ? "" : `${t.getMonth() + 1}/${t.getDate()}`; };
const myName = () => state.profile.nickname || (MODE === "demo" ? "お試しユーザー" : state.email.split("@")[0]);

/* ===== ホーム（生徒画面） ===== */
function renderHome() {
  if (state.isAdmin && !state.viewAsStudent) return renderAdminHome();
  applySkin(state.profile.theme);
  const card = (it, i) => {
    const p = itemProg(it.id);
    const done = clearedCount(it.id);
    const dots = [1, 2, 3, 4].map((s) => {
      const need = requiredPasses(s), n = Math.min(p.passCount[s - 1], need);
      const partial = !isCleared(it.id, s) && n > 0 ? `<i style="width:${(n / need) * 100}%"></i>` : "";
      return `<span class="dot s${s} ${isCleared(it.id, s) ? "on" : ""}" title="段階${s}：${n}/${need}回合格">${partial}<b>${s}</b></span>`;
    }).join("");
    return `<button class="item-card ${done === 4 ? "mastered" : ""}" data-i="${i}">
      <span class="num">${itemNo(it)}</span>
      <span class="item-main"><span class="item-title">${esc(it.title)}</span><span class="dots">${dots}</span>${dueChip(dueOf(it.id))}</span>
      <span class="item-count">${done === 4 ? "マスター" : done + "/4"}</span>
    </button>`;
  };
  const assignedList = assignedOrder();
  const freeList = CONTENT.map((it, i) => [it, i]).filter(([it]) => !isAssigned(it.id));
  const soon = assignedList.map(([it]) => dueOf(it.id)).filter((d) => d && (d.state === "over" || (d.state === "open" && d.left <= 2)));
  const masters = myMasters();
  const cards = (masters.length ? `<h2 class="sec">🏅 マスターモード</h2><div class="master-list">${masters.map(masterCard).join("")}</div>` : "") +
    (freeList.length || soon.length || masters.length ? `<h2 class="sec">課題</h2>` : "") +
    (assignedList.length ? assignedList.map(([it, i]) => card(it, i)).join("") : `<p class="hint">課題の項目はまだありません。</p>`) +
    (freeList.length ? `<h2 class="sec">自由練習</h2>` + GRADES.map((g) => {
      const list = freeList.filter(([it]) => gradeOf(it) === g);
      if (!list.length) return "";
      const started = list.some(([it]) => itemProg(it.id).attempts.some((n) => n > 0));
      return `<details class="grade-box free" ${started || (g === 1 && !assignedList.length) ? "open" : ""}><summary>中${g}の文法（${list.length}）</summary>${list.map(([it, i]) => card(it, i)).join("")}</details>`;
    }).join("") : "");
  const rw = rewardState(state.history);
  const nx = nextStep();
  const pf = state.profile, lv = rw.level;
  const unread = state.tstamps.filter((s) => !s.seen).length;
  const omToday = pf.omLast === dayKey(Date.now());
  const menu = [
    ["toAvatar", "🎨", "着せ替え", ""],
    ["toShop", "🛍️", "お店", ""],
    ["toReview", "📝", "復習", (state.mistakes || []).length ? String(reviewItems().length) : ""],
    state.settings.omikuji !== false ? ["toOmikuji", "🎋", "おみくじ", omToday ? "" : "今日まだ"] : null,
    state.settings.showRanking || state.isAdmin ? ["toRank", "🏆", "ランキング", state.settings.showRanking ? "" : "先生だけ"] : null,
    ["toRewards", "📮", "スタンプ帳", unread ? "NEW" : ""]
  ].filter(Boolean);
  const slots = Array.from({ length: STAMPS_PER_CARD }, (_, k) => `<span class="slot ${k < rw.onCard ? "on" : ""} ${k === rw.onCard - 1 && rw.todayDone ? "today" : ""}">${k < rw.onCard ? "🐾" : k + 1}</span>`).join("");
  render(`${header("英文法トレーニング")}
    <main class="wrap">
      ${speechAvailable ? "" : `<div class="notice">この端末のブラウザでは音声認識が使えません。キーボードのマイク（音声入力）や文字入力で答えてください。</div>`}
      ${soon.length ? `<div class="notice due-notice">⏰ 締め切りが近い（または過ぎた）課題が ${soon.length}つ あります。下の「課題」を見てみよう。</div>` : ""}
      <section class="me-card">
        <div class="me-top">
          <button class="me-av" id="meAv" aria-label="アバターを着せ替える">${avatarHTML(pf.avatar, 78)}<span class="av-edit" aria-hidden="true">✏️</span></button>
          <div class="me-info">
            <div class="me-hello">${esc(myName())} さん</div>
            <div class="lv-row"><span class="lv-chip">🥋 ${esc(lv.name)}</span><span class="lv-next">${lv.next ? `${esc(lv.next)}まで あと ${lv.nextAt - rw.xp}` : "最高の段位です！"}</span></div>
            <div class="lv-bar" title="けいけん値 ${rw.xp}"><i style="width:${pct(lv.progress)}%"></i></div>
          </div>
        </div>
        <div class="me-stats">
          <span class="stat"><b>🔥 ${rw.streak}</b><small>日連続</small></span>
          <span class="stat"><b>🪙 ${rw.points.avail}</b><small>ポイント</small></span>
          <span class="stat"><b>🏅 ${rw.badges.size}</b><small>バッジ</small></span>
          <span class="stat"><b>👑 ${rw.mastered}</b><small>マスター</small></span>
        </div>
        <button class="stamp-card" id="toCard" aria-label="スタンプ帳を見る">
          <span class="sc-head"><span>スタンプカード${rw.cards ? `（${rw.cards}枚うめた）` : ""}</span><span class="sc-more">${rw.todayDone ? "今日のスタンプ ゲット！" : "今日も1回練習しよう"}</span></span>
          <span class="slots">${slots}</span>
        </button>
      </section>
      <nav class="quick-grid">${menu.map(([id, ico, label, note]) => `<button class="quick" id="${id}"><span class="q-ico">${ico}</span><span class="q-label">${label}</span>${note ? `<span class="q-note ${note === "NEW" ? "new" : ""}">${note}</span>` : ""}</button>`).join("")}</nav>
      ${nx ? `<section class="next-card"><div class="next-label">今日のおすすめ</div>
        <div class="next-body"><span class="stage-no s${nx.stage}">段階${nx.stage}</span><span class="next-title">${esc(nx.it.title)}<small>${STAGE_NAMES[nx.stage - 1]}</small></span></div>
        <button class="btn primary big" id="goNext">はじめる</button></section>`
      : `<section class="next-card done"><div class="next-label">すごい！</div><div class="next-title">すべての文法をマスターしました 🎉</div></section>`}
      <p class="lead">文法の項目をえらぼう。段階1〜4をすべてクリアすると、その文法はマスターです。</p>
      <div class="items">${cards}</div>
      <div class="home-links">
        ${MODE === "api" ? `<button class="link-btn" id="logout">ログアウト</button>` : ""}
      </div>
      ${footerNote()}
    </main>`);
  bindBack(null);
  $$(".item-card").forEach((b) => (b.onclick = () => renderItem(+b.dataset.i)));
  $$(".master-card").forEach((b) => (b.onclick = () => renderMaster(b.dataset.m)));
  $("#meAv").onclick = () => renderAvatar("b");
  $("#toAvatar").onclick = () => renderAvatar("b");
  $("#toShop").onclick = renderShop;
  $("#toReview").onclick = renderReview;
  if ($("#toOmikuji")) $("#toOmikuji").onclick = renderOmikuji;
  if ($("#toRank")) $("#toRank").onclick = () => renderRanking("week");
  $("#toRewards").onclick = renderRewards;
  $("#toCard").onclick = renderRewards;
  if ($("#goNext")) $("#goNext").onclick = () => (nx.stage === 1 ? renderStage1(nx.i) : startQuiz(nx.i, nx.stage));
  if ($("#logout")) $("#logout").onclick = () => { lsSet("eg_token", ""); renderLogin("ログアウトしました。"); };
  // はじめての生徒にはアバターを選んでもらう → 先生からのスタンプが届いていれば見せる
  if (!pf.avatar && !state.isAdmin) avatarPicker();
  else if (unread) showTeacherStamps();
}

/* ===== はじめてのアバター選び ===== */
const START_BGS = ["bg_sky", "bg_pink", "bg_mint", "bg_lemon"];
function avatarPicker() {
  const bases = AVATAR_SET.list.filter((x) => x.k === "b" && x.un === "start");
  const pick = { b: "", sk: 0, bg: "bg_sky" };
  let nick = state.profile.nickname || "";
  const el = document.createElement("div");
  el.className = "gift-overlay av-first";
  document.body.appendChild(el);
  function draw() {
    const b = AVATAR_SET.byId[pick.b];
    el.innerHTML = `<div class="gift av-pick-box" role="dialog" aria-label="アバターを選ぶ"><div class="gift-title">✨ あなたのアバターを選ぼう！</div>
      <p class="hint">これが、アプリの中のあなたです。あとから着せ替えもできます。練習をがんばると、キャラクターやアイテムが増えていきます！</p>
      <div class="av-pick-grid">${bases.map((x, i) => `<button type="button" class="av-pick ${pick.b === x.id ? "active" : ""}" data-b="${x.id}">${avatarHTML({ b: x.id, sk: pick.b === x.id ? pick.sk : 0, bg: START_BGS[i % 4] }, 64)}<span>${esc(x.name)}</span></button>`).join("")}</div>
      ${b && b.human ? `<div class="av-skins"><span class="hint">はだの色</span>${AVATAR_SET.SKINS.map((c, i) => `<button type="button" class="skin ${pick.sk === i ? "active" : ""}" data-sk="${i}" style="background:${c}" aria-label="はだの色${i + 1}"></button>`).join("")}</div>` : ""}
      <div class="av-bgs"><span class="hint">背景</span>${START_BGS.map((id) => `<button type="button" class="bgpick ${pick.bg === id ? "active" : ""}" data-bg="${id}">${avatarHTML({ b: pick.b || "cat", bg: id, sk: pick.sk }, 40)}</button>`).join("")}</div>
      <label class="nick-row"><span>ニックネーム（ランキングなどで表示。10文字まで・あとで変えられます）</span><input type="text" id="pkNick" maxlength="10" value="${esc(nick)}" placeholder="例：えいごマン"></label>
      <div class="av-big">${pick.b ? avatarHTML(pick, 110) : ""}</div>
      <button class="btn primary big" id="avGo" ${pick.b ? "" : "disabled"}>${pick.b ? "このアバターにする！" : "キャラクターを選んでね"}</button>
      <div class="msg ng" id="avErr"></div></div>`;
    $("#pkNick", el).oninput = (e) => { nick = e.target.value; };
    $$(".av-pick", el).forEach((bt) => (bt.onclick = () => { pick.b = bt.dataset.b; if (!(AVATAR_SET.byId[pick.b] || {}).human) pick.sk = 0; draw(); }));
    $$(".skin", el).forEach((bt) => (bt.onclick = () => { pick.sk = +bt.dataset.sk; draw(); }));
    $$(".bgpick", el).forEach((bt) => (bt.onclick = () => { pick.bg = bt.dataset.bg; draw(); }));
    $("#avGo", el).onclick = async (e) => {
      e.target.disabled = true;
      const before = rewardState(state.history);
      try {
        state.profile = await api.saveProfile({ avatar: pick, nickname: nick.trim() });
        el.remove();
        rewardGifts(before);
        renderHome();
      } catch (err) { $("#avErr", el).textContent = err.message; e.target.disabled = false; }
    };
  }
  draw();
}

/* ===== 着せ替え（アバター・テーマ色・ニックネーム） ===== */
const AV_TABS = [["b", "キャラクター"], ["make", "パーツで作る"], ["h", "帽子・頭"], ["f", "顔"], ["w", "服・持ち物"], ["bg", "背景"], ["theme", "テーマ色"]];
const MAKER_GROUPS = [["sh", "顔の形"], ["sk", "はだの色"], ["ea", "耳"], ["hs", "髪型"], ["hc", "髪の色"], ["ey", "目"], ["br", "まゆ"], ["mo", "口"], ["ch", "ほっぺ"], ["cl", "服の色"]];
function renderAvatar(tab) {
  const A = AVATAR_SET;
  const saved = () => JSON.stringify([state.profile.avatar, state.profile.theme || "umi"]);
  let draft = JSON.parse(JSON.stringify(state.profile.avatar || { b: "cat", bg: "bg_sky" }));
  let theme = state.profile.theme || "umi";
  let mk = Object.assign({}, A.MAKER_DEFAULT, draft.b === "maker" ? draft.mk : lsGet("eg_lastmk", {}));
  tab = tab || "b";
  const leave = () => { applySkin(state.profile.theme); renderHome(); };
  let drawn = false;
  function draw() {
    const rw = rewardState(state.history), owned = state.profile.owned || [];
    const changed = JSON.stringify([draft, theme]) !== saved();
    let side = "";
    if (tab === "make") {

/* ===== おみくじ英文（英文を読んでから引く） ===== */
const FORTUNE_ODDS = [[95, [50, 30, 15, 5]], [85, [30, 35, 25, 10]], [70, [15, 30, 30, 25]], [0, [5, 20, 35, 40]]];
const FORTUNE_NAMES = ["大吉", "中吉", "小吉", "吉"];
function drawFortune(acc) {
  const odds = FORTUNE_ODDS.find((o) => acc >= o[0])[1], x = Math.random() * 100;
  for (let i = 0, sum = 0; i < odds.length; i++) { sum += odds[i]; if (x < sum) return FORTUNE_NAMES[i]; }
  return "吉";
}
// 読めた単語の割合（語順もふくめて、いちばん長く一致した単語の数 ÷ 英文の単語の数）
function readAccuracy(target, said) {
  const t = normalize(target).split(" ").filter(Boolean), s = normalize(said).split(" ").filter(Boolean);
  if (!t.length) return { acc: 0, marks: [] };
  const dp = Array.from({ length: t.length + 1 }, () => new Array(s.length + 1).fill(0));
  for (let i = t.length - 1; i >= 0; i--) for (let j = s.length - 1; j >= 0; j--) dp[i][j] = t[i] === s[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const marks = []; let i = 0, j = 0;
  while (i < t.length) { if (j < s.length && t[i] === s[j]) { marks.push(true); i++; j++; } else if (j < s.length && dp[i][j + 1] >= dp[i + 1][j]) j++; else { marks.push(false); i++; } }
  return { acc: Math.round((dp[0][0] / t.length) * 100), marks, words: t };
}
function omikujiPool() {
  const O = window.OmikujiSet || { list: [] };
  const base = O.list.filter((x) => x.lv === 1);
  // 練習した文法の英文（課題の復習）もまぜる
  const done = CONTENT.filter((it) => itemProg(it.id).attempts.some((n) => n > 0));
  const review = done.flatMap((it) => it.stage3.questions.map((q) => ({ c: "review", en: q.answers[0], ja: q.ja })));
  return { base, review };
}
function renderOmikuji() {
  const O = window.OmikujiSet || { CATS: {}, MESSAGES: {}, WORDS: [["star", "星"]], COLORS: [["red", "赤", "#e03131"]], ITEMS: [["pencil", "えんぴつ"]], LUCK: [], STARS: {} };
  const { base, review } = omikujiPool();
  const pickFrom = review.length && Math.random() < 0.3 ? review : base;
  const s = pickFrom[Math.floor(Math.random() * pickFrom.length)] || { c: "pos", en: "You can do it.", ja: "あなたならできる。" };
  const today = state.profile.omLast === dayKey(Date.now());
  render(`${header("おみくじ英文", true)}
    <main class="wrap">
      <section class="om-sentence">
        <span class="om-cat">${esc(O.CATS[s.c] || "英文")}</span>
        <div class="om-ja">${esc(s.ja)}</div>
        <div class="om-en">${esc(s.en)}</div>
        <button class="listen" id="omListen">🔊 お手本</button>
      </section>
      <p class="hint center">英文を声に出して読んでから、おみくじを引こう。正しく読めるほど大吉が出やすくなります。${today ? "" : "今日はじめてのおみくじで +5pt！"}</p>
      ${answerBlock({ lang: "en-US", placeholder: "マイクをタップして英文を読もう", multiline: false })}
      <div id="result"></div>
      ${footerNote()}
    </main>`);
  bindBack(renderHome);
  $("#omListen").onclick = () => speak(s.en, "en-US");
  const ctl = mountAnswer({
    lang: "en-US", continuous: false, confirm: false,
    onSubmit: (ans) => {
      const best = [ans.text].concat(ans.alts || []).map((t) => readAccuracy(s.en, t)).sort((a, b) => b.acc - a.acc)[0];
      if (!best.acc) { ctl.setMsg("英文が聞き取れませんでした。もう一度読んでみよう。", "ng"); return; }
      ctl.disable();
      $("#result").innerHTML = `<div class="panel center"><div class="om-words">${best.words.map((w, k) => `<span class="${best.marks[k] ? "ok" : "ng"}">${esc(w)}</span>`).join(" ")}</div>
        <div class="verdict ${best.acc >= 85 ? "ok" : ""}">読めた割合 ${best.acc}%</div>
        <button class="btn primary big" id="omDraw">🎋 おみくじを引く</button>
        <button class="btn" id="omAgain">もう一度読む</button></div>`;
      $("#omAgain").onclick = renderOmikuji;
      $("#omDraw").onclick = () => drawOmikuji(drawFortune(best.acc), O);
    }
  });
}

  const box = $("#result");

/* 練習・交換などのあとに、新しくもらったものをお知らせする */
function rewardGifts(before) {
  const after = rewardState(state.history);
  const gifts = [];
  if (after.days > before.days) gifts.push({ big: "🐾", title: "今日のスタンプ！", text: after.onCard === 0 ? `スタンプカードが1枚うまりました（${after.cards}枚目）` : `スタンプカード ${after.onCard} / ${STAMPS_PER_CARD}` + (after.streak >= 2 ? `　🔥${after.streak}日連続` : "") });

  const oldKeys = new Set(before.autoStamps.map((s) => s.key));
  after.autoStamps.filter((s) => !oldKeys.has(s.key)).forEach((s) => gifts.push({ html: stampArt(s.design, 160), title: "スタンプをもらいました！", text: s.note }));
  BADGES.filter((b) => after.badges.has(b.id) && !before.badges.has(b.id)).forEach((b) => gifts.push({ big: b.ico, title: "バッジ「" + b.name + "」", text: b.desc + "（+20pt）" }));
  const newItems = AVATAR_SET.list.filter((it) => after.unlocked.has(it.id) && !before.unlocked.has(it.id) && !shopPrice(it.un));
  const newThemes = THEMES.filter((t) => after.unlocked.has(t.id) && !before.unlocked.has(t.id) && !shopPrice(t.un));
  if (newItems.length || newThemes.length) {
    const av = state.profile.avatar || { b: "cat", bg: "bg_sky" };
    gifts.push({ html: `<div class="gift-items">${newItems.slice(0, 6).map((it) => { const a = Object.assign({}, av, { [it.k]: it.id }); if (it.k === "b") delete a.mk; return avatarHTML(a, 72); }).join("")}${newThemes.map((t) => `<span class="swatch big" style="background:${t.c}"></span>`).join("")}</div>`,
      title: "新しい着せ替えが使えるようになりました！", text: newItems.concat(newThemes).map((x) => x.name).join("、") });
  }
  showGifts(gifts);
  return { gained: after.points.avail - before.points.avail, after };
}

/* マイク操作をまとめたコントローラ */
function mountAnswer({ lang, continuous, silenceSec, confirm, onSubmit, onSpeechStart }) {
  let current = { text: "", alts: [] };
  const tEl = $("#transcript"), mic = $("#micBtn"), msg = $("#msg"), conf = $("#confirmRow");
  const setText = (t, interim) => { tEl.innerHTML = t ? `<span class="${interim ? "interim" : ""}">${esc(t)}</span>` : `<span class="ph">…</span>`; };
  const setMsg = (m, cls) => { msg.textContent = m || ""; msg.className = "msg " + (cls || ""); };
  let listening = false;
  const stopUI = () => { listening = false; mic && mic.classList.remove("on"); };
  function start() {
    if (!speechAvailable || listening) return;
    setMsg(""); conf.classList.add("hidden");
    listening = true; mic && mic.classList.add("on");
    setText("", true);
    activeRec = listen({
      lang, continuous, silenceSec,
      onSpeechStart: () => onSpeechStart && onSpeechStart(),
      onInterim: (t) => setText(t, true),
      onError: (err) => { if (err !== "aborted") setMsg(SR_ERRORS[err] || ("音声認識エラー: " + err), "ng"); },
      onEnd: (res) => {
        stopUI(); activeRec = null;
        if (!res.text) { if (!msg.textContent) setMsg(SR_ERRORS["no-speech"], "ng"); setText(""); return; }
        current = res; setText(res.text, false);
        if (confirm) conf.classList.remove("hidden"); else onSubmit(current, "voice");
      }
    });
  }
  function stop() { if (activeRec) { try { activeRec.stop(); } catch (e) {} } }
  if (mic) mic.onclick = () => (listening ? stop() : start());
  $("#submitBtn").onclick = () => { conf.classList.add("hidden"); onSubmit(current, "voice"); };
  $("#retryBtn").onclick = () => { conf.classList.add("hidden"); setText(""); start(); };
  const ti = $("#textIn"), ts = $("#textSubmit");
  if (ti && ts) {
    let firstKey = true;
    ti.addEventListener("input", () => { if (firstKey) { firstKey = false; onSpeechStart && onSpeechStart(); } });
    const go = () => { const v = ti.value.trim(); if (!v) return; setText(v, false); onSubmit({ text: v, alts: [v] }, "text"); };
    ts.onclick = go;
    if (ti.tagName === "INPUT") ti.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.isComposing) go(); });
  }
  return {
    start, setMsg,
    disable() { if (mic) mic.disabled = true; if (ti) ti.disabled = true; if (ts) ts.disabled = true; conf.classList.add("hidden"); },
  };
}

/* ===== 段階2〜4：問題を順に出す ===== */
function startQuiz(i, stage) {
  const it = CONTENT[i];
  const conf = state.settings["stage" + stage];
  // 課題で PDF・Word の問題セットが選ばれていれば、段階2〜4はその問題を使う
  const set = activeSet(it.id);
  const pool = (s) => (set && (set.q[s] || []).length ? set.q[s] : it["stage" + s].questions);
  let qs;
  if (stage === 2) qs = shuffle(pool(2));
  else if (stage === 3) qs = shuffle(pool(3)).map((q) => Object.assign({ grammar: it.title }, q));
  else {
    // 段階4：この項目を中心に、それまでの項目もまぜる
    const tag = (src) => src.stage4.questions.concat(src.stage3.questions).map((q) => Object.assign({ grammar: src.title }, q));
    const cur = shuffle(set && (set.q[4] || []).length ? set.q[4].map((q) => Object.assign({ grammar: it.title }, q)) : tag(it));
    const prev = shuffle(CONTENT.slice(0, i).flatMap(tag));
    const n = conf.numQuestions;
    const fromCur = prev.length ? Math.ceil(n / 2) : n;
    qs = shuffle(cur.slice(0, fromCur).concat(prev.slice(0, n - Math.min(fromCur, cur.length))));
  }
  qs = qs.slice(0, Math.max(1, conf.numQuestions));
  session = { i, stage, qs, index: 0, log: [], startedAt: Date.now() };
  if (stage === 4) renderStage4Intro(); else renderQuestion();
}

        <div class="chips">${q.options.map((o) => `<span class="chip">${esc(o)}</span>`).join("")}</div></section>`;
    }
    if (q.type === "order") {
      return `<section class="q-card s2"><div class="q-label">ならべかえて、文を言おう${q.hint ? `（${esc(q.hint)}）` : ""}</div>
        <div class="chips big">${shuffle(q.words).map((w) => `<span class="chip">${esc(w)}</span>`).join("")}</div></section>`;
    }
    return `<section class="q-card s2"><div class="q-label">${esc(q.instruction)}</div>
      <div class="q-main en">${esc(q.text)}</div></section>`;
  }
  return `<section class="q-card s${stage}"><div class="q-label">${stage === 3 ? "英語で言おう" : "すぐに英語で！"}</div>
    <div class="q-main ja">${esc(q.ja)}</div>
    ${stage === 4 ? `<div class="countdown"><div class="countdown-bar" id="cd"></div></div>` : ""}</section>`;
}

function renderQuestion() {
  const { qs, index } = session;
  const q = qs[index];
  const stage = q._st || session.stage; // 復習では問題ごとに段階がちがう
  render(`${quizHeader()}
    <main class="wrap">

      <div id="result"></div>
    </main>`);
  bindBack(() => (session.master ? renderMaster(session.master.id) : session.review ? renderReview() : renderItem(session.i)));

  let shownAt = 0, latency = null;
  const limit = state.settings.stage4.timeLimitSec;
  const confirm = stage === 4 ? !state.settings.autoSubmitStage4 : state.settings.confirmBeforeSubmit;
  const ctl = mountAnswer({
    lang: "en-US", continuous: false, confirm,
    onSpeechStart: () => { if (latency == null && shownAt) latency = (performance.now() - shownAt) / 1000; },
    onSubmit: (ans, via) => judgeQuestion(q, ans, via, latency, ctl)
  });

  if (stage === 4) {
    const begin = () => {
      shownAt = performance.now();
      const bar = $("#cd");
      const tick = setInterval(() => {
        const el = (performance.now() - shownAt) / 1000;
        if (bar) bar.style.width = Math.max(0, 100 - (el / limit) * 100) + "%";
        if (latency != null) { clearInterval(tick); if (bar) bar.classList.add(latency <= limit ? "ok" : "late"); }
        else if (el >= limit) { clearInterval(tick); if (bar) bar.classList.add("late"); ctl.setMsg("時間切れ！でも最後まで言ってみよう。", "warn"); }
      }, 100);
      timers.push(tick);
      if (speechAvailable) ctl.start();
    };
    if (state.settings.ttsStage4) speak(q.ja, "ja-JP", begin); else begin();
  }
}

async function judgeQuestion(q, ans, via, latency, ctl) {
  const stage = q._st || session.stage;
  ctl.disable();
  const res = $("#result");
  let correct = false, model = "", feedback = "", by = "local";
  if (stage === 2) {
    correct = matchesAny(ans.alts.concat([ans.text]), stage2Answers(q));
    model = stage2Model(q);
  } else {
    if (matchesAny(ans.alts.concat([ans.text]), q.answers)) {
      correct = true; model = q.answers[0]; feedback = "正解です！";
    } else {
      res.innerHTML = `<div class="judging"><span class="spinner"></span>判定しています…</div>`;
      try {
        const r = await api.judge(buildTranslateRequest(q, q.grammar, ans.text));
        correct = !!r.correct; model = r.corrected || q.answers[0]; feedback = r.feedback || ""; by = "ai";
      } catch (e) {
        // AIが使えないときは自己判定
        res.innerHTML = `<div class="panel"><div class="msg ng">AIで判定できませんでした（${esc(e.message)}）。</div>
          <p>正解例と比べて、自分で判定しよう。</p>
          <div class="model">${q.answers.map(esc).join("<br>")}</div>
          <div class="btn-row"><button class="btn primary" id="selfOk">言えた</button><button class="btn" id="selfNg">言えなかった</button></div></div>`;
        await new Promise((resolve) => {
          $("#selfOk").onclick = () => { correct = true; resolve(); };
          $("#selfNg").onclick = () => { correct = false; resolve(); };
        });
        model = q.answers[0]; by = "self";
      }
    }
  }
  const late = stage === 4 && (latency == null || latency > state.settings.stage4.timeLimitSec);
  const finalCorrect = correct && !late;
  session.log.push({ qid: q.qid, st: stage, q: qText(q), a: ans.text, correct: finalCorrect, contentCorrect: correct, latency: latency == null ? null : Math.round(latency * 10) / 10, via, by });

  const isLast = session.index + 1 >= session.qs.length;
  res.innerHTML = `<div class="panel">
    <div class="verdict ${finalCorrect ? "ok" : "ng"}">${finalCorrect ? "○ 正解" : (correct && late ? "△ 正しいけど時間オーバー" : "× おしい")}
      ${stage === 4 && latency != null ? `<small>話し始め ${latency.toFixed(1)}秒</small>` : ""}</div>
    <div class="model-line"><span>正しい英文</span><div class="model-row"><b>${esc(model)}</b><button class="listen" id="listen" aria-label="お手本を聞く">🔊 お手本</button></div></div>
    ${feedback && !(finalCorrect && feedback === "正解です！") ? `<div class="feedback">${esc(feedback)}</div>` : ""}
    <button class="btn primary big" id="next">${isLast ? "結果を見る" : "次へ"}</button>
  </div>`;
  $("#next").onclick = () => { session.index++; if (isLast) renderQuizResult(); else renderQuestion(); };
  $("#listen").onclick = () => speak(model, "en-US");
  $("#next").focus();
}

function startMaster(m) {

  const lists = m.list.map((it) => ({

    if (q) qs.push(q);

  if ($("#taskCls")) $("#taskCls").onchange = (e) => { readTasks(); taskCls = e.target.value; if (!tasks[taskCls]) tasks[taskCls] = { assigned: tasks[""].assigned, due: Object.assign({}, tasks[""].due), src: Object.assign({}, tasks[""].src), own: false }; drawTasks(); };
  const collect = () => {
    readTasks();
    const classTasks = {};
    Object.keys(tasks).filter((c) => c && tasks[c].own).forEach((c) => { classTasks[c] = { assigned: tasks[c].assigned, due: tasks[c].due, src: tasks[c].src || {} }; });
    const v = (id) => parseFloat($("#" + id).value);
    const clampR = (x) => Math.min(1, Math.max(0.1, (isNaN(x) ? 80 : x) / 100));
    const clampN = (x) => Math.min(30, Math.max(1, Math.round(isNaN(x) ? 10 : x)));

    return {

/* ===== 先生用の共通部品 ===== */
const personName = (p) => (p && p.name) || String((p && p.email) || "").split("@")[0];
const itemShort = (id) => (id === "review" ? "復習" : (CONTENT.find((c) => c.id === id) || {}).short || id);
const stageLabel = (st) => (Number(st) === 0 ? "復習" : "段階" + st);
function clsSelect(id, classes, cur, allLabel) {
  if (!classes || !classes.length) return "";
  return `<select id="${id}" class="cls-sel"><option value="">${esc(allLabel || "すべてのクラス")}</option>${classes.map((c) => `<option value="${esc(c)}" ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`;
}
const loadingMain = (title, back) => { render(`${header(title, true)}<main class="wrap"><div class="judging"><span class="spinner"></span>読み込んでいます…</div></main>`); bindBack(back || renderHome); };
const failMain = (e) => { $("main").innerHTML = `<div class="msg ng">読み込めませんでした：${esc(e.message)}</div>`; };
const DUE_LABEL = { done: "✓期限内", late: "期限後", over: "期限切れ", open: "" };
function dueText(d) {
  if (!d) return "";
  const base = `〆${fmtDue(d.due)}`;
  if (d.state === "done") return `<span class="due ok">${base} ✓期限内</span>`;
  if (d.state === "late") return `<span class="due">${base} 期限後にマスター</span>`;
  if (d.state === "over") return `<span class="due ng">${base} 期限切れ</span>`;
  return `<span class="due ${d.left <= 2 ? "warn" : ""}">${base}（あと${d.left}日）</span>`;
}
// 練習した日のカレンダー（月曜はじまり・weeks 週ぶん）
function calendarHTML(dayCounts, weeks) {
  const today = new Date(dayKey(Date.now()) + "T00:00:00");
  const start = today.getTime() - ((today.getDay() + 6) % 7) * 86400000 - (weeks - 1) * 7 * 86400000;
  let cols = "";
  for (let w = 0; w < weeks; w++) {
    let cells = "";
    for (let d = 0; d < 7; d++) {
      const t = new Date(start + (w * 7 + d) * 86400000), k = dayKey(t), n = (dayCounts || {})[k] || 0;
      cells += `<i class="cal-d l${n === 0 ? 0 : n < 3 ? 1 : n < 6 ? 2 : 3} ${t > today ? "fut" : ""}" title="${k}：${n}回"></i>`;
    }
    cols += `<div class="cal-col"><small>${new Date(start + w * 7 * 86400000).getMonth() + 1}/${new Date(start + w * 7 * 86400000).getDate()}</small>${cells}</div>`;
  }
  return `<div class="cal"><div class="cal-dow"><small>&nbsp;</small><span>月</span><span></span><span>水</span><span></span><span>金</span><span></span><span>日</span></div>${cols}</div>`;
}
// 文法ごとの進み具合の表（詳しい記録・レポート共通）
function progressTable(sum) {
  const tried = (it) => (((sum.progress || {})[it.id] || {}).attempts || []).some((n) => n > 0);
  let items = CONTENT.filter((it) => (Array.isArray(sum.assigned) && sum.assigned.includes(it.id)) || tried(it));
  if (!items.length) items = CONTENT.filter((it) => gradeOf(it) === 1);
  const rows = items.map((it) => {
    const p = (sum.progress || {})[it.id] || {}, pc = p.passCount || [0, 0, 0, 0], best = p.best || [0, 0, 0, 0], at = p.attempts || [0, 0, 0, 0];
    const assigned = !Array.isArray(sum.assigned) || sum.assigned.includes(it.id);
    const cells = [1, 2, 3, 4].map((k) => {
      const need = requiredPasses(k), ok = pc[k - 1] >= need;
      return `<td class="${ok ? "clr" : ""}">${ok ? "✓" : pc[k - 1] ? `${pc[k - 1]}/${need}` : at[k - 1] ? pct(best[k - 1]) + "%" : "－"}</td>`;
    }).join("");
    const m = (sum.masteredAt || {})[it.id];
    return `<tr><th class="name">${assigned ? "★" : ""}${esc(it.title)}</th>${cells}<td>${m ? fmtDate(m) : ""}</td><td>${dueText((sum.due || {})[it.id])}</td></tr>`;
  }).join("");
  return `<table class="prog"><thead><tr><th class="name">文法（★は課題。課題と練習した文法だけ）</th><th>段階1</th><th>段階2</th><th>段階3</th><th>段階4</th><th>マスター</th><th>締め切り</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="hint">✓＝クリア　n/m＝合格回数／クリアに必要な回数　％＝最高の正答率（まだ合格していない段階）</p>`;
}
function mistakeList(mistakes, max) {
  const list = (mistakes || []).map((m) => ({ m, x: QINDEX[m.qid] })).filter((e) => e.x).slice(0, max || 50);
  if (!list.length) return `<p class="hint">まちがえたままの問題はありません。</p>`;
  return `<table class="miss"><thead><tr><th>問題</th><th>生徒の答え</th><th>正しい答え（例）</th></tr></thead><tbody>${list.map(({ m, x }) =>
    `<tr><td><small>${esc(x.it.short)}・段階${x.stage}</small><br>${esc(qText(x.q))}</td><td class="ng">${esc(m.a || "（なし）")}${m.wrong > 1 ? `<small>（${m.wrong}回）</small>` : ""}</td><td>${esc(qModel(x.q))}</td></tr>`).join("")}</tbody></table>`;
}

}

/* ===== 生徒一覧・名簿（先生用） ===== */
function parseRoster(text) {
  const lines = String(text || "").split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  if (!lines.length) return { rows: [], errors: [] };
  const split = (l) => (l.includes("\t") ? l.split("\t") : l.split(/[,，]/)).map((c) => c.trim().replace(/^"|"$/g, ""));
  let map = null, start = 0;
  const h = split(lines[0]);
  if (!h.some((c) => c.includes("@"))) { // 1行目が見出し
    const find = (re) => h.findIndex((c) => re.test(c));
    map = { email: find(/メール|mail/i), cls: find(/クラス|組|class/i), no: find(/番号|出席|no|num/i), name: find(/名前|氏名|name/i) };
    start = 1;
  }
  const rows = [], errors = [];
  lines.slice(start).forEach((l, k) => {
    const c = split(l);
    let r;
    if (map && map.email >= 0) r = { email: c[map.email] || "", cls: map.cls >= 0 ? c[map.cls] || "" : "", no: map.no >= 0 ? c[map.no] || "" : "", name: map.name >= 0 ? c[map.name] || "" : "" };
    else { const ei = c.findIndex((x) => x.includes("@")); const rest = c.filter((x, i) => i !== ei); r = { email: ei >= 0 ? c[ei] : "", cls: rest[0] || "", no: rest[1] || "", name: rest[2] || "" }; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email)) errors.push(`${k + 1 + start}行目：メールアドレスが見つかりません`);
    else rows.push(r);
  });
  return { rows, errors };
}

const STAMP_COLORS = ["#e03131", "#e64980", "#f76707", "#f08c00", "#2b8a3e", "#1971c2", "#7048e8", "#495057"];
async function renderTeacherStamps() {
  const SS = window.StampSet || { list: [] };
  const choices = SS.list.filter((d) => d.k !== "lv").sort((a, b) => (a.rules ? 1 : 0) - (b.rules ? 1 : 0));
  const st = { mode: "pick", design: { id: (choices[0] || {}).id }, make: { a: "cat", t: "よくできました", c: "#e03131", po: "banzai", ex: "sparkle", cr: false }, to: new Set(), all: false, msg: "", students: null, sent: null };
  render(`${header("先生スタンプ", true)}<main class="wrap"><div class="judging"><span class="spinner"></span>読み込んでいます…</div></main>`);
  bindBack(renderHome);
  try { const [a, b] = await Promise.all([api.students(), api.sentStamps()]); st.students = a.students || []; st.classes = a.classes || []; st.sent = b.stamps || []; }
  catch (e) { $("main").innerHTML = `<div class="msg ng">読み込めませんでした：${esc(e.message)}</div>`; return; }
  const cur = () => (st.mode === "make" ? { make: Object.assign({}, st.make) } : st.design);
  function draw() {
    const A = window.Art || { SPECIES: {}, POSES: {}, EXPRS: {} };
    const designBox = st.mode === "pick"
      ? `<div class="stamp-pick">${choices.map((d) => `<button class="stamp-opt ${st.design.id === d.id ? "active" : ""}" data-sid="${d.id}">${stampArt(d.id, 78)}</button>`).join("")}</div>`
      : `<div class="maker-form">
          <label>キャラクター<select id="mkA">${Object.keys(A.SPECIES).map((k) => `<option value="${k}" ${st.make.a === k ? "selected" : ""}>${esc(A.SPECIES[k].name || k)}</option>`).join("")}</select></label>
          <label>ポーズ<select id="mkPo">${Object.keys(A.POSES).map((k) => `<option value="${k}" ${st.make.po === k ? "selected" : ""}>${esc(A.POSES[k])}</option>`).join("")}</select></label>
          <label>表情<select id="mkEx">${Object.keys(A.EXPRS).map((k) => `<option value="${k}" ${st.make.ex === k ? "selected" : ""}>${esc(A.EXPRS[k])}</option>`).join("")}</select></label>
          <label>ことば（12文字まで）<input type="text" id="mkT" maxlength="12" value="${esc(st.make.t)}"></label>
          <div class="mk-row"><div class="mk-label">ことばの色</div><div class="mk-opts">${STAMP_COLORS.map((c) => `<button type="button" class="mk-color ${st.make.c === c ? "active" : ""}" data-col="${c}" style="background:${c}" aria-label="色"></button>`).join("")}</div></div>
          <label class="check"><input type="checkbox" id="mkCr" ${st.make.cr ? "checked" : ""}> 王冠をつける</label>
        </div>`;
    const people = st.students.map((p) => `<label class="person ${st.to.has(p.email) ? "on" : ""}"><input type="checkbox" data-to="${esc(p.email)}" ${st.to.has(p.email) || (st.all && !p.teacher) ? "checked" : ""} ${st.all ? "disabled" : ""}>${avatarHTML(p.avatar, 30)}<span>${p.cls ? `<small>${esc(p.cls)} ${esc(p.no || "")}</small>` : ""}${esc(personName(p))}${p.nickname ? `<small>${esc(p.nickname)}</small>` : ""}</span></label>`).join("");
    $("main").innerHTML = `
      <section class="panel"><h2>1. スタンプをえらぶ・つくる</h2>
        <div class="seg"><button data-m="pick" class="${st.mode === "pick" ? "on" : ""}">えらぶ</button><button data-m="make" class="${st.mode === "make" ? "on" : ""}">つくる</button></div>
        <div class="stamp-editor"><div class="stamp-preview">${stampArt(cur(), 150)}</div>${designBox}</div></section>
      <section class="panel"><h2>2. 送る相手</h2>
        <label class="check"><input type="checkbox" id="toAll" ${st.all ? "checked" : ""}> 全員に送る（${st.students.filter((p) => !p.teacher).length}人）</label>
        ${(st.classes || []).length && !st.all ? `<div class="chips">${st.classes.map((c) => `<button class="chip small" data-pickcls="${esc(c)}">${esc(c)} の全員をえらぶ</button>`).join("")}</div>` : ""}
        <div class="people-pick">${people || `<p class="hint">まだ生徒がいません（一度アプリを開いた生徒が表示されます）。</p>`}</div></section>
      <section class="panel"><h2>3. ひとこと（なくてもOK）</h2>
        <input type="text" class="full" id="stMsg" maxlength="60" value="${esc(st.msg)}" placeholder="例：毎日よくがんばっていますね！">
        <div class="btn-row"><button class="btn primary big" id="sendSt">💌 スタンプを送る</button></div><div class="msg" id="stMsgOut"></div>
        <p class="hint">送ったスタンプは、生徒が次にアプリを開いたときに表示されます。スタンプ1つにつき生徒に +10pt。</p></section>
      <section class="panel"><h2>送ったスタンプ</h2>

    $$("[data-sid]").forEach((b) => (b.onclick = () => { st.design = { id: b.dataset.sid }; draw(); }));
    const upd = () => { $(".stamp-preview").innerHTML = stampArt(cur(), 150); };

      $("#mkA").onchange = (e) => { st.make.a = e.target.value; upd(); };
      $("#mkPo").onchange = (e) => { st.make.po = e.target.value; upd(); };
      $("#mkEx").onchange = (e) => { st.make.ex = e.target.value; upd(); };
      $("#mkT").oninput = (e) => { st.make.t = e.target.value; upd(); };
      $("#mkCr").onchange = (e) => { st.make.cr = e.target.checked; upd(); };
      $$("[data-col]").forEach((b) => (b.onclick = () => { st.make.c = b.dataset.col; draw(); }));
    }
    $("#toAll").onchange = (e) => { st.all = e.target.checked; draw(); };
    $$("[data-pickcls]").forEach((b) => (b.onclick = () => { st.students.filter((p) => p.cls === b.dataset.pickcls).forEach((p) => st.to.add(p.email)); draw(); }));
    $$("[data-to]").forEach((c) => (c.onchange = () => { if (c.checked) st.to.add(c.dataset.to); else st.to.delete(c.dataset.to); c.closest(".person").classList.toggle("on", c.checked); }));
    $("#stMsg").oninput = (e) => { st.msg = e.target.value; };
    $("#sendSt").onclick = async (e) => {
      const m = $("#stMsgOut");
      const to = st.all ? "all" : Array.from(st.to);
      if (to !== "all" && !to.length) { m.textContent = "送る相手をえらんでください。"; m.className = "msg ng"; return; }
      if (st.mode === "make" && !st.make.t.trim()) { m.textContent = "ことばを入れてください。"; m.className = "msg ng"; return; }
      e.target.disabled = true;
      try {
        const r = await api.sendStamp({ to, design: cur(), message: st.msg.trim() });
        const b = await api.sentStamps(); st.sent = b.stamps || [];
        if (MODE === "demo") state.tstamps = lsGet("eg_tstamps", []);
        st.to.clear(); st.all = false; st.msg = "";
        draw();
        const m2 = $("#stMsgOut"); m2.textContent = `${r.sent}人にスタンプを送りました 💌`; m2.className = "msg ok";
      } catch (err) { m.textContent = "送れませんでした：" + err.message; m.className = "msg ng"; e.target.disabled = false; }
    };
  }
  draw();
}

      const it = ALL_ITEMS.find((x) => x.id === b.dataset.use); if (it) it.use = b.checked;
      setContent(ALL_ITEMS); indexQuestions(); lsSet("eg_content", null);
      m.textContent = `「${itemTitleOf(b.dataset.use)}」を${b.checked ? "使う" : "使わない"}ようにしました。`; m.className = "msg ok";
    } catch (e) { b.checked = !b.checked; m.textContent = "変更できませんでした：" + e.message; m.className = "msg ng"; }
  }));
  $$("[data-sedit]").forEach((b) => (b.onclick = () => {
    const x = state.sets[b.dataset.sedit];
    if (!x.data || !x.data.sentences) { const m = $("#setListMsg"); m.textContent = "この問題セットは、アプリの画面では直せません（スプレッドシートの「問題」シートで直してください）。"; m.className = "msg ng"; return; }
    renderSetEditor({ setId: x.id, draft: { itemId: x.itemId, name: x.name, file: x.file, formats: x.data.formats, sentences: JSON.parse(JSON.stringify(x.data.sentences)) }, back: () => renderMaterials() });
  }));
  $$("[data-sdel]").forEach((b) => (b.onclick = async () => {
    const x = state.sets[b.dataset.sdel], used = setUsedBy(x.id);
    if (!confirm(`問題セット「${x.name}」を削除します。${used.length ? `\n課題で使っているクラス（${used.join("、")}）は「問題を自動作成」にもどります。` : ""}\n生徒の記録は消えません。よろしいですか？`)) return;
    try {
      const r = await api.deleteSet(x.id);
      if (r.settings) applySettings(r.settings);
      renderMaterials(`「${esc(x.name)}」を削除しました。`);
    } catch (e) { const m = $("#setListMsg"); m.textContent = "削除できませんでした：" + e.message; m.className = "msg ng"; }
  }));
}

/* Word（.docx）から文字を取り出す（.docx は zip。中の word/document.xml を読む） */
async function docxText(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  if (eocd < 0) throw new Error("Word のファイルを読めませんでした（.docx で保存し直してください）。");
  let p = dv.getUint32(eocd + 16, true);
  const n = dv.getUint16(eocd + 10, true);
  for (let k = 0; k < n; k++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true), nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
    if (name === "word/document.xml") {
      const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
      let data = u8.subarray(start, start + csize);
      if (method === 8) {
        if (typeof DecompressionStream === "undefined") throw new Error("このブラウザでは Word を読めません。PDF で保存して読みこんでください。");
        data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
      }
      const xml = new TextDecoder().decode(data);
      return xml.replace(/<w:tab\/>/g, "\t").replace(/<w:br[^>]*\/>/g, "\n").replace(/<\/w:p>/g, "\n").replace(/<[^>]+>/g, "")
        .replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&amp;/g, "&").replace(/\n{3,}/g, "\n\n").trim();
    }
    p += 46 + nlen + xlen + clen;
  }
  throw new Error("Word のファイルの中に本文が見つかりませんでした。");
}
const fileToBase64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = () => rej(new Error("ファイルを読めませんでした。")); r.readAsDataURL(file); });
const FORMAT_NAMES = { choice: "穴うめ（4択）", order: "並べかえ", transform: "書きかえ（もとの文にもどす）", form: "（　）の語を正しい形に" };

function renderImport(opt) {
  opt = opt || {};
  const back = opt.back || (() => renderMaterials());
  render(`${header("PDF・Word から問題を作る", true)}
    <main class="wrap">
      <section class="panel">
        <div class="form-grid">
          <label>文法項目（段階1のルール説明に使います）${itemSelect("imItem", opt.itemId || "")}</label>
          <label>ファイル（PDF または Word の .docx）<input type="file" id="imFile" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"></label>
          <label>AI への指示（なくてもよい）<input type="text" id="imNote" maxlength="300" placeholder="例：12ページの大問2だけ／(1)〜(10)だけ"></label>
        </div>
        <h3>作る問題（段階2）</h3>
        <div class="fmt-row">${Object.keys(FORMAT_NAMES).map((k) => `<label class="check"><input type="checkbox" id="fm_${k}" checked> ${FORMAT_NAMES[k]}</label>`).join("")}</div>
        <p class="hint">段階3・4（日本語→英語）は、すべての文で作ります。日本語訳は、問題集にのっていればそれを使い、なければ AI が作ります。</p>
        <p class="hint">英文は、問題集の文をそのまま使います。空欄・選択肢・並べかえなどの問題は、AI が答えを入れた「完成した文」にします。読みこんだあと、問題を確認して直してから保存します。1回に40文まで、PDF は15MBまでです。読みこみには1〜2分かかることがあります。</p>
        <div class="btn-row"><button class="btn primary" id="imGo">読みこんで問題を作る</button></div>
        <div class="msg" id="imMsg"></div>
      </section>
      <section class="panel"><h2>著作権について</h2><p class="hint">市販の問題集を使うときは、生徒が持っている教材の範囲で使うなど、学校の方針にそって使ってください。作った問題は、このアプリの中だけで使われます。</p></section>
    </main>`);
  bindBack(back);
  $("#imGo").onclick = async () => {
    const m = $("#imMsg"), f = $("#imFile").files[0], itemId = $("#imItem").value;
    const fail = (t) => { m.textContent = t; m.className = "msg ng"; $("#imGo").disabled = false; };
    if (!f) return fail("ファイルを選んでください。");
    const formats = {}; Object.keys(FORMAT_NAMES).forEach((k) => { formats[k] = $("#fm_" + k).checked; });
    const it = ALL_ITEMS.find((x) => x.id === itemId) || {};
    const req = { itemId, item: { title: it.title || "", points: ((it.stage1 || {}).points || []).map((p) => p.text) }, note: $("#imNote").value.trim() };
    $("#imGo").disabled = true;
    try {
      if (/\.pdf$/i.test(f.name) || f.type === "application/pdf") {
        if (f.size > 15 * 1024 * 1024) return fail("PDF が大きすぎます（15MBまで）。必要なページだけにしてください。");
        req.kind = "pdf"; req.data = await fileToBase64(f);
      } else if (/\.docx$/i.test(f.name)) {
        req.kind = "text"; req.text = await docxText(await f.arrayBuffer());
        if (!/[A-Za-z]/.test(req.text)) return fail("Word のファイルに英文が見つかりませんでした。");
      } else if (/\.doc$/i.test(f.name)) return fail("古い Word の形式（.doc）は読めません。Word で「.docx」または PDF で保存し直してください。");
      else return fail("PDF か Word（.docx）のファイルを選んでください。");
      m.innerHTML = `<span class="spinner"></span> AI が読みこんで問題を作っています…（1〜2分かかることがあります。この画面のままお待ちください）`; m.className = "msg";
      const r = await api.importSentences(req);
      if (!r.sentences || !r.sentences.length) return fail(r.message || "英文が見つかりませんでした。");
      r.sentences.forEach((s) => { s.use = Object.assign({}, formats); });
      renderSetEditor({ draft: { itemId, name: f.name.replace(/\.[^.]+$/, "").slice(0, 60), file: f.name, formats, sentences: r.sentences, message: r.message }, back });
    } catch (e) { fail("読みこめませんでした：" + e.message); }
  };
}

/* 読みこんだ問題の確認・修正 */
function renderSetEditor({ draft, setId, back }) {
  const S = draft.sentences;
  const val = (v) => esc(v == null ? "" : v);
  const card = (s, k) => {
    const c = s.choice || { text: "", options: ["", "", "", ""], answer: "" }, opts = (c.options || []).concat(["", "", "", ""]).slice(0, 4);
    const ai = c.options ? opts.indexOf(c.answer) : -1, u = s.use || {};
    return `<div class="sent-card ${s.off ? "off" : ""}" id="sc_${k}">
      <div class="sent-head"><b>${k + 1}</b><label class="check"><input type="checkbox" id="on_${k}" ${s.off ? "" : "checked"}> この文を使う</label></div>
      ${(s.warn || []).length ? `<div class="hint warn">⚠ ${s.warn.map(esc).join("／")}</div>` : ""}
      <label class="fld">英文（答え）<input type="text" id="en_${k}" value="${val(s.en)}" class="en"></label>
      <label class="fld">日本語訳 <small class="hint">${s.jaSrc ? "問題集の訳" : "AIの訳"}・段階3・4で使う</small><input type="text" id="ja_${k}" value="${val(s.ja)}"></label>
      <div class="fmt"><label class="check"><input type="checkbox" id="uc_${k}" ${u.choice !== false && s.choice ? "checked" : ""}> 穴うめ（4択）</label>
        <input type="text" id="ct_${k}" value="${val(c.text)}" placeholder="( ) を1つ入れた文" class="en">
        <div class="opts">${opts.map((o, j) => `<label class="opt"><input type="radio" name="ca_${k}" value="${j}" ${j === ai ? "checked" : ""} aria-label="正解"><input type="text" id="co_${k}_${j}" value="${val(o)}" class="en" placeholder="選択肢${j + 1}"></label>`).join("")}</div>
        <small class="hint">○ をつけたものが正解</small></div>
      <div class="fmt"><label class="check"><input type="checkbox" id="uo_${k}" ${u.order !== false ? "checked" : ""}> 並べかえ</label> <small class="hint">英文の単語をばらばらにして出します</small></div>
      <div class="fmt"><label class="check"><input type="checkbox" id="ut_${k}" ${u.transform !== false && s.transform ? "checked" : ""}> 書きかえ</label>
        <input type="text" id="tt_${k}" value="${val((s.transform || {}).text)}" placeholder="見せる文（これを英文にもどす）" class="en">
        <input type="text" id="ti_${k}" value="${val((s.transform || {}).instruction)}" placeholder="指示（例：肯定文にしよう）"></div>
      <div class="fmt"><label class="check"><input type="checkbox" id="uf_${k}" ${u.form !== false && s.form ? "checked" : ""}> （　）の語を正しい形に</label>
        <input type="text" id="ft_${k}" value="${val((s.form || {}).text)}" placeholder="例：He (play) tennis yesterday." class="en"></div>
      <div class="msg" id="er_${k}"></div>
    </div>`;
  };
  render(`${header(setId ? "問題セットを直す" : "読みこんだ問題の確認", true)}
    <main class="wrap">
      ${draft.message ? `<div class="notice">${esc(draft.message)}</div>` : ""}
      <section class="panel">
        <div class="form-grid">
          <label>問題セットの名前 <input type="text" id="seName" maxlength="60" value="${val(draft.name)}"></label>
          <label>文法項目 ${itemSelect("seItem", draft.itemId, true)}</label>
        </div>
        <p class="hint">${S.length}文を読みこみました。AI が作った答え・訳・問題をたしかめて、ちがうところは直してください。使わない文や問題はチェックを外します。</p>
        <div class="fmt-row"><span>まとめて：</span>${Object.keys(FORMAT_NAMES).map((k) => `<button type="button" class="btn small" data-all="${k}">${FORMAT_NAMES[k]}を全部オン／オフ</button>`).join("")}</div>
      </section>
      <div class="sent-list">${S.map(card).join("")}</div>
      <div class="btn-row sticky-save"><button class="btn primary" id="seSave">保存する</button></div>
      <div class="msg" id="seMsg"></div>
    </main>`);
  bindBack(() => { if (confirm("保存していない変更は消えます。もどりますか？")) back(); });
  const ids = { choice: "uc", order: "uo", transform: "ut", form: "uf" };
  $$("[data-all]").forEach((b) => (b.onclick = () => {
    const boxes = S.map((_, k) => $(`#${ids[b.dataset.all]}_${k}`));
    const to = !boxes.every((x) => x.checked);
    boxes.forEach((x) => { x.checked = to; });
  }));
  S.forEach((_, k) => { $("#on_" + k).onchange = (e) => $("#sc_" + k).classList.toggle("off", !e.target.checked); });
  $("#seSave").onclick = async () => {
    const out = [], m = $("#seMsg");
    let bad = -1;
    S.forEach((s, k) => {
      const g = (id) => $("#" + id + "_" + k).value.trim(), on = (id) => $("#" + id + "_" + k).checked;
      const en = g("en"), errs = [];
      const opts = [0, 1, 2, 3].map((j) => $(`#co_${k}_${j}`).value.trim()), ar = $(`[name="ca_${k}"]:checked`);
      const choice = { text: g("ct"), options: opts, answer: ar ? opts[+ar.value] : "" };
      const transform = { text: g("tt"), instruction: g("ti") || "書きかえよう" }, form = { text: g("ft") };
      const use = { choice: on("uc"), order: on("uo"), transform: on("ut"), form: on("uf") };
      const off = !on("on");
      if (!off) {
        if (!/[A-Za-z]/.test(en)) errs.push("英文を入れてください");
        if (use.choice) {
          if (choice.text.split("( )").length !== 2) errs.push("穴うめ：文に ( ) を1つ入れてください");
          else if (opts.some((o) => !o) || new Set(opts).size !== 4) errs.push("穴うめ：選択肢を4つ（ちがうもの）入れてください");
          else if (!choice.answer) errs.push("穴うめ：正解に ○ をつけてください");
          else if (normalize(choice.text.replace("( )", choice.answer)) !== normalize(en)) errs.push("穴うめ：( ) に正解を入れた文が、英文と同じになりません");
        }
        if (use.transform && (!transform.text || normalize(transform.text) === normalize(en))) errs.push("書きかえ：英文とちがう文を入れてください");
        if (use.form && !/\(.+\)/.test(form.text)) errs.push("語形：（　）に入れた語がある文にしてください");
      }
      const er = $("#er_" + k);
      er.textContent = errs.join("／"); er.className = errs.length ? "msg ng" : "msg";
      if (errs.length && bad < 0) bad = k;
      out.push({ sid: Number.isInteger(s.sid) ? s.sid : 1000 + k, en, ja: g("ja"), choice: choice.text || opts.some(Boolean) ? choice : null, transform: transform.text ? transform : null, form: form.text ? form : null, use, off });
    });
    if (bad >= 0) { m.textContent = "直すところがあります（赤い字の文）。"; m.className = "msg ng"; $("#sc_" + bad).scrollIntoView({ block: "center" }); return; }
    if (!out.some((s) => !s.off)) { m.textContent = "使う文がありません。"; m.className = "msg ng"; return; }
    $("#seSave").disabled = true; m.textContent = "保存しています…"; m.className = "msg";
    try {
      const r = await api.saveSet({ id: setId || "", name: $("#seName").value.trim() || "PDFの問題", itemId: $("#seItem").value, file: draft.file || "", formats: draft.formats || null, sentences: out });
      state.sets = r.sets || state.sets; indexQuestions();
      const used = setUsedBy(r.id);
      renderMaterials(`保存しました。${used.length ? "課題で使っているクラスには、すぐに反映されます。" : "「管理者設定」の「課題と締め切り」で、この文法の「問題」の欄から選ぶと、生徒の課題になります。"}`);
    } catch (e) { $("#seSave").disabled = false; m.textContent = "保存できませんでした：" + e.message; m.className = "msg ng"; }
  };
}

/* サーバーから届いた教材を使う（先生がはじめて開いたときは、アプリの教材をスプレッドシートに書き出す） */
async function applyContent(c) {
  c = c || { seeded: false };
  if (state.isAdmin && (!c.seeded || (c.builtinVer !== undefined && c.builtinVer !== BUILTIN_VER))) {
    try { await api.seedContent({ items: BUILTIN, mode: "add", builtinVer: BUILTIN_VER }); c = await api.getContent(); } catch (e) { console.warn("教材の書き出し", e); }
  }
  state.sets = c.sets || {};
  state.problems = c.problems || [];
  state.sheetUrl = c.sheetUrl || "";
  if (c.seeded) {
    let items = c.items;
    if (items) lsSet("eg_content", { ver: c.ver, items });
    else { const cached = lsGet("eg_content", null); if (cached && cached.ver === c.ver) items = cached.items; }
    if (items && items.length) setContent(items);
  }
  indexQuestions();
}
async function init() {
  app().innerHTML = `<div class="boot"><span class="spinner"></span>読み込んでいます…</div>`;
  if (MODE === "api" && !lsGet("eg_token", "")) return renderLogin("");
  try {
    const b = await api.bootstrap();
    state.email = b.email || "";
    state.isAdmin = !!b.isAdmin;
    state.viewAsStudent = state.isAdmin && !!lsGet("eg_preview", false);
    state.progress = b.progress || {};
    state.history = b.history || [];
    state.hasEleven = !!b.hasEleven;
    state.profile = Object.assign({}, DEFAULT_PROFILE, b.profile || {});
    applySettings(b.settings);
    state.tstamps = b.tstamps || [];
    state.mistakes = b.mistakes || [];
    state.teacher = b.teacher || null;
    state.classes = b.classes || [];
    await applyContent(b.content);
    renderHome();
  } catch (e) {
    if (e instanceof AuthError) return renderLogin(e.message);
    if (/名簿に登録されていない/.test(e.message)) {
      app().innerHTML = `<header class="bar"><span class="logo">G</span><h1>英文法トレーニング</h1></header><main class="wrap"><section class="panel login">
        <h2>まだ使えません</h2><p class="msg ng">${esc(e.message)}</p><p>先生が名簿に登録すると使えるようになります。別のアカウントでログインしている場合は、ログインし直してください。</p>
        <button class="btn primary big" id="relogin">ログインし直す</button></section></main>`;
      $("#relogin").onclick = () => { lsSet("eg_token", ""); renderLogin(""); };
      return;
    }
    app().innerHTML = `<div class="boot ng">起動できませんでした：${esc(e.message)}</div>`;
  }
}
document.addEventListener("DOMContentLoaded", init);
